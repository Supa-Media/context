# Scores each reply gate (apps/mcp/src/agent/replyGates.js) on its own
# labelled set (apps/mcp/bench/gates/) against the real decision model, so a
# gate's threshold is tuned on evidence before it decides anything in
# production (Dev2, 2026-11-05: "make sure each of these judges are also well
# tuned"). The report is the run's summary page. Nothing is written anywhere.
#
# Runs by hand only, like the AI Benchmark: it holds production's Workers AI
# token, so it never runs on a pushed branch's unreviewed code
# (scripts/check-workflow-triggers.mjs). One Clef Flash call per case per
# gate, a few hundred calls a run: cents.

name: AI Gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Gates to score, comma-separated; empty means all"
        required: false
        default: ""
      model:
        description: "Decision model"
        required: false
        default: clef-flash
        type: choice
        options:
          - clef-flash
          - clef

permissions:
  contents: read

concurrency:
  group: ai-gates
  cancel-in-progress: false

jobs:
  gates:
    name: Score the reply gates
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      GATES: ${{ inputs.gate }}
      MODEL: ${{ inputs.model || 'clef-flash' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse a gate name that is not one
        run: |
          set -euo pipefail
          [[ -z "$GATES" || "$GATES" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::gate is names like finished,sourced"; exit 1; }
      - name: Score
        run: |
          set -euo pipefail
          args=(--model "$MODEL")
          [ -z "$GATES" ] || args+=(--gate "$GATES")
          pnpm --silent ai gates "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
