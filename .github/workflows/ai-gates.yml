# With bench "respond", scores the conversation classifier's reply-or-quiet
# call instead (apps/mcp/src/agent/respond.js, apps/mcp/bench/respond/).
#
# Scores the reply reviewer (apps/mcp/src/agent/replyJudge.js, one Haiku
# call) on every labelled case in apps/mcp/bench/review/, against the real
# model through the AI gateway, so it clears one bar for the whole reviewer
# before it decides anything in production (Dev2, 2026-11-06: "replace the
# judges with one haiku model"). The report is the run's summary page.
# Nothing is written anywhere. The file keeps its old name so a run can be
# dispatched on a branch before it merges.
#
# Runs by hand only, like the AI Benchmark: it holds production's gateway
# token, so it never runs on a pushed branch's unreviewed code
# (scripts/check-workflow-triggers.mjs). One Haiku call per case, about two
# hundred a run: cents.

name: AI Reviewer

on:
  workflow_dispatch:
    inputs:
      bench:
        description: "review: the reply reviewer; respond: the classifier's reply-or-quiet call"
        required: false
        default: review
        type: choice
        options: [review, respond]
      gate:
        description: "Case sets to score, comma-separated; empty means all"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-gates
  cancel-in-progress: false

jobs:
  review:
    name: Score the reply reviewer
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_KEY_ALIASES: ${{ secrets.AI_GATEWAY_KEY_ALIASES }}
      # The one judge is Clef, a Workers AI model: `pnpm ai respond` asks it through the REST API (bench/models.mjs).
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      SETS: ${{ inputs.gate }}
      BENCH: ${{ inputs.bench }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse a set name that is not one
        run: |
          set -euo pipefail
          [[ -z "$SETS" || "$SETS" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::sets are names like chat,sourced"; exit 1; }
      - name: Score the classifier's reply-or-quiet call
        if: inputs.bench == 'respond'
        run: |
          set -euo pipefail
          pnpm --silent ai respond | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Score
        if: inputs.bench != 'respond'
        run: |
          set -euo pipefail
          args=()
          [ -z "$SETS" ] || args+=(--set "$SETS")
          pnpm --silent ai review "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
