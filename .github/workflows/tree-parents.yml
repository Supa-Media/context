# Ask production how far the check that every keyed workspace's rows say
# their paths through their parents has got (`apps/convex/functions/treeParents.ts`),
# and optionally start the next pages now rather than at the next half-hour tick.
#
# Manual only. `report` answers with counts, never a
# workspace, a path or a time: this repository is public, and so is this
# job's log.
name: Tree parents

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start the check for every workspace not yet done, then report"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Start checks
        if: ${{ inputs.start }}
        run: npx convex run functions/treeParents:checkDue 2>/dev/null
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Report
        run: npx convex run functions/treeParents:report 2>/dev/null
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
