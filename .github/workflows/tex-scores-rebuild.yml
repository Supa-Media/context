# Rebuild Tex's daily scores note for one day from its score rows, for a day
# whose note fell behind (2026-10-24 and 25: rewrites after the second one
# conflicted). Manual only. It prints `functions/texReviewScoresRebuild.ts`'s
# answer, a row count and whether the note was written, and never a score
# or a name: this repository is public, and so is this job's log. Running it
# again changes nothing.
name: Tex scores rebuild

on:
  workflow_dispatch:
    inputs:
      day:
        description: "The UTC day to rebuild (YYYY-MM-DD)."
        required: true
      drop_group_minutes:
        description: "Optional: UTC minutes (HHMM, space-separated) of repeat group reviews whose score rows to drop first."
        required: false
        default: ""
      dry_run:
        description: "With drop_group_minutes: count the rows only, drop and rebuild nothing."
        type: boolean
        default: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Rebuild
        run: |
          set -euo pipefail
          case "$DAY" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "day must be YYYY-MM-DD"; exit 1 ;;
          esac
          if [ -n "$MINUTES" ]; then
            list=""
            for minute in $MINUTES; do
              case "$minute" in
                [0-9][0-9][0-9][0-9]) list="$list${list:+,}\"$minute\"" ;;
                *) echo "minutes must be HHMM"; exit 1 ;;
              esac
            done
            dry=true
            [ "$DRY_RUN" = "true" ] || dry=false
            npx convex run functions/texReviewScoresRebuild:dropRepeatScores "{\"day\":\"$DAY\",\"kind\":\"group\",\"minutes\":[$list],\"dryRun\":$dry}"
            [ "$dry" = "true" ] && exit 0
          fi
          npx convex run functions/texReviewScoresRebuild:rebuildScoresNote "{\"day\":\"$DAY\"}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DAY: ${{ inputs.day }}
          MINUTES: ${{ inputs.drop_group_minutes }}
          DRY_RUN: ${{ inputs.dry_run }}
