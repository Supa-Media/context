name: Collaboration

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/mcp/**"
      - "apps/convex/**"
      - "packages/collaboration/**"
      - "packages/communications/**"
      - "packages/desktop-bridge/**"
      - "packages/drawings/**"
      - "packages/meetings/**"
      - "packages/obsidian-runtime/**"
      - "packages/shared/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/collaboration.yml"

permissions:
  contents: read

jobs:
  browser:
    name: Two editors, agents, and offline recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "1"
      EXPO_PUBLIC_E2E_FIXTURE: "1"
      EXPO_PUBLIC_CONVEX_URL: "https://e2e-fixture.invalid"
    steps:
      - uses: actions/checkout@v5

      # Required checks still have to report on unrelated pull requests. Keep
      # the trigger broad, detect changes inside the job, and skip only the
      # expensive setup and browser work.
      - name: Does this touch collaboration or what the browser build uses?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            browser:
              - "apps/convex/**"
              - "apps/mcp/**"
              - "apps/mobile/**"
              - "packages/collaboration/**"
              - "packages/communications/**"
              - "packages/desktop-bridge/**"
              - "packages/drawings/**"
              - "packages/meetings/**"
              - "packages/obsidian-runtime/**"
              - "packages/shared/**"
              - ".npmrc"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "patches/**"
              - ".github/workflows/collaboration.yml"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.browser == 'true'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.browser == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.browser == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify durable history and interrupted storage operations
        if: steps.changes.outputs.browser == 'true'
        run: pnpm --filter @context/collaboration test

      - name: Build the actual app with its local-only test screen
        if: steps.changes.outputs.browser == 'true'
        run: pnpm --filter @context/mobile exec expo export --platform web --output-dir web-build

      - name: Exercise production editor and gateway against local R2
        if: steps.changes.outputs.browser == 'true'
        run: node apps/mcp/test/browser/verifyEditor.mjs

      - name: Keep evidence for failures and passes
        if: always() && steps.changes.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-results
          path: artifacts/collaboration/
