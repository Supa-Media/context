name: Collaboration

# Once a day and on demand, not on every push (Dev2, 2026-10-07: "the full
# browser one is just too expensive").
#
# This run builds the whole web app and drives two real Chromium editors, an
# agent and an offline reconnect against a local gateway: about four minutes
# of runner time, on almost every pull request and again on main. What it
# proves does not change commit to commit the way unit contracts do, so it
# moves to a daily run of main. The concurrency rules themselves still run on
# every push, without a browser:
#
#   - `Test Gateway` (mcp.yml) runs @context/collaboration's suite (merging,
#     replay, adversarial histories, interrupted storage operations) and the
#     gateway's collaboration and presence tests;
#   - `ci / Test Mobile App` runs presenceRecovery, collaborationTransport and
#     durableCollaboration (see docs/decisions/collaboration.md).
#
# A red daily run is a regression on main: fix it before the next production
# promotion. Run it by hand (Actions › Collaboration › Run workflow) before
# merging a change to the editor's room or autosave path.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Two editors, agents, and offline recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      CI: "1"
      EXPO_PUBLIC_E2E_FIXTURE: "1"
      EXPO_PUBLIC_CONVEX_URL: "https://e2e-fixture.invalid"
    steps:
      - uses: actions/checkout@v5

      # The Playwright container runs as a different user from the checkout's
      # owner, and `actions/checkout` marks it safe only in a temporary HOME;
      # anything that runs git locally then refuses the repository ("dubious
      # ownership").
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify durable history and interrupted storage operations
        run: pnpm --filter @context/collaboration test

      - name: Build the actual app with its local-only test screen
        run: pnpm --filter @context/mobile exec expo export --platform web --output-dir web-build

      - name: Exercise production editor and gateway against local R2
        run: node apps/mcp/test/browser/verifyEditor.mjs

      - name: Keep evidence for failures and passes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-results
          path: artifacts/collaboration/
