# Move each Tex guest chat's folder into the chat's home, then clear its guest mode
# (owner, 2026-10-31; `docs/decisions/texting-assistant/group-guests.md`).
#
# Manual only. Run it with `dry_run` first: that counts what would move and
# changes nothing. It pages through `functions/texGuestRetire:run`, which answers
# with counts and a cursor, never a path, a name or a key: this repository is
# public, and so is this job's log. Moves run in the background on the
# deployment, so run it again until `started` and `moving` are zero; running it
# again moves nothing already moved.
name: Tex guest chats retire

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to retire guest chats in."
        type: choice
        options:
          - staging
          - production
        default: staging
      dry_run:
        description: "Count only; move nothing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Retire guest chats
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cursor=""
          page=0
          while :; do
            page=$((page + 1))
            if [ -z "$cursor" ]; then
              args=$(jq -cn --argjson dry "$DRY_RUN" '{dryRun: $dry}')
            else
              args=$(jq -cn --argjson dry "$DRY_RUN" --arg cursor "$cursor" '{dryRun: $dry, cursor: $cursor}')
            fi
            answer=$(npx convex run functions/texGuestRetire:run "$args" 2>/dev/null)
            echo "page $page: $(echo "$answer" | jq -c 'del(.cursor)')"
            if [ "$(echo "$answer" | jq -r '.finished')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 400 ]; then echo "stopped after $page pages"; exit 1; fi
          done
