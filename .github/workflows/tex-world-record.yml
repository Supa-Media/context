# THE SIMULATED WORLD, RECORDED ONCE (`apps/mcp/bench/simFixtures.mjs`, `apps/mcp/bench/simWorld.mjs`).
#
# A Front door test's outside world (web search, page reads, browser, calendar, Gmail) is played by a model where the
# conversation's fixtures (`apps/mcp/bench/sets/sim/<id>.json`) have no answer. Two runs of the same commit used to
# invent different worlds (62 vs 60 answers, Dev 11/30 vs 15/30 on 249c2bd), so the answers are recorded and committed,
# and every Lab run replays them. This workflow records (or checks) them on the repo's own Training or Dev set only,
# never the sealed Test set, on Claude Code (CLAUDE_CODE_OAUTH_TOKEN, $0) with Clef on Workers AI as a Lab run has it.
#
#   world: record   runs the set once and adds every miss to the fixtures
#          refresh  re-asks every call and replaces the fixtures
#          replay   answers from the committed fixtures (a reworded call gets the nearest answer), asks the model only
#                   for a call nothing is near and keeps that answer; prints the misses and a hash of the world answers
#                   the run was shown, so two replays of one commit can be compared (same hash, zero misses = same world)
#   Every mode heals: the run's new answers go onto `branch` (tex-world/... or claude/...) when one is named, by a job
#   with a write token and none of the run's secrets; else, for a run of main, `tex-world-heal.yml` opens them as a pull
#   request that merges itself, so the next run replays them. The job that ran the models never holds a write token.
#
# The log prints counts, kinds and hashes, never a conversation's words or an answer. The fixtures are public bench data.
name: Tex world record

on:
  workflow_dispatch:
    inputs:
      set:
        description: "The repo's set to run (never the sealed Test set)"
        required: true
        default: training
        type: choice
        options:
          - training
          - dev
      world:
        description: "record adds misses, refresh re-asks every call, replay checks the committed fixtures"
        required: true
        default: record
        type: choice
        options:
          - record
          - refresh
          - replay
      repeat:
        description: "How many times each Front door test runs (1 to 5)"
        required: false
        default: "1"
        type: string
      branch:
        description: "Optional: a branch (tex-world/... or claude/...) to commit the new answers to; empty opens a pull request that merges itself"
        required: false
        default: ""
        type: string

permissions:
  contents: read

run-name: Tex world ${{ inputs.world }} (${{ inputs.set }})

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Run the set's Front door tests
        env:
          SET: ${{ inputs.set }}
          WORLD: ${{ inputs.world }}
          REPEAT: ${{ inputs.repeat }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          set +e -uo pipefail
          [[ "$SET" =~ ^(training|dev)$ ]] || { echo "::error::only the repo's Training or Dev set"; exit 1; }
          [[ "$WORLD" =~ ^(replay|record|refresh)$ ]] || { echo "::error::unknown world mode"; exit 1; }
          [[ "$REPEAT" =~ ^[1-5]$ ]] || { echo "::error::repeat is 1 to 5"; exit 1; }
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "::error::no Claude Code token"; exit 1; }
          export BENCH_MODEL_SOCKET="$RUNNER_TEMP/sock"
          mkdir -p "$BENCH_MODEL_SOCKET" "$RUNNER_TEMP/out"
          node apps/mcp/bench/socketAnswerer.mjs --dir "$BENCH_MODEL_SOCKET" --stop "$RUNNER_TEMP/run-done" --parallel 8 > "$RUNNER_TEMP/answerer.log" 2>&1 &
          answerer=$!
          ( while kill -0 "$answerer" 2>/dev/null; do sleep 5; done; [ -f "$RUNNER_TEMP/run-done" ] || pkill -f "bench/run.mjs sets run" || true ) &
          strict=()
          if [ "$WORLD" = "replay" ]; then strict=(--world-strict warn); fi
          # --out keeps the run's words in a file, out of the public log; only the summary lines print.
          node apps/mcp/bench/run.mjs sets run --set "$SET" --node fd --world "$WORLD" "${strict[@]}" --repeat "$REPEAT" --parallel 8 \
            --keep "$RUNNER_TEMP/kept" --out "$RUNNER_TEMP/out/rows.json"
          code=$?
          touch "$RUNNER_TEMP/run-done"
          wait "$answerer" || code=1
          tail -n 5 "$RUNNER_TEMP/answerer.log"
          node apps/mcp/bench/worldHash.mjs --rows "$RUNNER_TEMP/out/rows.json" --kept "$RUNNER_TEMP/kept" || true
          # Only this set's own conversations' files leave the run: a Training and a Dev recording may run at once, and
          # one must never carry the other's older files back over its newer ones.
          mkdir -p "$RUNNER_TEMP/world-out"
          for conv in apps/mcp/bench/sets/"$SET"/*.json; do
            f="apps/mcp/bench/sets/sim/$(basename "$conv")"
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/world-out/"; fi
          done
          ls "$RUNNER_TEMP/world-out" | wc -l | xargs echo "fixture files for the $SET set:"
          exit "$code"

      - name: Upload the recorded world
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-fixtures
          path: ${{ runner.temp }}/world-out/
          retention-days: 7
          if-no-files-found: ignore

  # The run's answers: onto `branch` when one is named, by a job with the write token and none of the run's secrets
  # that runs main's code only (`worldHeal.mjs`: a committed answer stands, a new one is added); else, for a run of
  # main, uploaded as `world-heal` for `tex-world-heal.yml` to open as a pull request that merges itself (owner,
  # 2026-11-19: "self-healing").
  push:
    needs: run
    if: ${{ always() && needs.run.result != 'cancelled' && inputs.branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The branch is one a recording may write
        env:
          BRANCH: ${{ inputs.branch }}
        run: '[[ "$BRANCH" =~ ^(tex-world|claude)/[A-Za-z0-9._/-]{1,80}$ && "$BRANCH" != *..* ]] || { echo "::error::the branch must be tex-world/... or claude/..."; exit 1; }'

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: world-fixtures
          path: ${{ runner.temp }}/world-in/

      - name: Merge the run's answers into the fixtures
        run: node apps/mcp/bench/worldHeal.mjs --from "$RUNNER_TEMP/world-in"

      - name: Commit the fixtures to the branch
        env:
          BRANCH: ${{ inputs.branch }}
          SET: ${{ inputs.set }}
          WORLD: ${{ inputs.world }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mcp/bench/sets/sim/
          if git diff --cached --quiet; then echo "No new answers to commit"; exit 0; fi
          git diff --cached --stat
          git commit -q -m "Tex bench: world fixtures, $WORLD on the $SET set (run $GITHUB_RUN_ID)"
          # A Training and a Dev recording may push to one branch at once: their files differ, so take the other's and retry.
          for try in 1 2 3; do
            git push origin "HEAD:refs/heads/$BRANCH" && exit 0
            git fetch origin "$BRANCH" && git rebase FETCH_HEAD
          done
          exit 1

  heal-ready:
    needs: run
    if: ${{ always() && needs.run.result != 'cancelled' && inputs.branch == '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: world-fixtures
          path: ${{ runner.temp }}/world-in/

      - uses: actions/upload-artifact@v4
        with:
          name: world-heal
          path: ${{ runner.temp }}/world-in/
          retention-days: 7
          if-no-files-found: ignore
