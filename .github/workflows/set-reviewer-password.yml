# Set, or revoke, the password for a review account that signs in with one
# (owner, 2026-11-14 for YC; 2026-11-18 for Google's verification reviewer;
# `apps/convex/functions/lib/reviewerPassword.ts`).
#
# Two accounts use this: yc-review@supa.media (YC partners) and
# google-review@supa.media (Google's verification reviewer). Both review on
# their own schedule, and a ten-minute issued code ("Issue a sign-in code")
# cannot let them in, so this sets a random 20-character password for the
# chosen account that lasts 30 days. Running it again replaces the last one;
# "revoke" ends it now. After ten wrong passwords in an hour it refuses
# everyone on that account until the hour is up. Give it to the reviewer only
# through the review's private form.
#
# Manual only. The password goes to the deployment's team inbox
# (`SIGNUP_ALERTS_EMAIL`) and never into this log: this repository is public,
# and so is this log. The answer printed is only when it expires.
name: Set a reviewer password

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment the account is on."
        type: choice
        options:
          - production
          - staging
        default: production
      account:
        description: "yc-review is YC's partners; google-review is Google's verification reviewer."
        type: choice
        options:
          - yc-review@supa.media
          - google-review@supa.media
        default: yc-review@supa.media
      action:
        description: "set mails a new password to the team inbox; revoke ends the current one."
        type: choice
        options:
          - set
          - revoke
        default: set

permissions:
  contents: read

concurrency:
  group: set-reviewer-password-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  password:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Set or revoke
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ACCOUNT: ${{ inputs.account }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          args=$(jq -cn --arg email "$ACCOUNT" '{email: $email}')
          if [ "$ACTION" = "revoke" ]; then
            answer=$(npx convex run functions/reviewerPasswords:revoke "$args" 2>/dev/null)
            echo "Revoked $(echo "$answer" | jq -r '.revoked') password(s)."
          else
            answer=$(npx convex run functions/reviewerPasswords:mailToTeam "$args" 2>/dev/null)
            # Only the expiry: the answer holds no password, and nothing else is echoed.
            echo "Mailed to the team inbox; expires $(echo "$answer" | jq -r '.expiresAt / 1000 | todate')"
          fi
