# Give a person's Tex folder and a group chat's home the same names (owner,
# 2026-11-01; `docs/decisions/texting-assistant/tex-folders.md`).
#
# Manual only. Run it with `dry_run` first: that counts what would be renamed
# and changes nothing. `personal` pages through
# `functions/texFolderNames:personal`; `homes` runs
# `functions/texFolderNames:homes`. Both answer with counts and fixed codes,
# never a path, a key or a word: this repository is public, and so is this
# job's log. Each rename is a row move, so nothing is deleted, and running it
# again renames nothing already renamed.
name: Tex folder names

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to rename in."
        type: choice
        options:
          - staging
          - production
        default: staging
      dry_run:
        description: "Count only; rename nothing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Rename
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cursor=""
          page=0
          total='{}'
          while :; do
            page=$((page + 1))
            if [ -z "$cursor" ]; then
              args=$(jq -cn --argjson dry "$DRY_RUN" '{dryRun: $dry}')
            else
              args=$(jq -cn --argjson dry "$DRY_RUN" --arg cursor "$cursor" '{dryRun: $dry, cursor: $cursor}')
            fi
            answer=$(npx convex run functions/texFolderNames:personal "$args" 2>/dev/null)
            echo "personal page $page: $(echo "$answer" | jq -c 'del(.cursor)')"
            total=$(jq -cn --argjson a "$total" --argjson b "$(echo "$answer" | jq -c '(.failed | with_entries(.key |= "failed_" + .)) + del(.cursor, .done, .failed)')" '$a + ($b | to_entries | map({key, value: (.value + ($a[.key] // 0))}) | from_entries)')
            if [ "$(echo "$answer" | jq -r '.done')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 2000 ]; then echo "stopped after $page pages"; exit 1; fi
          done
          echo "personal total: $total"
          echo "homes: $(npx convex run functions/texFolderNames:homes "$(jq -cn --argjson dry "$DRY_RUN" '{dryRun: $dry}')" 2>/dev/null | jq -c .)"
          echo "pages: $(npx convex run functions/texFolderNames:pages '{}' 2>/dev/null | jq -c .)"
