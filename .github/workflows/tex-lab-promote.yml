# A Lab version becomes Tex's config through a pull request (Dev2, 2026-11-13: "I want the config generated by the
# lab to become the production code, and to be the only source of truth").
#
# Promote in the Lab (context.lc/lab) records the ask in Convex (apps/convex/functions/texLabPromote.ts). Every
# quarter hour this reads the asks with the deploy key, writes each version's graph into
# packages/shared/src/texConfig.json on a branch of its own (scripts/tex-lab-promote.mjs), and opens the pull request
# that changes it. That pull request merges like any Tex change, on green CI and the replay gate; nothing here merges.
# The pull request is opened with GH_ADMIN_TOKEN, because one opened with this workflow's own token starts no CI.
#
# The log is public: it names a version's id and the pull request, never its graph or who asked.
name: Tex Lab promote

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tex-lab-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_ADMIN_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Read the asks
        id: asks
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          npx convex run functions/texLabPromote:asked '{}' 2>/dev/null > "$RUNNER_TEMP/asks.json"
          echo "count=$(jq length "$RUNNER_TEMP/asks.json")" >> "$GITHUB_OUTPUT"
          echo "Asks waiting: $(jq length "$RUNNER_TEMP/asks.json")"

      - name: Open a pull request for each
        if: steps.asks.outputs.count != '0'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Tex Lab"
          git config user.email "tex-lab@users.noreply.github.com"
          answer() { npx convex run functions/texLabPromote:answered "$1" > /dev/null 2>&1; }
          count=$(jq length "$RUNNER_TEMP/asks.json")
          for i in $(seq 0 $((count - 1))); do
            ask=$(jq -c ".[$i]" "$RUNNER_TEMP/asks.json")
            id=$(echo "$ask" | jq -r .versionId)
            at=$(echo "$ask" | jq -r .at)
            if ! [[ "$id" =~ ^v[0-9a-z]{1,16}$ && "$at" =~ ^[0-9]{1,16}$ ]]; then echo "skipping a malformed ask"; continue; fi
            git checkout -q -B "tex-lab/promote-$id-$at" origin/main
            echo "$ask" | jq -r .graph > "$RUNNER_TEMP/graph.json"
            if ! why=$(node scripts/tex-lab-promote.mjs "$RUNNER_TEMP/graph.json" 2>&1); then
              echo "$id: refused"
              answer "$(jq -cn --arg v "$id" --argjson at "$at" --arg why "${why#tex-lab-promote: refused: }" '{versionId: $v, at: $at, why: $why}')"
              continue
            fi
            if git diff --quiet; then
              answer "$(jq -cn --arg v "$id" --argjson at "$at" '{versionId: $v, at: $at, why: "it is the same as main"}')"
              continue
            fi
            name=$(echo "$ask" | jq -r .name | tr -d '\r' | cut -c1-80)
            by=$(echo "$ask" | jq -r .by)
            git add packages/shared/src/texConfig.json docs/architecture/tex.md
            git commit -q -m "Promote the Lab version \"$name\" to Tex's config" -m "Asked for in the Tex Architecture Lab by $by. The pull request merges only on green CI and the replay gate."
            git push -q -f origin "HEAD:refs/heads/tex-lab/promote-$id-$at"
            {
              echo "Promoted from the Tex Architecture Lab (context.lc/lab) by $by: version \"$name\" (\`$id\`)."
              echo
              echo "What changed is \`packages/shared/src/texConfig.json\` and the steps table it makes in \`docs/architecture/tex.md\`; the diff is the whole change. A changed model, effort or time limit changes the prompts and requests the replay gate fingerprints, so **Tex replay required** names the areas it reaches: run them on the examiner path before merging."
              echo
              echo "No replay case: a Lab promotion changes settings the existing replay areas already measure."
            } > "$RUNNER_TEMP/body.md"
            url=$(gh pr create --base main --head "tex-lab/promote-$id-$at" --title "Promote the Lab version \"$name\" to Tex's config" --body-file "$RUNNER_TEMP/body.md")
            echo "$id: $url"
            answer "$(jq -cn --arg v "$id" --argjson at "$at" --arg pr "$url" '{versionId: $v, at: $at, pr: $pr}')"
          done
