# A Lab version becomes Tex's config through a pull request (Dev2, 2026-11-13: "I want the config generated by the
# lab to become the production code, and to be the only source of truth").
#
# Promote in the Lab (context.lc/lab) records the ask in Convex (apps/convex/functions/texLabPromote.ts), which
# dispatches this workflow at once (apps/convex/functions/texLabRuns.ts; the quarter-hour schedule stays as the
# fallback). Each run reads the asks with the deploy key, writes each version's graph into
# packages/shared/src/texConfig.json on a branch of its own (scripts/tex-lab-promote.mjs), and opens the pull request
# that changes it. That pull request merges like any Tex change, on green CI and the replay gate; nothing here merges.
# The pull request is opened with GH_ADMIN_TOKEN, because one opened with this workflow's own token starts no CI.
#
# The log is public: it names a version's id and the pull request, never its graph or who asked.
name: Tex Lab promote

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tex-lab-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_ADMIN_TOKEN }}
          # A promotion is merged from the main the draft was made from (scripts/tex-lab-merge.mjs), so main's history
          # has to be here to find it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Read the asks
        id: asks
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          npx convex run functions/texLabPromote:asked '{}' 2>/dev/null > "$RUNNER_TEMP/asks.json"
          echo "count=$(jq length "$RUNNER_TEMP/asks.json")" >> "$GITHUB_OUTPUT"
          echo "Asks waiting: $(jq length "$RUNNER_TEMP/asks.json")"

      - name: Open a pull request for each
        if: steps.asks.outputs.count != '0'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Tex Lab"
          git config user.email "tex-lab@users.noreply.github.com"
          answer() { npx convex run functions/texLabPromote:answered "$1" > /dev/null 2>&1; }
          count=$(jq length "$RUNNER_TEMP/asks.json")
          for i in $(seq 0 $((count - 1))); do
            ask=$(jq -c ".[$i]" "$RUNNER_TEMP/asks.json")
            id=$(echo "$ask" | jq -r .versionId)
            at=$(echo "$ask" | jq -r .at)
            if ! [[ "$id" =~ ^v[0-9a-z]{1,16}$ && "$at" =~ ^[0-9]{1,16}$ ]]; then echo "skipping a malformed ask"; continue; fi
            git checkout -q -B "tex-lab/promote-$id-$at" origin/main
            echo "$ask" | jq -r .graph > "$RUNNER_TEMP/graph.json"
            base=$(echo "$ask" | jq -r '.base // ""')
            made=$(echo "$ask" | jq -r '.made // 0')
            if ! [[ "$base" =~ ^(c[0-9a-f]{14})?$ && "$made" =~ ^[0-9]{1,16}$ ]]; then echo "skipping a malformed ask"; continue; fi
            rm -f "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/clashes.json"
            # The person's picks for the clashes a refusal named, made in the Lab or with tex_dev (main's or the draft's).
            echo "$ask" | jq -c '(.picks // []) | map({(.what): .take}) | add // {}' > "$RUNNER_TEMP/picks.json"
            # Only the draft's own changes since the main it was made from, merged onto main as it is now; a setting
            # both changed is refused by name, never written over (Dev2, 2026-11-17).
            if ! why=$(node scripts/tex-lab-promote.mjs "$RUNNER_TEMP/graph.json" --base "$base" --made "$made" --main origin/main --summary "$RUNNER_TEMP/merged.json" --picks "$RUNNER_TEMP/picks.json" --clashes "$RUNNER_TEMP/clashes.json" 2>&1); then
              echo "$id: refused"
              clashes=$(cat "$RUNNER_TEMP/clashes.json" 2>/dev/null || echo '[]')
              answer "$(jq -cn --arg v "$id" --argjson at "$at" --arg why "${why#tex-lab-promote: refused: }" --argjson clashes "$clashes" '{versionId: $v, at: $at, why: $why} + (if ($clashes | length) > 0 then {clashes: $clashes} else {} end)')"
              continue
            fi
            # The Lab's prompt catalogue (read at old commits by the Lab's Replay) follows the config's words and order.
            node scripts/tex-prompt-catalog.mjs > /dev/null
            if git diff --quiet; then
              answer "$(jq -cn --arg v "$id" --argjson at "$at" '{versionId: $v, at: $at, why: "it is the same as main"}')"
              continue
            fi
            name=$(echo "$ask" | jq -r .name | tr -d '\r' | cut -c1-80)
            by=$(echo "$ask" | jq -r .by)
            git add packages/shared/src/texConfig.json docs/architecture/tex.md apps/mcp/src/agent/texArchitecture.generated.js packages/shared/src/texPrompt packages/shared/src/texPrompt.generated.json packages/shared/src/texNodeShelf.json apps/mobile/features/tex/lab/promptCatalog.generated.json
            git commit -q -m "Promote the Lab version \"$name\" to Tex's config" -m "Asked for in the Tex Architecture Lab by $by. The pull request merges only on green CI and the replay gate."
            git push -q -f origin "HEAD:refs/heads/tex-lab/promote-$id-$at"
            {
              echo "Promoted from the Tex Architecture Lab (context.lc/lab) by $by: version \"$name\" (\`$id\`)."
              echo
              if [ -f "$RUNNER_TEMP/merged.json" ]; then
                echo "Merged onto main, not written over it: this draft's own changes since \`$(jq -r '.base[0:7]' "$RUNNER_TEMP/merged.json")\`, the main it was made from$(jq -r 'if .guessed then " (taken from when it was made: it was saved before drafts kept their base)" else "" end' "$RUNNER_TEMP/merged.json"), and the $(jq -r .theirs "$RUNNER_TEMP/merged.json") change(s) main has had since, kept. Its own:"
                echo
                jq -r '.kept[] | "- " + .' "$RUNNER_TEMP/merged.json" | head -60
                echo
              fi
              if [ "$(jq length "$RUNNER_TEMP/picks.json")" -gt 0 ]; then
                echo "Settings both changed, settled by $by's pick:"
                echo
                jq -r 'to_entries[] | "- " + .key + ": " + (if .value == "draft" then "this draft'"'"'s" else "main'"'"'s" end)' "$RUNNER_TEMP/picks.json" | head -60
                echo
              fi
              echo "What changed is \`packages/shared/src/texConfig.json\`, the drawing and table it makes in \`docs/architecture/tex.md\`, the map every Tex agent reads (\`texArchitecture.generated.js\`), and any prompt words under \`packages/shared/src/texPrompt/\`; the diff is the whole change. A changed model, effort, time limit or word changes the prompts and requests the replay gate fingerprints, so **Tex replay required** names the areas it reaches and starts the sealed Test Set on main for this pull request; it merges when that passes."
              echo
              echo "No replay case: a Lab promotion changes settings the existing replay areas already measure."
            } > "$RUNNER_TEMP/body.md"
            url=$(gh pr create --base main --head "tex-lab/promote-$id-$at" --title "Promote the Lab version \"$name\" to Tex's config" --body-file "$RUNNER_TEMP/body.md")
            echo "$id: $url"
            answer "$(jq -cn --arg v "$id" --argjson at "$at" --arg pr "$url" '{versionId: $v, at: $at, pr: $pr}')"
          done

      # The Testing tab's conversations (`functions/texSets.ts`): every draft asked for goes into one pull request
      # writing apps/mcp/bench/sets; once that pull request merges, the drafts it carried are cleared.
      - name: Read the test conversations asked for
        id: sets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          npx convex run functions/texSets:asked '{}' 2>/dev/null > "$RUNNER_TEMP/sets.json"
          echo "count=$(jq length "$RUNNER_TEMP/sets.json")" >> "$GITHUB_OUTPUT"
          echo "Test conversations waiting: $(jq length "$RUNNER_TEMP/sets.json")"

      - name: Open a pull request for the test conversations
        if: steps.sets.outputs.count != '0'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Tex Lab"
          git config user.email "tex-lab@users.noreply.github.com"
          stamp=$(date -u +%Y%m%d%H%M%S)
          git checkout -q -B "tex-lab/sets-$stamp" origin/main
          result=$(node scripts/tex-sets-promote.mjs "$RUNNER_TEMP/sets.json")
          echo "$result" | jq -c '{written: (.written | length), removed: (.removed | length), refused: (.refused | length)}'
          refused=$(echo "$result" | jq -c '[.refused[] | {id, why}]')
          ats=$(jq -c 'map({key: .id, value: .at}) | from_entries' "$RUNNER_TEMP/sets.json")
          answer() { npx convex run functions/texSets:answered "$1" > /dev/null 2>&1; }
          if [ "$(echo "$refused" | jq length)" != "0" ]; then
            answer "$(jq -cn --argjson r "$refused" --argjson at "$ats" '{items: [$r[] | {id, at: $at[.id], why}]}')"
          fi
          git add apps/mcp/bench/sets packages/shared/src/texSetsRepo.generated.json
          if git diff --cached --quiet; then
            done_ids=$(echo "$result" | jq -c '[.written[], .removed[]]')
            [ "$(echo "$done_ids" | jq length)" = "0" ] || answer "$(jq -cn --argjson d "$done_ids" --argjson at "$ats" '{items: [$d[] | {id: ., at: $at[.], why: "it is the same as main"}]}')"
            exit 0
          fi
          n=$(echo "$result" | jq '(.written | length) + (.removed | length)')
          by=$(jq -r '[.[].by] | unique | join(", ")' "$RUNNER_TEMP/sets.json" | cut -c1-120)
          git commit -q -m "Promote $n test conversations from the Lab's Testing tab" -m "Asked for in the Tex Lab by $by. Training and Dev conversations only; the Test Set never enters the repo."
          git push -q -f origin "HEAD:refs/heads/tex-lab/sets-$stamp"
          {
            echo "Promoted from the Tex Lab's Testing tab (context.lc/lab) by $by: Training and Dev conversations written into \`apps/mcp/bench/sets\`, and the data the gateway and the Lab read from that folder rebuilt."
            echo
            echo "$result" | jq -r '"Written: \(.written | join(", "))\nRemoved: \(.removed | join(", "))"'
            echo
            echo "No replay case: test conversations are the cases themselves; Training conversations reach a step's prompt only through its examples module, whose replay its own pull request carries."
          } > "$RUNNER_TEMP/sets-body.md"
          url=$(gh pr create --base main --head "tex-lab/sets-$stamp" --title "Promote $n test conversations from the Lab" --body-file "$RUNNER_TEMP/sets-body.md")
          echo "test conversations: $url"
          ids=$(echo "$result" | jq -c '[.written[], .removed[]]')
          answer "$(jq -cn --argjson d "$ids" --argjson at "$ats" --arg pr "$url" '{items: [$d[] | {id: ., at: $at[.], pr: $pr}]}')"

      - name: Clear the test conversations whose pull request merged
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          npx convex run functions/texSets:opened '{}' 2>/dev/null > "$RUNNER_TEMP/opened.json"
          for pr in $(jq -r '[.[].pr] | unique | .[]' "$RUNNER_TEMP/opened.json"); do
            [[ "$pr" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/pull/[0-9]{1,7}$ ]] || continue
            state=$(gh pr view "$pr" --json state -q .state 2>/dev/null || echo "")
            if [ "$state" = "MERGED" ]; then
              npx convex run functions/texSets:merged "$(jq -cn --arg pr "$pr" '{pr: $pr}')" > /dev/null 2>&1 && echo "cleared the drafts of $pr"
            fi
          done

