# The full replay of the practice cases, on demand (docs/decisions/testing/replay-gate.md; Dev2,
# 2026-11-13). Since 2026-11-15 it never gates and never starts by itself: "Tex replay required" waits on the Test
# Set only (tex-test-set.yml), and the held-out cases live in the eval service, not here. Its "Tex replay" status
# is for the agent tuning against the Dev Set. Runs only the model areas a branch's Tex change reaches
# (apps/mcp/bench/replayAreas.mjs, and every area whose prompts differ from
# main's: apps/mcp/bench/promptFingerprint.mjs) against main,
# capped at $1 (apps/mcp/bench/replayGate.mjs) and at its monthly line in
# ai/results/spend.md (bench/spend.mjs), then marks the branch's head
# commit with the status "Tex replay" and re-runs the pull request's required
# check ("Tex replay required", scripts/tex-replay-required.mjs).
#
# Runs by hand only, like the AI Benchmark: it holds production's gateway
# token, so it never runs on a pushed branch's code by itself
# (scripts/check-workflow-triggers.mjs). The agent that opens a Tex pull
# request dispatches it on its branch.

name: Tex replay

on:
  workflow_dispatch:
    inputs:
      examiner:
        description: "Score the examiner session's answers for this commit (ai/results/examiner/<sha>) instead of calling Claude"
        type: boolean
        default: false
      claude_code:
        description: "Answer every Claude call here, with Claude Code on the subscription (CLAUDE_CODE_OAUTH_TOKEN), instead of API credits; scored the same"
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  actions: write

# No `concurrency` group: one holds a single pending run and cancels the
# next, so the wait-turn job below queues runs instead (bench-runner-lock.mjs).

jobs:
  # One benchmark runner sign-in at a time, first come first served, nothing
  # cancelled (scripts/bench-runner-lock.mjs). Its own job, holding no secret:
  # the next job's secrets are read when it starts, after an earlier run has
  # written the rotated refresh token back.
  wait-turn:
    name: Wait for earlier benchmark runs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Mark the commit as waiting its turn
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context="Tex replay" \
            -f description="Waiting for earlier benchmark runs, then replaying" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: Wait until no earlier run signs in as the benchmark runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --max-minutes 170

  # The private half never enters the replay job. This job does not check out the branch.
  token-key:
    name: Make this run's seal key
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      public: ${{ steps.key.outputs.public }}
      wrapped: ${{ steps.key.outputs.wrapped }}
    steps:
      - name: Wrap a key the branch job cannot open
        id: key
        env:
          WRITER: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WRITER" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN to wrap this run's seal key"
          umask 077
          /usr/bin/openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/priv.pem"
          /usr/bin/openssl pkey -in "$RUNNER_TEMP/priv.pem" -pubout -out "$RUNNER_TEMP/pub.pem"
          export SEAL="$WRITER"
          /usr/bin/openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SEAL -in "$RUNNER_TEMP/priv.pem" -out "$RUNNER_TEMP/priv.enc"
          wrapped=$(/usr/bin/base64 -w0 "$RUNNER_TEMP/priv.enc")
          pub=$(/usr/bin/base64 -w0 "$RUNNER_TEMP/pub.pem")
          rm -f "$RUNNER_TEMP/priv.pem" "$RUNNER_TEMP/priv.enc" "$RUNNER_TEMP/pub.pem"
          {
            echo "wrapped<<EOF"
            echo "$wrapped"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "public=$pub" >> "$GITHUB_OUTPUT"
          echo "Seal key: RSA-2048, public ${#pub} characters. The private half is wrapped."

  # Forwards the public key and nothing else. The replay job needs this job, not token-key.
  publish-pub:
    name: Hand on the seal's public key
    needs: token-key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ needs.token-key.outputs.public }}
    steps:
      - name: The public key is the only half this job keeps
        env:
          PUB: ${{ needs.token-key.outputs.public }}
        run: |
          set -euo pipefail
          [ -n "$PUB" ] || { echo "::error::no public key"; exit 1; }
          echo "Public key: ${#PUB} characters. The private half stays wrapped on the key job."

  replay:
    name: Replay the areas this change reaches
    needs: [wait-turn, publish-pub]
    runs-on: ubuntu-latest
    environment: production
    # The jobs area runs whole background jobs (apps/mcp/bench/jobTasks.mjs): minutes a task.
    # Claude Code answers each call in seconds, four at a time: a whole run with jobs can take most of two hours.
    timeout-minutes: ${{ inputs.claude_code && 120 || 60 }}
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_KEY_ALIASES: dev-claude-credits,dev2-claude-credits # aliases on the gateway's Provider Keys page, not secrets
      ANTHROPIC_CREDIT_KEY: ${{ secrets.ANTHROPIC_CREDIT_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      BENCH_RUNNER_CLIENT_ID: ${{ secrets.BENCH_RUNNER_CLIENT_ID }}
      BENCH_RUNNER_REFRESH_TOKEN: ${{ secrets.BENCH_RUNNER_REFRESH_TOKEN }}
      BENCH_RUNNER_REFRESH_TOKEN_LIVE: ${{ secrets.BENCH_RUNNER_REFRESH_TOKEN_LIVE }}
      HEAD_SHA: ${{ github.sha }}
    outputs:
      early: ${{ steps.seal-early.outputs.early }}
      final: ${{ steps.seal-final.outputs.final }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mark the commit as being replayed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context="Tex replay" \
            -f description="Replaying the areas this change reaches" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      # Main first: the areas are named by the change's files and by its prompts, every area's
      # built free on both trees (apps/mcp/bench/promptFingerprint.mjs), so one byte of a prompt
      # that no area's file rule names still replays every area it reaches.
      - name: Main beside the change
        id: base
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git worktree add "$RUNNER_TEMP/main" "$base"
          (cd "$RUNNER_TEMP/main" && pnpm install --frozen-lockfile)

      - name: Name the areas this change reaches
        id: areas
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          areas="$(env -u AI_GATEWAY_TOKEN -u ANTHROPIC_CREDIT_KEY -u CLOUDFLARE_AI_TOKEN pnpm --silent ai gate areas --base-sha "$BASE" --base-tree "$RUNNER_TEMP/main" 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2) | paste -sd, -)"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "Areas: ${areas:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Claude Code has its token
        if: steps.areas.outputs.areas != '' && inputs.claude_code
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set: make one with \`claude setup-token\` and add it as a production secret"; exit 1; }
          # Its shape only, never the value: `claude setup-token` prints one token starting sk-ant-oat, and a terminal
          # wraps it, so a copy pasted into the vault carries line breaks. A token has no whitespace; the answerer drops it.
          CLAUDE_CODE_OAUTH_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN//[[:space:]]/}"
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not a \`claude setup-token\` token (it starts sk-ant-oat); ${#CLAUDE_CODE_OAUTH_TOKEN} characters"; exit 1 ;;
          esac
          echo "Claude Code token: ${#CLAUDE_CODE_OAUTH_TOKEN} characters"

      # Its wait-turn job is skipped by "Re-run failed jobs": check once more,
      # and refuse rather than sign in beside another run (bench-runner-lock.mjs).
      - name: Refuse to sign in beside another benchmark run
        if: steps.areas.outputs.areas != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --check

      # Sign-in rotates the refresh token and writes the runner file. The secret is written later, by the
      # writer job on main's checkout. This step does not hold the writer token.
      - name: Sign in as the benchmark runner
        id: signin
        if: steps.areas.outputs.areas != ''
        run: |
          set -euo pipefail
          pnpm --silent ai signin
          echo "Signed in. The rotated refresh token is in the runner file, not in this log."

      - name: Seal the rotated token after sign-in
        id: seal-early
        if: always()
        env:
          PUB: ${{ needs.publish-pub.outputs.public }}
          DEST: ${{ runner.temp }}/bench-token-early.bin
          WHICH: early
        run: |
          set -euo pipefail
          echo "Sealing the refresh token after sign-in"
          f="$RUNNER_TEMP/bench-runner.json"
          if [ ! -f "$f" ]; then
            echo "${WHICH}=absent" >> "$GITHUB_OUTPUT"
            echo "No runner file after sign-in; nothing to seal"
            exit 0
          fi
          if [ -z "${PUB:-}" ]; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::no public key to seal the rotated token"
            exit 1
          fi
          if ! printf '%s' "$PUB" | /usr/bin/base64 -d > "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::the public key could not be read"
            exit 1
          fi
          if ! /usr/bin/python3 -c '
          import json, pathlib, subprocess, sys
          src, dest, pub = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(src).read_text())
          except Exception:
              sys.stderr.write("the runner file is not json\n")
              sys.exit(1)
          token = data.get("refreshToken") if isinstance(data, dict) else None
          if not isinstance(token, str) or token == "":
              sys.stderr.write("the runner file has no refresh token\n")
              sys.exit(1)
          plain = pathlib.Path(dest + ".plain")
          plain.write_bytes(token.encode())
          plain.chmod(0o600)
          result = subprocess.run(["/usr/bin/openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub, "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256", "-in", str(plain), "-out", dest], capture_output=True, text=True)
          plain.unlink(missing_ok=True)
          if result.returncode != 0:
              sys.stderr.write(result.stderr or "openssl could not seal the token\n")
              sys.exit(result.returncode or 1)
          print("Sealed", pathlib.Path(dest).stat().st_size, "bytes")
          ' "$f" "$DEST" "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not seal the rotated token after sign-in"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seal-pub.pem"
          echo "${WHICH}=present" >> "$GITHUB_OUTPUT"
          echo "Sealed the refresh token after sign-in"

      - name: Keep the seal from after sign-in
        # always(): a failed step before this one must not skip the upload (Lab run 44313860768 sealed the
        # final token, skipped this upload because the run had already failed, and the writer wrote nothing).
        if: always() && steps.seal-early.outputs.early == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: bench-token-early
          path: ${{ runner.temp }}/bench-token-early.bin
          retention-days: 1
          if-no-files-found: error

      # With no API credits (Dev2, 2026-11-13): a separate examiner session answered this
      # commit's Claude calls (apps/mcp/bench/modelSocket.mjs); every call is rebuilt here
      # from this commit and answered from those answers, and the scoring is this run's own.
      - name: Pull the examiner's answers for this commit
        if: steps.areas.outputs.areas != '' && inputs.examiner
        run: |
          set -euo pipefail
          pnpm --silent ai socket pull --sha "$HEAD_SHA" --out "$RUNNER_TEMP/examiner.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BENCH_MODEL_REPLAY=$RUNNER_TEMP/examiner.json" >> "$GITHUB_ENV"

      # The core and jobs areas answer as the live setup, in each tree's own code:
      # the setup and the tests edited in Context go into both trees' bench folders.
      - name: Pull the live setup into both trees (core and jobs areas)
        if: contains(steps.areas.outputs.areas, 'core') || contains(steps.areas.outputs.areas, 'jobs')
        run: |
          set -euo pipefail
          pnpm --silent ai pull texting-assistant
          (cd "$RUNNER_TEMP/main" && pnpm --silent ai pull texting-assistant)

      # The monthly line (bench/spend.mjs). Examiner and Claude Code rounds record
      # $0, so they are not refused here. A round that would pass the line, the
      # month, or the day does not start.
      - name: Refuse a replay over its monthly line
        id: replay-budget
        if: steps.areas.outputs.areas != '' && steps.signin.outcome == 'success' && inputs.examiner != true && inputs.claude_code != true
        run: |
          set -euo pipefail
          pnpm --silent ai spend check replay-gate --setups production | tee -a "$GITHUB_STEP_SUMMARY"

      # Dev2, 2026-11-15: the replay examined the moment its check goes red, by a GitHub Action on the subscription
      # rather than an hourly project task. Claude Code answers the gate's model socket here
      # (apps/mcp/bench/socketAnswerer.mjs): each call is asked of the model family it names, with its own system
      # prompt and no tools of the CLI's own, and the gate scores the answers against main in its own code.
      - name: Install Claude Code
        if: steps.areas.outputs.areas != '' && inputs.claude_code
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Replay against main
        id: gate
        if: steps.areas.outputs.areas != '' && (steps.replay-budget.outcome == 'success' || steps.replay-budget.outcome == 'skipped')
        env:
          AREAS: ${{ steps.areas.outputs.areas }}
          CLAUDE_CODE: ${{ inputs.claude_code }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          # The step's shell runs with -e; the gate's and the answerer's exits are read below instead.
          set +e -uo pipefail
          answerer=""
          if [ "$CLAUDE_CODE" = "true" ]; then
            if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set: make one with \`claude setup-token\` and add it as a production secret"
              exit 1
            fi
            export BENCH_MODEL_SOCKET="$RUNNER_TEMP/sock"
            mkdir -p "$BENCH_MODEL_SOCKET"
            node apps/mcp/bench/socketAnswerer.mjs --dir "$BENCH_MODEL_SOCKET" --stop "$RUNNER_TEMP/gate-done" --parallel 4 > "$RUNNER_TEMP/answerer.log" 2>&1 &
            answerer=$!
            # The gate waits on the socket; an answerer that died (no token, or a call failed three times) would leave
            # it waiting 45 minutes a call, so its end ends the gate.
            ( while kill -0 "$answerer" 2>/dev/null; do sleep 5; done; [ -f "$RUNNER_TEMP/gate-done" ] || pkill -f "bench/run.mjs gate" || true ) &
          fi
          pnpm --silent ai gate --base "$RUNNER_TEMP/main" --areas "$AREAS" \
            --scratch "$RUNNER_TEMP/gate" --out "$RUNNER_TEMP/gate.json" | tee -a "$GITHUB_STEP_SUMMARY"
          code="${PIPESTATUS[0]}"
          if [ -n "$answerer" ]; then
            touch "$RUNNER_TEMP/gate-done"
            wait "$answerer" || code=1
            echo "### Claude Code answerer" >> "$GITHUB_STEP_SUMMARY"
            tail -n 5 "$RUNNER_TEMP/answerer.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            # Into the log too: hashes, models and the CLI's errors only, never a prompt or an answer.
            tail -n 20 "$RUNNER_TEMP/answerer.log"
          fi
          exit "$code"

      # The core area's answers and the judge's reason on every line, the change's and main's, into
      # @context-lc ai/results/replay/<sha>/ (never the repository or the log), so a regression can be
      # read rather than guessed at. Before the token is put back: it may refresh the sign-in.
      - name: Keep the core area's judged answers in Context
        if: always() && contains(steps.areas.outputs.areas, 'core') && steps.signin.outcome == 'success'
        continue-on-error: true
        run: pnpm --silent ai gate records --scratch "$RUNNER_TEMP/gate" --sha "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      # The job tasks' records (each practice task's page, parts and checks; held-out ones are never written), so a
      # pass can be read rather than trusted.
      - name: Keep the job tasks' records
        if: always() && contains(steps.areas.outputs.areas, 'jobs')
        uses: actions/upload-artifact@v4
        with:
          name: tex-replay-job-tasks
          path: ${{ runner.temp }}/gate/jobs-*-records.json
          if-no-files-found: ignore
          retention-days: 14

      # What the run spent, beside the testing loop's other rounds (ai/results/spend.md).
      - name: Record what the replay spent
        if: always() && steps.areas.outputs.areas != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/gate.json" ] || exit 0
          usd="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).usd.toFixed(2))' "$RUNNER_TEMP/gate.json")"
          [ "$usd" = "0.00" ] || pnpm --silent ai spend add replay-gate --usd "$usd" --run "replay-$RUN_NUMBER" --run-url "$RUN_URL"

      # The core area's answers may take long enough to sign in again. Seal whatever the file holds now.
      # The writer prefers this seal, and does not store the older one if this seal fails.
      - name: Seal the rotated token after the run
        id: seal-final
        if: always()
        env:
          PUB: ${{ needs.publish-pub.outputs.public }}
          DEST: ${{ runner.temp }}/bench-token-final.bin
          WHICH: final
        run: |
          set -euo pipefail
          echo "Sealing the refresh token after the run"
          f="$RUNNER_TEMP/bench-runner.json"
          if [ ! -f "$f" ]; then
            echo "${WHICH}=absent" >> "$GITHUB_OUTPUT"
            echo "No runner file after the run; nothing to seal"
            exit 0
          fi
          if [ -z "${PUB:-}" ]; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::no public key to seal the rotated token"
            exit 1
          fi
          if ! printf '%s' "$PUB" | /usr/bin/base64 -d > "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::the public key could not be read"
            exit 1
          fi
          if ! /usr/bin/python3 -c '
          import json, pathlib, subprocess, sys
          src, dest, pub = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(src).read_text())
          except Exception:
              sys.stderr.write("the runner file is not json\n")
              sys.exit(1)
          token = data.get("refreshToken") if isinstance(data, dict) else None
          if not isinstance(token, str) or token == "":
              sys.stderr.write("the runner file has no refresh token\n")
              sys.exit(1)
          plain = pathlib.Path(dest + ".plain")
          plain.write_bytes(token.encode())
          plain.chmod(0o600)
          result = subprocess.run(["/usr/bin/openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub, "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256", "-in", str(plain), "-out", dest], capture_output=True, text=True)
          plain.unlink(missing_ok=True)
          if result.returncode != 0:
              sys.stderr.write(result.stderr or "openssl could not seal the token\n")
              sys.exit(result.returncode or 1)
          print("Sealed", pathlib.Path(dest).stat().st_size, "bytes")
          ' "$f" "$DEST" "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not seal the rotated token after the run"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seal-pub.pem"
          echo "${WHICH}=present" >> "$GITHUB_OUTPUT"
          echo "Sealed the refresh token after the run"

      - name: Keep the seal from the end of the run
        # always(): a failed step before this one must not skip the upload (Lab run 44313860768 sealed the
        # final token, skipped this upload because the run had already failed, and the writer wrote nothing).
        if: always() && steps.seal-final.outputs.final == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: bench-token-final
          path: ${{ runner.temp }}/bench-token-final.bin
          retention-days: 1
          if-no-files-found: error

      - name: Mark the commit with the result and re-run the pull request's check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
          AREAS: ${{ steps.areas.outputs.areas }}
          NAMED: ${{ steps.areas.outcome }}
          SIGNIN: ${{ steps.signin.outcome }}
          BUDGET: ${{ steps.replay-budget.outcome }}
          EXAMINER: ${{ inputs.examiner }}
          CLAUDE_CODE: ${{ inputs.claude_code }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "$AREAS" ] && [ "$NAMED" = "success" ]; then state=success; description="No model area reached: plumbing replays only"
          elif [ "$OUTCOME" = "success" ] && [ "$EXAMINER" = "true" ]; then state=success; description="Nothing regressed against main (examiner's answers, scored here)"
          elif [ "$OUTCOME" = "success" ] && [ "$CLAUDE_CODE" = "true" ]; then state=success; description="Nothing regressed against main (Claude Code's answers, scored here)"
          elif [ "$OUTCOME" = "success" ]; then state=success; description="Nothing regressed against main"
          elif [ "$CLAUDE_CODE" = "true" ] && [ "$HAS_TOKEN" != "true" ]; then state=failure; description="Needs CLAUDE_CODE_OAUTH_TOKEN: make one with claude setup-token, add it as a production secret"
          elif [ "$SIGNIN" = "failure" ]; then state=failure; description="Runner sign-in failed: if the grant was revoked, a person must run pnpm ai connect"
          elif [ "$BUDGET" = "failure" ]; then state=failure; description="Over the replay-gate month in ai/results/spend.md"
          else state=failure; description="Regressed against main, or the run failed: read the run's summary"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context="Tex replay" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tex-replay-check.yml --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [ -z "$run" ] || gh run rerun "$run" --repo "$GITHUB_REPOSITORY" || true

  # Main's checkout only. Opens the seal and writes the production secret. Runs after the replay even when that
  # job failed, because a sign-in that already rotated the token still has to be stored. The workflow stays in
  # progress until this job finishes, so the next benchmark run reads the secret after the write.
  write-token:
    name: Write the rotated refresh token
    needs: [token-key, replay]
    if: always() && (needs.replay.outputs.early == 'present' || needs.replay.outputs.early == 'failed' || needs.replay.outputs.final == 'present' || needs.replay.outputs.final == 'failed')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: The writer token is set
        env:
          GH_TOKEN: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN"

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # Both seals, each when its job said it exists, and neither may fail the job: the write below prefers the
      # final seal only when its file is here, and otherwise falls back to the one from after sign-in.
      - name: The seal from the end of the run
        if: needs.replay.outputs.final == 'present'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-token-final
          path: ${{ runner.temp }}/final

      - name: The seal from after sign-in
        if: always() && needs.replay.outputs.early == 'present'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-token-early
          path: ${{ runner.temp }}/early

      - name: Open the seal and write the production secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
          WRAPPED: ${{ needs.token-key.outputs.wrapped }}
          EARLY: ${{ needs.replay.outputs.early }}
          FINAL: ${{ needs.replay.outputs.final }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/priv.pem" "$RUNNER_TEMP/priv.enc" "$RUNNER_TEMP/refresh-token"' EXIT
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN"
          if [ "$FINAL" = "failed" ]; then
            echo "::error::the last seal failed; not writing an older token"
            exit 1
          fi
          final="$RUNNER_TEMP/final/bench-token-final.bin"
          early="$RUNNER_TEMP/early/bench-token-early.bin"
          if [ "$FINAL" = "present" ] && [ -s "$final" ]; then
            cipher="$final"
            echo "Using the seal from the end of the run"
          elif [ "$EARLY" = "failed" ]; then
            echo "::error::the seal after sign-in failed"
            exit 1
          elif [ "$EARLY" = "present" ] && [ -s "$early" ]; then
            cipher="$early"
            if [ "$FINAL" = "present" ]; then
              echo "::warning::the seal from the end of the run is missing or empty; using the seal from after sign-in"
            else
              echo "Using the seal from after sign-in; the run ended before the last seal"
            fi
          elif [ "$FINAL" = "present" ] || [ "$EARLY" = "present" ]; then
            echo "::error::the sealed token file is missing"
            exit 1
          else
            echo "::error::no sealed token to write"
            exit 1
          fi
          if [ ! -s "$cipher" ]; then
            echo "::error::the sealed token file is missing"
            exit 1
          fi
          if [ -z "$WRAPPED" ]; then
            echo "::error::this run has no wrapped seal key"
            exit 1
          fi
          umask 077
          printf '%s' "$WRAPPED" | /usr/bin/base64 -d > "$RUNNER_TEMP/priv.enc"
          export SEAL="$GH_TOKEN"
          /usr/bin/openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SEAL -in "$RUNNER_TEMP/priv.enc" -out "$RUNNER_TEMP/priv.pem"
          node scripts/bench-token-open.mjs --private "$RUNNER_TEMP/priv.pem" --cipher "$cipher" --out "$RUNNER_TEMP/refresh-token"
          mask=$(/usr/bin/python3 -c 'import pathlib,sys; sys.stdout.write(pathlib.Path(sys.argv[1]).read_text())' "$RUNNER_TEMP/refresh-token")
          echo "::add-mask::$mask"
          unset mask
          echo "Writing BENCH_RUNNER_REFRESH_TOKEN_LIVE to the production environment"
          # `gh secret set` has no `--body-file`. That flag exits 1 before the API call, so the rotated
          # token is never stored and the next sign-in revokes the grant. The value is stdin.
          # bench-token-open.mjs writes the token with no trailing newline; gh strips only trailing CR/LF
          # from stdin, and a refresh token has neither, so the stored secret equals the token.
          if ! gh secret set BENCH_RUNNER_REFRESH_TOKEN_LIVE --env production --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/refresh-token"; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN could not write BENCH_RUNNER_REFRESH_TOKEN_LIVE"
            exit 1
          fi
          echo "Wrote BENCH_RUNNER_REFRESH_TOKEN_LIVE"
