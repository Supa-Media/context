# The replay gate's model half (docs/decisions/testing/replay-gate.md; Dev2,
# 2026-11-13). Runs only the model areas a branch's Tex change reaches
# (apps/mcp/bench/replayAreas.mjs) against main, held-out cases included,
# capped at $1 (apps/mcp/bench/replayGate.mjs), then marks the branch's head
# commit with the status "Tex replay" and re-runs the pull request's required
# check ("Tex replay required", scripts/tex-replay-required.mjs).
#
# Runs by hand only, like the AI Benchmark: it holds production's gateway
# token, so it never runs on a pushed branch's code by itself
# (scripts/check-workflow-triggers.mjs). The agent that opens a Tex pull
# request dispatches it on its branch.

name: Tex replay

on:
  workflow_dispatch:
    inputs:
      examiner:
        description: "Score the examiner session's answers for this commit (ai/results/examiner/<sha>) instead of calling Claude"
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  actions: write

# No `concurrency` group: one holds a single pending run and cancels the
# next, so the wait-turn job below queues runs instead (bench-runner-lock.mjs).

jobs:
  # One benchmark runner sign-in at a time, first come first served, nothing
  # cancelled (scripts/bench-runner-lock.mjs). Its own job, holding no secret:
  # the next job's secrets are read when it starts, after an earlier run has
  # written the rotated refresh token back.
  wait-turn:
    name: Wait for earlier benchmark runs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Mark the commit as waiting its turn
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context="Tex replay" \
            -f description="Waiting for earlier benchmark runs, then replaying" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: Wait until no earlier run signs in as the benchmark runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --max-minutes 170

  replay:
    name: Replay the areas this change reaches
    needs: wait-turn
    runs-on: ubuntu-latest
    environment: production
    # The jobs area runs whole background jobs (apps/mcp/bench/jobTasks.mjs): minutes a task.
    timeout-minutes: 60
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_KEY_ALIASES: ${{ secrets.AI_GATEWAY_KEY_ALIASES }}
      ANTHROPIC_CREDIT_KEY: ${{ secrets.ANTHROPIC_CREDIT_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      BENCH_RUNNER_CLIENT_ID: ${{ secrets.BENCH_RUNNER_CLIENT_ID }}
      BENCH_RUNNER_REFRESH_TOKEN: ${{ secrets.BENCH_RUNNER_REFRESH_TOKEN }}
      BENCH_RUNNER_REFRESH_TOKEN_LIVE: ${{ secrets.BENCH_RUNNER_REFRESH_TOKEN_LIVE }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mark the commit as being replayed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context="Tex replay" \
            -f description="Replaying the areas this change reaches" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Name the areas this change reaches
        id: areas
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          areas="$(pnpm --silent ai gate areas --base-sha "$base" | paste -sd, -)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "Areas: ${areas:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Main beside the change
        if: steps.areas.outputs.areas != ''
        env:
          BASE: ${{ steps.areas.outputs.base }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/main" "$BASE"
          (cd "$RUNNER_TEMP/main" && pnpm install --frozen-lockfile)

      # Its wait-turn job is skipped by "Re-run failed jobs": check once more,
      # and refuse rather than sign in beside another run (bench-runner-lock.mjs).
      - name: Refuse to sign in beside another benchmark run
        if: steps.areas.outputs.areas != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --check

      - name: Sign in as the benchmark runner and keep the rotated token
        id: signin
        if: steps.areas.outputs.areas != ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --silent ai signin
          next="$(pnpm --silent ai signin --show refresh-token)"
          echo "::add-mask::$next"
          gh secret set BENCH_RUNNER_REFRESH_TOKEN_LIVE --env production --repo "$GITHUB_REPOSITORY" --body "$next"

      - name: Pull the held-out cases (never written to the repository or the log)
        if: steps.areas.outputs.areas != ''
        run: pnpm --silent ai gate held-out --dir "$RUNNER_TEMP/held-out"

      # With no API credits (Dev2, 2026-11-13): a separate examiner session answered this
      # commit's Claude calls (apps/mcp/bench/modelSocket.mjs); every call is rebuilt here
      # from this commit and answered from those answers, and the scoring is this run's own.
      - name: Pull the examiner's answers for this commit
        if: steps.areas.outputs.areas != '' && inputs.examiner
        run: |
          set -euo pipefail
          pnpm --silent ai socket pull --sha "$HEAD_SHA" --out "$RUNNER_TEMP/examiner.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BENCH_MODEL_REPLAY=$RUNNER_TEMP/examiner.json" >> "$GITHUB_ENV"

      # The core and jobs areas answer as the live setup, in each tree's own code:
      # the setup and the tests edited in Context go into both trees' bench folders.
      - name: Pull the live setup into both trees (core and jobs areas)
        if: contains(steps.areas.outputs.areas, 'core') || contains(steps.areas.outputs.areas, 'jobs')
        run: |
          set -euo pipefail
          pnpm --silent ai pull texting-assistant
          (cd "$RUNNER_TEMP/main" && pnpm --silent ai pull texting-assistant)

      - name: Replay against main
        id: gate
        if: steps.areas.outputs.areas != ''
        env:
          AREAS: ${{ steps.areas.outputs.areas }}
        run: |
          set -uo pipefail
          pnpm --silent ai gate --base "$RUNNER_TEMP/main" --areas "$AREAS" --held-out "$RUNNER_TEMP/held-out" \
            --scratch "$RUNNER_TEMP/gate" --out "$RUNNER_TEMP/gate.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # The job tasks' records (each practice task's page, parts and checks; held-out ones are never written), so a
      # pass can be read rather than trusted.
      - name: Keep the job tasks' records
        if: always() && contains(steps.areas.outputs.areas, 'jobs')
        uses: actions/upload-artifact@v4
        with:
          name: tex-replay-job-tasks
          path: ${{ runner.temp }}/gate/jobs-*-records.json
          if-no-files-found: ignore
          retention-days: 14

      # What the run spent, beside the testing loop's other rounds (ai/results/spend.md).
      - name: Record what the replay spent
        if: always() && steps.areas.outputs.areas != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/gate.json" ] || exit 0
          usd="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).usd.toFixed(2))' "$RUNNER_TEMP/gate.json")"
          [ "$usd" = "0.00" ] || pnpm --silent ai spend add replay-gate --usd "$usd" --run "replay-$RUN_NUMBER" --run-url "$RUN_URL"

      # The core area's answers may take long enough to sign in again: keep that token too.
      - name: Keep the runner's rotated token
        if: always() && steps.areas.outputs.areas != ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/bench-runner.json" ] || exit 0
          next="$(pnpm --silent ai signin --show refresh-token)"
          echo "::add-mask::$next"
          gh secret set BENCH_RUNNER_REFRESH_TOKEN_LIVE --env production --repo "$GITHUB_REPOSITORY" --body "$next"

      - name: Mark the commit with the result and re-run the pull request's check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
          AREAS: ${{ steps.areas.outputs.areas }}
          NAMED: ${{ steps.areas.outcome }}
          SIGNIN: ${{ steps.signin.outcome }}
          EXAMINER: ${{ inputs.examiner }}
        run: |
          set -euo pipefail
          if [ -z "$AREAS" ] && [ "$NAMED" = "success" ]; then state=success; description="No model area reached: plumbing replays only"
          elif [ "$OUTCOME" = "success" ] && [ "$EXAMINER" = "true" ]; then state=success; description="Nothing regressed against main (examiner's answers, scored here)"
          elif [ "$OUTCOME" = "success" ]; then state=success; description="Nothing regressed against main"
          elif [ "$SIGNIN" = "failure" ]; then state=failure; description="Runner sign-in failed: if the grant was revoked, a person must run pnpm ai connect"
          else state=failure; description="Regressed against main, or the run failed: read the run's summary"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context="Tex replay" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tex-replay-check.yml --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [ -z "$run" ] || gh run rerun "$run" --repo "$GITHUB_REPOSITORY" || true
