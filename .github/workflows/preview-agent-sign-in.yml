name: Preview agent sign-in

# Lets an AI agent sign in to the preview of a pull request, with no mailbox and
# no new secret (Dev2, 2026-11-21). The agent passes a throwaway public key made
# by `node packages/sandbox/src/agent-sign-in.mjs keygen`; this runner signs a
# fictional persona in on that pull request's preview (the preview deploy key
# only reaches `pr<N>` deployments, never staging or production) and prints one
# AGENT_SIGN_IN line: the preview's address and the session, sealed to that key.
# This repository's Actions logs are public, and that line is unreadable without
# the agent's private key. See packages/sandbox/src/agent-sign-in.mjs and
# docs/preview-sandbox.md.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number whose preview to sign in to."
        type: string
        required: true
      persona:
        description: "Which fictional persona."
        type: choice
        options: [alpha, beta, gamma, delta, epsilon]
        default: alpha
      public_key:
        description: "The 43-character public key `agent-sign-in.mjs keygen` printed."
        type: string
        required: true

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The workers.dev subdomain names the account, so it is masked; it reaches the agent only inside the sealed line.
      - name: Read the preview's web app origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr is a pull request number"; exit 1; }
          sub="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // ""')"
          [ -n "$sub" ] || { echo "::error::no workers.dev subdomain"; exit 1; }
          echo "::add-mask::$sub"
          echo "PREVIEW_ROUTER_ORIGIN=https://context-router-pr$PR.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Sign the persona in and seal the session to the agent's key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PR: ${{ inputs.pr }}
          PERSONA: ${{ inputs.persona }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: node packages/sandbox/src/agent-sign-in.mjs mint
