# Deploy the MCP gateway Worker (apps/mcp) on every merge to `main`.
#
# The gateway decrypts and uses customers' storage credentials, so its suite is
# a hard gate: the deploy job does not start unless every check passes. That is
# the same reasoning as mcp.yml (this repo's gateway CI), which exists because
# the most security-sensitive code here was once the least covered.
#
# ── The Wrangler config question ───────────────────────────────────────────
#
# `apps/mcp/wrangler.toml` is NOT the product config. It is the founder's live
# single-tenant deployment: Worker `brain`, an R2 binding `BRAIN` to a bucket
# `brain`, a calendar cron, and a header telling you to deploy it from a
# PERSONAL Cloudflare account. Deploying that file with this repo's
# CLOUDFLARE_* secrets would push it into the Supa Media account instead —
# creating a second Worker called `brain` bound to a bucket that does not exist
# there, and putting a live personal deployment one config edit away from being
# overwritten.
#
# So this workflow never touches it. It deploys MCP_WRANGLER_CONFIG below, a
# separate product config that does not exist yet — while it is absent the
# deploy is skipped with a warning rather than falling back to the personal
# one. See the deploy pipeline report / the proposal in the pull request for
# what that file should contain; switching to a repurposed `wrangler.toml`
# later is a one-line change here.
name: Deploy MCP Gateway (production)

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

# Never on `pull_request`: a deploy triggered by a pull request from a branch
# pushed HERE would run unreviewed code with the account's Cloudflare
# credentials, against the Worker that holds customers' storage keys. A branch
# and not a fork — a fork's run inherits no secrets, so it is the one shape that
# could not; a same-repo branch is trusted by Actions.
concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  # The product gateway's Wrangler config, relative to apps/mcp.
  #
  # This used to name `wrangler.product.toml`, a file that has never existed —
  # so the "Look for the product Wrangler config" step below skipped the deploy
  # and the job went green. The gateway was therefore never deployed at all,
  # while every run reported success, and `mcp.context.lc` did not resolve.
  #
  # The reason for the indirection is gone: `wrangler.toml` IS the product
  # config (read its header), and the personal single-tenant `brain` Worker now
  # lives on a different Cloudflare account with its own config. The identity
  # guard below still refuses a config naming that Worker or its bucket.
  MCP_WRANGLER_CONFIG: wrangler.toml

jobs:
  test:
    name: Test gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Required. setup-node defaults this to true, detects pnpm from the
          # root package.json's `packageManager` field, and shells out to
          # `pnpm` to resolve its cache directory. This job deliberately never
          # installs pnpm, so it would die with "Unable to locate executable
          # file: pnpm" before the suite ever ran.
          package-manager-cache: false

      # No install. apps/mcp has zero dependencies and its suite runs offline
      # against an in-memory store stub. If this ever needs an install, a
      # dependency crept into the gateway and that is the thing to fix.
      - name: Run test suite
        working-directory: apps/mcp
        run: node test/test.mjs

  deploy:
    name: Deploy gateway
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Decide whether there is a product config to deploy. Absent one, this
      # job stops short of `wrangler deploy` instead of reaching for the
      # personal config — see the header.
      - name: Look for the product Wrangler config
        id: config
        run: |
          set -euo pipefail
          path="apps/mcp/$MCP_WRANGLER_CONFIG"
          if [ -f "$path" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "OK — deploying with $path."
          else
            echo "ERROR: $path does not exist, so there is nothing to deploy."
            echo "This used to be a warning that let the job pass. It cost the"
            echo "project a gateway that was never deployed while CI stayed green."
            exit 1
          fi

      # A last line of defence for the live personal deployment. If the product
      # config ever ends up naming the personal Worker or binding its bucket,
      # stop — a deploy under that name from these credentials is either a
      # duplicate in the wrong account or, with the wrong token, a clobber.
      - name: Refuse to deploy under the personal Worker's identity
        if: steps.config.outputs.found == 'true'
        run: |
          set -euo pipefail
          path="apps/mcp/$MCP_WRANGLER_CONFIG"
          if grep -qE '^\s*name\s*=\s*"brain"' "$path"; then
            echo "ERROR: $path declares name = \"brain\" — the founder's personal Worker."
            exit 1
          fi
          if grep -qE '^\s*bucket_name\s*=\s*"brain"' "$path"; then
            echo "ERROR: $path binds the personal 'brain' R2 bucket."
            exit 1
          fi
          echo "OK — the product config has its own identity."

      - name: Verify required secrets
        if: steps.config.outputs.found == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_SECRET CONTROL_PLANE_URL; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required secret '$var' in the 'production' environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK — every required secret is present."

      # Prove the token can write to the account wrangler will deploy into,
      # BEFORE the opaque wrangler failure ("Could not route ... [code: 7003]",
      # which says nothing about the cause).
      #
      # This calls GET /accounts/{id}/workers/scripts rather than the bare
      # GET /accounts/{id} it used until 2026-09-07. The bare form needs
      # "Account Settings: Read" — a permission this deploy has no other use
      # for — and that day the token lost exactly that scope while otherwise
      # unchanged (it could still deploy). Two sibling workflows
      # (deploy-router.yml, deploy-email-worker.yml) died on Cloudflare 9109
      # ("Unauthorized to access requested resource") from the identical bare
      # call; this workflow carried the same step and would have failed the
      # same way on its next trigger. `/workers/scripts` needs only
      # "Workers Scripts: Read", a strict subset of "Workers Scripts: Edit",
      # which `wrangler deploy` below needs no matter what — so this preflight
      # can never need a permission the deploy does not already require.
      #
      # It can no longer print the account's NAME — that field lives behind
      # the same "Account Settings: Read" this step now deliberately avoids
      # asking for — so it prints the script COUNT instead. A count is not an
      # identifier, but it still distinguishes the personal account (its own,
      # unrelated set of scripts) from Supa Media's.
      - name: Verify Cloudflare credentials (preflight)
        if: steps.config.outputs.found == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            if (d.success) {
              console.log("[ok] token can list Workers scripts for this account (" + (d.result || []).length + " script(s)).");
            } else {
              console.error("[FAIL] CLOUDFLARE_API_TOKEN cannot read Workers scripts for CLOUDFLARE_ACCOUNT_ID.");
              console.error("       Cloudflare errors: " + JSON.stringify(d.errors));
              console.error("");
              console.error("       Code 9109 (\"Unauthorized to access requested resource\") means one of:");
              console.error("         - CLOUDFLARE_ACCOUNT_ID is wrong for this token, or");
              console.error("         - CLOUDFLARE_API_TOKEN itself is invalid or expired, or");
              console.error("         - the token is missing \"Workers Scripts: Read\" (or :Edit) on this account.");
              console.error("       wrangler deploy below needs \"Workers Scripts: Edit\" regardless, so if");
              console.error("       this is a permission gap, that same edit fixes both.");
              process.exit(1);
            }
          ' "$resp"

      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.found == 'true'

      - uses: actions/setup-node@v5
        if: steps.config.outputs.found == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Scoped to apps/mcp, which needs exactly one devDependency (wrangler) —
      # the gateway itself still has no runtime dependencies.
      - name: Install wrangler
        if: steps.config.outputs.found == 'true'
        run: pnpm install --filter "./apps/mcp..." --frozen-lockfile

      # DEPLOY FIRST, secrets after — the ordering `deploy-router.yml` and
      # `deploy-email-worker.yml` fixed for the same reason (#302).
      # `wrangler secret put` acts on whatever version of the script is
      # CURRENTLY LIVE. If a future edit to `wrangler.toml` ever declares
      # `CONTROL_PLANE_URL` or `GATEWAY_SECRET` under `[vars]` — the exact
      # mistake `infra/router/wrangler.jsonc` made — running the secret push
      # before this step would collide with that plaintext var on every run,
      # forever, because the one step that retires it (`wrangler deploy`)
      # would never get to run: Cloudflare 10053, "Binding name '<NAME>'
      # already in use". Nothing in `wrangler.toml` declares either name as a
      # var today (see its `[vars]` block), so this file has not hit that
      # failure — but the ordering that prevents it costs nothing and matches
      # its two siblings, so it is applied here too rather than left as the
      # one deploy workflow that still assumes the collision can't happen.
      - name: Deploy gateway
        if: steps.config.outputs.found == 'true'
        working-directory: apps/mcp
        run: pnpm exec wrangler deploy --config "$MCP_WRANGLER_CONFIG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Push the Worker's secrets from GitHub on every deploy, so the live
      # gateway is reproducible from this repository rather than from whatever
      # somebody once typed at a terminal. `wrangler secret put` is idempotent
      # and reads the value from stdin, so nothing is ever placed on a command
      # line or in a log.
      #
      # GATEWAY_SECRET must be the same value the control plane holds — it is
      # what proves "this caller is the gateway" — so it lives in one place,
      # GitHub, and is pushed to both sides from there.
      - name: Sync the gateway's secrets
        if: steps.config.outputs.found == 'true'
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
          TRANSCRIBE_WORKER_URL: ${{ secrets.TRANSCRIBE_WORKER_URL }}
          TRANSCRIBE_WORKER_SECRET: ${{ secrets.TRANSCRIBE_WORKER_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$GATEWAY_SECRET" | pnpm exec wrangler secret put GATEWAY_SECRET --config "$MCP_WRANGLER_CONFIG"
          printf '%s' "$CONTROL_PLANE_URL" | pnpm exec wrangler secret put CONTROL_PLANE_URL --config "$MCP_WRANGLER_CONFIG"

          # Transcription: both, or neither, and absent is a working state.
          #
          # The desktop recorder reaches `POST /meetings/sessions/:id/transcribe`
          # with its own grant; the gateway forwards the audio to the same
          # `context-transcribe` Worker the control plane uses and keeps none of
          # it. With neither variable set the route answers 501 and every
          # recorder degrades to typed notes — which is the right answer for a
          # self-hosted install and the reason this is not a required secret
          # here. A URL with no secret would post meeting audio to an endpoint
          # unauthenticated, so a half-configured pair is refused rather than
          # deployed.
          if [ -n "${TRANSCRIBE_WORKER_URL:-}" ] && [ -n "${TRANSCRIBE_WORKER_SECRET:-}" ]; then
            printf '%s' "$TRANSCRIBE_WORKER_URL" | pnpm exec wrangler secret put TRANSCRIBE_WORKER_URL --config "$MCP_WRANGLER_CONFIG"
            printf '%s' "$TRANSCRIBE_WORKER_SECRET" | pnpm exec wrangler secret put TRANSCRIBE_WORKER_SECRET --config "$MCP_WRANGLER_CONFIG"
            echo "OK — transcription is configured for this gateway."
          elif [ -n "${TRANSCRIBE_WORKER_URL:-}" ] || [ -n "${TRANSCRIBE_WORKER_SECRET:-}" ]; then
            echo "ERROR: TRANSCRIBE_WORKER_URL and TRANSCRIBE_WORKER_SECRET must be set together."
            exit 1
          else
            echo "OK — no transcription configured; meetings on the desktop will be typed."
          fi
          echo "OK — the Worker's secrets match this repository's."

      # A deploy that reports success without the endpoint answering is exactly
      # how this gateway stayed undeployed for weeks. Ask the public URL.
      - name: Verify the gateway is actually serving
        if: steps.config.outputs.found == 'true'
        run: |
          set -euo pipefail
          origin="https://mcp.context.lc"

          # RFC 9728 discovery is unauthenticated and must name this origin.
          # A worker that is up but misconfigured (PUBLIC_ORIGIN unset, so the
          # documents advertise a workers.dev URL) would pass a bare 200 check
          # and hand every client the wrong address — so match the content.
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$origin/.well-known/oauth-protected-resource" || true)"
            case "$body" in
              *'"resource":"https://mcp.context.lc/mcp"'*)
                echo "OK — discovery is live and self-consistent (attempt $attempt)."
                break
                ;;
            esac
            if [ "$attempt" -eq 20 ]; then
              echo "ERROR: $origin never served correct protected-resource metadata."
              echo "Last body: ${body:-<empty>}"
              exit 1
            fi
            echo "Attempt $attempt: not serving correctly yet."
            sleep 15
          done

          # And the endpoint the product actually hands people must refuse an
          # unauthenticated call rather than 404 or 500. 401 is the right answer.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            "$origin/mcp")"
          if [ "$code" != "401" ]; then
            echo "ERROR: POST $origin/mcp returned $code; expected 401 for an unauthenticated call."
            exit 1
          fi
          echo "OK — $origin/mcp refuses an unauthenticated call with 401."

      - name: Summary
        if: always()
        run: |
          {
            echo "## MCP gateway deploy (production)"
            echo ""
            echo "- **Deployed with:** \`apps/mcp/$MCP_WRANGLER_CONFIG\`"
            echo "- **Serves:** https://mcp.context.lc — verified live by the step above."
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
