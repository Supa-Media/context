name: Preview cleanup

# Deletes a pull request's preview (its Workers, Workflows and storage) and
# sweeps for any left behind. The matching is exact, so one preview's cleanup
# can never touch another's (scripts/preview-cleanup.mjs explains the names).
#
# Four ways in:
#
#   push to main       a merge closes its pull request, and a push to main is the
#                      only event that follows a merge: the sweep finds the
#                      merged pull request's preview there.
#   delete             a branch was deleted: the closed pull requests that
#                      branch had are looked up through the API and cleaned.
#   schedule           a daily sweep, the backstop for every other case. It is
#                      also how a pull request closed WITHOUT merging is cleaned,
#                      so that preview lives until the next sweep.
#   workflow_dispatch  one pull request (`pr`), or the sweep when `pr` is empty.
#
# There is no `pull_request` trigger. Scripts/check-workflow-triggers.mjs requires
# any pull_request trigger to carry the default types, and this workflow only
# needs the close, so a `closed`-only trigger is refused (rule A).
#
# What one deletion covers, and the check that ends it, are in
# scripts/preview-cleanup.mjs and scripts/preview-teardown.mjs: the Workers (and
# with them their Durable Objects and secrets), the Workflows, the Convex preview
# deployment, the emptied buckets, the search databases and indexes, and the
# scoped R2 tokens. Anything still there afterwards fails the run.
#
# This workflow runs `wrangler delete`, inside scripts/preview-cleanup.mjs. The
# trigger checker does not count a delete as a deploy, so the file keeps its
# name. Its deletions are exact-name only, and no production name can match.
on:
  push:
    branches: [main]
  delete:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number whose preview to delete. Leave empty to sweep every closed preview."
        type: string
        default: ""

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview resources
    # A deleted tag is not a branch, and has no preview.
    if: ${{ github.event_name != 'delete' || github.event.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MANAGED_R2_ACCOUNT_ID: ${{ secrets.MANAGED_R2_ACCOUNT_ID }}
      # The token that minted each bucket's scoped R2 token, so it can list and revoke them.
      PREVIEW_R2_API_TOKEN: ${{ secrets.PREVIEW_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      # The preview deploy key finds the pr<N> Convex deployment and deletes it.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      EVENT_BRANCH: ${{ github.event.ref }}
      INPUT_PR: ${{ inputs.pr }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Wrangler, from each Worker's own checkout, does the Worker deletions.
      - run: pnpm install --frozen-lockfile

      - name: Delete the previews of a deleted branch's closed pull requests
        if: ${{ github.event_name == 'delete' }}
        run: |
          set -euo pipefail
          numbers="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=all -f "head=$OWNER:$EVENT_BRANCH" --jq '.[] | select(.state == "closed") | .number')"
          if [ -z "$numbers" ]; then
            echo "Branch $EVENT_BRANCH had no closed pull request; no preview to delete. The sweep is the backstop."
            exit 0
          fi
          for number in $numbers; do
            node scripts/preview-cleanup.mjs delete "$number"
          done

      - name: Delete the requested preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' }}
        run: node scripts/preview-cleanup.mjs delete "$INPUT_PR"

      # Every preview whose pull request is closed, and a count of the live ones
      # against the ceiling. Runs after a merge, on the daily schedule, and on a
      # dispatch that names no pull request.
      - name: Sweep for previews whose pull request is closed
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '') }}
        run: node scripts/preview-cleanup.mjs sweep
