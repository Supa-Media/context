# The email worker's own CI.
#
# Same gap `mcp.yml` and `router.yml` were written to close: the Supa
# framework's reusable pipeline filters on apps/mobile, apps/convex and
# packages/shared, so nothing under infra/ is covered. Without this job the
# 210 tests that hold this worker's security properties — DMARC before the
# allowlist, personal contexts only, one indistinguishable bounce for every
# refusal — would only ever run on a developer's machine.
name: Email Worker

# No `paths:` filter on pull_request. A filtered-out required check never
# reports and leaves the PR pending forever; see the note in mcp.yml.
#
# And no `branches:` filter on pull_request either — see mcp.yml. A base-branch
# filter means a pull request stacked on another branch runs no checks at all,
# which is how #169 merged with zero check runs. The key is absent rather than
# `branches: ['**']` so that a tidy-up to `'*'` cannot silently stop matching
# `claude/…`-shaped branches; `scripts/check-workflow-triggers.mjs` enforces it.
# The `push:` filter below stays on `main`.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/email-worker/**"
      - ".github/workflows/email-worker.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: email-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Email Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Runs before install: it needs only bash and node, and a workflow whose
      # shell does not parse is worth failing fast on. See the script's header
      # for the apostrophe that made this necessary.
      - name: Workflow run blocks parse as shell
        run: node scripts/check-workflow-shell.mjs

      # The third of the same family, and this file is its second host for the
      # same reason it is the trigger checker's: a workflow that does not parse
      # is not a failing check, GitHub ignores the file entirely, so a checker
      # that lives only inside the file that broke goes down with it silently.
      # `mcp.yml` held the only copy and was the file it could not check.
      - name: Every workflow file parses as YAML
        run: |
          node scripts/check-workflow-yaml.mjs --self-test
          node scripts/check-workflow-yaml.mjs

      # The second half of the same idea, and the second host for it: this
      # asserts what the `on:` blocks SAY rather than what their run blocks do.
      # mcp.yml runs it too — see the note there for why one host is not
      # enough.
      - name: Workflow triggers reach pull requests, and deploys reach none
        run: |
          node scripts/check-workflow-triggers.mjs --self-test
          node scripts/check-workflow-triggers.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --filter @context/email-worker... --frozen-lockfile

      - name: Typecheck
        working-directory: infra/email-worker
        run: npx tsc --noEmit

      - name: Ingestion tests
        working-directory: infra/email-worker
        run: npx vitest run
