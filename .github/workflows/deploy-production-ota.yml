name: Publish production OTA

# The JS bundle is exported in Deploy to Production, beside the backends.
# This workflow only uploads that artifact, after those backends have
# succeeded, so a phone does not receive JS that calls functions the deploy
# has not shipped. It is a separate workflow so the upload does not hold
# production's queue: web, router, Convex and the agent are live while this
# runs.
#
# An in-progress upload is not cancelled. A newer queued upload replaces an
# older one that has not started. There is no separate rollback command; a
# failed upload leaves the previous production update in place, and the next
# successful publish replaces it.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Deploy to Production run that uploaded production-ota-dist
        type: string
        required: true
      deploy_sha:
        description: Commit the bundle was exported from
        type: string
        required: true

concurrency:
  group: deploy-production-ota
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish OTA update
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Inlined into the OTA JS bundle at export time. The export already
      # happened in the production run; `eas update` still evaluates
      # app.config.js for the manifest, so the same values have to be present.
      EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      # The commit the bundle was exported from, not the tip of main.
      EXPO_PUBLIC_APP_BUILD: ${{ inputs.deploy_sha }}
      EXPO_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.1"
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
      EXPO_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: "0.1"
      # The site key for the human check in front of a collect link — the
      # public half of the pair whose secret half `deploy-convex.yml` pushes.
      # Public by construction: it is in the markup of every page that runs the
      # widget. Here rather than committed because this repository is, and
      # `CLAUDE.md` keeps account identifiers out of it. Absent is a working
      # state and a deliberate one: the form says it is not taking answers,
      # which is the same thing the control plane says with no secret set.
      EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
      # Build-only source-map credentials; none has an EXPO_PUBLIC_ prefix.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      # Read by app.config.js to resolve extra.eas.projectId — see build-mobile-ota.yml.
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy_sha }}

      - name: The checkout is the commit the bundle was built from
        run: |
          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
            echo "ERROR: checked out $(git rev-parse HEAD), bundle is $DEPLOY_SHA."
            exit 1
          fi
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Verify required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for v in EXPO_TOKEN EXPO_PUBLIC_CONVEX_URL EAS_PROJECT_ID; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: missing required secret '$v' in the 'production' environment."
              exit 1
            fi
          done

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Still needed: `eas update` evaluates app.config.js for the manifest.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: production-ota-dist
          path: apps/mobile/dist
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      # Publish to the `production` BRANCH, which the production channel (read by
      # production builds) points to. `--auto` would publish to the git branch
      # (main), which isn't linked to the channel, so updates would never land.
      - name: Publish OTA update
        working-directory: apps/mobile
        run: eas update --branch production --skip-bundler --input-dir dist --message "$(git log -1 --pretty=%s)" --non-interactive
