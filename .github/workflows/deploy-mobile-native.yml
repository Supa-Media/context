name: Deploy Mobile Native (build + submit)

# A native binary, built on EAS and handed to the App Store — the one step of
# the mobile lifecycle that has been done by hand from a laptop.
#
# ## What this is not
#
# `deploy-mobile-update.yml` ships an OTA JS bundle on every merge to `main`,
# and that covers most days: a change to JS reaches installed builds without
# anyone touching Xcode. What it cannot do is change the binary — a new native
# module, a permission string, an entitlement, a bumped `runtimeVersion` — and
# for those the only route was `eas build` typed locally, which means it
# happened from whichever machine had `eas` logged in. This is that route,
# written down and run by the account rather than by a person's laptop.
#
# ## Why nothing about a branch triggers it
#
# `workflow_dispatch` only, and the reason is the second half of the name: this
# SUBMITS TO THE APP STORE. A `push: branches: [main]` trigger would send a
# build to review on every merge, which is a release decision taken by a merge
# — and the framework's own reusable workflow guards the same hazard with
# fingerprint detection, which needs an `apps/mobile/.fingerprint` this repo
# does not keep. `health-check.yml` states the precedent for the shape: a
# workflow that can reach production, kept safe by nothing about a branch
# starting it.
#
# The consequence is worth stating plainly rather than discovering: **a native
# change merged to `main` ships nothing until somebody dispatches this.** The
# OTA workflow will happily publish a JS bundle whose `runtimeVersion` no
# installed build matches, and that is silent. Dispatch this in the same sitting
# as merging a native change.
#
# ## Why it does not call the framework's reusable workflow
#
# `Supa-Media/supa-framework/.github/workflows/build-mobile-native.yml` exists
# and does more than this. Two things stop it being the right call here today:
#
#  - Its `github-secrets` provider loads `toJSON(secrets)` through a composite
#    action, which requires `secrets: inherit` from the caller. That puts every
#    secret in the `production` environment — `STORAGE_SECRET_ENCRYPTION_KEY`
#    and `GATEWAY_SECRET` among them — into the environment of a job that
#    uploads a source tarball to a third party. This job needs exactly one
#    secret, and holding one secret is not a smaller version of holding twelve.
#  - Its change detection reads `apps/mobile/.fingerprint`, which this repo does
#    not generate, so it would run with `skip-detection: true` and the rest is
#    four `run:` steps.
#
# If either of those changes — a fingerprint file, or a provider that passes
# named secrets — this should become a caller and lose its steps. Upstream-first
# still holds; it is the *coupling* that is wrong right now, not the workflow.
#
# ## What it needs, and what it cannot check
#
# `EXPO_TOKEN` in the `production` environment, which the 1Password sync
# supplies (`scripts/secrets-allowlist.json`, optional — the OTA workflow needs
# it too).
#
# Everything else lives on EAS, not here: the iOS distribution certificate and
# provisioning profile, and the App Store Connect API key that `eas submit`
# authenticates with. A runner cannot verify those exist, and `--non-interactive`
# turns a missing one into a failed step rather than a prompt. If submit fails
# on credentials, run `eas credentials` locally once — the fix is on the EAS
# account, not in this file.
#
# `EXPO_PUBLIC_CONVEX_URL`, `EAS_PROJECT_ID`, and `ASC_APP_ID` are not committed
# because they are account identifiers in this public repository. The first two
# are not read directly by the
# build itself. A native build's env comes from `eas.json`'s per-profile `env`
# block, evaluated on EAS — so setting them as *this job's* env would be a
# value that looks authoritative and is ignored. That is the opposite of the
# OTA workflow, where the bundle is exported in the runner and the variable is
# load-bearing. Instead, the "Inject build-time values into eas.json" step
# below writes the real secrets into the checked-out `eas.json` immediately
# before `eas build` reads it — never into git, only into this run's ephemeral
# working copy — because those two are account identifiers this repository
# does not commit (CLAUDE.md: "no internal hostnames, no account identifiers").
#
# `APPLE_TEAM_ID` IS an ordinary step env, because both `eas build` (when it
# provisions a newly-added target) and `eas submit` read it straight from
# `EXPO_APPLE_TEAM_ID` in their own process environment rather than from a
# config file EAS evaluates remotely.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [ios, android, both]
        default: ios
      profile:
        description: "EAS build profile"
        type: choice
        options: [production, staging]
        default: production
      submit:
        description: "Submit the build to the store after it finishes"
        type: boolean
        default: true

# A second run while one is in flight would build the same commit twice and
# race two submissions of the same version at App Store Connect. Queue instead;
# never cancel, because a cancelled run abandons a build that EAS is already
# paying for and may still submit.
concurrency:
  group: deploy-mobile-native-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    # IPA validation uses Apple's `codesign`, `security` and `plutil`.
    runs-on: macos-latest
    environment: production
    env:
      # `eas build`/`eas submit` resolve the project locally (in this runner)
      # from app.config.js's extra.eas.projectId before ever talking to EAS's
      # remote worker, so this has to be a real value here too — separately
      # from the "Inject build-time values into eas.json" step below, which
      # supplies the *remote* worker's own copy.
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Everything that can be known before EAS is asked to spend half an hour.
      # A submit profile missing from eas.json fails `eas submit` *after* the
      # build, which is the expensive place to find out.
      - name: Preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          # Passed as env rather than interpolated into the node script below,
          # so a profile or platform name can never become JavaScript. They are
          # `choice` inputs today, but that is a property of this file's `on:`
          # block and not something the script gets to depend on.
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          missing=0
          for var in EXPO_TOKEN EAS_PROJECT_ID EXPO_PUBLIC_CONVEX_URL; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required secret '$var' in the 'production' environment."
              echo "It is in scripts/secrets-allowlist.json; run the Sync Secrets workflow."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # Android is prepared, not shipped (owner, 2026-09-07): no keystore,
          # no build, no store submission yet — see docs/decisions/meetings.md,
          # "Android is prepared, not shipped". This blocks a *build* too, not
          # only a submit, and it runs before the submit=false early exit below
          # on purpose: `apps/mobile/app.config.js` and `eas.json`'s
          # `build.production.android` are ready, so nothing stops
          # `eas build --platform android --non-interactive` from running and
          # silently generating a brand-new EAS-managed keystore — a real,
          # permanent artifact for this app's Play Store identity — the first
          # time anyone dispatches this with no credentials configured. That is
          # a decision the owner takes on purpose, once, not a side effect of a
          # workflow_dispatch. `apps/mobile/eas.json` has no
          # `submit.production.android` block either, on purpose — JSON has no
          # comment syntax to disable it in place, so the disabling happens
          # here, deliberately, before `eas submit` ever runs and produces a
          # stack trace about a credential nobody has configured.
          if [ "${PLATFORM}" = "android" ] || [ "${PLATFORM}" = "both" ]; then
            echo "ERROR: Android is prepared, not shipped — no build, no submission yet."
            echo ""
            echo "Two things only the owner can do, in order, before a first Android build:"
            echo "  1. Approve EAS's managed Android keystore for this project (or upload one) —"
            echo "     'eas credentials --platform android', run once, interactively, from a"
            echo "     laptop logged into this EAS account."
            echo "  2. Create a Google Play service-account key with Play Console access and add"
            echo "     it as the GOOGLE_SERVICE_ACCOUNT_KEY secret (scripts/secrets-allowlist.json),"
            echo "     then add a submit.production.android block to apps/mobile/eas.json pointing"
            echo "     at it (eas.json's own docs: https://docs.expo.dev/submit/android/)."
            echo ""
            echo "Until both are done, re-run with platform=ios."
            exit 1
          fi

          if [ "${PLATFORM}" = "ios" ] || [ "${PLATFORM}" = "both" ]; then
            if [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "ERROR: missing 'APPLE_TEAM_ID' in the 'production' environment, needed by"
              echo "'eas build --platform ios' to provision every target (read as"
              echo "EXPO_APPLE_TEAM_ID). It is in scripts/secrets-allowlist.json; run the Sync"
              echo "Secrets workflow."
              exit 1
            fi
          fi

          if [ "${{ inputs.submit }}" != "true" ]; then
            echo "Submit not requested; skipping submit-profile checks."
            exit 0
          fi

          if [ "${PLATFORM}" = "ios" ] || [ "${PLATFORM}" = "both" ]; then
            if [ -z "${ASC_APP_ID:-}" ]; then
              echo "ERROR: missing 'ASC_APP_ID' in the 'production' environment, needed by"
              echo "'eas submit --platform ios --non-interactive' to select the App Store record."
              exit 1
            fi
          fi

          node -e '
            const fs = require("node:fs");
            const eas = JSON.parse(fs.readFileSync("apps/mobile/eas.json", "utf8"));
            const profile = process.env.PROFILE;
            const platform = process.env.PLATFORM;
            const wanted = platform === "both" ? ["ios", "android"] : [platform];
            const submit = (eas.submit || {})[profile] || {};
            const missing = wanted.filter((p) => submit[p] === undefined);
            if (missing.length > 0) {
              console.error(
                `apps/mobile/eas.json has no submit.${profile} config for: ${missing.join(", ")}.\n` +
                `Add it (iOS needs an "ios": {} entry — the team id comes from the\n` +
                `APPLE_TEAM_ID secret), or re-run with submit=false.`
              );
              process.exit(1);
            }
            console.log(`submit.${profile} covers ${wanted.join(", ")}.`);
          '

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `eas.json` commits a placeholder ("REPLACED_BY_CI") for these two —
      # both account identifiers, so this repository does not hold the real
      # values (CLAUDE.md: "no internal hostnames, no account identifiers").
      # `eas build` uploads this checked-out copy of the project to a remote
      # worker that evaluates `app.config.js` itself using exactly this file's
      # per-profile `env` block, so the real values have to land here, in the
      # ephemeral working copy this run made from git — never committed.
      - name: Inject account values into eas.json
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          PROFILE: ${{ inputs.profile }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = "eas.json";
            const eas = JSON.parse(fs.readFileSync(path, "utf8"));
            const values = {
              EAS_PROJECT_ID: process.env.EAS_PROJECT_ID,
              EXPO_PUBLIC_CONVEX_URL: process.env.EXPO_PUBLIC_CONVEX_URL,
            };
            const observability = {
              EXPO_PUBLIC_SENTRY_DSN: process.env.EXPO_PUBLIC_SENTRY_DSN,
              EXPO_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.1",
              EXPO_PUBLIC_POSTHOG_KEY: process.env.EXPO_PUBLIC_POSTHOG_KEY,
              EXPO_PUBLIC_POSTHOG_HOST: process.env.EXPO_PUBLIC_POSTHOG_HOST,
              EXPO_PUBLIC_POSTHOG_REPLAY_SAMPLE_RATE: "0.1",
              SENTRY_AUTH_TOKEN: process.env.SENTRY_AUTH_TOKEN,
              SENTRY_ORG: process.env.SENTRY_ORG,
              SENTRY_PROJECT: process.env.SENTRY_PROJECT,
            };
            let replaced = 0;
            for (const profile of Object.values(eas.build || {})) {
              if (!profile.env) continue;
              for (const key of Object.keys(values)) {
                if (profile.env[key] === "REPLACED_BY_CI") {
                  profile.env[key] = values[key];
                  replaced++;
                }
              }
              for (const [key, value] of Object.entries(observability)) {
                if (value) profile.env[key] = value;
                else delete profile.env[key];
              }
            }
            if (process.env.SUBMIT === "true") {
              const submitProfile = eas.submit?.[process.env.PROFILE];
              if (!submitProfile?.ios) {
                console.error(`eas.json has no submit.${process.env.PROFILE}.ios configuration.`);
                process.exit(1);
              }
              if (!process.env.ASC_APP_ID) {
                console.error("ASC_APP_ID is required for a non-interactive iOS submission.");
                process.exit(1);
              }
              submitProfile.ios.ascAppId = process.env.ASC_APP_ID;
            }
            if (replaced === 0) {
              console.error("No REPLACED_BY_CI placeholder found in eas.json build.*.env.");
              process.exit(1);
            }
            fs.writeFileSync(path, JSON.stringify(eas, null, 2) + "\n");
            console.log(`Injected ephemeral account values into eas.json (${replaced} build env entr${replaced === 1 ? "y" : "ies"}).`);
          '

      # Waits for the build and records its ID, because submission below uses
      # that exact validated artifact rather than a race-prone latest lookup.
      - name: Build iOS
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
        working-directory: apps/mobile
        env:
          # EAS needs the team identifier during the build too: adding a native
          # extension creates a second target whose provisioning profile must
          # be resolved before the remote build can be created.
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          BUILD_JSON=/tmp/context-build.json
          IPA_PATH=/tmp/context-build.ipa
          BUILD_ID_FILE=/tmp/context-build-id
          eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --json > "$BUILD_JSON"
          BUILD_ID=$(node ../../scripts/eas-build-artifact.cjs id "$BUILD_JSON")
          # eas build:download treats the app archive as a tar.gz and fails on
          # the IPA ZIP. Download the applicationArchiveUrl from this exact
          # build JSON, without printing the signed URL or using a latest build.
          node ../../scripts/eas-build-artifact.cjs download "$BUILD_JSON" "$IPA_PATH" | grep -Fxq "$BUILD_ID"
          node ../../scripts/validate-ios-ipa.cjs "$IPA_PATH"
          echo "$BUILD_ID" > "$BUILD_ID_FILE"

      - name: Build Android
        if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive

      - name: Submit iOS to App Store Connect
        if: ${{ inputs.submit && (inputs.platform == 'ios' || inputs.platform == 'both') }}
        working-directory: apps/mobile
        env:
          # eas-cli reads this directly — apps/mobile/eas.json no longer
          # commits an `appleTeamId`, since it is an account identifier this
          # public repository does not hold.
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --path /tmp/context-build.ipa --profile ${{ inputs.profile }} --non-interactive

      - name: Submit Android to Play Console
        if: ${{ inputs.submit && (inputs.platform == 'android' || inputs.platform == 'both') }}
        working-directory: apps/mobile
        run: eas submit --platform android --latest --profile ${{ inputs.profile }} --non-interactive

      - name: Summary
        if: always()
        run: |
          {
            echo "## Native build"
            echo ""
            echo "- **Profile:** ${{ inputs.profile }}"
            echo "- **Platform:** ${{ inputs.platform }}"
            echo "- **Submitted:** ${{ inputs.submit }}"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo ""
            echo "A submitted build still needs a release created in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up native artifacts
        if: always()
        run: |
          umask 077
          trap 'rm -f /tmp/context-build.json /tmp/context-build.ipa /tmp/context-build-id' EXIT
          rm -f /tmp/context-build.json /tmp/context-build.ipa /tmp/context-build-id
