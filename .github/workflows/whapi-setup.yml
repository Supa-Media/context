# Set up Tex's WhatsApp line: point the Whapi.Cloud channel's webhook at the
# texting assistant Worker, so a WhatsApp message reaches Tex. Run by hand.
#
# Whapi webhooks are per channel. Pointing staging and production at the same
# channel leaves one of them receiving nothing: the last apply wins. Give each
# environment its own channel, or apply to one of them only.
#
# The Worker's address is read from Cloudflare, as the deploy workflows do, so
# no hostname is written here. The webhook secret is sent by Whapi on every
# delivery in the x-tex-webhook-secret header; the Worker refuses the rest.
#
# A dry run (the default) reads the channel's status and prints the settings it
# would send, with the secret masked. Tick `apply` to send them.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which Worker the channel's webhook points at"
        type: choice
        options:
          - staging
          - production
        default: production
        required: true
      apply:
        description: "Send the settings (false = dry run, nothing is changed)"
        type: boolean
        default: false
      probe:
        description: "Also print the shapes Whapi uses for @mentions and link previews (no words, numbers or names)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    name: Point Whapi at the texting assistant
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      APPLY: ${{ inputs.apply }}
      WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
      WHAPI_WEBHOOK_SECRET: ${{ secrets.WHAPI_WEBHOOK_SECRET }}
      WHAPI_LINE: ${{ secrets.WHAPI_LINE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets are set
        run: |
          set -euo pipefail
          missing=0
          for var in WHAPI_TOKEN WHAPI_WEBHOOK_SECRET; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set in the $ENVIRONMENT environment. Set it in 1Password and sync, then run this again." >&2
              missing=1
            fi
          done
          if [ "$missing" = "0" ] && [ "${#WHAPI_WEBHOOK_SECRET}" -lt 16 ]; then
            echo "::error::WHAPI_WEBHOOK_SECRET must be at least 16 characters." >&2
            missing=1
          fi
          exit "$missing"

      - name: Find the texting assistant's address
        run: |
          set -euo pipefail
          sub="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).result?.subdomain??""))')"
          if [ -z "$sub" ]; then echo "No workers.dev subdomain on this account." >&2; exit 1; fi
          echo "::add-mask::$sub"
          # The same Worker names the deploy workflows use (WORKER_NAME, and staging's).
          if [ "$ENVIRONMENT" = "staging" ]; then worker=context-agent-staging; else worker=context-agent; fi
          echo "WORKER_URL=https://$worker.$sub.workers.dev" >> "$GITHUB_ENV"

      - name: Read the channel's status
        run: |
          set -euo pipefail
          echo "::add-mask::$WHAPI_TOKEN"
          echo "::add-mask::$WHAPI_WEBHOOK_SECRET"
          out="$(mktemp)"
          code="$(curl -s -o "$out" -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $WHAPI_TOKEN" \
            https://gate.whapi.cloud/health || true)"
          if [ "$code" != "200" ]; then
            echo "::error::Whapi's /health answered $code. Check the token." >&2
            exit 1
          fi
          # Prints the channel's status text and whether the phone is linked.
          # Never an id, a number or a name: only a short status word is shown.
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const status = d.status ?? {};
            const raw = String(status.text ?? status.code ?? "unknown");
            const text = /^[A-Z_ ]{1,20}$/.test(raw) ? raw : "unknown";
            const linked = String(status.code ?? status.text ?? "") === "AUTH";
            console.log("Channel status: " + text);
            console.log("Phone linked: " + (linked ? "yes" : "no"));
            if (!linked) console.log("::warning::The channel is not linked to a phone yet. Scan its QR code in Whapi before Tex can reply on WhatsApp.");
          ' "$out"
          rm -f "$out"

      # Shapes only: which fields Whapi fills, and whether a mention is Tex's
      # number, a @lid that resolves to it, or someone else. Never a value.
      - name: Probe mention and link preview shapes
        if: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          echo "::add-mask::$WHAPI_TOKEN"
          node - <<'JS'
          const api = "https://gate.whapi.cloud";
          const auth = { authorization: `Bearer ${process.env.WHAPI_TOKEN}` };
          const line = String(process.env.WHAPI_LINE ?? "").replace(/^\+/, "");
          const get = async (path) => {
            const r = await fetch(api + path, { headers: auth }).catch(() => null);
            if (r === null) return { status: 0, body: null };
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const shape = (v) => {
            if (typeof v !== "string") return typeof v;
            const d = v.replace(/@.*$/, "");
            const suffix = v.includes("@") ? v.slice(v.indexOf("@")) : "";
            return `${d === line ? "TEX" : /^\d+$/.test(d) ? `digits${d.length}` : "text"}${suffix.replace(/[^@a-z.]/g, "")}`;
          };
          const health = await get("/health");
          const user = health.body?.user ?? {};
          console.log("health user fields:", Object.entries(user).map(([k, v]) => `${k}=${shape(v)}`).join(" "));
          for (const path of ["/users/profile", "/settings"]) {
            const r = await get(path);
            console.log(path, r.status, Object.keys(r.body ?? {}).join(","));
          }
          const list = await get("/messages/list?count=100");
          const messages = list.body?.messages ?? [];
          console.log("messages read:", list.status, messages.length);
          const self = new Set();
          for (const m of messages) {
            const ctx = m.context ?? {};
            const mentions = Array.isArray(ctx.mentions) ? ctx.mentions : [];
            const body = String(m.text?.body ?? m.link_preview?.body ?? "");
            const inBody = [...body.matchAll(/@(\d{5,})/g)].map((x) => x[1]);
            if (mentions.length === 0 && inBody.length === 0) continue;
            const group = String(m.chat_id ?? "").endsWith("@g.us");
            const parts = [];
            for (const id of mentions.slice(0, 5)) {
              let resolved = "";
              if (String(id).endsWith("@lid") || !String(id).includes("@")) {
                const bare = String(id).replace(/@.*$/, "");
                for (const q of [`${bare}@lid`, bare]) {
                  const r = await get(`/contacts/ids/${encodeURIComponent(q)}`);
                  const text = JSON.stringify(r.body ?? "");
                  resolved += ` ids(${q.includes("@") ? "lid" : "bare"})=${r.status}${line && text.includes(line) ? ":TEX" : ""}`;
                  if (line && text.includes(line)) self.add(bare);
                }
              }
              parts.push(`${shape(String(id))} inBody=${body.includes("@" + String(id).replace(/@.*$/, ""))}${resolved}`);
            }
            console.log(`${group ? "group" : "dm"} type=${m.type} fromMe=${m.from_me === true} ctxKeys=${Object.keys(ctx).join(",")} mentions=[${parts.join(" | ")}] bodyAts=[${inBody.map(shape).join(",")}]`);
          }
          console.log("lids resolving to Tex:", self.size);
          for (const path of ["/openapi.json", "/docs/openapi.json", "/swagger.json"]) {
            const r = await get(path);
            if (r.status !== 200 || !r.body?.paths) { console.log(path, r.status); continue; }
            for (const [p, ops] of Object.entries(r.body.paths)) {
              if (!/link|lid|mention|ids/i.test(p)) continue;
              for (const [verb, op] of Object.entries(ops)) {
                const schema = op.requestBody?.content?.["application/json"]?.schema;
                const ref = schema?.$ref?.split("/").pop();
                const props = ref ? Object.keys(r.body.components?.schemas?.[ref]?.properties ?? {}) : Object.keys(schema?.properties ?? {});
                const required = ref ? r.body.components?.schemas?.[ref]?.required ?? [] : schema?.required ?? [];
                console.log(`${verb.toUpperCase()} ${p} props=${props.join(",")} required=${required.join(",")}`);
              }
            }
            break;
          }
          JS

      # Shapes only: for each group the line is in, which kinds of id its
      # participants carry (a phone, a @lid), the fields an entry has, and
      # whether Whapi resolves a @lid to a phone. Counts and status codes only.
      - name: Probe group participant shapes
        if: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          echo "::add-mask::$WHAPI_TOKEN"
          node - <<'JS'
          const api = "https://gate.whapi.cloud";
          const auth = { authorization: `Bearer ${process.env.WHAPI_TOKEN}` };
          const get = async (path) => {
            const r = await fetch(api + path, { headers: auth }).catch(() => null);
            if (r === null) return { status: 0, body: null };
            return { status: r.status, body: await r.json().catch(() => null) };
          };
          const kind = (id) => (typeof id !== "string" ? typeof id : id.endsWith("@lid") ? "lid" : /@s\.whatsapp\.net$|@c\.us$/.test(id) ? "phone" : /^\d+$/.test(id) ? "bare" : "other");
          const list = await get("/groups?count=20");
          const groups = list.body?.groups ?? [];
          console.log("groups read:", list.status, groups.length, "list keys:", Object.keys(list.body ?? {}).join(","));
          let n = 0;
          for (const g of groups) {
            n += 1;
            const one = await get(`/groups/${encodeURIComponent(g.id)}`);
            const ps = Array.isArray(one.body?.participants) ? one.body.participants : [];
            const kinds = {};
            const keys = new Set();
            for (const p of ps) {
              kinds[kind(p?.id)] = (kinds[kind(p?.id)] ?? 0) + 1;
              for (const [k, v] of Object.entries(p ?? {})) keys.add(`${k}:${k === "id" ? kind(v) : typeof v === "string" ? kind(v) : typeof v}`);
            }
            console.log(`group#${n} status=${one.status} groupKeys=${Object.keys(one.body ?? {}).join(",")} participants=${ps.length} kinds=${JSON.stringify(kinds)} entryKeys=${[...keys].join(",")}`);
            const lid = ps.find((p) => kind(p?.id) === "lid")?.id;
            if (lid !== undefined) {
              const bare = lid.replace(/@.*$/, "");
              for (const path of [`/contacts/ids/${lid}`, `/contacts/ids/${bare}`, `/contacts/lids/${lid}`, `/contacts/${lid}`, `/users/lid/${bare}`]) {
                const r = await get(path.replace(/@/g, "%40"));
                const fields = Object.entries(r.body ?? {}).map(([k, v]) => `${k}:${Array.isArray(v) ? "array" + v.length + (v[0] ? "[" + Object.entries(v[0]).map(([a, b]) => a + ":" + kind(b)).join(";") + "]" : "") : kind(v)}`);
                console.log(`  ${path.replace(/\d+/g, "N")} -> ${r.status} ${fields.join(",")}`);
              }
            }
          }
          JS

      - name: Build the settings
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const body = {
              webhooks: [{
                url: process.env.WORKER_URL + "/whapi",
                mode: "body",
                headers: { "x-tex-webhook-secret": process.env.WHAPI_WEBHOOK_SECRET },
                events: [{ type: "messages", method: "post" }, { type: "presences", method: "post" }],
              }],
              media: { auto_download: ["image", "audio", "voice", "video", "document", "sticker"] },
              callback_persist: true,
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + "/whapi-settings.json", JSON.stringify(body));
            const shown = JSON.parse(JSON.stringify(body));
            shown.webhooks[0].headers["x-tex-webhook-secret"] = "***";
            console.log(JSON.stringify(shown, null, 2));
          '
          if [ "$APPLY" != "true" ]; then echo "Dry run: nothing was sent. Tick apply to send these settings."; fi

      - name: Send the settings
        if: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X PATCH \
            -H "Authorization: Bearer $WHAPI_TOKEN" \
            -H 'content-type: application/json' \
            --data-binary "@$RUNNER_TEMP/whapi-settings.json" \
            https://gate.whapi.cloud/settings || true)"
          echo "PATCH /settings answered $status."
          case "$status" in
            2??) ;;
            *) echo "::error::Whapi refused the settings ($status)." >&2; exit 1 ;;
          esac

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Tex's WhatsApp line ($ENVIRONMENT)"
            echo ""
            if [ "$APPLY" = "true" ]; then echo "Settings were sent (see the step above)."; else echo "Dry run: nothing was changed."; fi
            echo ""
            echo "> **Whapi webhooks are per channel.** Pointing staging and production at the same channel means the last apply wins and the other environment stops receiving WhatsApp messages. Give each environment its own channel."
          } >> "$GITHUB_STEP_SUMMARY"
