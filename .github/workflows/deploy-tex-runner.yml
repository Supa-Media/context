# Deploy the Lab's runner: the Worker, its Durable Object and its container image
# (a GitHub Actions runner for one tex-lab-run.yml job). See infra/tex-runner/README.md.
name: Deploy Tex Lab Runner (production)

on:
  workflow_call:

concurrency:
  group: deploy-tex-runner-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  WORKER_NAME: context-tex-runner

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/tex-runner..." --frozen-lockfile
      - working-directory: infra/tex-runner
        run: pnpm typecheck
      - working-directory: infra/tex-runner
        run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required production secret '$var'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Verify workflow and container config agree
        run: |
          set -euo pipefail
          config=infra/tex-runner/wrangler.jsonc
          grep -qE "^\s*\"name\"\s*:\s*\"$WORKER_NAME\"" "$config"
          grep -qE '"class_name"\s*:\s*"LabRunner"' "$config"
          test -f infra/tex-runner/Dockerfile

      # Wrangler uploads the Worker before it configures the container image, so
      # prove the token reaches Containers first.
      - name: Verify Cloudflare Containers permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/me" \
            -o /dev/null; then
            echo "ERROR: CLOUDFLARE_API_TOKEN needs Account > Containers > Edit for this account."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/tex-runner..." --frozen-lockfile

      - name: Deploy container and Worker
        working-directory: infra/tex-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # The runner registers one just-in-time runner per run on the repository, which needs a token with admin on it:
      # the PAT that already writes the repository's secrets. Absent, the Worker answers 503 and every Lab run stays
      # on GitHub's runners.
      - name: Give the runner its GitHub token
        working-directory: infra/tex-runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_RUNNER_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_RUNNER_TOKEN" ]; then echo "::warning::no GH_ADMIN_TOKEN; Lab runs stay on GitHub's runners"; exit 0; fi
          printf '%s' "$GH_RUNNER_TOKEN" | pnpm exec wrangler secret put GH_RUNNER_TOKEN

      # tex-lab-sandbox.yml reads where the runner is from a repository secret, because the address names the
      # account's workers.dev subdomain and this token writes secrets, not variables. Masked here.
      - name: Tell the Lab run workflow where the runner is
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          sub="$(curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          [ -n "$sub" ] || { echo "::warning::no workers.dev subdomain"; exit 0; }
          echo "::add-mask::$sub"
          printf '%s' "https://$WORKER_NAME.$sub.workers.dev" | gh secret set TEX_RUNNER_ORIGIN --repo "$GITHUB_REPOSITORY"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Tex Lab runner deploy"
            echo ""
            echo "- Worker and container: \`$WORKER_NAME\`"
            echo "- One door, POST /v1/start, for main's tex-lab-run.yml by OIDC. Turned on by the repository variable TEX_LAB_RUNNER=sandbox."
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
