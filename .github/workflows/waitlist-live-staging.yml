# Invite-only sign-in, the waitlist and both kinds of invite, live against
# staging with real mail.
#
# Runs scripts/staging-waitlist-live.mjs: a stranger joins from the homepage
# with a reason, staff (the seeded alpha@supa.media persona) read it and let
# them in, the "you're in" mail and a mailed code sign them in, they make a
# business workspace and invite a teammate by email, and invite a friend to
# Context. Every code and link is read out of a fresh AgentMail inbox, so this
# also proves staging's mail is sent and its links work. Everything the run
# creates is removed at the end. The same journeys run against a fake mailbox
# on every pull request in apps/convex/__tests__/waitlistJourney.test.ts.
#
# Manual only: it creates real accounts and sends real mail. It needs
# AGENTMAIL_API_KEY in the staging environment, and alpha@supa.media in
# staging's ADMIN_EMAILS (1Password, then Sync Secrets, then a staging deploy).
name: Waitlist Live (staging)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waitlist-live-staging
  cancel-in-progress: false

jobs:
  live:
    name: Waitlist and invites against staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      APP_ENV: staging
      STAGING_CONVEX_DEPLOYMENT: ${{ vars.STAGING_CONVEX_DEPLOYMENT }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Walk the waitlist and invite journeys with real mail
        run: node scripts/staging-waitlist-live.mjs
