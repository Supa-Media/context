# The site shots worker's own CI.
#
# Same gap `mcp.yml`, `router.yml` and `email-worker.yml` were written to close:
# the Supa framework's reusable pipeline filters on apps/mobile, apps/convex and
# packages/shared, so nothing under infra/ is covered. Without this job the
# tests that hold this Worker's properties — it never points a browser at a
# private address, and its entry module exports only its handler — would only
# ever run on a developer's machine, and `docs/decisions/testing.md` is one rule: a guard
# nobody has checked is not a guard.
name: Site Shots Worker

# No `paths:` filter on pull_request. A filtered-out required check never
# reports and leaves the PR pending forever; see the note in mcp.yml.
#
# And no `branches:` filter on pull_request either — a base-branch filter means
# a pull request stacked on another branch runs no checks at all, which is how
# #169 merged with zero check runs. `scripts/check-workflow-triggers.mjs`
# enforces both. The `push:` filter below stays on `main`.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/site-shots/**"
      - ".github/workflows/site-shots.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: site-shots-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Site Shots Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          packages: "@context/site-shots"
          paths: ".github/workflows/site-shots.yml"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.affected == 'true'

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.affected == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.scope.outputs.affected == 'true'
        run: pnpm install --filter @context/site-shots... --frozen-lockfile

      - name: Typecheck
        if: steps.scope.outputs.affected == 'true'
        working-directory: infra/site-shots
        run: npx tsc --noEmit

      - name: Site shots tests
        if: steps.scope.outputs.affected == 'true'
        working-directory: infra/site-shots
        run: npx vitest run
