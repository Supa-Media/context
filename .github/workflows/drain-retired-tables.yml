# Empty the tables whose feature was removed, so their definitions can leave
# the schema (`apps/convex/functions/retiredTables.ts`): a schema push that
# drops a table still holding documents is refused.
#
# Manual only. It prints counts, never a row: this repository is public, and
# so is this job's log.
name: Drain retired tables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment"
        type: choice
        options: [production, staging]
        default: production

jobs:
  drain:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Drain
        run: |
          for fn in drainOrganizerSettings drainFeatureSwitches; do
            echo "$fn: $(npx convex run functions/retiredTables:$fn 2>/dev/null)"
          done
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
