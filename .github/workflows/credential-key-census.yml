# Count which key each sealed envelope in the control plane was written under
# (Dev, 2026-11-02: staging's storage credentials stopped opening).
#
# Manual only, read only. It runs `functions/credentialKeyCensus:run`, which
# reads each envelope's key-id prefix and opens nothing, and answers counts
# only, never a key, an id, a workspace or a value: this repository is public,
# and so is this job's log.
name: Credential key census

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to count."
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Count envelopes by key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # stderr is dropped: `convex run` prints the function's own log lines there (`scripts/check-convex-run-stderr.mjs`).
          answer=$(npx convex run functions/credentialKeyCensus:run '{}' 2>/dev/null)
          echo "census: $(echo "$answer" | jq -c .)"
