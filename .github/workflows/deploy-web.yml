# Deploy the Expo web app to EAS Hosting on every merge to `main`.
#
# Single environment by design (no staging yet) — mirrors deploy-convex.yml.
# This exports the web bundle and publishes it to EAS Hosting at the project's
# `*.expo.app` origin. That origin is NOT the address people use: context.lc is
# a Cloudflare Worker (infra/router) that proxies to it, because EAS Hosting
# only attaches custom domains on a paid plan. See infra/router/src/route.ts.
#
# @supa-media/* packages come from GitHub Packages, a registry that needs auth,
# so every `pnpm install` step passes GITHUB_TOKEN (see .npmrc — pnpm errors
# outright if the variable the file interpolates is undefined).
name: Deploy Web (production)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Nothing here runs on `pull_request`, and never should: a deploy triggered by
# a fork's pull request would run untrusted code with production credentials.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy web to EAS Hosting (production)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Inlined into the web bundle at export time. A missing value ships
      # `undefined` and the app cannot reach the control plane at all, which
      # is why the preflight below refuses to continue without it.
      EXPO_PUBLIC_CONVEX_URL: ${{ secrets.EXPO_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v5

      # Preflight before anything expensive, so a missing secret costs seconds
      # rather than a full install and export.
      - name: Verify required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for var in EXPO_TOKEN EXPO_PUBLIC_CONVEX_URL; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required secret '$var' in the 'production' environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK — every required secret is present."

      # `eas deploy` resolves the project from app.config.js's
      # extra.eas.projectId. The template ships a placeholder there, and with it
      # still in place the deploy dies with an opaque project-not-found error
      # after a full install and bundle export. Say so up front instead.
      - name: Verify the EAS project is linked
        run: |
          set -euo pipefail
          id=$(node -e '
            const cfg = require("./apps/mobile/app.config.js")({ config: {} });
            process.stdout.write(String((cfg.extra && cfg.extra.eas && cfg.extra.eas.projectId) || ""));
          ')
          case "$id" in
            ""|YOUR_EAS_PROJECT_ID)
              echo "ERROR: apps/mobile/app.config.js still has the placeholder EAS project id ('${id:-<empty>}')."
              echo "Run 'eas init' in apps/mobile to create the project, then commit the real"
              echo "projectId (and the matching updates.url) before deploying."
              exit 1
              ;;
          esac
          echo "OK — EAS project id is set."

      # The web bundle and the backend must name the SAME Convex deployment.
      # They did not: `EXPO_PUBLIC_CONVEX_URL` pointed at one deployment while
      # `CONVEX_DEPLOY_KEY` deployed the functions to another, so every backend
      # change went live somewhere no browser was talking to — and sign-in broke
      # the moment the frontend's deployment lost an env var the real one had.
      # Nothing anywhere reported it; the site simply said "Server Error".
      #
      # The router already records which deployment is production, so compare
      # against that rather than against a second copy of the answer.
      - name: Verify the frontend and the router name the same Convex deployment
        run: |
          set -euo pipefail
          router=$(node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("infra/router/wrangler.jsonc", "utf8");
            const m = raw.match(/"CONVEX_ORIGIN"\s*:\s*"https:\/\/([a-z0-9-]+)\.convex\.(?:site|cloud)"/);
            if (!m) { console.error("No CONVEX_ORIGIN in infra/router/wrangler.jsonc."); process.exit(1); }
            process.stdout.write(m[1]);
          ')
          front=$(node -e '
            const url = process.env.EXPO_PUBLIC_CONVEX_URL || "";
            const m = url.match(/^https:\/\/([a-z0-9-]+)\.convex\.(?:cloud|site)\/?$/);
            if (!m) { console.error(`EXPO_PUBLIC_CONVEX_URL is not a Convex URL: "${url}"`); process.exit(1); }
            process.stdout.write(m[1]);
          ')
          if [ "$router" != "$front" ]; then
            echo "ERROR: the web bundle would talk to '$front' while the router and the"
            echo "backend deploy target '$router'. Those must be the same deployment."
            echo "Fix the EXPO_PUBLIC_CONVEX_URL secret, or CONVEX_ORIGIN in"
            echo "infra/router/wrangler.jsonc — whichever is wrong."
            exit 1
          fi
          echo "OK — frontend and router both use '$router'."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Export web bundle
        working-directory: apps/mobile
        run: npx expo export --platform web

      # Use the `eas` binary the Setup EAS step already installed — NOT
      # `npx eas-cli`, which re-resolves `latest` from npm at this point and
      # fails outright when a release's dist-tag has propagated but its
      # manifest has not yet (ETARGET). That is not theoretical: it raced a
      # real deploy in the events-os repo 43 seconds after eas-cli@21.3.0
      # published.
      - name: Deploy to EAS Hosting (production)
        working-directory: apps/mobile
        run: eas deploy --prod --environment=production --non-interactive

      # `eas deploy --prod` reporting success is NOT proof that context.lc moved.
      # It has published a deployment and left the production alias pointing at
      # the previous one — three deploys in a row "succeeded" while the live site
      # kept serving stale JS, and nothing in the log said so. The only honest
      # check is to ask the public URL what it is serving.
      #
      # The web export names its entry bundle with a content hash, so the
      # filename in `dist/index.html` is unique to this build. If the live HTML
      # references it, the alias moved. If it does not, the deploy silently did
      # not go live, and this job has to fail rather than report green.
      - name: Verify the live site serves this build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          bundle=$(node -e '
            const fs = require("fs");
            const html = fs.readFileSync("dist/index.html", "utf8");
            const match = html.match(/\/_expo\/static\/js\/web\/[A-Za-z0-9._-]+\.js/);
            if (!match) {
              console.error("Could not find the entry bundle in dist/index.html.");
              process.exit(1);
            }
            process.stdout.write(match[0]);
          ')
          echo "Built bundle: $bundle"

          # EAS Hosting and the Cloudflare router in front of it need a while to
          # serve a new alias, so this polls rather than sleeping a fixed time.
          #
          # Twelve minutes, not five. The five-minute version failed a deploy
          # that was in fact completely fine — the alias moved at around nine.
          # A check that cries wolf is worse than no check at all, because the
          # next genuinely-red deploy gets waved through as "that flaky step".
          for attempt in $(seq 1 48); do
            live=$(curl -fsSL --max-time 20 https://context.lc/ || true)
            case "$live" in
              *"$bundle"*)
                echo "OK — https://context.lc is serving this build (attempt $attempt)."
                exit 0
                ;;
            esac
            echo "Attempt $attempt: not live yet."
            sleep 15
          done

          echo "ERROR: https://context.lc never served the bundle this run built."
          echo "The deploy step reported success, so the likeliest cause is that the"
          echo "production alias did not move. Recover with:"
          echo "  eas deploy:list      # find this run's deployment id"
          echo "  eas deploy:alias --prod --id <id>"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Web deploy (production)"
            echo ""
            echo "- **Public URL:** https://context.lc (served by the \`context-router\` Worker)"
            echo "- **EAS Hosting origin:** printed by the deploy step above — it must match"
            echo "  \`EXPO_ORIGIN\` in \`infra/router/wrangler.jsonc\`."
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
