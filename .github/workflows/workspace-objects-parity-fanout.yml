# The parity check of "Workspace objects parity", one job per workspace at
# once instead of one workspace after another (owner, 2026-11-02: every
# workspace switched within minutes). Each job runs the same
# `functions/workspaceObjects:parity` on one workspace, so the same guard
# decides a switch: `switch_clean` switches a workspace only right after its
# own check matched exactly. Logs carry counts only, never a path, a key or a
# body: this repository is public, and so is this job's log.
name: Workspace objects parity (all at once)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to check."
        type: choice
        options:
          - staging
          - production
        default: staging
      home:
        description: "Which workspaces to check: those still on dual (to switch them), or those already on object (to prove they still match)."
        type: choice
        options:
          - dual
          - object
        default: dual
      switch_clean:
        description: "Switch each workspace to object right after its own check comes back clean."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - id: list
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          HOME_NOW: ${{ inputs.home }}
        run: |
          set -euo pipefail
          ids=$(npx convex run functions/workspaceObjectsRows:atHome "$(jq -cn --arg home "${HOME_NOW:-dual}" '{home: $home}')" 2>/dev/null | jq -c '.')
          echo "workspaces: $(echo "$ids" | jq 'length')"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  parity:
    needs: list
    if: needs.list.outputs.ids != '[]'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        workspace: ${{ fromJson(needs.list.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Compare
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          WORKSPACE: ${{ matrix.workspace }}
          SWITCH_CLEAN: ${{ inputs.switch_clean }}
        run: |
          set -euo pipefail
          # A run on this workspace alone: the cursor queues it and ends the listing.
          cursor=$(jq -cn --arg id "$WORKSPACE" '{page: null, queue: [$id], exhausted: true}')
          page=0
          total='{"clean":0,"differing":0,"unreachable":0,"switched":0}'
          while :; do
            page=$((page + 1))
            args=$(jq -cn --argjson switch "${SWITCH_CLEAN:-false}" --arg cursor "$cursor" '{cursor: $cursor} + (if $switch then {switchClean: true} else {} end)')
            answer=$(npx convex run functions/workspaceObjects:parity "$args" 2>/dev/null)
            echo "page $page: $(echo "$answer" | jq -c 'del(.cursor)')"
            total=$(jq -cn --argjson a "$total" --argjson b "$answer" '{clean: ($a.clean + $b.clean), differing: ($a.differing + $b.differing), unreachable: ($a.unreachable + $b.unreachable), switched: ($a.switched + $b.switched)}')
            if [ "$(echo "$answer" | jq -r '.done')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 2000 ]; then echo "stopped after $page pages"; exit 1; fi
          done
          echo "total: $total"
          echo "\`$total\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$total" | jq -r '.differing + .unreachable')" != "0" ]; then exit 1; fi
