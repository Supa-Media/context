name: Deploy to Production

# Promote the commit selected by this manual run, after it passed staging.
#
# Only the components that changed since production's last successful run are
# deployed; `validate` decides with scripts/deploy-plan.mjs, which deploys
# everything whenever it is unsure. Tick `full` to redeploy everything anyway,
# for recovery or after rotating a production secret.
#
#   validate ─┬─ web export ─────────────────────┐
#             ├─ convex ─┬─ gateway ─────────────┼─ router + assets
#             │          ├─ email ───────────────┤
#             │          ├─ transcribe ──────────┼─ mobile-update
#             │          ├─ egress ──────────────┘
#             │          └─ agent
#             └─ sentry
#
# Why each edge exists:
# - The Workers deploy after Convex, because new Worker code may call control
#   plane functions the old backend does not have.
# - The web export builds alongside the backends. The router waits for both,
#   then publishes Worker code and that exact export as one version.
# - The OTA update waits for the backends, not the web artifact.
#
# The gateway's suite is not rerun here. `validate` requires this exact commit
# to have passed staging, and staging runs that suite (a superset of this
# workflow's copy) whenever the gateway's inputs change; see deploy-mcp.yml.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Deploy every component, whatever changed
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  validate:
    name: Require a successful staging deployment
    runs-on: ubuntu-latest
    outputs:
      convex: ${{ steps.plan.outputs.convex }}
      gateway: ${{ steps.plan.outputs.gateway }}
      email: ${{ steps.plan.outputs.email }}
      transcribe: ${{ steps.plan.outputs.transcribe }}
      agent: ${{ steps.plan.outputs.agent }}
      egress: ${{ steps.plan.outputs.egress }}
      sentry: ${{ steps.plan.outputs.sentry }}
      web: ${{ steps.plan.outputs.web }}
      router: ${{ steps.plan.outputs.router }}
      ota: ${{ steps.plan.outputs.ota }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/production-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare with what production is running
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_DEPLOY: ${{ inputs.full }}
        run: node scripts/deploy-plan.mjs --target production

  convex:
    needs: validate
    if: ${{ needs.validate.outputs.convex == 'true' }}
    uses: ./.github/workflows/deploy-convex.yml
    secrets: inherit

  gateway:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.gateway == 'true' }}
    uses: ./.github/workflows/deploy-mcp.yml
    with:
      tested_in_staging: true
    secrets: inherit

  email:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.email == 'true' }}
    uses: ./.github/workflows/deploy-email-worker.yml
    secrets: inherit

  transcribe:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.transcribe == 'true' }}
    uses: ./.github/workflows/deploy-transcribe-worker.yml
    secrets: inherit

  agent:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.agent == 'true' }}
    uses: ./.github/workflows/deploy-agent-worker.yml
    secrets: inherit

  egress:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.egress == 'true' }}
    uses: ./.github/workflows/deploy-egress-service.yml
    secrets: inherit

  sentry:
    needs: validate
    if: ${{ needs.validate.outputs.sentry == 'true' }}
    uses: ./.github/workflows/deploy-sentry-worker.yml
    secrets: inherit

  web:
    needs: validate
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.web == 'true' }}
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  router:
    needs: [validate, convex, gateway, email, transcribe, egress, web]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.router == 'true' }}
    uses: ./.github/workflows/deploy-router.yml
    secrets: inherit

  mobile-update:
    needs: [validate, convex, gateway, email, transcribe, egress]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.ota == 'true' }}
    uses: ./.github/workflows/deploy-mobile-update.yml
    secrets: inherit
