name: Deploy to Production

# Promote one commit after CI on main has passed it. Staging is not a gate.
#
# A manual run deploys the tip of main. Promote to Production dispatches
# `prod-deploy/<sha>`, a branch at one commit, so the run's SHA is that
# commit rather than whatever main is when a branch dispatch starts.
# `validate` refuses a run whose commit is not on main, or whose newest CI
# run did not succeed.
#
# Only the components that changed since production's last successful run are
# deployed; `validate` decides with scripts/deploy-plan.mjs, which deploys
# everything whenever it is unsure. Tick `full` to redeploy everything anyway,
# for recovery or after rotating a production secret.
#
#   validate ─┬─ gateway tests ──────────────┐
#             ├─ web export ─────────────────┼─ router + assets
#             ├─ convex ─┬─ gateway deploy ──┤
#             │          ├─ email ───────────┤
#             │          ├─ transcribe ──────┤
#             │          ├─ egress ──────────┤
#             │          └─ agent ── photon ─┤
#             ├─ mobile-bundle (export) ─────┴─ start OTA publish
#             └─ sentry
#
# Why each edge exists:
# - The Workers deploy after Convex, because new Worker code may call control
#   plane functions the old backend does not have.
# - The gateway suite runs on this commit, beside Convex and the other jobs.
#   Only the gateway deploy waits for it. A failed suite skips that deploy,
#   and the router waits on the deploy, so the release fails with the suite.
# - The web export builds alongside the backends. The router waits for both,
#   then publishes Worker code and that exact export as one version.
# - The OTA bundle is exported from the start, beside the backends. The upload
#   is a separate workflow started after those backends succeed, so this
#   queue is free once web, router, Convex and the agent are live.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Deploy every component, whatever changed
        type: boolean
        default: false

# One deploy runs. A newer run replaces one that has not started, and
# Promote also cancels a queued run of any other commit, so a burst keeps
# the in-progress rollout and at most the newest green SHA. A run that has
# started is not cancelled. Its first step refuses to deploy when a newer
# commit on main already has green CI, before any component changes.
# That step cancels its own run. POST /actions/runs/{id}/cancel needs
# actions: write, and write includes read. The token below is actions: read,
# which returns 403, so the run fails instead of ending cancelled. validate
# is the job that cancels, so it is the one that raises actions to write.
# mobile-publish already has actions: write to start the OTA workflow.
# A job's permissions replace this block, so validate also keeps
# contents: read and packages: read.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  validate:
    name: Require a green CI run on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    outputs:
      convex: ${{ steps.plan.outputs.convex }}
      gateway: ${{ steps.plan.outputs.gateway }}
      email: ${{ steps.plan.outputs.email }}
      transcribe: ${{ steps.plan.outputs.transcribe }}
      agent: ${{ steps.plan.outputs.agent }}
      egress: ${{ steps.plan.outputs.egress }}
      photon: ${{ steps.plan.outputs.photon }}
      sentry: ${{ steps.plan.outputs.sentry }}
      web: ${{ steps.plan.outputs.web }}
      router: ${{ steps.plan.outputs.router }}
      ota: ${{ steps.plan.outputs.ota }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/production-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare with what production is running
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_DEPLOY: ${{ inputs.full }}
        run: node scripts/deploy-plan.mjs --target production

  convex:
    needs: validate
    if: ${{ needs.validate.outputs.convex == 'true' }}
    uses: ./.github/workflows/deploy-convex.yml
    secrets: inherit

  # Beside Convex, not behind it. The deploy below is the job that waits.
  gateway-test:
    name: Test gateway
    needs: validate
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.gateway == 'true' }}
    uses: ./.github/workflows/deploy-mcp.yml
    with:
      phase: test
    secrets: inherit

  gateway:
    needs: [validate, convex, gateway-test]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.gateway == 'true' }}
    uses: ./.github/workflows/deploy-mcp.yml
    with:
      phase: deploy
    secrets: inherit

  email:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.email == 'true' }}
    uses: ./.github/workflows/deploy-email-worker.yml
    secrets: inherit

  transcribe:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.transcribe == 'true' }}
    uses: ./.github/workflows/deploy-transcribe-worker.yml
    secrets: inherit

  agent:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.agent == 'true' }}
    uses: ./.github/workflows/deploy-agent-worker.yml
    secrets: inherit

  egress:
    needs: [validate, convex]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.egress == 'true' }}
    uses: ./.github/workflows/deploy-egress-service.yml
    secrets: inherit

  # The suite starts with the other jobs. Only the deploy waits for Convex
  # and the agent, so the test's half minute is not on the tail.
  photon-test:
    needs: validate
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.photon == 'true' }}
    uses: ./.github/workflows/deploy-photon-bridge.yml
    with:
      phase: test
    secrets: inherit

  photon:
    needs: [validate, convex, agent, photon-test]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.photon == 'true' }}
    uses: ./.github/workflows/deploy-photon-bridge.yml
    with:
      phase: deploy
    secrets: inherit

  sentry:
    needs: validate
    if: ${{ needs.validate.outputs.sentry == 'true' }}
    uses: ./.github/workflows/deploy-sentry-worker.yml
    secrets: inherit

  web:
    needs: validate
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.web == 'true' }}
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  router:
    needs: [validate, convex, gateway, email, transcribe, egress, web]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.router == 'true' }}
    uses: ./.github/workflows/deploy-router.yml
    secrets: inherit

  mobile-bundle:
    needs: validate
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.ota == 'true' }}
    uses: ./.github/workflows/build-mobile-ota.yml
    with:
      phase: bundle
    secrets: inherit

  # Starts the upload and returns. The publish workflow is not a job of
  # this run, so its minute does not hold deploy-production.
  mobile-publish:
    name: Start OTA publish
    needs: [validate, convex, gateway, email, transcribe, egress, mobile-bundle]
    if: ${{ !cancelled() && !failure() && needs.validate.outputs.ota == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish the exported bundle without holding this deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        # `--ref` is a branch. The workflow checks out deploy_sha, the commit
        # this run exported, which is not always the tip.
        run: gh workflow run deploy-production-ota.yml --repo "$GH_REPO" --ref main -f "source_run_id=$SOURCE_RUN_ID" -f "deploy_sha=$DEPLOY_SHA"
