# The control-plane checks that are really checks OF THE GATEWAY.
#
# Eight files under apps/convex/__tests__ depend on apps/mcp/src: four read a
# path under it in code (addressing, ingestionGateway, scaffold, writeImage),
# and six import `gatewayFormat.helpers.ts`, which evaluates the gateway's real
# module and exposes its private helpers — parsePrivacyManifest, visibilityOf,
# effectiveVisibility, isPlumbing, canSee. Two are in both sets. Run
# scripts/gateway-contract-tests.mjs for the current list rather than trusting
# this number; an earlier version of this comment said eleven, because the
# detector was counting backticked paths in doc comments as reads.
#
# `ingestionGateway.test.ts` additionally scrapes MAX_INLINE_IMAGE_BYTES out of
# the text, and `addressing.test.ts` mirrors the S3 adapter's ambiguity rule.
#
# The coupling is not only in tests: apps/convex/functions/files.ts and
# functions/provisioning.ts import the gateway's store factory in PRODUCTION.
#
# They live in the control plane's package, and the control plane's CI job is
# filtered on `apps/convex/**`. So on a pull request that changes only
# apps/mcp, every one of them was skipped: THE CROSS-PACKAGE GUARDS ON THE
# GATEWAY WERE SILENT ON EXACTLY THE PULL REQUESTS THAT CHANGE THE GATEWAY.
#
# Measured before this file existed. Adding one named export to
# apps/mcp/src/index.js leaves the gateway's own suite reporting ALL PASS, and
# in the control-plane suite fails 5 files / 12 checks — fileOps and
# privacyEngine fail to collect at all, taking ~198 checks with them (1271 run
# becomes 1073), scaffold (8), provisioning (2) and onboarding (2) fail after
# collecting, and ingestionGateway is unaffected because it scrapes a constant
# rather than evaluating the module. The message
# it prints is "update gatewayFormat.helpers.ts rather than weakening the
# assertion" — written for exactly this situation, and impossible to receive,
# because the job that would print it never ran. `ci / Test Convex Backend` was
# skipped on both of the two pull requests that most recently modified that
# file.
#
# THIS IS ONE INSTANCE OF A GENERAL PROBLEM, AND THE OTHER DIRECTION IS STILL
# LIVE: apps/mobile/__tests__/consentScopes.test.ts imports
# @context/convex/functions/lib/consentScopes — the mirror CLAUDE.md names as
# "asserted against the control plane's rather than claimed in a comment" — and
# `ci / Test Mobile App` is skipped on convex-only pull requests. A reusable
# pipeline's path filters cannot see cross-package imports, which makes the
# real fix upstream-shaped. This file closes the gateway direction only.
#
# mcp.yml's header records the same shape one layer down: the gateway's own
# suite never ran, for the same reason, until it was moved out of the
# framework's filtered pipeline. That is not the only precedent — mcp.yml,
# router.yml, email-worker.yml, cli.yml's YAML-parse job and ci.yml's
# lint-command comment each record a version of "a check that is green because
# it did not execute".
#
# The suite itself now runs in ONE place: `ci / Test Convex Backend` (three
# shards, under the required `ci / Test Summary`), whose change filter in
# ci.yml was widened to every path this file watched — apps/mcp,
# packages/collaboration, the Dropbox mirror and the lockfile among them. It
# used to run here as well, the same 226 files twice on most pull requests
# (about 85 runner-minutes in three hours, measured 2026-10-07). This file
# keeps the part only it does: proving the cross-package contract still exists.
name: Gateway Contracts

# No `paths:` filter on pull_request, deliberately — the same reasoning as
# mcp.yml and email-worker.yml. A filtered-out required check never reports and
# leaves the pull request pending forever. Here it is also the specific bug
# this workflow exists to fix, so a filter would be self-defeating.
#
# The push filter names apps/mobile and packages/shared because the suite
# genuinely reaches into both — see the install step below. A filter that
# contradicts the file's own comments is how this class of bug starts.
#
# And no `branches:` filter on pull_request either — see mcp.yml. A base-branch
# filter means a pull request stacked on another branch runs no checks at all,
# which is how #169 merged with zero check runs. The key is absent rather than
# `branches: ['**']` so that a tidy-up to `'*'` cannot silently stop matching
# `claude/…`-shaped branches; `scripts/check-workflow-triggers.mjs` enforces it.
# The `push:` filter below stays on `main`.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "apps/convex/**"
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/collaboration/**"
      - ".github/workflows/gateway-contracts.yml"

permissions:
  contents: read
  packages: read

# Only the newest commit on a branch is worth checking.
concurrency:
  group: gateway-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Gateway contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          packages: |
            @context/mcp
            @context/convex
          paths: |
            apps/mobile/features/console/storage/dropbox.ts
            apps/mobile/features/console/storage/dropbox.web.ts
            .github/workflows/gateway-contracts.yml

      # The detector self-tests, and fails when it finds nothing. A scan that
      # matches no files is not a pass — it is this job quietly becoming
      # decorative, which is the failure it was written to catch.
      #
      # The shell counts the lines because the script's own zero-match branch
      # cannot fire if the script never runs. That is not hypothetical here: an
      # earlier version of its main-module guard compared `import.meta.url`
      # against an un-realpath'd `process.argv[1]`, so through any symlink —
      # an npm or pnpm bin shim — both commands below printed nothing and
      # exited 0, `--self-test` included. Only an assertion outside the script
      # catches the script not executing.
      - name: The cross-package contract still exists
        if: steps.scope.outputs.affected == 'true'
        run: |
          node scripts/gateway-contract-tests.mjs --self-test
          found=$(node scripts/gateway-contract-tests.mjs | tee /dev/stderr | wc -l)
          if [ "$found" -lt 1 ]; then
            echo "The detector printed nothing, so it did not run."
            exit 1
          fi
          echo "$found contract tests listed."
