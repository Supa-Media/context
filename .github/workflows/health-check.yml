# Production health check + auto-redeploy — INERT, and has never run.
#
# Read this before trusting the name: `convex-url` below is still the
# scaffolder's `YOUR-DEPLOYMENT` placeholder and the `schedule:` is still
# commented out, so this workflow has never executed once. It monitors nothing
# today. It is left in place because the auto-redeploy path it wires up is
# worth having, not because it is doing anything.
#
# Two separate things are missing, and only one of them is a chore:
#
#   1. A real deployment URL. A `*.convex.cloud` hostname is an account
#      identifier, which `scripts/check-no-identifiers.mjs` refuses in this
#      public tree — so it has to arrive as a repository secret, and adding one
#      is the owner's to do, not an agent's.
#   2. A decision about auto-redeploy. Redeploying in response to an outage of
#      unknown cause can reapply a bad deploy on a loop.
#
# What this one would have watched is also not the plane that fails most
# visibly: it pings a Convex query, while the endpoint every customer
# configured in every AI client is the gateway Worker. `gateway-health.yml`
# watches that, needs no secret, and runs on a schedule today.
#
# `workflow_call` workflows can't own a `schedule:`, so this thin caller owns
# the cron and calls the framework's reusable health-check workflow, which
# calls one or more Convex query functions and redeploys (via deploy-convex.yml)
# if any of them fail.
#
# Before this is useful:
#   1. Replace convex-url below with your deployment's URL.
#   2. Replace health-check-functions with a real query function path
#      (e.g. "functions/context/queries:listPublic").
#   3. Make sure scripts/sync-secrets-to-convex.sh (or your equivalent) exists,
#      or drop the sync-secrets-script input if you don't need it.

name: Production Health Check

on:
  # Fill in `convex-url` below and uncomment this before enabling the schedule.
  # schedule:
  #   # Run every 6 hours
  #   - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: "Force redeploy even if health check passes"
        required: false
        default: false
        type: boolean

jobs:
  health-check:
    uses: Supa-Media/supa-framework/.github/workflows/health-check.yml@main
    with:
      app-name: "Context"
      convex-url: "https://YOUR-DEPLOYMENT.convex.cloud"
      health-check-functions: |
        functions/context/queries:listPublic
      environment: production
      sync-secrets-script: scripts/sync-secrets-to-convex.sh
      force-redeploy: ${{ github.event.inputs.force_redeploy == 'true' }}
    secrets: inherit
