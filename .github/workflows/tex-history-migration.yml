# Move every workspace's one-to-one Tex history and turn records from its
# bucket into its Tex Durable Object (owner, 2026-11-01;
# `docs/decisions/texting-assistant/one-to-one-history.md`).
#
# Manual only. Run it with `dry_run` first: that counts what would move and
# changes nothing. It pages through `functions/texHistoryMigration:run`, which
# answers with counts and a cursor, never a path, a key or a word: this
# repository is public, and so is this job's log. With `report_key`, the
# workspaces that failed are printed only sealed to that public key. Running it again moves
# nothing already moved, and nothing in a bucket is deleted.
name: Tex history into its object

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to move in."
        type: choice
        options:
          - staging
          - production
        default: staging
      dry_run:
        description: "Count only; move nothing."
        type: boolean
        default: true
      report_key:
        description: "Optional: a base64 RSA public key (PEM). The failed workspaces are printed only encrypted to it."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Move history
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPORT_KEY: ${{ inputs.report_key }}
        run: |
          set -euo pipefail
          cursor=""
          page=0
          total='{}'
          report=false
          if [ -n "$REPORT_KEY" ]; then
            echo "$REPORT_KEY" | base64 -d > "$RUNNER_TEMP/report.pub"
            openssl pkey -pubin -in "$RUNNER_TEMP/report.pub" -noout
            report=true
          fi
          while :; do
            page=$((page + 1))
            if [ -z "$cursor" ]; then
              args=$(jq -cn --argjson dry "$DRY_RUN" --argjson report "$report" '{dryRun: $dry, report: $report}')
            else
              args=$(jq -cn --argjson dry "$DRY_RUN" --argjson report "$report" --arg cursor "$cursor" '{dryRun: $dry, report: $report, cursor: $cursor}')
            fi
            # stderr is dropped: `convex run` prints the function's own log lines there, and a failure logs a
            # workspace id, which is the very thing the sealed report exists to keep out of this public log
            # (`scripts/check-convex-run-stderr.mjs`). The detail is in the Convex dashboard, which is private.
            answer=$(npx convex run functions/texHistoryMigration:run "$args" 2>/dev/null)
            # Who failed is never printed in the clear: only sealed to the caller's key (a fresh AES key, wrapped by RSA-OAEP).
            if [ "$report" = true ] && [ "$(echo "$answer" | jq '.failures // [] | length')" != "0" ]; then
              secret=$(openssl rand -hex 32)
              sealed=$(echo "$answer" | jq -c '.failures' | openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$secret" | base64 -w0)
              wrapped=$(printf %s "$secret" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/report.pub" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
              echo "sealed report, page $page: $wrapped.$sealed"
            fi
            echo "page $page: $(echo "$answer" | jq -c 'del(.cursor, .failures)')"
            total=$(jq -cn --argjson a "$total" --argjson b "$(echo "$answer" | jq -c '(.failedCodes // {} | with_entries(.key |= "failed_" + .)) + del(.cursor, .done, .failedCodes, .failures)')" '$a + ($b | to_entries | map({key, value: (.value + ($a[.key] // 0))}) | from_entries)')
            if [ "$(echo "$answer" | jq -r '.done')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 2000 ]; then echo "stopped after $page pages"; exit 1; fi
          done
          echo "total: $total"
