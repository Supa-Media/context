# Deploy `context-email` — the Cloudflare Email Worker behind <username>@context.lc
# — on every merge to `main`.
#
# Modelled on deploy-mcp.yml and deploy-router.yml: the suite is a hard gate, a
# preflight names a missing secret instead of letting wrangler fail opaquely,
# the Worker's secrets are pushed from GitHub on every deploy, and — the part
# that matters most here — the job does not report success until it has proved
# the pipeline actually works.
#
# ── WHY THE POST-DEPLOY VERIFICATION IS SO LARGE ───────────────────────────
#
# `wrangler deploy` succeeding tells you a script was uploaded. It tells you
# nothing about whether mail reaches it, and for this Worker that gap is the
# whole failure mode: the owner emailed seyi@context.lc and got back
# `550 5.1.1 Address does not exist` — a rejection issued by Cloudflare's MX
# *before any Worker ran*, because no Email Routing rule matched the address.
# A deploy pipeline that goes green in that state is worse than no pipeline.
#
# So this workflow asserts, after deploying, that all four links in the chain
# are real:
#
#   1. the script exists in the account and was modified by THIS run,
#   2. `EMAIL_WORKER_SECRET` is actually bound to it,
#   3. Email Routing is enabled on the zone and its catch-all points at this
#      Worker — the specific thing whose absence produced the 550,
#   4. the control plane's `/gateway/ingest/*` routes are deployed and
#      authenticating, so the Worker has something to call.
#
# Any of those failing fails the job. Several of them can only be fixed by a
# human in the Cloudflare dashboard, and that is deliberate: a red build with a
# runbook in its error message is the correct representation of "configured
# wrong", and is what this project got wrong four separate times today.
name: Deploy Email Worker (production)

on:
  push:
    branches: [main]
    paths:
      - "infra/email-worker/**"
      - ".github/workflows/deploy-email-worker.yml"
  workflow_dispatch:

# Never on `pull_request`: a deploy triggered by a pull request from a branch
# pushed HERE would run unreviewed code with the account's Cloudflare
# credentials, against the Worker that reads customers' mail and holds the
# secret that mints ingestion tickets. A branch and not a fork — a fork's run
# inherits no secrets, so it is the one shape that could not.
concurrency:
  group: deploy-email-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  # Must match `name` in infra/email-worker/wrangler.jsonc. Cross-checked below
  # rather than parsed out of it: wrangler.jsonc is JSONC and its comments are
  # load-bearing documentation, so a JSON.parse here would either fail or
  # invite someone to strip them.
  WORKER_NAME: context-email
  # Must match `vars.INGEST_DOMAIN` in the same file. This is the zone whose
  # Email Routing configuration is verified below.
  INGEST_DOMAIN: context.lc

jobs:
  test:
    name: Test email worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --filter "./infra/email-worker..." --frozen-lockfile

      - name: Typecheck
        working-directory: infra/email-worker
        run: pnpm typecheck

      # The suite holds this Worker's security properties: authentication
      # before the allow-list, personal contexts only, one indistinguishable
      # refusal for every kind of no. It gates the deploy for that reason.
      - name: Test
        working-directory: infra/email-worker
        run: pnpm test

  deploy:
    name: Deploy + verify context-email
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # A rename in wrangler.jsonc that this workflow did not follow would make
      # every verification below check a Worker nobody deployed — passing, or
      # failing, for reasons unrelated to the deploy.
      - name: Verify this workflow and wrangler.jsonc agree
        run: |
          set -euo pipefail
          config=infra/email-worker/wrangler.jsonc
          if ! grep -qE "^\s*\"name\"\s*:\s*\"$WORKER_NAME\"" "$config"; then
            echo "ERROR: $config does not declare name \"$WORKER_NAME\"."
            echo "Update WORKER_NAME in this workflow to match, or vice versa —"
            echo "every verification step below keys off it."
            exit 1
          fi
          if ! grep -qE "\"INGEST_DOMAIN\"\s*:\s*\"$INGEST_DOMAIN\"" "$config"; then
            echo "ERROR: $config does not declare INGEST_DOMAIN \"$INGEST_DOMAIN\"."
            echo "The Email Routing checks below verify the wrong zone if these drift."
            exit 1
          fi
          echo "OK — workflow and wrangler.jsonc agree on $WORKER_NAME / $INGEST_DOMAIN."

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID EMAIL_WORKER_SECRET CONTROL_PLANE_URL; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required secret '$var' in the 'production' environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "EMAIL_WORKER_SECRET is this Worker's own credential — NOT GATEWAY_SECRET."
            echo "See the contract block in infra/email-worker/src/controlPlane.ts."
            echo "The same value must also be set on the Convex deployment as"
            echo "EMAIL_WORKER_SECRET, or every ingest call is answered 401."
            exit 1
          fi
          echo "OK — every required secret is present."

      # Prove the token can write to the account wrangler will deploy into,
      # BEFORE the opaque wrangler failure ("Could not route ... [code: 7003]",
      # which says nothing about the cause).
      #
      # This calls GET /accounts/{id}/workers/scripts — the same endpoint the
      # "Verify the Worker exists and was just modified" step below already
      # calls — rather than the bare GET /accounts/{id} this step used until
      # 2026-09-07. The bare form needs "Account Settings: Read", a permission
      # this deploy has no other use for. That day the token lost exactly that
      # scope (still valid, still able to deploy) while its permission set was
      # being edited, and this preflight died on Cloudflare 9109
      # ("Unauthorized to access requested resource") for a permission nothing
      # downstream spends — re-running Sync Secrets five times changed nothing,
      # because the token's VALUE was never wrong. `/workers/scripts` needs only
      # "Workers Scripts: Read", a strict subset of "Workers Scripts: Edit",
      # which `wrangler deploy` needs no matter what — so this preflight can
      # never need a permission the deploy does not already require.
      #
      # It can no longer print the account's NAME — that field lives behind the
      # same "Account Settings: Read" this step now deliberately avoids asking
      # for — so it prints the script COUNT instead. A count is not an
      # identifier; it proves the token can list this account's Workers, which
      # is the fact this step exists to establish.
      - name: Verify Cloudflare credentials (preflight)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            if (d.success) {
              console.log("[ok] token can list Workers scripts for this account (" + (d.result || []).length + " script(s)).");
            } else {
              console.error("[FAIL] CLOUDFLARE_API_TOKEN cannot read Workers scripts for CLOUDFLARE_ACCOUNT_ID.");
              console.error("       Cloudflare errors: " + JSON.stringify(d.errors));
              console.error("");
              console.error("       Code 9109 (\"Unauthorized to access requested resource\") means one of:");
              console.error("         - CLOUDFLARE_ACCOUNT_ID is wrong for this token, or");
              console.error("         - CLOUDFLARE_API_TOKEN itself is invalid or expired, or");
              console.error("         - the token is missing \"Workers Scripts: Read\" (or :Edit) on this account.");
              console.error("       wrangler deploy below needs \"Workers Scripts: Edit\" regardless, so if");
              console.error("       this is a permission gap, that same edit fixes both.");
              process.exit(1);
            }
          ' "$resp"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --filter "./infra/email-worker..." --frozen-lockfile

      # DEPLOY BEFORE SECRETS, deliberately — the step after it says why.
      - name: Deploy context-email
        working-directory: infra/email-worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # There used to be a step here comparing infra/router/wrangler.jsonc's
      # CONVEX_ORIGIN against this worker's own CONTROL_PLANE_URL, both
      # committed literals that could drift independently. Both are now the
      # identical `CONTROL_PLANE_URL` secret (set below and in
      # deploy-router.yml), so they cannot drift from each other — only "Verify
      # required secrets" above can still fail, if the secret itself is unset.
      #
      # Push the Worker's secrets from GitHub on every deploy, so the live
      # Worker is reproducible from this repository rather than from whatever
      # somebody once typed at a terminal. `wrangler secret put` is idempotent
      # and reads the value from STDIN, so it is never placed on a command
      # line, in the process table, or in a log.
      #
      # EMAIL_WORKER_SECRET must be the same value the control plane holds — it
      # is what proves "this caller is the email worker" — so it lives in one
      # place, GitHub, and is pushed from there.
      #
      # ── WHY THIS RUNS AFTER `wrangler deploy` AND NOT BEFORE ──────────────
      #
      # It ran before, and that ordering deadlocked this deploy:
      #
      #   A request to the Cloudflare API (/…/workers/scripts/context-email/
      #   secrets) failed. Binding name 'CONTROL_PLANE_URL' already in use.
      #   [code: 10053]
      #
      # `wrangler deploy` is the only thing that reconciles the Worker's
      # BINDING SHAPE; `wrangler secret put` only fills a value in. Until #275
      # CONTROL_PLANE_URL was a plaintext var in wrangler.jsonc, so the live
      # Worker still carried it as a var, and Cloudflare refuses to create a
      # secret whose name collides with an existing var. The deploy is what
      # drops the stale var — so the step that fixes the problem sat behind the
      # step the problem breaks: self-healing in principle, permanently stuck
      # in practice, and never reached by a re-run.
      #
      # Deleting the stale binding out of band would fix it once; this fixes
      # the class, needs no extra credential or API call, and is a no-op on a
      # fresh account where there is nothing stale to drop. deploy-router.yml
      # is reordered the same way for the same reason — #275 moved CONVEX_ORIGIN
      # there on the same day and it would have hit 10053 the moment it could
      # run again.
      #
      # The cost is a window of seconds, and only on a Worker whose secrets are
      # not already set — a fresh install, or this one repair run — in which
      # the deployed code has no CONTROL_PLANE_URL yet. `requireConfig` in
      # src/controlPlane.ts is evaluated per call rather than at construction,
      # and throws `ControlPlaneError("not configured")`, which reaches the one
      # branch in src/index.ts allowed to RETHROW rather than `setReject`:
      # resolution failure is recipient-independent, so it leaks nothing and is
      # deliberately left to the runtime's own handling. Mail arriving in that
      # window is therefore not permanently refused.
      #
      # Every later run has no window at all, because the secrets are already
      # on the Worker and `wrangler deploy` preserves them. That is not an
      # assumption: under the previous ordering this workflow set the secret
      # and then, AFTER deploying, asserted it was still bound (verification 2
      # below). Every green run was that assertion passing.
      - name: Sync the Worker's secrets
        working-directory: infra/email-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          # No 10053 runbook on this one: EMAIL_WORKER_SECRET has never been a
          # var in wrangler.jsonc, so a binding collision here would be a new
          # fact and wrangler's own error is the honest thing to read.
          printf '%s' "$EMAIL_WORKER_SECRET" | pnpm exec wrangler secret put EMAIL_WORKER_SECRET
          # CONTROL_PLANE_URL used to be a plaintext var in this file's
          # wrangler.jsonc, naming an account identifier (which Convex
          # deployment) a public repo does not commit. Same secret and pattern
          # apps/mcp already uses for this value — and apps/mcp never hit the
          # collision below because it never declared it as a var.
          if ! printf '%s' "$CONTROL_PLANE_URL" | pnpm exec wrangler secret put CONTROL_PLANE_URL; then
            echo ""
            echo "If that failed with \"Binding name 'CONTROL_PLANE_URL' already in use\""
            echo "[code: 10053], the live Worker still carries it as a PLAINTEXT VAR from"
            echo "a deploy predating #275. The deploy step above is what removes it,"
            echo "which is why it now runs first, so a re-run should clear this. If it"
            echo "does not, delete that variable on context-email in the Cloudflare"
            echo "dashboard (Settings -> Variables and Secrets) and re-run."
            exit 1
          fi
          echo "OK — the Worker's secrets match this repository's."

      # ── Verification 1: something was actually deployed, by this run. ──────
      #
      # A `wrangler deploy` that no-ops, or that deployed into a different
      # account, leaves the script either absent or untouched. Asking the API
      # for its modification time catches both, and is the assertion that would
      # have caught this project's "four pipelines reported success while
      # deploying nothing".
      - name: Verify the Worker exists and was just modified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            const name = process.argv[2];
            if (!d.success) {
              console.error("[FAIL] could not list Workers: " + JSON.stringify(d.errors));
              process.exit(1);
            }
            const script = (d.result || []).find((s) => s.id === name);
            if (!script) {
              console.error("[FAIL] no Worker named " + name + " exists in this account.");
              console.error("       wrangler deploy reported success, so it deployed somewhere else.");
              process.exit(1);
            }
            const age = (Date.now() - Date.parse(script.modified_on)) / 60000;
            if (!Number.isFinite(age) || age > 30) {
              console.error("[FAIL] " + name + " was last modified " + Math.round(age) +
                " minutes ago — this run did not deploy it.");
              process.exit(1);
            }
            console.log("[ok] " + name + " was modified " + Math.round(age) + " minute(s) ago.");
          ' "$resp" "$WORKER_NAME"

      # ── Verification 2: the secrets are bound, not merely uploaded. ────────
      #
      # Only NAMES and types are read. Values are never fetched, printed, or
      # compared — the API does not return them, and this step must never
      # become the reason someone wishes it did.
      #
      # CONTROL_PLANE_URL is checked here as well as EMAIL_WORKER_SECRET, and
      # that second name is doing more work than it looks: this endpoint lists
      # SECRET bindings only. Seeing it here is therefore proof that the
      # plaintext var of the same name — the one that made `wrangler secret
      # put` fail with 10053 until the deploy was moved ahead of it — is really
      # gone, rather than merely believed to be.
      - name: Verify the Worker's secrets are bound
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            if (!d.success) {
              console.error("[FAIL] could not list the Worker secrets: " + JSON.stringify(d.errors));
              process.exit(1);
            }
            const names = (d.result || []).map((s) => s.name);
            if (!names.includes("EMAIL_WORKER_SECRET")) {
              console.error("[FAIL] EMAIL_WORKER_SECRET is not bound to this Worker.");
              console.error("       Bound secrets: " + (names.join(", ") || "(none)"));
              console.error("       Without it every control-plane call is answered 401 and");
              console.error("       every message is refused.");
              process.exit(1);
            }
            if (!names.includes("CONTROL_PLANE_URL")) {
              console.error("[FAIL] CONTROL_PLANE_URL is not bound to this Worker AS A SECRET.");
              console.error("       Bound secrets: " + (names.join(", ") || "(none)"));
              console.error("       If the Worker still carries it as a plaintext VAR from a");
              console.error("       deploy predating #275, the secret could not be created:");
              console.error("       \"Binding name ... already in use\" [code: 10053]. The deploy");
              console.error("       step drops that var, which is why it runs first now.");
              console.error("       Without this value the Worker cannot reach the control");
              console.error("       plane and every message is left to the runtime to retry.");
              process.exit(1);
            }
            console.log("[ok] EMAIL_WORKER_SECRET and CONTROL_PLANE_URL are bound as secrets.");
          ' "$resp"

      # ── Verification 3: mail can actually REACH the Worker. ────────────────
      #
      # This is the step that represents the bug this workflow exists to stop
      # recurring. Email Routing rejects mail for an address with no matching
      # rule before the Worker ever runs, with exactly the
      # `550 5.1.1 Address does not exist` the owner received — so a deployed
      # Worker with no catch-all is a Worker that receives nothing, forever,
      # while every deploy stays green.
      #
      # The catch-all specifically, not per-address rules: see note 1 in the
      # header of infra/email-worker/wrangler.jsonc. Per-address rules would put
      # a username-enumeration oracle one layer above the Worker, defeating the
      # uniform refusals in src/index.ts.
      - name: Verify Email Routing delivers to this Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          zresp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$INGEST_DOMAIN")"
          zone="$(node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            if (!d.success) {
              console.error("[FAIL] could not look up the zone. The CLOUDFLARE_API_TOKEN needs");
              console.error("       Zone:Read and Zone:Email Routing Rules:Read on " + process.argv[2] + ".");
              console.error("       Cloudflare errors: " + JSON.stringify(d.errors));
              process.exit(1);
            }
            const z = (d.result || [])[0];
            if (!z) {
              console.error("[FAIL] no zone named " + process.argv[2] + " is visible to this token.");
              process.exit(1);
            }
            console.log(z.id);
          ' "$zresp" "$INGEST_DOMAIN")"
          echo "[ok] zone $INGEST_DOMAIN resolved."

          # Deliberately NOT the zone settings endpoint
          # (`/zones/:id/email/routing`). That needs **Email Routing Settings**,
          # a different permission group from **Email Routing Rules** — and a
          # deploy token has no business reading account settings it never
          # changes. Asking for it failed the deploy with a 10000 that this step
          # then misreported as "Email Routing is not enabled", about a zone that
          # was enabled and routing correctly the whole time.
          #
          # The catch-all rule below is the thing that actually decides whether
          # mail reaches this Worker, it is readable with the permission the
          # token already has, and a zone with Email Routing switched off cannot
          # have an enabled rule at all. So it subsumes the check it replaces.

          cresp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone/email/routing/rules/catch_all")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            const worker = process.argv[2];
            const domain = process.argv[3];
            const r = d.result || {};
            const fail = (msg) => {
              console.error("[FAIL] " + msg);
              console.error("");
              console.error("  Mail to <name>@" + domain + " is rejected by Cloudflare with");
              console.error("  \"550 5.1.1 Address does not exist\" before this Worker ever runs.");
              console.error("");
              console.error("  Fix, in the Cloudflare dashboard:");
              console.error("    " + domain + " -> Email -> Email Routing -> Routing rules");
              console.error("    -> Catch-all address -> Edit");
              console.error("    -> Action: \"Send to a Worker\", Destination: \"" + worker + "\"");
              console.error("    -> Enable the catch-all, and Save.");
              console.error("");
              console.error("  It must be the CATCH-ALL, not per-address rules — per-address rules");
              console.error("  make Cloudflare answer differently for a claimed name than for an");
              console.error("  unclaimed one, which is a username-enumeration oracle sitting above");
              console.error("  the uniform refusals this Worker returns.");
              process.exit(1);
            };
            if (!d.success) fail("could not read the catch-all rule: " + JSON.stringify(d.errors));
            if (r.enabled !== true) fail("the catch-all rule is disabled.");
            const actions = r.actions || [];
            const toWorker = actions.find((a) => a.type === "worker");
            if (!toWorker) {
              fail("the catch-all action is \"" +
                (actions.map((a) => a.type).join(", ") || "(none)") +
                "\", not \"worker\".");
            }
            const values = toWorker.value || [];
            if (!values.includes(worker)) {
              fail("the catch-all sends to Worker \"" + values.join(", ") +
                "\", not \"" + worker + "\".");
            }
            console.log("[ok] the catch-all on " + domain + " delivers to Worker " + worker + ".");
          ' "$cresp" "$WORKER_NAME" "$INGEST_DOMAIN"

      # ── Verification 4: the Worker has a control plane to call. ────────────
      #
      # The Worker resolves every recipient against `/gateway/ingest/resolve`
      # before it does anything else, so those routes being live is part of
      # "deployed and working". They ship from apps/convex, whose deploy is a
      # separate workflow triggered by the same push — hence the retry: this job
      # can legitimately win the race.
      #
      # 401 is the assertion, and it is a real one. A 404 means the routes are
      # not deployed at all (which is exactly what this endpoint returns today,
      # before this branch merges); a 200 would mean the route stopped
      # authenticating. Only 401 means "deployed, and refusing an
      # unauthenticated caller".
      - name: Verify the control plane's ingest routes are live
        env:
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          origin="$CONTROL_PLANE_URL"
          url="$origin/gateway/ingest/resolve"

          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -X POST -H 'Content-Type: application/json' -d '{}' "$url" || true)"
            if [ "$code" = "401" ]; then
              echo "[ok] $url refuses an unauthenticated call with 401 (attempt $attempt)."
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "[FAIL] $url returned $code; expected 401."
              if [ "$code" = "404" ]; then
                echo "       404 means the ingest routes are not deployed. Check the"
                echo "       'Deploy Convex' workflow for this commit — apps/convex/http.ts"
                echo "       must be live before this Worker can resolve a single recipient."
              fi
              exit 1
            fi
            echo "Attempt $attempt: got $code, waiting for the Convex deploy."
            sleep 15
          done

      # ── Verification 5: the Worker's key opens the control plane's door. ───
      #
      # THE STEP THIS PIPELINE WAS MISSING, AND THE GAP THAT COST THE HOURS.
      #
      # Everything above proves the Worker exists, that a secret is *bound* to
      # it, and that the route refuses an unauthenticated caller. None of that
      # says the secret the Worker holds is the secret this deployment accepts —
      # and the two halves come from two different places: this workflow pushes
      # GitHub's `EMAIL_WORKER_SECRET` to Cloudflare, while the Convex side is
      # set by hand with `convex env set`. Nothing has ever compared them.
      #
      # When they disagree, every ingest call is answered 401, the Worker raises
      # `ControlPlaneError("status 401")`, `src/index.ts` rethrows it because a
      # control-plane outage is the one recipient-independent branch, and the
      # operator sees Cloudflare's "temporary error: worker script threw an
      # exception" with no cause anywhere. Every deploy stays green.
      #
      # ── Why this is not an oracle ──
      #
      # `postmaster` is in RESERVED_NAMES, so `validateName` refuses it before
      # any lookup: the answer is `{"ingestion":null}` for all time, whatever is
      # in the database, and no ticket is minted and no rate limit is consumed.
      # The only bit this reads is 200-vs-401 — "was my secret accepted" — which
      # is a fact about this workflow's own credential and about no user at all.
      - name: Verify the Worker's secret is the one the control plane accepts
        env:
          EMAIL_WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          url="$CONTROL_PLANE_URL/gateway/ingest/resolve"

          # A reserved name. Refused before any lookup, so this probe reads no
          # row, writes no row, and consumes no limit.
          body='{"username":"postmaster","sizeBytes":1,"envelopeFrom":"ci@invalid"}'

          out="$(curl -s -o /tmp/ingest-auth.json -w '%{http_code}' --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $EMAIL_WORKER_SECRET" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "$body" "$url" || true)"

          if [ "$out" = "401" ]; then
            echo "[FAIL] the control plane REFUSED this repository's EMAIL_WORKER_SECRET."
            echo ""
            echo "  The Worker was just given this exact value, so every inbound message"
            echo "  will be answered 401, the Worker will throw, and Cloudflare will report"
            echo "  \"temporary error: worker script threw an exception\" — with no cause"
            echo "  visible anywhere. Mail to <name>@$INGEST_DOMAIN is lost."
            echo ""
            echo "  Fix: set the SAME value on the Convex deployment."
            echo "    npx convex env set EMAIL_WORKER_SECRET '<the GitHub secret>' --prod"
            echo ""
            echo "  It is NOT GATEWAY_SECRET. See the contract block in"
            echo "  infra/email-worker/src/controlPlane.ts."
            echo ""
            echo "  If the two values LOOK identical, check the invisible half: a GitHub"
            echo "  secret set from a file keeps its trailing newline, the Bearer header"
            echo "  carries it, and the comparison is over the raw string."
            # Whether it is padded, never how long it is — the control plane's
            # comparison is deliberately length-blind and a CI log should not
            # undo that.
            if [ "$EMAIL_WORKER_SECRET" != "$(printf '%s' "$EMAIL_WORKER_SECRET" | tr -d '[:space:]')" ]; then
              echo "  -> THIS REPOSITORY'S SECRET CONTAINS WHITESPACE. That is almost"
              echo "     certainly it. Re-set it with no trailing newline."
            else
              echo "  (this repository's secret has no whitespace in it, so the two values"
              echo "   genuinely differ.)"
            fi
            exit 1
          fi

          if [ "$out" != "200" ]; then
            echo "[FAIL] $url answered $out to an authenticated call; expected 200."
            if [ "$EMAIL_WORKER_SECRET" != "$(printf '%s' "$EMAIL_WORKER_SECRET" | tr -d '[:space:]')" ]; then
              echo "       This repository's EMAIL_WORKER_SECRET contains whitespace, which"
              echo "       cannot go in an Authorization header. The Worker builds that header"
              echo "       by interpolation, so in production this is not a 401 — fetch throws,"
              echo "       the Worker rethrows, and Cloudflare reports \"worker script threw an"
              echo "       exception\". Re-set the secret with no trailing newline."
            fi
            exit 1
          fi

          # 200 alone is not enough: a route that stopped reading the body would
          # also answer 200. The documented refusal for a reserved name is an
          # explicit null, and a *missing* key is a control plane that no longer
          # implements this contract — which is exactly what the Worker's
          # `required()` treats as an outage.
          if ! grep -q '"ingestion":null' /tmp/ingest-auth.json; then
            echo "[FAIL] the secret was accepted, but the answer for a reserved name was not"
            echo "       '{\"ingestion\":null}':"
            cat /tmp/ingest-auth.json
            exit 1
          fi

          rm -f /tmp/ingest-auth.json
          echo "[ok] the control plane accepts this Worker's secret."

      # Not a gate. postmaster@ and abuse@ are forwarded to OPERATIONS_MAILBOX
      # and never ingested; RFC 2142 requires them to stay deliverable and
      # CLAUDE.md records that as load-bearing. But a Worker that ingests mail
      # correctly while bouncing postmaster@ is strictly better than one that is
      # not deployed, so this reports rather than blocks.
      - name: Check OPERATIONS_MAILBOX is set
        run: |
          set -euo pipefail
          config=infra/email-worker/wrangler.jsonc
          if grep -qE '"OPERATIONS_MAILBOX"\s*:\s*""' "$config"; then
            echo "::warning::OPERATIONS_MAILBOX is empty in $config, so postmaster@$INGEST_DOMAIN and abuse@$INGEST_DOMAIN are refused and the Worker logs 'operations_mailbox_unset'. Set it to a VERIFIED Email Routing destination address."
            echo "OPERATIONS_MAILBOX is unset — see the warning above."
          else
            echo "OK — OPERATIONS_MAILBOX is set."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Email worker deploy (production)"
            echo ""
            echo "- **Worker:** \`$WORKER_NAME\`"
            echo "- **Receives:** mail to \`<username>@$INGEST_DOMAIN\`, via the zone's"
            echo "  Email Routing **catch-all** — verified live by the steps above."
            echo "- **Verified:** the script was modified by this run;"
            echo "  \`EMAIL_WORKER_SECRET\` is bound; Email Routing is enabled and its"
            echo "  catch-all targets this Worker; \`/gateway/ingest/resolve\` answers 401."
            echo "- **Not verified by CI:** that \`AUTH_SERVICE_ID\` matches what Cloudflare"
            echo "  actually stamps on a delivered message. Only a real delivery can"
            echo "  settle that — see note 2 in \`infra/email-worker/wrangler.jsonc\`."
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
