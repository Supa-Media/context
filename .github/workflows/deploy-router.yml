# Deploy context-router — the Cloudflare Worker fronting https://context.lc —
# on every merge to `main`.
#
# The router is the front door: every request for the web app and every request
# in the sign-in flow passes through it. A broken deploy takes the whole site
# down, so its own test suite gates the deploy and a bad Cloudflare credential
# is diagnosed before `wrangler deploy` can fail opaquely.
#
# This deliberately does NOT use the framework's reusable deploy-web workflow:
# that targets Cloudflare *Pages* (`wrangler pages deploy`), which cannot
# express a Worker doing custom fetch routing.
name: Deploy Router (production)

on:
  push:
    branches: [main]
    paths:
      - "infra/router/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-router.yml"
  workflow_dispatch:

# Never on `pull_request`: a deploy triggered by a pull request from a branch
# pushed HERE would run unreviewed code with the account's Cloudflare
# credentials. A branch and not a fork — a fork's run inherits no secrets.
concurrency:
  group: deploy-router-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Test + deploy context-router
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # infra/router has to be a pnpm workspace member for the filtered install
      # below to resolve it from the root lockfile. Without the glob, pnpm's
      # error is about a filter matching no projects, which reads like a typo
      # rather than a missing one-line config. Say the actual fix instead.
      - name: Verify infra/* is a workspace package
        run: |
          set -euo pipefail
          if ! grep -qE '^\s*-\s*"?infra/\*"?\s*$' pnpm-workspace.yaml; then
            echo "ERROR: pnpm-workspace.yaml does not include infra/*."
            echo ""
            echo "Add this line under 'packages:' and regenerate the lockfile:"
            echo "  - \"infra/*\""
            echo ""
            echo "infra/router carries devDependencies (vitest, wrangler, typescript)"
            echo "that have to be resolvable from the root pnpm-lock.yaml."
            exit 1
          fi
          echo "OK — infra/* is a workspace package."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Scoped to infra/router and its dependencies — all this job needs.
      - name: Install dependencies
        run: pnpm install --filter "./infra/router..." --frozen-lockfile

      - name: Typecheck
        working-directory: infra/router
        run: pnpm typecheck

      # Gates the deploy. The routing decisions are pure functions precisely so
      # this can prove them without a network or the Workers runtime.
      - name: Test
        working-directory: infra/router
        run: pnpm test

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required secret '$var' in the 'production' environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK — every required secret is present."

      # Prove the token can actually write to the account wrangler will deploy
      # into, BEFORE the opaque wrangler failure. A mis-scoped token otherwise
      # dies with "Could not route ... [code: 7003]", which says nothing about
      # the cause.
      #
      # This calls GET /accounts/{id}/workers/scripts rather than the bare
      # GET /accounts/{id} it used until 2026-09-07. The bare form needs
      # "Account Settings: Read" — a permission this deploy has no other use
      # for — and that day the token lost exactly that scope while otherwise
      # unchanged (it could still deploy). The preflight died on Cloudflare
      # 9109 ("Unauthorized to access requested resource") for a permission
      # nothing downstream spends, five minutes after re-running Sync Secrets
      # changed nothing, because the token's VALUE was never wrong. This
      # endpoint needs only "Workers Scripts: Read", a strict subset of
      # "Workers Scripts: Edit", which `wrangler deploy` below needs no matter
      # what — so this preflight can never need a permission the deploy does
      # not already require.
      #
      # It can no longer print the account's NAME — that field lives behind
      # the same "Account Settings: Read" this step now deliberately avoids
      # asking for — so it prints the script COUNT instead. A count is not an
      # identifier; it proves the token can list this account's Workers, which
      # is the fact this step exists to establish, without spending a
      # permission never claimed to be needed.
      - name: Verify Cloudflare credentials (preflight)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          node -e '
            const d = JSON.parse(process.argv[1] || "{}");
            if (d.success) {
              console.log("[ok] token can list Workers scripts for this account (" + (d.result || []).length + " script(s)).");
            } else {
              console.error("[FAIL] CLOUDFLARE_API_TOKEN cannot read Workers scripts for CLOUDFLARE_ACCOUNT_ID.");
              console.error("       Cloudflare errors: " + JSON.stringify(d.errors));
              console.error("");
              console.error("       Code 9109 (\"Unauthorized to access requested resource\") means one of:");
              console.error("         - CLOUDFLARE_ACCOUNT_ID is wrong for this token, or");
              console.error("         - CLOUDFLARE_API_TOKEN itself is invalid or expired, or");
              console.error("         - the token is missing \"Workers Scripts: Read\" (or :Edit) on this account.");
              console.error("       wrangler deploy below needs \"Workers Scripts: Edit\" regardless, so if");
              console.error("       this is a permission gap, that same edit fixes both.");
              process.exit(1);
            }
          ' "$resp"

      # CONVEX_ORIGIN names which Convex deployment production talks to — an
      # account identifier, so infra/router/wrangler.jsonc no longer commits
      # it as a plaintext var (CLAUDE.md: "no internal hostnames, no account
      # identifiers"). Set as a `wrangler secret` instead, from the same
      # `CONTROL_PLANE_URL` secret the email worker and the MCP gateway read
      # under that name — one Convex deployment origin, three Workers.
      #
      # Skipped, not failed, when the secret is unset: infra/router's own
      # comment on CONVEX_ORIGIN documents that state as a real one — the
      # Worker fails CLOSED on /api/auth/* rather than guessing — for a fresh
      # self-hosted deploy that has not set up Convex yet.
      #
      # The "skip when unset" check moved from a step-level `if:` into the
      # shell body. `secrets` is not a valid context for `jobs.<job_id>.
      # steps.if` — only `env`, `with`, and a job's `container`/`services`/
      # `environment` can read it — so `if: ${{ secrets.CONTROL_PLANE_URL !=
      # '' }}` failed the ENTIRE workflow to parse ("Unrecognized named-value:
      # 'secrets'") on every trigger, push included, from the moment this
      # step was added: zero jobs ever ran, and every deploy of the router —
      # the front door — silently stayed on whatever was last live while this
      # showed red. Caught while chasing an unrelated Cloudflare permission
      # failure on 2026-09-07, which is the first thing that made anyone look
      # at this job's failures at all.
      - name: Set CONVEX_ORIGIN secret (Convex HTTP-actions origin)
        working-directory: infra/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_URL:-}" ]; then
            echo "Skipping CONVEX_ORIGIN — CONTROL_PLANE_URL is unset. Expected for a"
            echo "fresh self-hosted deploy that has not set up Convex yet; the Worker"
            echo "fails closed on /api/auth/* rather than guessing."
            exit 0
          fi
          printf '%s' "$CONTROL_PLANE_URL" | pnpm exec wrangler secret put CONVEX_ORIGIN

      - name: Deploy context-router
        working-directory: infra/router
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Router deploy (production)"
            echo ""
            echo "- **Worker:** \`context-router\`"
            echo "- **Serves:** https://context.lc and https://www.context.lc"
            echo "- **Custom domains are attached in the Cloudflare dashboard,** not by this"
            echo "  workflow — see the comment at the top of \`infra/router/wrangler.jsonc\`."
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
