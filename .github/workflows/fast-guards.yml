name: Fast repository guards

on:
  pull_request:
    # Not `edited`. A description edit re-ran every guard and cancelled an
    # in-progress run. pr-description.yml re-runs this workflow only when the
    # owner's skip line changed, and the steps below read the live description
    # so that re-run sees the new line. "No replay case:", "Tex diagram:
    # unchanged because" and "Speed budget raised:" are read on the next push,
    # and on that re-run.
    types: [opened, synchronize, reopened]
  # The merge queue asks for the required checks on its trial commit. The
  # guards that grade a diff or read the description grade the merge group's
  # diff and the description of the pull request it was built for.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A newer push to a pull request supersedes the run for the older commit, so
# that run is cancelled rather than holding runners (a free account gets 20
# at once). Pushes to main are each kept: the group is the commit there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    name: Fast repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # These guards use only Node built-ins and need no package install.
      # Pin the runtime: the public policy check reads its canonical TypeScript
      # data with Node's built-in type stripping.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Record the runner Node version
        run: node --version

      - name: The pull request description, as it is now
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # A merge group carries no pull request; its branch names the one it
          # was built for (gh-readonly-queue/main/pr-<n>-<sha>).
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-description.mjs --print-body > "$RUNNER_TEMP/pr-body"

      # precheck runs these steps on a full clone before a push. This fails when a guard `run:` drifts, or when
      # `mobile-typecheck` in ci.yml drifts. Node built-ins only, so it needs no install. It also runs as one of
      # the guards below; that second pass is the same check, not a second copy of the rules.
      - name: Precheck matches the fast guards and the app typecheck
        run: node scripts/precheck.mjs --self-test

      - name: The public privacy page contains the current policy without app execution
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/public-privacy.test.mjs

      - name: Workflow files and triggers are valid
        run: |
          node scripts/ci-change-scope.mjs --self-test
          node scripts/check-workflow-shell.mjs --self-test
          node scripts/check-workflow-shell.mjs
          node scripts/check-workflow-yaml.mjs --self-test
          node scripts/check-workflow-yaml.mjs
          node scripts/check-workflow-triggers.mjs --self-test
          node scripts/check-workflow-triggers.mjs
          node scripts/pr-description.mjs --self-test
          node scripts/merge-group.mjs --self-test
          node scripts/check-workflow-interpolation.mjs --self-test
          node scripts/check-workflow-interpolation.mjs
          node scripts/check-workflow-output-secrets.mjs --self-test
          node scripts/check-workflow-output-secrets.mjs
          node scripts/bench-runner-lock.mjs --self-test
          node scripts/check-package-tests-run.mjs --self-test
          node scripts/check-package-tests-run.mjs
          node scripts/check-workflow-cloudflare-preflight.mjs --self-test
          node scripts/check-workflow-cloudflare-preflight.mjs
          node scripts/check-workflow-secret-order.mjs --self-test
          node scripts/check-workflow-secret-order.mjs
          node scripts/check-bench-token-writer.mjs --self-test
          node scripts/check-bench-token-writer.mjs
          node scripts/bench-token-open.mjs --self-test
          node scripts/check-wrangler-vars-not-secrets.mjs --self-test
          node scripts/check-wrangler-vars-not-secrets.mjs
          node scripts/check-convex-run-stderr.mjs --self-test
          node scripts/check-convex-run-stderr.mjs

      # ── THE PATH-GATE CHECKER HAS TO RUN UNGATED, AND DID NOT ─────────────
      #
      # `check-ci-path-gates.mjs` asserts what every scoped job watches: the
      # WebKit path sets, that each scoped job names its packages and gates
      # every step, and that the editor-bundle job watches every source the
      # bundle records. It was hosted only in `router.yml` (now `workers.yml`)
      # and `email-worker.yml`, and since #1074 both of those are themselves
      # `ci-scope`d — to `@context/router` plus its workflow, and
      # `@context/email-worker` plus `email-worker.yml`.
      #
      # So on a pull request that changes only `.github/workflows/ci.yml`, both
      # hosts answered `affected: false` and skipped, and every assertion this
      # checker makes about `ci.yml` went unmade on the one diff that could
      # break them. Measured with the scope module's own `decide()`, not
      # assumed. The two gated hosts stay — they are the two-host reasoning
      # every other checker here uses — and this lane is the ungated one,
      # because a guard about a path filter must not sit behind one.
      #
      # Plain Node over files in this repository, like its neighbours, so it
      # needs no install.
      - name: CI path gates are what the jobs they describe actually watch
        run: |
          node scripts/check-ci-path-gates.mjs --self-test
          node scripts/check-ci-path-gates.mjs
          node scripts/check-agent-path-imports.mjs --self-test
          node scripts/check-agent-path-imports.mjs
          node scripts/check-mobile-outside-reads.mjs --self-test
          node scripts/check-mobile-outside-reads.mjs

      # ── AND THE GUARD OVER EVERY WORKER, NOT JUST THE GATEWAY ────────────
      #
      # `check-worker-fetch-options.mjs` scans four Worker source trees: the
      # gateway, the email worker, the router and the transcribe worker. Its
      # only host was `mcp.yml`'s `Test Gateway`, which is `ci-scope`d to
      # `@context/mcp` plus five named packages — so a pull request touching
      # only `infra/email-worker/src`, `infra/router/src` or
      # `infra/transcribe-worker/src` computed `affected: false` and the guard
      # did not run over the very trees it was written for. Its own header
      # records that `redirect: "error"` shipped twice and each time stopped a
      # Worker dead before the request was made.
      #
      # It stays in `mcp.yml` too — two hosts is the idiom here — and this is
      # the ungated one. `check-ci-path-gates.mjs` now asserts the relationship
      # rather than leaving it to a comment.
      - name: No Worker source asks for a fetch option workerd lacks
        run: |
          node scripts/check-worker-fetch-options.mjs --self-test
          node scripts/check-worker-fetch-options.mjs

      # Every Durable Object is placed in eastern North America (decided by the
      # owner, 2026-11-01). An object is placed once, near its first caller,
      # and never moves: Tex's objects had no hint and six of them were placed
      # in London and Amsterdam beside a gateway in Virginia.
      - name: Every Durable Object stub names the eastern North America hint
        run: |
          node scripts/check-durable-object-location.mjs --self-test
          node scripts/check-durable-object-location.mjs

      # ── AND THE JOBS THIS REPOSITORY NEVER TURNED ON ─────────────────────
      #
      # `ci / Test Shared Package` is gated upstream on an input `ci.yml` does
      # not pass, so it has never run — a skip indistinguishable from the
      # change-scoped ones around it. Nothing is unexercised today
      # (`@context/shared` has no `test` script and its coverage lives in
      # `apps/convex/__tests__`), and this guard is what keeps that true: the
      # day that package gains a `test` script, the job that would run it must
      # be turned on in the same commit.
      - name: A package's tests and the job that runs them agree
        run: |
          node scripts/check-ci-shared-tests.mjs --self-test
          node scripts/check-ci-shared-tests.mjs

      - name: Secrets, identifiers, and export remain safe
        run: |
          node scripts/check-secrets-allowlist.mjs --self-test
          node --test scripts/secrets-sync-plan.test.mjs
          node --test scripts/staging-config.test.mjs
          # What a manual job prints into its own public log is the same rule:
          # the image probe repeats a provider's prose, and prose quotes ids.
          node --test scripts/image-model-probe.test.mjs
          node --test scripts/tex-effort-beta-probe.test.mjs
          # A Lab runner slot serves one run at a time: its live holders are never listed as gone.
          node --test scripts/lab-runner-lease-active.test.mjs
          node scripts/check-secrets-allowlist.mjs
          node scripts/check-no-identifiers.mjs --self-test
          node scripts/check-no-identifiers.mjs
          node scripts/check-exit-is-ungated.mjs --self-test
          node scripts/check-exit-is-ungated.mjs

      - name: Gateway dependency boundary remains explicit
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(readFileSync('apps/mcp/package.json', 'utf8'));
          assert.deepEqual(manifest.dependencies, { '@context/collaboration': 'workspace:*', 'js-tiktoken': '1.0.21' });
          for (const field of ['optionalDependencies', 'peerDependencies', 'bundleDependencies']) {
            assert.deepEqual(manifest[field] ?? {}, {}, `apps/mcp declared ${field}`);
          }
          JS
          node scripts/check-gateway-imports.mjs --self-test
          # js-tiktoken: the usage tokenizer, in its one file (docs/decisions/observability/token-usage.md).
          node scripts/check-gateway-imports.mjs --allow-import=js-tiktoken/lite:src/mcp/tokens.js --allow-import=js-tiktoken/ranks/o200k_base:src/mcp/tokens.js apps/mcp/src

      - name: Gateway health probe can still fail
        run: node scripts/health-check-gateway.mjs --self-test

      - name: Site health probe can still fail
        run: node scripts/health-check-sites.mjs --self-test

      # A change to Tex ships with the case it is replayed against (docs/decisions/testing/replay-gate.md, Dev2 2026-11-13).
      - name: A Tex change adds the case that proves it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEX_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -f "$RUNNER_TEMP/pr-body" ]; then TEX_PR_BODY="$(cat "$RUNNER_TEMP/pr-body")"; export TEX_PR_BODY; fi
          node scripts/check-tex-change-has-case.mjs --self-test
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/check-tex-change-has-case.mjs

      # Tex's speed budgets move up only with a stated reason (Dev2 2026-11-13: "the speed keeps regressing").
      - name: Tex speed budgets are not raised without a reason
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEX_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -f "$RUNNER_TEMP/pr-body" ]; then TEX_PR_BODY="$(cat "$RUNNER_TEMP/pr-body")"; export TEX_PR_BODY; fi
          node scripts/check-speed-budget.mjs --self-test
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/check-speed-budget.mjs

      # The one Tex drawing moves with the code it draws (docs/architecture/tex.md, Dev2 2026-11-05).
      - name: The Tex diagram matches the code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          TEX_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -f "$RUNNER_TEMP/pr-body" ]; then TEX_PR_BODY="$(cat "$RUNNER_TEMP/pr-body")"; export TEX_PR_BODY; fi
          node scripts/tex-diagram-check.mjs --self-test
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/tex-diagram-check.mjs --base "$BASE_SHA"
          else
            node scripts/tex-diagram-check.mjs
          fi

      # Promote writes a Lab version into the config: main's own graph must promote to main's config byte for byte,
      # and a loop wire keeps its rounds (it lost them unseen while nothing ran this; 2026-11-16).
      # One loader and one schema for Tex's config (2026-11-17): no file reads texConfig.json its own way, the
      # committed config matches its schema version, and a version bump comes with its migration.
      - name: Tex's config is read through its loader and matches its schema
        run: node scripts/tex-config-readers.mjs && node scripts/tex-config-readers.mjs --self-test && node scripts/tex-config-migrate.mjs --check

      # Everything a pull request's preview creates has a teardown and a gone-check (scripts/preview-resources.mjs):
      # a new binding kind, Workflow, Worker or Cloudflare API family fails here until it is registered.
      - name: Every preview resource has a teardown
        run: node scripts/preview-resources-check.mjs && node --test scripts/preview-resources.test.mjs

      - name: Lab Promote writes main as main
        run: node scripts/tex-lab-promote.mjs --self-test && node scripts/tex-lab-merge.mjs --self-test

      # The Architecture Lab's cases, module texts and test workspaces are the bench's own (tex.lc/lab).
      # Built on install and never committed (scripts/tex-generated.mjs); building it still fails on a bench past its caps.
      - name: The Tex Lab's data builds from the bench
        run: node scripts/tex-lab-data.mjs

      # Tex's test conversations (packages/tex/src/texSets.cjs; plan: tex-sets/plan.md). The Test Set is never in the
      # repo: its star count comes from the eval service, and an unreachable service falls back to Training against Dev.
      - name: Tex's test conversations are sound and hold 60/20/20
        env:
          TEX_EVAL_COUNTS_URL: https://mcp.context.lc/tex-eval/counts
        run: node scripts/tex-sets-check.mjs

      - name: Tex's test conversations data is current
        run: node scripts/tex-sets-data.mjs --check
