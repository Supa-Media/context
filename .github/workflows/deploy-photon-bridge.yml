# Deploy the Photon bridge: the Worker, its Durable Object and its container.
# The bridge holds the Photon gRPC streams that the texting assistant reads
# (hosted webhooks lack edits, unsends and read receipts), and it is the one
# network exit for Tex's Photon sends. See infra/photon-bridge/README.md.
#
# The Photon secrets are optional. When both are unset the deploy still runs,
# the Worker answers 503 "unconfigured", and nothing listens to Photon, so
# merging this before the secrets exist is inert. Both must be set for the
# bridge to work.
name: Deploy Photon Bridge (production)

# Production calls this twice: `phase: test` beside Convex, then `phase:
# deploy` after Convex and the agent. The test is about 25 seconds and used
# to sit on the tail, after the agent deploy. `phase: all` (the default)
# runs the test and then the deploy in one call.
on:
  workflow_call:
    inputs:
      phase:
        description: "test (suite only), deploy (deploy only; the caller ran test), or all (suite, then deploy)"
        type: string
        default: all

concurrency:
  group: deploy-photon-bridge-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  WORKER_NAME: context-photon-bridge

jobs:
  test:
    if: ${{ inputs.phase != 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/photon-bridge..." --frozen-lockfile
      - working-directory: infra/photon-bridge
        run: pnpm typecheck
      - working-directory: infra/photon-bridge
        run: |
          npm ci --prefix container
          pnpm test

  deploy:
    needs: test
    if: ${{ !cancelled() && inputs.phase != 'test' && (inputs.phase == 'deploy' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required production secret '$var'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Verify workflow and container config agree
        run: |
          set -euo pipefail
          config=infra/photon-bridge/wrangler.jsonc
          grep -qE "^\s*\"name\"\s*:\s*\"$WORKER_NAME\"" "$config"
          grep -qE '"class_name"\s*:\s*"PhotonBridge"' "$config"
          grep -qE '"new_sqlite_classes"\s*:\s*\["PhotonBridge"\]' "$config"
          test -f infra/photon-bridge/Dockerfile

      # Wrangler uploads the Worker before it configures the container image.
      # Prove the token can reach Containers first, so a missing permission
      # fails before production is left with a new script and no backing image.
      - name: Verify Cloudflare Containers permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/me" \
            -o /dev/null; then
            echo "ERROR: CLOUDFLARE_API_TOKEN needs Account > Containers > Edit for this account."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/photon-bridge..." --frozen-lockfile

      # Secrets ride on this same deploy. A following secret put publishes a
      # second version and starts the container again; on 2026-11-17 that
      # second start left the bridge with no container instance. Both secrets
      # or neither, so a half-set pair cannot mint a token. Unset, the deploy
      # stays inert until the Photon project exists.
      - name: Deploy container and Worker
        working-directory: infra/photon-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHOTON_PROJECT_ID: ${{ secrets.PHOTON_PROJECT_ID }}
          PHOTON_PROJECT_SECRET: ${{ secrets.PHOTON_PROJECT_SECRET }}
        run: |
          set -euo pipefail
          secrets_file=""
          cleanup() { if [ -n "${secrets_file}" ]; then rm -f "$secrets_file"; fi; }
          trap cleanup EXIT
          if [ -n "${PHOTON_PROJECT_ID:-}" ] && [ -n "${PHOTON_PROJECT_SECRET:-}" ]; then
            secrets_file="$(mktemp)"
            node ../../scripts/photon-secrets-file.mjs "$secrets_file"
            pnpm exec wrangler deploy --secrets-file "$secrets_file"
          else
            echo "WARNING: PHOTON_PROJECT_ID and PHOTON_PROJECT_SECRET are not both set; the bridge stays unconfigured and idle."
            pnpm exec wrangler deploy
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Photon bridge deploy"
            echo ""
            echo "- Worker and container: \`$WORKER_NAME\`"
            echo "- No public route: reached only through the agent's service binding."
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
