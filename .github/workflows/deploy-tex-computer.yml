# Deploy Tex's computer: the Worker, its Durable Object and its container image.
# One sleeping Linux container per person or group chat, reached only through
# the gateway's service binding. See infra/tex-computer/README.md.
name: Deploy Tex Computer (production)

on:
  workflow_call:

concurrency:
  group: deploy-tex-computer-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  WORKER_NAME: context-tex-computer

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/tex-computer..." --frozen-lockfile
      - working-directory: infra/tex-computer
        run: pnpm typecheck
      - working-directory: infra/tex-computer
        run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: missing required production secret '$var'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Verify workflow and container config agree
        run: |
          set -euo pipefail
          config=infra/tex-computer/wrangler.jsonc
          grep -qE "^\s*\"name\"\s*:\s*\"$WORKER_NAME\"" "$config"
          grep -qE '"class_name"\s*:\s*"TexComputer"' "$config"
          test -f infra/tex-computer/Dockerfile

      # Wrangler uploads the Worker before it configures the container image, so
      # prove the token reaches Containers first.
      - name: Verify Cloudflare Containers permission
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/me" \
            -o /dev/null; then
            echo "ERROR: CLOUDFLARE_API_TOKEN needs Account > Containers > Edit for this account."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter "./infra/tex-computer..." --frozen-lockfile

      - name: Deploy container and Worker
        working-directory: infra/tex-computer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Summary
        if: always()
        run: |
          {
            echo "## Tex computer deploy"
            echo ""
            echo "- Worker and container: \`$WORKER_NAME\`"
            echo "- No public route: reached only through the gateway's service binding."
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
