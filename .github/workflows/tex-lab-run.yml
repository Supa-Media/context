# A Lab run on GitHub (Dev2, 2026-11-16: "Ok go ahead and build everything"; picked "Convex dispatches directly").
#
# Run Dev set, Run this chat and Run node in the Tex Lab (context.lc/lab), and tex_dev's `run`, record a run in
# Convex (apps/convex/functions/texLabRuns.ts), which dispatches this workflow at once. Jobs:
#
#   prep    main's code, with the deploy key: says the run is running, reads it, and resolves the code it runs on
#           (main, or the same-repository pull request or branch the draft names; Dev2, 2026-11-16: "when we run
#           things it should run on the PRs code instead of main"), and reports the commit to Convex.
#   lease   main's checkout, with the deploy key: takes one of the Lab runner slots (LAB_RUNNER_<N>_*, three grants of
#           the bench test account) for this run when one is connected and free; otherwise slot 0, the shared
#           benchmark runner, exactly as before slots. It never fails or blocks a run. scripts/lab-runner-lease.mjs;
#           the slot and attempt are its only outputs.
#   wait-turn  slot 0 only: waits for the shared runner's lock (scripts/bench-runner-lock.mjs), as before slots.
#   run     that commit's code, WITHOUT the deploy key (a branch's code never sees it, and cannot touch the job that
#           reports): writes the draft's graph into the config with that code's own promote check, and runs the Dev
#           set's unit tests with the bench's node-alone runner (`node apps/mcp/bench/run.mjs sets run`): never the
#           Training set, never the Test set (people only, in the eval service). Models "gw" asks the AI gateway as the
#           bench always does; "cc" answers every Claude call with Claude Code on CLAUDE_CODE_OAUTH_TOKEN
#           (apps/mcp/bench/socketAnswerer.mjs), and the token never leaves this job. Clef stays on Workers AI.
#           The spend check rotates the leased slot's refresh token. This job seals that token and does not write
#           the production secret: a secret in this job would be the branch's to read, because its install can change PATH.
#           The `world` input (replay by default) picks the simulated world's mode (`setsRun.mjs`, `simFixtures.mjs`): replay
#           answers its calls from the committed fixtures (the nearest answer for a reworded call), asks the model only
#           for a call nothing is near, and warns on each; record adds the misses on the repo's Training or Dev set;
#           refresh re-asks every call. Only the repo's own sets, never the Test set.
#   heal-ready   no secret, main's checkout: when the run ran main's code, uploads its world fixtures as `world-heal`
#                for tex-world-heal.yml to merge into main, so the next run replays them.
#   token-key    no checkout. An RSA key for this run. The private half is wrapped with the writer token and leaves
#                only as ciphertext. The run job does not need this job, so that output is not in the branch's hands.
#   publish-pub  the public half only. needs is not transitive, which is why this job exists.
#   write-token  main's checkout only, after the run: unwraps, checks the token's shape, and writes the leased slot's
#                production secret (LAB_RUNNER_<N>_REFRESH_TOKEN, N checked against 1-3), or on slot 0 the shared
#                BENCH_RUNNER_REFRESH_TOKEN_LIVE. An empty writer token or a
#                refused write fails the job.
#   report  main's code, with the deploy key: the results (cleaned again by Convex) or why it failed.
#   release main's code, with the deploy key, after write-token: frees the slot, so the next lease reads the new token.
#
# The run and its results pass between jobs as artifacts sealed with a key (a public repository's artifacts can be
# downloaded by anyone). The key is never passed between jobs: each step that seals or opens derives it from the run's
# id with HMAC-SHA256 keyed by the AI_GATEWAY_TOKEN secret, masks it, and holds it only in its own shell. Job outputs
# and step `env:` values are printed in the public log, which is why neither ever holds it
# (scripts/check-workflow-output-secrets.mjs). Artifacts are kept one day. The log is public: it names the run's id,
# conversation ids, the commit and counts, never a conversation's words.
name: Tex Lab run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The Lab run (its Convex id)"
        required: true
        type: string
      world:
        description: "The simulated world: replay answers from the committed fixtures and keeps what it had to ask (a miss is warned); record adds the misses on the repo's Training or Dev set; refresh re-asks every call. New answers come back as a pull request that merges itself"
        required: false
        default: replay
        type: choice
        options:
          - replay
          - record
          - refresh
      preview:
        description: "A pull request's preview (pr<N>, its number). Runs that pull request's code, replay only (record and refresh are refused), with one repeat per Front door test. Empty runs as before"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

run-name: Tex Lab run ${{ inputs.run_id }}

jobs:
  prep:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RUN_ID: ${{ inputs.run_id }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    outputs:
      models: ${{ steps.job.outputs.models }}
      node: ${{ steps.job.outputs.node }}
      set: ${{ steps.job.outputs.set }}
      repeats: ${{ steps.job.outputs.repeats }}
      sha: ${{ steps.code.outputs.sha }}
      why: ${{ steps.why.outputs.why }}
    steps:
      - name: The run id is a Convex id
        run: '[[ "$RUN_ID" =~ ^[a-z0-9]{16,40}$ ]] || { echo "::error::not a run id"; exit 1; }'

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A preview run is replay only: record and refresh call the models live and write fixtures. Empty preview is no check.
      - name: A preview run is replay only
        env:
          PREVIEW: ${{ inputs.preview }}
          WORLD: ${{ inputs.world }}
        run: |
          set -euo pipefail
          [ -z "$PREVIEW" ] && exit 0
          [[ "$PREVIEW" =~ ^pr[1-9][0-9]{0,6}$ ]] || { echo "::error::preview is pr<N>, the pull request's number"; exit 1; }
          [ "${WORLD:-replay}" = "replay" ] || { echo "::error::a preview run is replay only: record and refresh call the models live"; exit 1; }
          echo "Preview: $PREVIEW (replay only, one repeat)"

      - name: Say it is running
        run: |
          set -euo pipefail
          npx convex run functions/texLabRuns:report "$(jq -cn --arg id "$RUN_ID" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{runId: $id, stage: "running", ghRunUrl: $url}')" > /dev/null 2>&1

      - name: Read the run
        id: job
        env:
          LAB_SEAL_SOURCE: ${{ secrets.AI_GATEWAY_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          [ -n "${LAB_SEAL_SOURCE:-}" ] || { echo "::error::no AI_GATEWAY_TOKEN to derive the run's seal key from"; exit 1; }
          SEAL=$(printf '%s' "tex-lab-seal.$GITHUB_RUN_ID" | openssl dgst -sha256 -hmac "$LAB_SEAL_SOURCE" -r | cut -d' ' -f1)
          echo "::add-mask::$SEAL"
          export SEAL; unset LAB_SEAL_SOURCE
          npx convex run functions/texLabRuns:job "$(jq -cn --arg id "$RUN_ID" '{runId: $id}')" 2>/dev/null > "$RUNNER_TEMP/job.json"
          [ "$(jq -r 'type' "$RUNNER_TEMP/job.json")" = "object" ] || { echo "::error::no such run"; exit 1; }
          models=$(jq -r .models "$RUNNER_TEMP/job.json")
          node=$(jq -r '.nodeId // ""' "$RUNNER_TEMP/job.json")
          [[ "$models" =~ ^(gw|cc)$ ]] || { echo "::error::unknown models"; exit 1; }
          [[ -z "$node" || "$node" =~ ^[a-z][A-Za-z0-9_-]{0,30}$ ]] || { echo "::error::not a step id"; exit 1; }
          # The seal key is derived above, masked, never a job output or env: value (the public log prints both).
          set=$(jq -r '.set // "dev"' "$RUNNER_TEMP/job.json")
          [[ "$set" =~ ^(dev|training)$ ]] || { echo "::error::unknown set"; exit 1; }
          # Each Front door test runs this many times (1 to 5; a run from before repeats ran once, the default is 3).
          repeats=$(jq -r '.repeats // 3' "$RUNNER_TEMP/job.json")
          [[ "$repeats" =~ ^[1-5]$ ]] || { echo "::error::repeats is 1 to 5"; exit 1; }
          # A preview run repeats each Front door test once (the cap in texLabRuns.ts PREVIEW_REPEATS).
          if [ -n "$PREVIEW" ]; then repeats=1; fi
          mkdir -p "$RUNNER_TEMP/sealed"
          gzip -9c "$RUNNER_TEMP/job.json" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SEAL -out "$RUNNER_TEMP/sealed/job.bin"
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "set=$set" >> "$GITHUB_OUTPUT"
          echo "repeats=$repeats" >> "$GITHUB_OUTPUT"
          echo "Run: $(jq -c '{versionId, kind, convId, nodeId, models, code, repeats: (.repeats // 3)}' "$RUNNER_TEMP/job.json")"

      # Main, a same-repository pull request's head, or a branch here. A fork's pull request is refused: only code
      # someone with write access pushed to this repository runs with the run's model keys.
      - name: Find the code it runs on
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(jq -r '.code // ""' "$RUNNER_TEMP/job.json")
          say() { echo "$1" > "$RUNNER_TEMP/why"; echo "::error::$1"; exit 1; }
          if [ -z "$code" ]; then
            sha=$(git rev-parse HEAD)
            echo "Code: main at $sha"
          elif [[ "$code" =~ ^#([1-9][0-9]{0,6})$ ]]; then
            n="${BASH_REMATCH[1]}"
            curl -fsS -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$n" > "$RUNNER_TEMP/pr.json" || say "there is no pull request #$n in this repository"
            [ "$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pr.json")" = "$GITHUB_REPOSITORY" ] || say "pull request #$n is from a fork: only this repository's branches run"
            sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
            echo "Code: pull request #$n ($(jq -r .head.ref "$RUNNER_TEMP/pr.json")) at $sha"
          elif [[ "$code" =~ ^[A-Za-z0-9._/-]{1,120}$ && "$code" != -* && "$code" != *..* ]]; then
            sha=$(git ls-remote origin "refs/heads/$code" | cut -f1)
            [ -n "$sha" ] || say "there is no branch $code in this repository"
            echo "Code: branch $code at $sha"
          else
            say "not a pull request or branch: $code"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || say "the code's commit could not be read"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          npx convex run functions/texLabRuns:report "$(jq -cn --arg id "$RUN_ID" --arg sha "$sha" '{runId: $id, stage: "running", commit: $sha}')" > /dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: job
          path: ${{ runner.temp }}/sealed/job.bin
          retention-days: 1
          if-no-files-found: error

      - name: Why it stopped
        id: why
        if: failure()
        run: |
          why="the GitHub run failed before the tests: read its log"
          [ -s "$RUNNER_TEMP/why" ] && why="$(head -c 280 "$RUNNER_TEMP/why" | tr '\n' ' ')"
          echo "why=$why" >> "$GITHUB_OUTPUT"

  # Each slot is its own grant of the bench test account. A grant rotates its refresh token on every sign-in and
  # revokes itself when a retired one comes back, so a slot serves one run at a time. This job never blocks a run
  # (Dev2, 2026-11-19, after #3682 stopped every Lab run when no slot was connected): with no slot connected, none
  # free, or anything here failing, the slot is 0, the shared benchmark runner, and wait-turn takes its lock exactly
  # as before slots. Every step continues on error and the slot output defaults to 0.
  lease:
    name: Lease a Lab runner slot
    needs: prep
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      slot: ${{ steps.lease.outputs.slot || '0' }}
      attempt: ${{ steps.lease.outputs.attempt || github.run_attempt }}
      why: ${{ steps.why.outputs.why }}
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        continue-on-error: true

      - uses: actions/setup-node@v5
        continue-on-error: true
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Take a free Lab runner slot, or the shared runner
        id: lease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          LAB_RUNNER_1_CLIENT_ID: ${{ secrets.LAB_RUNNER_1_CLIENT_ID }}
          LAB_RUNNER_1_REFRESH_TOKEN: ${{ secrets.LAB_RUNNER_1_REFRESH_TOKEN }}
          LAB_RUNNER_2_CLIENT_ID: ${{ secrets.LAB_RUNNER_2_CLIENT_ID }}
          LAB_RUNNER_2_REFRESH_TOKEN: ${{ secrets.LAB_RUNNER_2_REFRESH_TOKEN }}
          LAB_RUNNER_3_CLIENT_ID: ${{ secrets.LAB_RUNNER_3_CLIENT_ID }}
          LAB_RUNNER_3_REFRESH_TOKEN: ${{ secrets.LAB_RUNNER_3_REFRESH_TOKEN }}
        run: node scripts/lab-runner-lease.mjs acquire

      - name: Why it stopped
        id: why
        if: failure()
        run: |
          why="the lease for a Lab runner slot failed: read its log"
          [ -s "$RUNNER_TEMP/why" ] && why="$(head -c 280 "$RUNNER_TEMP/why" | tr '\n' ' ')"
          echo "why=$why" >> "$GITHUB_OUTPUT"

  # Slot 0 only: the shared benchmark runner grant, which every runner workflow signs in with one at a time. Waits
  # until no earlier runner sign-in is still going, as before slots. The wait is its own job: the run job reads the
  # secret when it starts, after the earlier run has written the rotated token back. A leased slot skips this.
  wait-turn:
    name: Wait for earlier benchmark runs
    needs: lease
    if: needs.lease.outputs.slot == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Wait until no earlier run signs in as the benchmark runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --max-minutes 170

  # The private half never enters the run job. This job does not check out the draft.
  token-key:
    name: Make this run's seal key
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      public: ${{ steps.key.outputs.public }}
      wrapped: ${{ steps.key.outputs.wrapped }}
    steps:
      - name: Wrap a key the branch job cannot open
        id: key
        env:
          WRITER: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WRITER" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN to wrap this run's seal key"
          umask 077
          /usr/bin/openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/priv.pem"
          /usr/bin/openssl pkey -in "$RUNNER_TEMP/priv.pem" -pubout -out "$RUNNER_TEMP/pub.pem"
          export SEAL="$WRITER"
          /usr/bin/openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SEAL -in "$RUNNER_TEMP/priv.pem" -out "$RUNNER_TEMP/priv.enc"
          wrapped=$(/usr/bin/base64 -w0 "$RUNNER_TEMP/priv.enc")
          pub=$(/usr/bin/base64 -w0 "$RUNNER_TEMP/pub.pem")
          rm -f "$RUNNER_TEMP/priv.pem" "$RUNNER_TEMP/priv.enc" "$RUNNER_TEMP/pub.pem"
          {
            echo "wrapped<<EOF"
            echo "$wrapped"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "public=$pub" >> "$GITHUB_OUTPUT"
          echo "Seal key: RSA-2048, public ${#pub} characters. The private half is wrapped."

  # Forwards the public key and nothing else. The run job needs this job, not token-key.
  publish-pub:
    name: Hand on the seal's public key
    needs: token-key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ needs.token-key.outputs.public }}
    steps:
      - name: The public key is the only half this job keeps
        env:
          PUB: ${{ needs.token-key.outputs.public }}
        run: |
          set -euo pipefail
          [ -n "$PUB" ] || { echo "::error::no public key"; exit 1; }
          echo "Public key: ${#PUB} characters. The private half stays wrapped on the key job."

  run:
    needs: [prep, lease, wait-turn, publish-pub]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.lease.result == 'success' && needs.publish-pub.result == 'success' && (needs.wait-turn.result == 'success' || needs.wait-turn.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    # Each Front door test now runs REPEATS times (3 by default, at most 5; `repeats` in texLabRuns.ts), so the
    # Front door's share of a run grows by that much; 90 minutes was a single pass's room.
    timeout-minutes: 180
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_KEY_ALIASES: dev-claude-credits,dev2-claude-credits # aliases on the gateway's Provider Keys page, not secrets
      # The leased slot's grant only, or on slot 0 the shared benchmark runner's (behind wait-turn's lock), as before slots.
      BENCH_RUNNER_CLIENT_ID: ${{ needs.lease.outputs.slot == '0' && secrets.BENCH_RUNNER_CLIENT_ID || needs.lease.outputs.slot == '1' && secrets.LAB_RUNNER_1_CLIENT_ID || needs.lease.outputs.slot == '2' && secrets.LAB_RUNNER_2_CLIENT_ID || needs.lease.outputs.slot == '3' && secrets.LAB_RUNNER_3_CLIENT_ID || '' }}
      BENCH_RUNNER_REFRESH_TOKEN: ${{ needs.lease.outputs.slot == '0' && secrets.BENCH_RUNNER_REFRESH_TOKEN || '' }}
      BENCH_RUNNER_REFRESH_TOKEN_LIVE: ${{ needs.lease.outputs.slot == '0' && secrets.BENCH_RUNNER_REFRESH_TOKEN_LIVE || needs.lease.outputs.slot == '1' && secrets.LAB_RUNNER_1_REFRESH_TOKEN || needs.lease.outputs.slot == '2' && secrets.LAB_RUNNER_2_REFRESH_TOKEN || needs.lease.outputs.slot == '3' && secrets.LAB_RUNNER_3_REFRESH_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
    outputs:
      why: ${{ steps.why.outputs.why }}
      early: ${{ steps.seal-early.outputs.early }}
      final: ${{ steps.seal-final.outputs.final }}
    steps:
      # "Re-run failed jobs" keeps the lease of an earlier attempt, and that slot may now belong to another run. Slot 0
      # is checked by the shared runner's lock below instead, as before slots.
      - name: This attempt holds its Lab runner slot
        env:
          SLOT: ${{ needs.lease.outputs.slot }}
          LEASED_ATTEMPT: ${{ needs.lease.outputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$SLOT" =~ ^[0-3]$ ]] || { echo "::error::the lease gave no slot"; exit 1; }
          if [ "$SLOT" = "0" ]; then echo "The shared benchmark runner"; exit 0; fi
          [ "$LEASED_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" ] || { echo "::error::slot $SLOT was leased by attempt $LEASED_ATTEMPT; dispatch the run again"; exit 1; }
          echo "Lab runner slot $SLOT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prep.outputs.sha }}
          persist-credentials: false

      - name: This code can run Lab runs
        run: |
          [ -f scripts/tex-lab-run.mjs ] && [ -f apps/mcp/bench/setsRun.mjs ] && [ -f scripts/tex-lab-promote.mjs ] || {
            echo "this code is older than Lab runs: merge main into its branch" > "$RUNNER_TEMP/why"; exit 1; }
          echo "Commit: $(git rev-parse HEAD)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: job
          path: ${{ runner.temp }}/sealed

      - name: Refuse to sign in beside another benchmark run
        if: needs.lease.outputs.slot == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bench-runner-lock.mjs --check

      - name: Refuse a Dev set the spend cap does not allow
        run: pnpm --silent ai spend check dev-set --setups production

      # The spend check rotated the refresh token. Seal it before the long run. The writer job, on main's
      # checkout, opens it. This job does not hold the writer token: the branch's install can change PATH, and a
      # secret in a later step would be that install's to read. A retired token presented again revokes the grant,
      # so a failed seal is a failure, not a skip.
      - name: Seal the rotated token after sign-in
        id: seal-early
        if: always()
        env:
          PUB: ${{ needs.publish-pub.outputs.public }}
          DEST: ${{ runner.temp }}/bench-token-early.bin
          WHICH: early
        run: |
          set -euo pipefail
          echo "Sealing the refresh token after sign-in"
          f="$RUNNER_TEMP/bench-runner.json"
          if [ ! -f "$f" ]; then
            echo "${WHICH}=absent" >> "$GITHUB_OUTPUT"
            echo "No runner file after sign-in; nothing to seal"
            exit 0
          fi
          if [ -z "${PUB:-}" ]; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::no public key to seal the rotated token"
            exit 1
          fi
          if ! printf '%s' "$PUB" | /usr/bin/base64 -d > "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::the public key could not be read"
            exit 1
          fi
          if ! /usr/bin/python3 -c '
          import json, pathlib, subprocess, sys
          src, dest, pub = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(src).read_text())
          except Exception:
              sys.stderr.write("the runner file is not json\n")
              sys.exit(1)
          token = data.get("refreshToken") if isinstance(data, dict) else None
          if not isinstance(token, str) or token == "":
              sys.stderr.write("the runner file has no refresh token\n")
              sys.exit(1)
          plain = pathlib.Path(dest + ".plain")
          plain.write_bytes(token.encode())
          plain.chmod(0o600)
          result = subprocess.run(["/usr/bin/openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub, "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256", "-in", str(plain), "-out", dest], capture_output=True, text=True)
          plain.unlink(missing_ok=True)
          if result.returncode != 0:
              sys.stderr.write(result.stderr or "openssl could not seal the token\n")
              sys.exit(result.returncode or 1)
          print("Sealed", pathlib.Path(dest).stat().st_size, "bytes")
          ' "$f" "$DEST" "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not seal the rotated token after sign-in"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seal-pub.pem"
          echo "${WHICH}=present" >> "$GITHUB_OUTPUT"
          echo "Sealed the refresh token after sign-in"

      - name: Keep the seal from after sign-in
        # always(): a failed step before this one must not skip the upload (Lab run 44313860768 sealed the
        # final token, skipped this upload because the run had already failed, and the writer wrote nothing).
        if: always() && steps.seal-early.outputs.early == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: bench-token-early
          path: ${{ runner.temp }}/bench-token-early.bin
          retention-days: 1
          if-no-files-found: error

      # Refuses conversations whose people the bench has no world for: a run that can't run fails, it never scores 0.
      - name: The Dev conversations, and the draft's graph
        env:
          LAB_SEAL_SOURCE: ${{ secrets.AI_GATEWAY_TOKEN }}
          TEX_LAB_WHY: ${{ runner.temp }}/why
        run: |
          set -euo pipefail
          [ -n "${LAB_SEAL_SOURCE:-}" ] || { echo "::error::no AI_GATEWAY_TOKEN to derive the run's seal key from"; exit 1; }
          SEAL=$(printf '%s' "tex-lab-seal.$GITHUB_RUN_ID" | openssl dgst -sha256 -hmac "$LAB_SEAL_SOURCE" -r | cut -d' ' -f1)
          echo "::add-mask::$SEAL"
          export SEAL; unset LAB_SEAL_SOURCE
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SEAL -in "$RUNNER_TEMP/sealed/job.bin" | gunzip > "$RUNNER_TEMP/job.json"
          node scripts/tex-lab-run.mjs prepare "$RUNNER_TEMP/job.json" "$RUNNER_TEMP/lab"

      # This code's own promote check and write: a draft that could not become its config fails here with why.
      - name: Write the draft's graph into the config
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/lab/graph.json" ] || { echo "The code's own config as it is"; exit 0; }
          if ! why=$(node scripts/tex-lab-promote.mjs "$RUNNER_TEMP/lab/graph.json" 2>&1); then
            printf '%s\n' "$why" >&2
            refused=$(printf '%s\n' "$why" | sed -n 's/^tex-lab-promote: refused: //p')
            if [ -z "$refused" ]; then refused=$why; fi
            printf '%s' "$refused" | head -c 280 > "$RUNNER_TEMP/why"
            echo "::error::the draft could not become a config"
            exit 1
          fi
          git diff --stat

      - name: Claude Code has its token
        if: needs.prep.outputs.models == 'cc'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLAUDE_CODE_OAUTH_TOKEN="${CLAUDE_CODE_OAUTH_TOKEN//[[:space:]]/}"
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) echo "Claude Code token: ${#CLAUDE_CODE_OAUTH_TOKEN} characters" ;;
            *) echo "Claude Code needs CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) as a production secret" > "$RUNNER_TEMP/why"; echo "::error::no Claude Code token"; exit 1 ;;
          esac

      - name: Install Claude Code
        if: needs.prep.outputs.models == 'cc'
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Run the Dev set's unit tests
        env:
          MODELS: ${{ needs.prep.outputs.models }}
          NODE_ID: ${{ needs.prep.outputs.node }}
          SET: ${{ needs.prep.outputs.set }}
          REPEATS: ${{ needs.prep.outputs.repeats }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.prep.outputs.models == 'cc' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # The hold-out switch (`setsRun.mjs`): the repository variable set to "on" scores each Training conversation's
          # Front door tests without that conversation among the examples; anything else scores them in context.
          TEX_SETS_HOLD_OUT: ${{ vars.TEX_SETS_HOLD_OUT }}
          # Bench-only Unified Billing (`apps/mcp/bench/models.mjs` `benchUnifiedBilling`; Finance, 2026-11-18): the
          # repository variable set to "on" lets a gw run's Claude calls fall through to Cloudflare's Unified Billing
          # after the key aliases fail. Ignored from 2026-12-01T00:00Z. Production's payer order never reads it.
          TEX_BENCH_UNIFIED_BILLING: ${{ vars.TEX_BENCH_UNIFIED_BILLING }}
          # The simulated world's mode (`setsRun.mjs` --world): replay by default, record or refresh from the workflow's input.
          WORLD: ${{ inputs.world || 'replay' }}
        run: |
          set +e -uo pipefail
          [[ "$WORLD" =~ ^(replay|record|refresh)$ ]] || { echo "::error::unknown world mode"; exit 1; }
          answerer=""
          if [ "$MODELS" = "cc" ]; then
            export BENCH_MODEL_SOCKET="$RUNNER_TEMP/sock"
            mkdir -p "$BENCH_MODEL_SOCKET"
            node apps/mcp/bench/socketAnswerer.mjs --dir "$BENCH_MODEL_SOCKET" --stop "$RUNNER_TEMP/run-done" --parallel 8 > "$RUNNER_TEMP/answerer.log" 2>&1 &
            answerer=$!
            ( while kill -0 "$answerer" 2>/dev/null; do sleep 5; done; [ -f "$RUNNER_TEMP/run-done" ] || pkill -f "bench/run.mjs sets run" || true ) &
          fi
          started=$(date +%s%3N)
          # Replay runs the handed-in conversations and warns on each simulated call with no fixture (`--world-strict warn`).
          # Record and refresh run the set itself (`--set`, the Dev or Training set the prep step checked), since they write
          # fixtures and never run on a file handed in. 24 Front door tests at once inside this one job (`setsRun.mjs`; 8 at once took 12 minutes on 2026-11-26):
          # no more GitHub jobs, so CI keeps its runners.
          if [ "$WORLD" = "replay" ]; then
            scope=(--conversations "$RUNNER_TEMP/lab/convs.json" --world replay --world-strict warn)
          else
            scope=(--set "$SET" --world "$WORLD")
          fi
          args=(--out "$RUNNER_TEMP/lab/rows.json" --parallel 24 --repeat "${REPEATS:-3}" --keep "$RUNNER_TEMP/lab/kept")
          if [ -n "$NODE_ID" ]; then args+=(--node "$NODE_ID"); fi
          node apps/mcp/bench/run.mjs sets run "${scope[@]}" "${args[@]}"
          code=$?
          echo "$(( $(date +%s%3N) - started ))" > "$RUNNER_TEMP/lab/ms"
          # The answerer stops itself when a call fails three times, and the watchdog then ends the run. The regrade and
          # the gold self-check below ask the same answerer, so with it gone they would wait on the socket until the job's
          # timeout (2026-11-20: Lab run 44676114994 waited 1 h 43 m). Its last lines say which call failed and why.
          if [ -n "$answerer" ] && ! kill -0 "$answerer" 2>/dev/null; then
            echo "::error::the Claude Code answerer stopped before the run finished; its last lines:"
            tail -n 20 "$RUNNER_TEMP/answerer.log" || true
            exit 1
          fi
          # The grader's own noise (`apps/mcp/bench/regrade.mjs`; Dev2, 2026-11-19): on Claude Code ($0), a Training or Dev
          # run grades its kept Front door replies once more; a row whose grade flips is the grader, not Tex. Counts and
          # row ids only in the log; never on the sealed Test set; a regrade that fails never fails the run.
          if [ -n "$answerer" ] && [ "$SET" = "training" -o "$SET" = "dev" ] && [ -d "$RUNNER_TEMP/lab/kept" ]; then
            node apps/mcp/bench/run.mjs sets regrade --kept "$RUNNER_TEMP/lab/kept" --times 1 \
              || echo "::warning::the regrade did not finish; the run's grades stand"
          fi
          # The gold self-check (`apps/mcp/bench/setsGold.mjs`; Dev2, 2026-11-18, Dev 2026-11-19): a Training or Dev run on
          # Claude Code also judges each Front door label against the conversation's own gold reply, at $0 through the same
          # answerer. A Training label its own gold fails makes its row ambiguous; a Dev one's row could not run; a label
          # that needs an ability Tex lacks is impossible and could not run in both sets. Counts only here (a Dev report
          # prints no label or text); a failed check scores without it.
          if [ -n "$answerer" ] && [ "$SET" = "training" -o "$SET" = "dev" ] && [ -z "$NODE_ID" -o "$NODE_ID" = "fd" ]; then
            node apps/mcp/bench/setsGold.mjs --set "$SET" --conversations "$RUNNER_TEMP/lab/convs.json" --out "$RUNNER_TEMP/lab/gold.json" > /dev/null \
              && echo "Gold self-check: $(jq -c '{set, rows, goldFails: (.goldFails | length), impossible: (.impossible | length)}' "$RUNNER_TEMP/lab/gold.json")" \
              || { rm -f "$RUNNER_TEMP/lab/gold.json"; echo "::warning::the gold self-check did not finish; scored without it"; }
          fi
          if [ -n "$answerer" ]; then
            touch "$RUNNER_TEMP/run-done"
            wait "$answerer" || code=1
            # Hashes, models and the CLI's errors only, never a prompt or an answer.
            tail -n 20 "$RUNNER_TEMP/answerer.log"
          fi
          exit "$code"

      # The world's fixtures (`apps/mcp/bench/sets/sim/`) as the run left them: a replay adds the answers it had to ask
      # for (`simFixtures.mjs` saveRunFixtures), a record or refresh what it recorded. Bench data from the repo's own
      # Training and Dev conversations, never the sealed Test set; heal-ready and tex-world-heal.yml merge them into main.
      - name: Upload the run's world
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-fixtures
          path: apps/mcp/bench/sets/sim/
          retention-days: 7
          if-no-files-found: ignore

      - name: The results
        env:
          LAB_SEAL_SOURCE: ${{ secrets.AI_GATEWAY_TOKEN }}
          TEX_LAB_WHY: ${{ runner.temp }}/why
          # The results script labels a cc run "model family only" (texRunBand.cjs fidelityOf).
          TEX_LAB_MODELS: ${{ needs.prep.outputs.models }}
        run: |
          set -euo pipefail
          [ -n "${LAB_SEAL_SOURCE:-}" ] || { echo "::error::no AI_GATEWAY_TOKEN to derive the run's seal key from"; exit 1; }
          SEAL=$(printf '%s' "tex-lab-seal.$GITHUB_RUN_ID" | openssl dgst -sha256 -hmac "$LAB_SEAL_SOURCE" -r | cut -d' ' -f1)
          echo "::add-mask::$SEAL"
          export SEAL; unset LAB_SEAL_SOURCE
          node scripts/tex-lab-run.mjs results "$RUNNER_TEMP/lab/rows.json" "$(cat "$RUNNER_TEMP/lab/ms")" "$RUNNER_TEMP/lab/gold.json" > "$RUNNER_TEMP/results.json"
          echo "Results: $(jq -c '{pass, total, score, repeats, fidelity, couldNotRun: (.couldNotRun | length), ambiguous: (.ambiguous | length), goldFails, impossible, costUsd, ms, perNode, fallbacks, valid, worldMisses: .world.misses}' "$RUNNER_TEMP/results.json")"
          usd="$(jq -r '.costUsd // 0' "$RUNNER_TEMP/results.json")"
          if awk -v u="$usd" 'BEGIN { exit !(u + 0 >= 0.005) }'; then
            # Every repeat is an answer billed, so count the raw rows (one per repeat), not the scored total (one per test).
            pnpm --silent ai spend add dev-set --usd "$usd" --answers "$(jq 'length' "$RUNNER_TEMP/lab/rows.json")" --run "lab-${{ github.run_number }}" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          # A step whose tests all could not run is a failed run, with why, never a score of 0 (after the spend is kept).
          node scripts/tex-lab-run.mjs ran "$RUNNER_TEMP/lab/rows.json"
          mkdir -p "$RUNNER_TEMP/out"
          gzip -9c "$RUNNER_TEMP/results.json" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SEAL -out "$RUNNER_TEMP/out/results.bin"

      # spend add may have rotated the token again. Seal whatever the file holds now. The writer prefers this
      # seal over the one from sign-in, and refuses to store the older one if this seal fails.
      - name: Seal the rotated token after the run
        id: seal-final
        if: always()
        env:
          PUB: ${{ needs.publish-pub.outputs.public }}
          DEST: ${{ runner.temp }}/bench-token-final.bin
          WHICH: final
        run: |
          set -euo pipefail
          echo "Sealing the refresh token after the run"
          f="$RUNNER_TEMP/bench-runner.json"
          if [ ! -f "$f" ]; then
            echo "${WHICH}=absent" >> "$GITHUB_OUTPUT"
            echo "No runner file after the run; nothing to seal"
            exit 0
          fi
          if [ -z "${PUB:-}" ]; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::no public key to seal the rotated token"
            exit 1
          fi
          if ! printf '%s' "$PUB" | /usr/bin/base64 -d > "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::the public key could not be read"
            exit 1
          fi
          if ! /usr/bin/python3 -c '
          import json, pathlib, subprocess, sys
          src, dest, pub = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(src).read_text())
          except Exception:
              sys.stderr.write("the runner file is not json\n")
              sys.exit(1)
          token = data.get("refreshToken") if isinstance(data, dict) else None
          if not isinstance(token, str) or token == "":
              sys.stderr.write("the runner file has no refresh token\n")
              sys.exit(1)
          plain = pathlib.Path(dest + ".plain")
          plain.write_bytes(token.encode())
          plain.chmod(0o600)
          result = subprocess.run(["/usr/bin/openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", pub, "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256", "-pkeyopt", "rsa_mgf1_md:sha256", "-in", str(plain), "-out", dest], capture_output=True, text=True)
          plain.unlink(missing_ok=True)
          if result.returncode != 0:
              sys.stderr.write(result.stderr or "openssl could not seal the token\n")
              sys.exit(result.returncode or 1)
          print("Sealed", pathlib.Path(dest).stat().st_size, "bytes")
          ' "$f" "$DEST" "$RUNNER_TEMP/seal-pub.pem"; then
            echo "${WHICH}=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not seal the rotated token after the run"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seal-pub.pem"
          echo "${WHICH}=present" >> "$GITHUB_OUTPUT"
          echo "Sealed the refresh token after the run"

      - name: Keep the seal from the end of the run
        # always(): a failed step before this one must not skip the upload (Lab run 44313860768 sealed the
        # final token, skipped this upload because the run had already failed, and the writer wrote nothing).
        if: always() && steps.seal-final.outputs.final == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: bench-token-final
          path: ${{ runner.temp }}/bench-token-final.bin
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ${{ runner.temp }}/out/results.bin
          retention-days: 1
          if-no-files-found: error

      - name: Why it stopped
        id: why
        if: failure()
        run: |
          why="the GitHub run failed: read its log"
          [ -s "$RUNNER_TEMP/why" ] && why="$(head -c 280 "$RUNNER_TEMP/why" | tr '\n' ' ')"
          echo "why=$why" >> "$GITHUB_OUTPUT"

  # Main's checkout only. Opens the seal and writes the leased slot's production secret. Runs after the run job even
  # when that job failed, because a sign-in that already rotated the token still has to be stored.
  write-token:
    name: Write the rotated refresh token
    needs: [token-key, lease, run]
    if: always() && needs.lease.result == 'success' && (needs.run.outputs.early == 'present' || needs.run.outputs.early == 'failed' || needs.run.outputs.final == 'present' || needs.run.outputs.final == 'failed')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: The writer token is set
        env:
          GH_TOKEN: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN"

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # Both seals, each when its job said it exists, and neither may fail the job: the write below prefers the
      # final seal only when its file is here, and otherwise falls back to the one from after sign-in.
      - name: The seal from the end of the run
        if: needs.run.outputs.final == 'present'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-token-final
          path: ${{ runner.temp }}/final

      - name: The seal from after sign-in
        if: always() && needs.run.outputs.early == 'present'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-token-early
          path: ${{ runner.temp }}/early

      - name: Open the seal and write the production secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BENCH_SECRET_WRITER_TOKEN }}
          WRAPPED: ${{ needs.token-key.outputs.wrapped }}
          SLOT: ${{ needs.lease.outputs.slot }}
          LEASED_ATTEMPT: ${{ needs.lease.outputs.attempt }}
          EARLY: ${{ needs.run.outputs.early }}
          FINAL: ${{ needs.run.outputs.final }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/priv.pem" "$RUNNER_TEMP/priv.enc" "$RUNNER_TEMP/refresh-token"' EXIT
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BENCH_SECRET_WRITER_TOKEN is empty"
            exit 1
          fi
          echo "Using secret BENCH_SECRET_WRITER_TOKEN"
          # The slot is checked before any secret name is built from it. Slot 0 is the shared runner's, as before slots.
          if [[ ! "$SLOT" =~ ^[0-3]$ ]]; then
            echo "::error::no Lab runner slot to write"
            exit 1
          fi
          if [ "$SLOT" = "0" ]; then name=BENCH_RUNNER_REFRESH_TOKEN_LIVE; else name="LAB_RUNNER_${SLOT}_REFRESH_TOKEN"; fi
          # "Re-run failed jobs" would write an earlier attempt's token after its slot was freed and leased again,
          # over the newer holder's token, and the next sign-in would revoke that grant.
          if [ "$SLOT" != "0" ] && [ "$LEASED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::slot $SLOT was leased by attempt $LEASED_ATTEMPT and has been freed; not writing an older token"
            exit 1
          fi
          if [ "$FINAL" = "failed" ]; then
            echo "::error::the last seal failed; not writing an older token"
            exit 1
          fi
          final="$RUNNER_TEMP/final/bench-token-final.bin"
          early="$RUNNER_TEMP/early/bench-token-early.bin"
          if [ "$FINAL" = "present" ] && [ -s "$final" ]; then
            cipher="$final"
            echo "Using the seal from the end of the run"
          elif [ "$EARLY" = "failed" ]; then
            echo "::error::the seal after sign-in failed"
            exit 1
          elif [ "$EARLY" = "present" ] && [ -s "$early" ]; then
            cipher="$early"
            if [ "$FINAL" = "present" ]; then
              echo "::warning::the seal from the end of the run is missing or empty; using the seal from after sign-in"
            else
              echo "Using the seal from after sign-in; the run ended before the last seal"
            fi
          elif [ "$FINAL" = "present" ] || [ "$EARLY" = "present" ]; then
            echo "::error::the sealed token file is missing"
            exit 1
          else
            echo "::error::no sealed token to write"
            exit 1
          fi
          if [ ! -s "$cipher" ]; then
            echo "::error::the sealed token file is missing"
            exit 1
          fi
          if [ -z "$WRAPPED" ]; then
            echo "::error::this run has no wrapped seal key"
            exit 1
          fi
          umask 077
          printf '%s' "$WRAPPED" | /usr/bin/base64 -d > "$RUNNER_TEMP/priv.enc"
          export SEAL="$GH_TOKEN"
          /usr/bin/openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:SEAL -in "$RUNNER_TEMP/priv.enc" -out "$RUNNER_TEMP/priv.pem"
          node scripts/bench-token-open.mjs --private "$RUNNER_TEMP/priv.pem" --cipher "$cipher" --out "$RUNNER_TEMP/refresh-token"
          mask=$(/usr/bin/python3 -c 'import pathlib,sys; sys.stdout.write(pathlib.Path(sys.argv[1]).read_text())' "$RUNNER_TEMP/refresh-token")
          echo "::add-mask::$mask"
          unset mask
          echo "Writing $name to the production environment"
          # `gh secret set` has no `--body-file`. That flag exits 1 before the API call, so the rotated
          # token is never stored and the next sign-in revokes the grant. The value is stdin.
          # bench-token-open.mjs writes the token with no trailing newline; gh strips only trailing CR/LF
          # from stdin, and a refresh token has neither, so the stored secret equals the token.
          if [ "$SLOT" = "0" ]; then
            gh secret set BENCH_RUNNER_REFRESH_TOKEN_LIVE --env production --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/refresh-token" || { echo "::error::BENCH_SECRET_WRITER_TOKEN could not write $name"; exit 1; }
          else
            gh secret set "LAB_RUNNER_${SLOT}_REFRESH_TOKEN" --env production --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/refresh-token" || { echo "::error::BENCH_SECRET_WRITER_TOKEN could not write $name"; exit 1; }
          fi
          echo "Wrote $name"

  report:
    needs: [prep, lease, run]
    if: always()
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      RUN_ID: ${{ inputs.run_id }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: The run id is a Convex id
        run: '[[ "$RUN_ID" =~ ^[a-z0-9]{16,40}$ ]] || { echo "::error::not a run id"; exit 1; }'

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        if: needs.run.result == 'success'
        with:
          name: results
          path: ${{ runner.temp }}/sealed

      # What the run job hands back is that code's to write: Convex keeps only counts, ids and short verdicts.
      - name: Report the results, or why it failed
        env:
          RAN: ${{ needs.run.result }}
          LAB_SEAL_SOURCE: ${{ secrets.AI_GATEWAY_TOKEN }}
          RUN_WHY: ${{ needs.run.outputs.why }}
          PREP_WHY: ${{ needs.prep.outputs.why }}
          LEASE_WHY: ${{ needs.lease.outputs.why }}
        run: |
          set -euo pipefail
          if [ "$RAN" = "success" ] && [ -s "$RUNNER_TEMP/sealed/results.bin" ]; then
            # Derived only here, so a missing secret still reaches the failure report below.
            [ -n "${LAB_SEAL_SOURCE:-}" ] || { echo "::error::no AI_GATEWAY_TOKEN to derive the run's seal key from"; exit 1; }
            SEAL=$(printf '%s' "tex-lab-seal.$GITHUB_RUN_ID" | openssl dgst -sha256 -hmac "$LAB_SEAL_SOURCE" -r | cut -d' ' -f1)
            echo "::add-mask::$SEAL"
            export SEAL; unset LAB_SEAL_SOURCE
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SEAL -in "$RUNNER_TEMP/sealed/results.bin" | gunzip > "$RUNNER_TEMP/results.json"
            jq -e 'type == "object"' "$RUNNER_TEMP/results.json" > /dev/null
            report=$(jq -cn --arg id "$RUN_ID" --slurpfile r "$RUNNER_TEMP/results.json" '{runId: $id, stage: "done", results: $r[0]}')
            # One argument is at most 128 KiB on Linux, and a bigger one never starts (exit 126: the Training set's run
            # of 2026-11-26 stayed "running" for good). Each cut is tried only while the report is still too big: the
            # misses' detail shortened, then dropped, then only the misses kept.
            for cut in '.results.rows |= map(if .detail then .detail |= .[0:500] else . end)' '.results.rows |= map(del(.detail))' '.results.rows |= map(select(.ok != true))'; do
              [ "$(printf '%s' "$report" | wc -c)" -le 120000 ] && break
              report=$(jq -c "$cut" <<< "$report")
            done
            if npx convex run functions/texLabRuns:report "$report" > /dev/null 2>&1; then exit 0; fi
            RUN_WHY="the run finished but its results could not be reported ($(printf '%s' "$report" | wc -c) bytes)"
          fi
          why="${RUN_WHY:-${PREP_WHY:-${LEASE_WHY:-the GitHub run failed: read its log}}}"
          [ "$RAN" = "cancelled" ] && why="the GitHub run was cancelled"
          npx convex run functions/texLabRuns:report "$(jq -cn --arg id "$RUN_ID" --arg why "$why" '{runId: $id, stage: "failed", error: $why}')" > /dev/null 2>&1

  # Frees the leased slot once write-token has stored its token, so the next lease of that slot signs in with the
  # new one. Skipped when no slot was leased.
  release:
    name: Free the Lab runner slot
    needs: [lease, write-token, report]
    if: always() && needs.lease.outputs.slot != '' && needs.lease.outputs.slot != '0'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Free the slot
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: node scripts/lab-runner-lease.mjs release


  # Self-healing world (owner, 2026-11-19): when the run ran main's code, its world fixtures go up again as
  # `world-heal`, which `tex-world-heal.yml` merges into main as a pull request that merges itself. A branch's run could
  # hand back any file, so its answers wait for a replay on main. No secret here; main's checkout and git only.
  heal-ready:
    needs: [prep, run]
    if: ${{ always() && needs.run.result != 'cancelled' && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: The run ran main's code
        id: main
        env:
          SHA: ${{ needs.prep.outputs.sha }}
        run: |
          if [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$SHA" HEAD; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "The run's code is not on main; its world answers are not kept"; fi

      - uses: actions/download-artifact@v4
        if: steps.main.outputs.ok == 'true'
        continue-on-error: true
        with:
          name: world-fixtures
          path: ${{ runner.temp }}/world-in/

      - uses: actions/upload-artifact@v4
        if: steps.main.outputs.ok == 'true'
        with:
          name: world-heal
          path: ${{ runner.temp }}/world-in/
          retention-days: 7
          if-no-files-found: ignore
