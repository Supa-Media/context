# The pull request's required check for the replay gate's model half
# (docs/decisions/testing/replay-gate.md; scripts/tex-replay-required.mjs).
# Holds no secret: it reads which model areas the change reaches (by its
# files, and by its prompts: every area's prompts are built free on main and on
# the change, and one that differs by a byte is reached) and, when
# any, passes only on a successful "Tex replay" status on the head commit,
# which the dispatched "Tex replay" run sets, then re-runs this.

name: Tex replay required

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  statuses: read
  # Only to start "Tex replay" on this branch when the rule fails (the last step); this workflow holds no secret.
  actions: write

concurrency:
  group: tex-replay-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Tex replay passed on this commit
    runs-on: ubuntu-latest
    # The prompt fingerprints install and run both trees: about four minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No pnpm cache: most runs install nothing, and when the lockfile changed
      # the cache misses, so the post-job save finds no store and fails the job
      # ("Path Validation Error") although the rule passed.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: The rule's own self-test
        run: node scripts/tex-replay-required.mjs --self-test

      # Every area's prompts built on main and on the change, with no model and no key
      # (apps/mcp/bench/promptFingerprint.mjs): an area whose prompts differ by a byte is
      # reached, whatever file changed. Only a change to code that can build a prompt runs it.
      - name: Prompt fingerprints, main against the change
        id: prints
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          areas=""
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/mcp/|apps/agent/|packages/)'; then
            pnpm install --frozen-lockfile
            git worktree add "$RUNNER_TEMP/main" "$BASE_SHA"
            (cd "$RUNNER_TEMP/main" && pnpm install --frozen-lockfile)
            node apps/mcp/bench/run.mjs gate fingerprint --base-tree "$RUNNER_TEMP/main" > "$RUNNER_TEMP/changed.txt" 2> "$RUNNER_TEMP/prints.txt" || { cat "$RUNNER_TEMP/prints.txt"; exit 1; }
            areas="$(paste -sd, "$RUNNER_TEMP/changed.txt")"
            { echo "### Prompt fingerprints"; grep -E '^(- |Prompt)' "$RUNNER_TEMP/prints.txt" || true; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "areas=$areas" >> "$GITHUB_OUTPUT"

      - name: The replay gate's model half passed, or the change reaches no model area
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT_AREAS: ${{ steps.prints.outputs.areas }}
          # Read by the owner's temporary skip only (SKIP_LINE in the script); passed through env, never into a shell line.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/tex-replay-required.mjs

      # Dev2, 2026-11-15: the replay starts the moment this check goes red, instead of waiting for an hourly examiner.
      # "Tex replay" runs main's workflow file on this branch with Claude Code answering on the subscription
      # (apps/mcp/bench/socketAnswerer.mjs), marks the commit, and re-runs this check. Started once a commit: only when
      # the head has no "Tex replay" status yet, or only the one asking for the token. Never for a fork, whose token
      # cannot start a workflow and whose code must not reach production's secrets.
      - name: Start Tex replay on this branch
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" --jq '[.[] | select(.context == "Tex replay")][0].description // ""')"
          if [ -n "$latest" ] && [[ "$latest" != Needs\ CLAUDE_CODE_OAUTH_TOKEN* ]]; then
            echo "Tex replay already ran or is running on this commit: $latest"
            exit 0
          fi
          gh workflow run tex-replay.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f claude_code=true
          echo "Started Tex replay (Claude Code) on $HEAD_REF; it re-runs this check when it ends." | tee -a "$GITHUB_STEP_SUMMARY"
