# The pull request's required check for Tex's gate, the Test Set
# (docs/decisions/testing/test-set-service.md; scripts/tex-replay-required.mjs).
# Holds no secret: it reads which model areas the change reaches (by its
# files, and by its prompts: every area's prompts are built free on main and on
# the change, and one that differs by a byte is reached) and, when
# any, passes only on a successful "Tex test set" status on the head commit,
# which main's "Tex test set" run sets, then re-runs this.
#
# The Test Set starts before the fingerprints when the files themselves reach
# a model area (scripts/tex-test-set-dispatch.mjs --early), so it runs beside
# the other checks instead of after this one has already failed. A reach that
# only the fingerprints can see still starts when the gate fails. Not `edited`:
# pr-description.yml re-runs this only when the owner's skip line changed, and
# the gate reads the live description.

name: Tex replay required

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: read
  pull-requests: read
  # Only to start "Tex test set" on main when this change needs it; this workflow holds no secret.
  actions: write

concurrency:
  group: tex-replay-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Tex replay passed on this commit
    runs-on: ubuntu-latest
    # The prompt fingerprints install and run both trees: about four minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No cache on setup-node. Most runs install nothing, and a cache whose
      # post step runs anyway fails the job with "Path Validation Error" when
      # the store was never created, after the rule had already passed. The
      # fingerprint step below caches the store only when it is about to install.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: The rule's own self-test
        run: |
          node scripts/tex-replay-required.mjs --self-test
          node scripts/tex-test-set-dispatch.mjs --self-test

      # Files that reach a model area start the Test Set now, before the
      # fingerprints. The gate below is unchanged: it still passes only on a
      # successful status. A fork's code never starts it.
      - name: Start the Tex test set when this change's files reach a model area
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/tex-test-set-dispatch.mjs --early

      # The same diff the fingerprint step installs for. The cache runs only
      # then, so a change that builds no prompt never creates a store and
      # never fails the post-cache step.
      - name: Does this change reach code that builds a prompt?
        id: reach
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/mcp/|apps/agent/|packages/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pnpm store path
        id: store
        if: steps.reach.outputs.code == 'true'
        run: |
          path="$(pnpm store path)"
          mkdir -p "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        if: steps.reach.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # Every area's prompts built on main and on the change, with no model and no key
      # (apps/mcp/bench/promptFingerprint.mjs): an area whose prompts differ by a byte is
      # reached, whatever file changed. Only a change to code that can build a prompt runs it.
      - name: Prompt fingerprints, main against the change
        id: prints
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          areas=""
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/mcp/|apps/agent/|packages/)'; then
            pnpm install --frozen-lockfile
            git worktree add "$RUNNER_TEMP/main" "$BASE_SHA"
            (cd "$RUNNER_TEMP/main" && pnpm install --frozen-lockfile)
            node apps/mcp/bench/run.mjs gate fingerprint --base-tree "$RUNNER_TEMP/main" > "$RUNNER_TEMP/changed.txt" 2> "$RUNNER_TEMP/prints.txt" || { cat "$RUNNER_TEMP/prints.txt"; exit 1; }
            areas="$(paste -sd, "$RUNNER_TEMP/changed.txt")"
            { echo "### Prompt fingerprints"; grep -E '^(- |Prompt)' "$RUNNER_TEMP/prints.txt" || true; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "areas=$areas" >> "$GITHUB_OUTPUT"

      - name: The replay gate's model half passed, or the change reaches no model area
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT_AREAS: ${{ steps.prints.outputs.areas }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Fallback when the live read fails. A re-run keeps the original event body, so the live one wins.
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "${PR_NUMBER:-}" ]; then
            PR_BODY="$(node scripts/pr-description.mjs --print-body)"
            export PR_BODY
          fi
          node scripts/tex-replay-required.mjs

      # A reach the files did not name (the prompts changed) still starts here,
      # once, and only when the gate failed for want of a run. File areas were
      # started above, before the fingerprints. Never for a fork.
      - name: Start the Tex test set for a prompt-only reach
        if: failure() && steps.gate.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          FINGERPRINT_AREAS: ${{ steps.prints.outputs.areas }}
        run: node scripts/tex-test-set-dispatch.mjs --prompts
