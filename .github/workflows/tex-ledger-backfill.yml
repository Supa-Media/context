# Copy every person's old Tex chat into their chat's ledger, for the chats that
# have not texted since the ledger began (Dev, 2026-11-02;
# `docs/decisions/texting-assistant/chat-ledger.md`, "Retiring the old copies").
#
# Manual only. Run it with `dry_run` first: that counts what would be copied and
# changes nothing. It pages through `functions/texLedgerBackfill:run`, which
# answers with counts and a cursor, never a path, a key or a word: this
# repository is public, and so is this job's log. Running it again copies
# nothing already in, and nothing in a bucket is deleted.
#
# `scope` picks what runs: `chats` (each person's one-to-one chat,
# `texLedgerBackfill:run`), `groups` (each group chat's old log,
# `texLedgerBackfillGroups:run`), or `transcripts` (the old daily transcript
# folders moved to the trash once their chat is whole in its ledger,
# restorable for 30 days; `texTranscriptsTrash:run`), or `group_pages` (each
# group chat's memory page copied into its ledger, its history file made, and
# the page moved to the trash once the ledger holds it; `texGroupPagesRetire:run`),
# or `group_pages_without_log` (the same, for a chat whose old log is in no
# place searched: its page goes in without it; Dev, 2026-11-03).
name: Tex chats into their ledger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to copy in."
        type: choice
        options:
          - staging
          - production
        default: staging
      scope:
        description: "What to run."
        type: choice
        options:
          - chats
          - groups
          - transcripts
          - group_pages
          - group_pages_without_log
        default: chats
      dry_run:
        description: "Count only; change nothing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Copy chats in
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          extra='{}'
          case "$SCOPE" in
            chats) fn=functions/texLedgerBackfill:run ;;
            groups) fn=functions/texLedgerBackfillGroups:run ;;
            transcripts) fn=functions/texTranscriptsTrash:run ;;
            group_pages) fn=functions/texGroupPagesRetire:run ;;
            # A page whose chat's old log is nowhere goes in without it (Dev's decision, 2026-11-03).
            group_pages_without_log) fn=functions/texGroupPagesRetire:run; extra='{"withoutLog":true}' ;;
            *) echo "unknown scope"; exit 1 ;;
          esac
          cursor=""
          page=0
          total='{}'
          while :; do
            page=$((page + 1))
            if [ -z "$cursor" ]; then
              args=$(jq -cn --argjson dry "$DRY_RUN" --argjson extra "$extra" '{dryRun: $dry} + $extra')
            else
              args=$(jq -cn --argjson dry "$DRY_RUN" --arg cursor "$cursor" --argjson extra "$extra" '{dryRun: $dry, cursor: $cursor} + $extra')
            fi
            # stderr is dropped: `convex run` prints the function's own log lines there, and a failure logs a
            # workspace id, which this public log must not show (`scripts/check-convex-run-stderr.mjs`).
            answer=$(npx convex run "$fn" "$args" 2>/dev/null)
            echo "page $page: $(echo "$answer" | jq -c 'del(.cursor)')"
            total=$(jq -cn --argjson a "$total" --argjson b "$(echo "$answer" | jq -c '(.failedCodes // {} | with_entries(.key |= "failed_" + .)) + del(.cursor, .done, .failedCodes)')" '$a + ($b | to_entries | map({key, value: (.value + ($a[.key] // 0))}) | from_entries)')
            if [ "$(echo "$answer" | jq -r 'if .done == null then true else .done end')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 4000 ]; then echo "stopped after $page pages"; exit 1; fi
          done
          echo "total: $total"
