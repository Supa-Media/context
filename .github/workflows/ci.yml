name: CI
# No `branches:` filter on pull_request, and no `paths:` filter — see mcp.yml
# for the whole argument. A base-branch filter means a pull request stacked on
# another branch runs no checks at all, which is how #169 merged with zero check
# runs, and this is the workflow that carries the mobile, convex and shared
# suites. Widening costs nothing in exposure: a pull request from a fork gets no
# secrets on any base branch, so `secrets: inherit` below inherits an empty set
# there, exactly as it already did for forks targeting `main`.
# The `push:` filter stays on `main`. `merge_group` is the merge queue's trial commit (docs/decisions/testing/ci-pipelines.md).
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# A newer push to a pull request supersedes the run for the older commit, so
# that run is cancelled rather than holding runners (a free account gets 20
# at once). Pushes to main are each kept: the group is the commit there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event.merge_group.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Supa-Media/supa-framework/.github/workflows/ci.yml@main
    with:
      app-slug: "context"
      strictness: "standard"
      # `ci / Lint` reported "skipping" on every PR for months. Nothing was
      # filtered out by paths — the reusable workflow's lint job is guarded only
      # by `if: inputs.lint-command != ''`, and this caller never passed one, so
      # the job could not run at all. A check that is green because it did not
      # execute is the failure this project keeps meeting.
      lint-command: "pnpm --filter @context/mobile lint"
      # And the second half of the same trap: `lint-continue-on-error` defaults
      # to **true** upstream, so even once the job runs, a lint failure would be
      # reported as a pass. It must block.
      lint-continue-on-error: false
      # `eslint .` in apps/mobile reads only the app, its config and what the
      # lockfile installs, which is exactly the `mobile` list below. A pull
      # request outside it (docs, the gateway, Convex) skips the install and
      # the minute of lint; pushes to main always lint.
      lint-filter: mobile
      # `shared-package` is deliberately NOT passed, and the skip it produces
      # is the reason this comment exists. Upstream's `Test Shared Package`
      # job is gated on `inputs.shared-package != ''`, with no fallback — so
      # without it that check reports `skipped` on every pull request,
      # including one whose `Detect Changes` step prints `Filter shared =
      # true`. It looks exactly like the forty legitimate change-scoped skips
      # beside it. (`Test Convex Backend` is not gated this way: it falls back
      # to `cd apps/convex && pnpm test`, which is why that one runs.)
      #
      # It is unset because `@context/shared` has no `test` script. Its
      # behaviour is covered from `apps/convex/__tests__` — `websiteMetadata`,
      # `devlog`, `websiteRoutes` and the rest — and the `convex` filter names
      # `packages/shared/**`, so a shared change does run those suites.
      # Passing the input today would run `pnpm --filter @context/shared test`
      # and go red; a `--passWithNoTests` script to keep it green would turn a
      # visible skip into an invisible one, which is worse than either.
      #
      # `scripts/check-ci-shared-tests.mjs` holds the pair together, so this
      # is a checked fact rather than a comment: a `test` script in that
      # package now requires the input, and the input requires a package that
      # has one.
      # `ci / Architecture check`: no handwritten file over 1,000 lines, and
      # the legacy allowance in `architecture.config.json` only shrinks. On a
      # pull request it compares against the base branch, so a PR cannot pass
      # by raising its own allowance, renaming a big file, or adding an
      # exclusion. `pnpm architecture` runs the same check locally.
      architecture-check: true
      # The Convex suite is the longest job on main: six runners each take a
      # time-balanced share (--shard=i/6, apps/convex/.test-timings.json);
      # `ci / Test Summary` still fails if any shard does.
      convex-test-shards: 6
      # On a pull request, run only the Convex tests the change reaches: main
      # records which files each test used, and `scripts/convex-tests.mjs`
      # picks from that map (docs/decisions/testing/convex-test-impact.md).
      # Main still runs the whole suite, and production requires it green.
      convex-test-map: "apps/convex/.test-map"
      # `convex typecheck` runs in convex-deploy-typecheck below, in parallel;
      # upstream's copy sat in front of shard 1's tests and made it the
      # slowest check (173s against 94-106s for the other shards).
      convex-typecheck: false
      # The mobile suite (737 files) took 2m45 on one runner once the Convex
      # one was split. Three shards left shard 1 at about 78 seconds of tests
      # (measured 2026-11-17, p50) against 42 and 57 for the other two. Six is
      # the most the reusable workflow's matrix allows. Each shard appends
      # --shard=i/n, which `pnpm run test` forwards to jest and the bare
      # `pnpm test` shorthand would refuse.
      mobile-test-shards: 6
      mobile-test-command: "pnpm run test"
      # The upstream filters, with `convex` widened to everything the
      # control-plane suite reads outside apps/convex: the gateway, the
      # packages and Workers it imports or scans, the few mobile files it
      # mirrors, deploy-convex.yml (deployEnv.test.ts parses it; a change
      # there turned main red unseen on 2026-10-07 because nothing re-ran
      # the suite), and the install inputs. Until 2026-10-07 both workflows ran the identical suite on
      # most pushes, about a fifth of all runner minutes. Now it runs once,
      # here, under the required `ci / Test Summary`, and Gateway Contracts
      # keeps only its detector. `scripts/check-ci-path-gates.mjs` holds the
      # two lists together.
      # A pull request of only Tex config and data skips the app, Convex and
      # lint jobs: the Tex suites and test set prove it. Must equal TEX_DATA in
      # scripts/ci-change-scope.mjs (its self-test checks).
      skip-when-only: |
        packages/tex/src/texConfig.json
        packages/tex/src/texNodeShelf.json
        packages/tex/src/texPrompt/**
        packages/tex/src/texTraining.generated.json
        packages/lab/src/texSetsRepo.generated.json
        apps/mcp/bench/sets/**
        packages/tex/gateway/agent/texArchitecture.generated.js
        packages/lab/gateway/texDev/canvas.generated.js
        packages/lab/gateway/texDev/lab.generated.js
        packages/lab/gateway/texDev/replay.generated.js
        packages/lab/app/labData.generated.ts
        packages/lab/app/promptCatalog.generated.json
        docs/architecture/tex.md
      change-filters: |
        shared:
          - 'packages/shared/**'
          - 'packages/tex/**'
          - 'packages/lab/**'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'tsconfig.json'
          - 'pnpm-workspace.yaml'
        mobile:
          - 'apps/mobile/**'
          - 'packages/shared/**'
          - 'packages/tex/**'
          - 'packages/lab/**'
          - 'package.json'
          - 'pnpm-lock.yaml'
          - 'tsconfig.json'
          - 'pnpm-workspace.yaml'
          # How the mobile job runs is set here, so a change to it runs it.
          - '.github/workflows/ci.yml'
          # editorBundle/mapBundle tests read the rebuild job there.
          - '.github/workflows/editor-bundle.yml'
          # Everything apps/mobile reads or imports outside the app, and what
          # those imports import: PR #3740 changed ledger.js, which a mobile
          # test reads, skipped this suite and turned main red (#3745).
          # `node scripts/check-mobile-outside-reads.mjs --filter` prints what
          # is missing; Fast repository guards fails until it is here.
          - '.github/workflows/**'
          - '.github/workflows/deploy-mobile-native.yml'
          - 'packages/tex/worker/stepEvents.ts'
          - 'apps/agent/wrangler.jsonc'
