    secrets: inherit

  # ── THE BRIDGE BETWEEN THE ONE UI AND THE SHELL ──────────────────────────
  #
  # `packages/desktop-bridge` is what `apps/mobile` asks and `apps/desktop`
  # answers once the Expo app is the UI on macOS too (docs/decisions/desktop.md).
  # It has no npm dependencies and its suite runs on bare node, so it gets a job
  # here rather than an install: the same shape as `Test Gateway` and
  # `Test Meetings Core` in mcp.yml, and for the same reason those exist —
  # a package whose only CI is somebody's laptop has none.
  #
  # The second step is the guard the decision document asks for by name:
  # **apps/mcp imports nothing from packages/desktop-bridge**. It runs in
  # mcp.yml too, and is repeated here because that is where somebody adding to
  # this package will look, and because the rule it enforces was widened in the
  # same pull request that created the package. A relative import into a
  # sibling package passed the older "relative only" rule; three self-test cases
  # now say it does not.
  desktop-bridge:
    name: Test Desktop Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # See mcp.yml: setup-node would shell out to pnpm to find its cache
          # directory, and this job deliberately never installs pnpm.
          package-manager-cache: false

      # No `pnpm install`. If this ever needs one, an npm dependency crept into
      # the bridge and that is the thing to fix.
      - name: Run test suite
        working-directory: packages/desktop-bridge
        run: node --experimental-strip-types test/test.mjs

      - name: The gateway imports none of it
        run: |
          node scripts/check-gateway-imports.mjs --self-test
          # js-tiktoken: the usage tokenizer, in its one file (docs/decisions/observability/token-usage.md).
          node scripts/check-gateway-imports.mjs --allow-import=js-tiktoken/lite:src/mcp/tokens.js --allow-import=js-tiktoken/ranks/o200k_base:src/mcp/tokens.js apps/mcp/src

      # Every step on Tex's reply path is a named, timed call (`packages/tex/gateway/agent/texTiming.js`).
      - name: Nothing joins Tex's reply path untimed
        run: |
          node scripts/tex-entry-check.mjs --self-test
          node scripts/tex-entry-check.mjs

      # The mirror of the check above: the gateway imports none of the desktop
      # bridge, and the control plane imports plenty of the gateway — so its
      # deploy has to notice when any of that changes. It stopped noticing, for
      # six source trees, and nothing said so; see the script's header.
      - name: Releases require staging, deploy what changed, and cover everything Convex bundles
        run: |
          node --test scripts/production-release.test.mjs
          node --test scripts/promote-production.test.mjs
          node --test scripts/github-rate-limit.test.mjs
          node --test scripts/convex-tests.test.mjs
          node --test scripts/deploy-plan.test.mjs
          node --test scripts/worker-secrets.test.mjs
          node --test scripts/email-worker-binding.test.mjs
          node --test scripts/photon-secrets-file.test.mjs
          node --test scripts/sendblue-status-url.test.mjs
          node --test scripts/ci-performance-report.test.mjs
          # The per-pull-request previews: their guards, config, and teardown (seed and smoke import convex, which this job does not install).
          node --test packages/sandbox/src/cleanup.test.mjs packages/sandbox/src/teardown.test.mjs packages/sandbox/src/config.test.mjs packages/sandbox/src/convex-env.test.mjs packages/sandbox/src/guards.test.mjs packages/sandbox/src/sign-in-code.test.mjs
          node --test scripts/mcp-speed-budgets.test.mjs
          node --test scripts/tex-speed-budgets.test.mjs
          node scripts/check-speed-budget.mjs --self-test
          node --test scripts/release-communication-evidence.test.mjs
          node --test scripts/tex-alert.test.mjs
          node --test scripts/agent-logs-filter.test.mjs
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/devlog-draft.test.mjs scripts/devlog-sync.test.mjs
          node scripts/check-convex-deploy-paths.mjs --self-test
          node scripts/check-convex-deploy-paths.mjs

  # ── THE APP HAS TO START, NOT JUST TYPECHECK AND PACKAGE ─────────────────
  #
  # #329 merged with 24 green checks and a temporal dead zone in
  # `apps/desktop/src/main/index.ts`: an `onChange` handler wired above
  # `const controller` called a function that reads `controller`, so every
  # launch threw `ReferenceError: Cannot access 'controller' before
  # initialization` — through a promise, so it surfaced as an unhandled
  # rejection rather than a stack trace at the call site. Nothing in THIS
  # file would have caught it; `apps/desktop`'s own `test.mjs` and `tsc
  # --noEmit` both stayed green, because neither one starts the process.
  # `test/launch.smoke.mjs` does — see docs/decisions/desktop.md, "A release
  # is a build that started" — and it already existed, wired into
  # `deploy-desktop.yml`. The defect still reached `main`, because that
  # workflow is `workflow_dispatch` only: the gate spoke hours later, on a
  # release dispatch, against a commit two pull requests removed from the one
  # that broke it. This job is the fix for THAT gap — the same check, run
  # where a defect can still be stopped rather than merely dated.
  #
  # ## Why a macOS runner, on pull requests, and this is affordable
  #
  # `context` is public (CLAUDE.md, "This repository is public and MIT
  # licensed"), and GitHub does not meter Actions minutes on a public
  # repository's hosted runners by OS or otherwise — a macOS runner here
  # costs no more in billing than `ubuntu-latest` costs `desktop-bridge`
  # above. What a macOS runner actually spends is queue time against a
  # smaller concurrency pool than Linux gets, and the way to keep that cheap
  # is to run it only where it can find something: gated by path, exactly
  # like `editor-webkit` below gates on `apps/mobile/**`. A run that does
  # apply is short — `pnpm install --filter "@context/desktop..."`, a build,
  # then the same `--smoke` launch `deploy-desktop.yml` runs, with no
  # certificate, no notarisation and no `.dmg` — nothing like that job's
  # 45-minute budget.
  #
  # So: on a pull request, this runs only when the diff touches
  # `apps/desktop` itself, one of its four runtime workspace packages, or the
  # MCP/collaboration packages its tool-contract test imports. These are the
  # dependency edges declared by `apps/desktop/package.json`, rather than
  # `packages/**` wholesale: `packages/shared` is not one of them, and gating
  # on all packages would run this on every unrelated package change. This uses
  # the same in-job change detection as `editor-webkit`, for the same reason (a
  # `paths:` filter on the trigger would leave an unrelated pull request with
  # no report at all, pending forever on a required check). On a push to
  # `main` it always runs, ungated — a merge is the moment this incident
  # actually happened, pushes to `main` are one per merge rather than one per
  # commit, and a change reaching `main` through something this path list did
  # not anticipate (a workspace-root dependency bump, a fifth package this
  # app starts depending on) still gets caught within minutes rather than at
  # the next release dispatch.
  #
  # ## What still is not covered
  #
  # `deploy-desktop.yml`'s own launch step is untouched — signed, notarised,
  # packaged, Gatekeeper-checked, and still the only thing that gates a
  # published release. This job runs the *unpackaged* dev bundle
  # (`dist/main/index.cjs`, `pnpm --filter @context/desktop smoke` with no
  # `--app`), so it cannot see a packaging-only defect (an asar path, an
  # Info.plist icon, code signing) — only a defect in the module graph or
  # `main()` itself, which is exactly what #329's was and exactly what nothing
  # before this job ran on a pull request at all. The two gates are
  # deliberately not merged into one: this one is meant to be cheap and fast
  # enough to run on every relevant pull request, and the release gate is
  # meant to prove the exact bits about to ship. Neither replaces the other.
  # The two macOS jobs below decide here, on Linux, whether they have anything
  # to do. The org has only a handful of macOS runners, and asking for one just
  # to run a path filter left every pull request and merge waiting for one: on
  # 2026-11-17 both jobs sat 19-22 minutes without a runner and were cancelled.
  # A job skipped by its `if:` still reports success to a required check, so
  # nothing is left pending; the filters themselves are unchanged.
  #
  # It also says whether the change is nothing but Tex config and data
  # (scripts/ci-change-scope.mjs TEX_DATA), which the Tex suites and test set
  # prove, so the Mac jobs skip it too (Dev2, 2026-11-17). A push to `main`
  # never counts as one.
  macos-scope:
    name: Which checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
      extension: ${{ steps.changes.outputs.extension }}
      tex-data-only: ${{ steps.tex.outputs.only }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Is this only Tex config and data?
        uses: ./.github/actions/ci-scope
        id: tex
        with:
          mode: tex-data-only

      - name: Does this touch the desktop app or the Messages extension?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            desktop:
              - "apps/desktop/**"
              - "packages/desktop-bridge/**"
              - "plugins/context/**"
              - "packages/communications/**"
              - "packages/meetings/**"
              - "apps/mcp/**"
              - "packages/collaboration/**"
              - ".github/workflows/ci.yml"
            extension:
              - "apps/mobile/targets/context-messages/**"
              - "apps/mobile/plugins/with-context-messages.js"
              - ".github/workflows/ci.yml"

  desktop-launch-smoke:
    name: The desktop app launches
    needs: macos-scope
    if: github.event_name == 'push' || (needs.macos-scope.outputs.desktop == 'true' && needs.macos-scope.outputs.tex-data-only != 'true')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The job's `if:` runs it on every push to `main`, ungated; see the
      # comment above this job for why a merge gets no path filter and a pull
      # request does.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Scoped to the app and its declared runtime and test dependencies, same
      # as `deploy-desktop.yml`'s install. The rest of the workspace is not
      # this job's business.
      - name: Install
        run: pnpm install --filter "@context/desktop..." --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        run: pnpm run build

      # The same check `deploy-desktop.yml` runs against the packaged app,
      # here against the unpackaged dev bundle it builds above — see the
      # header comment for what that does and does not cover.
      #
      # The failure has to name the app's own error, not just an exit code:
      # that is the entire lesson of tonight's incident, where the gate that
      # did exist spoke only "the release build failed" hours after the fact
      # and pointed at a commit two pull requests removed from the one that
      # broke it. `test/launch.smoke.mjs` already prints a PASS/FAIL line per
      # check and the app's full captured output on any failure (both reach
      # this step's own log); the `::error::` annotation below additionally
      # pulls out one line for the job summary and the check-run title, so the
      # reason is visible without opening the log at all.
      #
      # Ordered on purpose, most specific first — proven against a real run of
      # this exact job (#329's dead zone, still open on `main` as this was
      # written): `main/index.ts`'s own `uncaughtException`/`unhandledRejection`
      # handlers print `[smoke] uncaught exception: <message>` or
      # `[smoke] unhandled rejection: <message>` before exiting, and that
      # message — e.g. `ReferenceError: Cannot access 'controller' before
      # initialization` — is the one sentence an on-call person actually needs.
      # The first attempt at this grepped `FAIL |Error:|Exception` with no
      # ordering and surfaced `FAIL  IT EXITS ZERO — exit code 1` instead on
      # that exact run, because the checker's own FAIL line for that symptom
      # sits earlier in the output than the JS error it was caused by — true,
      # but not the answer. Falling back to a `FAIL` line, then to the crash
      # strings `launch.smoke.mjs` itself greps for, only reads as "nothing
      # more specific was in the log" when none of the app's own error text
      # was captured at all.
      - name: Launch the app it just built (smoke test)
        id: smoke
        working-directory: apps/desktop
        run: |
          set +e
          pnpm run smoke 2>&1 | tee "$RUNNER_TEMP/desktop-smoke.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            reason="$(grep -m1 -E 'uncaught exception:|unhandled rejection:' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            if [ -z "$reason" ]; then
              reason="$(grep -m1 -E 'Dynamic require of|Uncaught Exception|A JavaScript error occurred|App threw an error during load' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            fi
            if [ -z "$reason" ]; then
              reason="$(grep -m1 -E '^FAIL ' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            fi
            if [ -z "$reason" ]; then
              reason="exited $status with no recognisable error line — see the full log above"
            fi
            echo "::error::apps/desktop failed to launch: ${reason}"
          fi
          exit "$status"

  # ── THE MONITOR HAS TO BE ABLE TO GO RED ────────────────────────────────
  #
  # `gateway-health.yml` probes production on a schedule, so nothing about it
  # runs on a pull request — which would leave the assertions it is made of
  # unchecked until the next tick, and a probe whose assertions have quietly
  # stopped matching anything reports a healthy service forever. That is this
  # repository's most-repeated failure shape, and it is worse in a monitor than
  # anywhere else: the thing that is supposed to tell you the endpoint is down
  # is the last thing anybody looks at while it is green.
  #
  # So the self-test runs here, on every pull request, and asserts the opposite
  # of what the monitor asserts: that fifteen sabotaged responses — an
  # unreachable host, a 200 serving an error page, PKCE dropped from the
  # metadata, an unauthenticated 200 from the MCP route — each still produce a
  # problem. No network, no credential, nothing to install.
  # ── THE BUNDLE THAT SHIPS TO A PHONE IS NOT THE ONE CI WAS BUILDING ─────
  #
  # Everything above resolves modules for node (jest) or for a browser (the
  # web export, the WebKit suite). A phone is a third resolver: Metro picks the
  # `react-native` export condition, and a dependency can have an entry point
  # there that exists on npm and cannot be resolved in this tree.
  #
  # That is not hypothetical. Live co-editing put Yjs in the console, Yjs
  # reaches Web Crypto through `lib0/webcrypto`, and lib0's `react-native`
  # condition requires `isomorphic-webcrypto/src/react-native` — a package
  # nothing here depends on. Every pull request was green. Every OTA deploy
  # after the merge failed at `expo export`, for four merges, because the only
  # thing that builds a native bundle ran *after* the merge button.
  #
  # So the deploy's own export runs here, before merging, for both platforms.
  # It is the same command `build-mobile-ota.yml` runs, minus the publish:
  # no EAS credential, no Expo account, nothing sent anywhere. Roughly two
  # minutes, and it is the only check in this repository that can see a native
  # resolution failure at all.
  #
  # `--dump-assetmap` and `--source-maps` are deliberately left off: this job
  # asks whether the bundle *builds*, and the deploy asks for the rest.
  native-bundle:
    name: The native bundle still builds (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One platform per runner: the two exports share nothing but the install,
    # and one runner doing both took ~104s of a ~137s job (2026-10-07).
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v5

      # Inside the job as a step, never a `paths:` filter on the trigger —
      # see `browser.yml` and `scripts/check-workflow-triggers.mjs`.
      - name: Does this touch the app or what it bundles?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile: ["apps/mobile/**", "apps/convex/**", "packages/collaboration/**", "packages/communications/**", "packages/desktop-bridge/**", "packages/drawings/**", "packages/meetings/**", "packages/obsidian-runtime/**", "packages/shared/**", "packages/tex/**", "packages/lab/**", ".npmrc", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "patches/**", ".github/workflows/ci.yml"]

      # A diff of only Tex config and data is proven by the Tex suites and
      # test set, not by the app (scripts/ci-change-scope.mjs TEX_DATA).
      - name: Is this only Tex config and data?
        uses: ./.github/actions/ci-scope
        id: tex
        with:
          mode: tex-data-only

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        run: pnpm install --frozen-lockfile

      # A syntactically valid, deliberately unreachable host, as `editor-webkit`
      # uses: nothing in an export dials out, and a missing one would fail the
      # build for a reason that is not the one this job is asking about.
      # Metro's transform cache from an earlier run of this job (2026-10-07).
      # Metro keys every entry on the file's content and the transform config,
      # and re-reads EXPO_PUBLIC_ values per export (checked: a warm export
      # with a different EXPO_PUBLIC_CONVEX_URL carried the new value), so a
      # warm export produces byte-identical output to a cold one (diffed) —
      # measured 110s cold against 19s warm. The lockfile is in the key so a
      # dependency change starts cold; each run saves under its own commit.
      - name: Restore Metro's cache
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/metro-cache
          key: metro-native-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            metro-native-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Export the ${{ matrix.platform }} bundle
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_CONVEX_URL: "https://native-bundle-check.invalid"
        run: pnpm exec expo export --platform "${{ matrix.platform }}" --output-dir "$RUNNER_TEMP/native-bundle"

  # The app's own `tsc`. Without it a Convex function's return shape could
  # change under a screen that still read the old one: #2116 cut
  # `nodesMigration.report` rows to four fields while the staff Search tab
  # still switched on `stage`, and the tab threw in production (#2367). Jest
  # strips types, so no test saw it. Needs about 3 GB of heap.
  mobile-typecheck:
    name: The app typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The same filter as the native bundle: what the app's types reach.
      - name: Does this touch the app or what it types against?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile: ["apps/mobile/**", "apps/convex/**", "packages/collaboration/**", "packages/communications/**", "packages/desktop-bridge/**", "packages/drawings/**", "packages/meetings/**", "packages/obsidian-runtime/**", "packages/shared/**", "packages/tex/**", "packages/lab/**", ".npmrc", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "patches/**", ".github/workflows/ci.yml"]

      # A diff of only Tex config and data is proven by the Tex suites and
      # test set, not by the app (scripts/ci-change-scope.mjs TEX_DATA).
      - name: Is this only Tex config and data?
        uses: ./.github/actions/ci-scope
        id: tex
        with:
          mode: tex-data-only

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        run: pnpm install --frozen-lockfile

      # tsc --incremental (apps/mobile/tsconfig.json) rechecks only files whose
      # content changed. The build info stores content hashes, so a restored
      # info skips unchanged files, and a changed file is always checked again:
      # a stale cache cannot let a wrong file pass.
      - name: Restore the app typecheck
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        uses: actions/cache@v4
        with:
          path: apps/mobile/.tsbuildinfo
          key: app-typecheck-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            app-typecheck-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/tsconfig.json') }}-

      - name: Typecheck the app
        if: steps.changes.outputs.mobile == 'true' && steps.tex.outputs.only != 'true'
        working-directory: apps/mobile
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck

  # The Convex deploy's own `tsc` reads gateway JSDoc through fileOps.ts; the package
  # `tsc` does not, so a stranded `@param` block once passed PR CI and broke staging.
  convex-deploy-typecheck:
    name: The Convex deploy typecheck passes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ci-scope
        id: scope
        with:
          packages: "@context/convex"
          # On main, diff against the commit this push replaced. A merge that
          # does not touch this list skips the minute of tsc. An unavailable
          # base fails open and runs it. The Convex suite on main is still the
          # backstop for the tests.
          push-diff: "true"
          # packages/** too: Convex reaches packages/communications and
          # packages/meetings by relative path, not as declared dependencies,
          # and this is now the only place the deploy typecheck runs.
          # The gateway files Convex reaches, as in the convex filter above;
          # check-ci-path-gates.mjs holds both lists to the same derivation.
          paths: |
            apps/mcp/src/activity/**
            packages/tex/gateway/agent/agentHomeMove.js
            packages/tex/gateway/agent/chatTime.js
            packages/tex/gateway/agent/conversation.js
            packages/tex/gateway/agent/dayWords.js
            packages/tex/gateway/agent/events.js
            packages/tex/gateway/agent/groupPageCopy.js
            packages/tex/gateway/agent/groupPageFormat.js
            packages/tex/gateway/agent/history.js
            packages/tex/gateway/agent/historyFile.js
            packages/tex/gateway/agent/ledger.js
            packages/tex/gateway/agent/ledgerBackfill.js
            packages/tex/gateway/agent/ledgerConversation.js
            packages/tex/gateway/agent/localNow.js
            packages/tex/gateway/agent/log.js
            packages/tex/gateway/agent/logRender.js
            packages/tex/gateway/agent/sentOnItsOwn.js
            packages/tex/gateway/agent/sources.js
            packages/tex/gateway/agent/textingPhone.js
            packages/tex/gateway/agent/threadsFold.js
            apps/mcp/src/chaos/**
            apps/mcp/src/communications/**
            apps/mcp/src/context/**
            apps/mcp/src/controlPlane.js
            apps/mcp/src/controlPlane/**
            apps/mcp/src/crypto/**
            apps/mcp/src/encryption.js
            apps/mcp/src/encryption/**
            apps/mcp/src/forms.js
            apps/mcp/src/forms/**
            apps/mcp/src/forwarding.js
            apps/mcp/src/history/**
            apps/mcp/src/http/**
            apps/mcp/src/ingestion/inbox.js
            apps/mcp/src/labSandbox/**
            apps/mcp/src/links.js
            apps/mcp/src/lists.js
            apps/mcp/src/lists/**
            apps/mcp/src/live/**
            apps/mcp/src/mcp/**
            apps/mcp/src/moves/**
            apps/mcp/src/notes/**
            apps/mcp/src/objectPlace.js
            apps/mcp/src/observability/**
            apps/mcp/src/orient/**
            apps/mcp/src/plugins/**
            apps/mcp/src/presence.js
            apps/mcp/src/privacy/**
            apps/mcp/src/search/**
            apps/mcp/src/session.js
            apps/mcp/src/sessionPayload.js
            apps/mcp/src/sessionStore.js
            apps/mcp/src/storageLayout.js
            apps/mcp/src/store/**
            packages/tex/gateway/texStore/**
            apps/mcp/src/tools/approvalKeys.js
            apps/mcp/src/tools/emailRead.js
            apps/mcp/src/tools/etagPlace.js
            apps/mcp/src/tools/fileParts.js
            apps/mcp/src/tools/googleAiAccess.js
            apps/mcp/src/tools/pdfLinks.js
            apps/mcp/src/tools/readFile.js
            apps/mcp/src/tools/moves/archive.js
            apps/mcp/src/tools/moves/destination.js
            apps/mcp/src/tools/moves/folder.js
            apps/mcp/src/tools/moves/note.js
            apps/mcp/src/tools/moves/notes.js
            apps/mcp/src/tools/moves/objectMove.js
            apps/mcp/src/tools/v2/actions.js
            apps/mcp/src/tools/moves/queuedFolder.js
            apps/mcp/src/tools/moves/references.js
            apps/mcp/src/tools/pathAddress.js
            apps/mcp/src/tools/notes/write.js
            apps/mcp/src/tools/readImage.js
            apps/mcp/src/tools/results.js
            apps/mcp/src/tools/search.js
            apps/mcp/src/tools/visibility.js
            apps/mcp/src/tree/**
            apps/mcp/src/vault/**
            apps/mcp/src/workspacePath.js
            apps/mcp/src/workspaceStore/**
            apps/mcp/test/attachmentsCore.test.mjs
            packages/**
            .github/workflows/ci.yml

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.affected == 'true'

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.affected == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.affected == 'true'
        run: pnpm install --frozen-lockfile

      # tsc --incremental (apps/convex/tsconfig.json) rechecks files whose
      # content changed. The checkout's mtimes are new; the build info stores
      # content hashes, so a restored info still skips unchanged files.
      - name: Restore the Convex typecheck
        if: steps.scope.outputs.affected == 'true'
        uses: actions/cache@v4
        with:
          path: apps/convex/.tsbuildinfo
          key: convex-typecheck-${{ hashFiles('pnpm-lock.yaml', 'apps/convex/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            convex-typecheck-${{ hashFiles('pnpm-lock.yaml', 'apps/convex/tsconfig.json') }}-

      - name: Typecheck what the Convex deploy would push
        if: steps.scope.outputs.affected == 'true'
        run: pnpm exec convex typecheck

  # The Messages extension (`apps/mobile/targets/context-messages`) is built
  # only by a native release, which is a separate, hand-run step; a Swift
  # mistake would otherwise first show up there, after the change merged.
  # This type-checks it against the iOS SDK on every pull request that
  # touches it, without building the app.
  messages-extension:
    name: The Messages extension compiles
    needs: macos-scope
    if: needs.macos-scope.outputs.extension == 'true' && needs.macos-scope.outputs.tex-data-only != 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Type-check the extension against the iOS SDK
        working-directory: apps/mobile/targets/context-messages
        run: |
          deployment=$(sed -n 's/.*IPHONEOS_DEPLOYMENT_TARGET = "\([0-9.]*\)".*/\1/p' ../../plugins/with-context-messages.js)
          xcrun --sdk iphoneos swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target "arm64-apple-ios${deployment}" \
            -swift-version 5 \
            *.swift

      - name: Compile the Messages icon catalog
        run: |
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          xcrun actool apps/mobile/targets/context-messages/Assets.xcassets \
            --compile "$output" --platform iphoneos --minimum-deployment-target 16.1 \
            --target-device iphone --target-device ipad --app-icon "iMessage App Icon" \
            --product-type com.apple.product-type.app-extension.messages \
            --output-partial-info-plist "$output/Info.plist"
