name: CI

# No `branches:` filter on pull_request, and no `paths:` filter — see mcp.yml
# for the whole argument. A base-branch filter means a pull request stacked on
# another branch runs no checks at all, which is how #169 merged with zero check
# runs, and this is the workflow that carries the mobile, convex and shared
# suites. Widening costs nothing in exposure: a pull request from a fork gets no
# secrets on any base branch, so `secrets: inherit` below inherits an empty set
# there, exactly as it already did for forks targeting `main`.
# The `push:` filter stays on `main`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: Supa-Media/supa-framework/.github/workflows/ci.yml@main
    with:
      app-slug: "context"
      strictness: "standard"
      # `ci / Lint` reported "skipping" on every PR for months. Nothing was
      # filtered out by paths — the reusable workflow's lint job is guarded only
      # by `if: inputs.lint-command != ''`, and this caller never passed one, so
      # the job could not run at all. A check that is green because it did not
      # execute is the failure this project keeps meeting.
      lint-command: "pnpm --filter @context/mobile lint"
      # And the second half of the same trap: `lint-continue-on-error` defaults
      # to **true** upstream, so even once the job runs, a lint failure would be
      # reported as a pass. It must block.
      lint-continue-on-error: false
      # `ci / Architecture check`: no handwritten file over 1,000 lines, and
      # the legacy allowance in `architecture.config.json` only shrinks. On a
      # pull request it compares against the base branch, so a PR cannot pass
      # by raising its own allowance, renaming a big file, or adding an
      # exclusion. `pnpm architecture` runs the same check locally.
      architecture-check: true
    secrets: inherit

  # ── THE THREE PLACES A SECRET IS NAMED MUST AGREE ────────────────────────
  #
  # A secret is named in `.env.example` (what local dev injects), in
  # `scripts/secrets-allowlist.json` (what the 1Password sync copies into
  # GitHub), and in a workflow as `secrets.NAME` (what a deploy reads). Nothing
  # checked that those matched until now, and both directions failed silently:
  # `ADMIN_EMAILS` was read by the control plane, set by hand, and synced by
  # nothing, so a rebuild of the GitHub environment would have dropped it.
  #
  # It also refuses a `.env.example` that reads a production credential. Every
  # reference in that file said `/production` until 2026-09-05, which put the
  # live `STORAGE_SECRET_ENCRYPTION_KEY` — the key that opens every customer's
  # storage credential — on the laptop of anyone who ran `pnpm setup:secrets`.
  #
  # No install: the checker is plain Node over files in this repo, like
  # `check-gateway-imports.mjs`. It cannot see the 1Password vault and does not
  # pretend to — that is what the sync workflow's dry-run is for.
  secrets-wiring:
    name: Secret wiring is consistent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # The self-test first, so a checker whose regexes silently match nothing
      # fails here rather than passing every repository it is pointed at.
      - name: The checker catches what it claims to
        run: node scripts/check-secrets-allowlist.mjs --self-test

      - name: Staging targets cannot select production
        run: node --test scripts/staging-config.test.mjs

      - name: Every secret is named in the same three places
        run: node scripts/check-secrets-allowlist.mjs

      # Same discipline, a different failure shape: an account identifier
      # (Apple Developer Team ID, EAS project id, Convex deployment hostname)
      # committed in plaintext rather than a secret going un-synced — and, on
      # the same scan and for the same reason, a numbered pointer into a
      # document this repository does not contain, which is a disclosure with
      # no identifier in it. (Phrased around the noun on purpose: the rule
      # matches that noun, and a comment about the rule is the first thing it
      # ever caught.) See
      # scripts/check-no-identifiers.mjs's own header for what shipped, what
      # recurred twice, and what this scan still cannot reach.
      - name: The identifier checker catches what it claims to
        run: node scripts/check-no-identifiers.mjs --self-test

      - name: No account identifier or private-register pointer is committed
        run: node scripts/check-no-identifiers.mjs

      # ── NON-NEGOTIABLE #1 NOW HAS A TEST INSTEAD OF A COMMENT ─────────────
      #
      # `billing.ts` forbids the class of code that would gate the exit — "What
      # this file may never grow: a function that consults the plan to decide
      # whether somebody may export, download, or hand over their bucket." That
      # is a prohibition on code nobody has written yet, and prose cannot fail a
      # build.
      #
      # The guard checks the stronger property: not that the exit ignores
      # billing state, but that billing state never reaches it. The two files
      # that serve every export — `/gateway/session`, which resolves the token
      # each read runs under, and `/gateway/binding`, which opens the storage
      # the bytes come from — must not have a plan in scope to read.
      - name: The exit checker catches a gate
        run: node scripts/check-exit-is-ungated.mjs --self-test

      - name: The exit is never gated on what somebody has paid
        run: node scripts/check-exit-is-ungated.mjs

  # ── THE COMMITTED EDITOR BUNDLE IS CHECKED HERE AND NOWHERE ELSE ──────────
  #
  # `apps/mobile/features/console/files/webview/bundle.generated.ts` is ~500kb
  # of minified CodeMirror that ships to a phone and runs against somebody's
  # private note. `__tests__/editorBundle.test.ts` opens with "THE COMMITTED
  # BUNDLE IS THE CODE IN THIS REPOSITORY" and does not check that: it hashes
  # the bundle's *inputs* — the six repo sources and the twenty package versions
  # — and asserts a handful of shapes about the output (it starts `"use
  # strict";(()=>{`, it is over 100kb, it contains no `eval(`). Measured: a
  # `navigator.sendBeacon` snippet appended to the `EDITOR_BUNDLE` string passed
  # that suite, `webviewHost.test.ts`, and all 2,459 mobile tests, because no
  # source file was touched and nothing in the payload needs `eval`.
  #
  # The only guard that closes it is rebuilding and comparing, and that belongs
  # here rather than in Jest for the reason the generator's own header gives:
  # esbuild is deliberately not a dependency of `apps/mobile`, and adding a
  # bundler to a React Native app's dependency tree to run one assertion is a
  # worse trade than a job. It is also a fact about this job that it can only be
  # written because the build IS reproducible — verified byte-identical on a
  # clean tree before this was added. If that ever stops being true, this job
  # goes red and says so, which is the right direction to fail in.
  editor-bundle:
    name: The committed editor bundle is what its sources build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The whole workspace: esbuild reaches this script through the repo root,
      # where `convex` already installs it, and the generator records the
      # resolved version of every package it bundles — so a partial install
      # would rebuild against different code than the commit was built from.
      - name: Install
        run: pnpm install --frozen-lockfile

      # What this binds, and what it does not. A hand-edited blob is caught:
      # the rebuild does not reproduce it. A compromised *dependency* is not —
      # it rebuilds to the same bytes and this job goes green. That is npm's
      # threat model rather than this one, and saying so here stops the job
      # reading as a broader promise than it is.
      #
      # `esbuild` is a root transitive of `convex` and deliberately not a
      # bundle input, so a root lockfile bump changes the minified output and
      # turns this red — with a message whose second branch reads "contains
      # code that is not in this repository". That is the wrong sentence for
      # that cause; the honest fix is to record esbuild's resolved version in
      # the generated header so the failure can name itself.
      - name: Rebuild the bundle from its sources
        run: node scripts/build-editor-bundle.mjs

      - name: It must be byte-for-byte what is committed
        run: |
          set -euo pipefail
          file=apps/mobile/features/console/files/webview/bundle.generated.ts
          if git diff --quiet -- "$file"; then
            echo "OK — the committed bundle is exactly what its sources build."
            exit 0
          fi
          echo "ERROR: $file is not what its sources build."
          echo ""
          echo "Either somebody edited a source and did not re-run the generator"
          echo "— in which case run \`node scripts/build-editor-bundle.mjs\` and"
          echo "commit the result — or the committed bundle contains code that"
          echo "is not in this repository, which is the case this job exists for."
          echo ""
          # The bundle is one enormous line, so a real diff is unreadable and
          # would print the injected code into a public log as the only record
          # of it. The stat says the file moved; the artifact below is what a
          # reviewer actually reads.
          git diff --stat -- "$file"
          exit 1

      # Uploaded only on failure, and only the rebuilt file: a reviewer needs to
      # compare it against the commit to see what was added, and scrolling a
      # 500kb single-line diff in a job log is not that.
      - name: What the sources actually build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-rebuilt
          path: apps/mobile/features/console/files/webview/bundle.generated.ts
          if-no-files-found: error

  # ── THE BRIDGE BETWEEN THE ONE UI AND THE SHELL ──────────────────────────
  #
  # `packages/desktop-bridge` is what `apps/mobile` asks and `apps/desktop`
  # answers once the Expo app is the UI on macOS too (docs/decisions/desktop.md).
  # It has no npm dependencies and its suite runs on bare node, so it gets a job
  # here rather than an install: the same shape as `Test Gateway` and
  # `Test Meetings Core` in mcp.yml, and for the same reason those exist —
  # a package whose only CI is somebody's laptop has none.
  #
  # The second step is the guard the decision document asks for by name:
  # **apps/mcp imports nothing from packages/desktop-bridge**. It runs in
  # mcp.yml too, and is repeated here because that is where somebody adding to
  # this package will look, and because the rule it enforces was widened in the
  # same pull request that created the package. A relative import into a
  # sibling package passed the older "relative only" rule; three self-test cases
  # now say it does not.
  desktop-bridge:
    name: Test Desktop Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # See mcp.yml: setup-node would shell out to pnpm to find its cache
          # directory, and this job deliberately never installs pnpm.
          package-manager-cache: false

      # No `pnpm install`. If this ever needs one, an npm dependency crept into
      # the bridge and that is the thing to fix.
      - name: Run test suite
        working-directory: packages/desktop-bridge
        run: node --experimental-strip-types test/test.mjs

      - name: The gateway imports none of it
        run: |
          node scripts/check-gateway-imports.mjs --self-test
          node scripts/check-gateway-imports.mjs apps/mcp/src

      # The mirror of the check above: the gateway imports none of the desktop
      # bridge, and the control plane imports plenty of the gateway — so its
      # deploy has to notice when any of that changes. It stopped noticing, for
      # six source trees, and nothing said so; see the script's header.
      - name: Releases require staging and cover everything Convex bundles
        run: |
          node --test scripts/production-release.test.mjs
          node scripts/check-convex-deploy-paths.mjs --self-test
          node scripts/check-convex-deploy-paths.mjs

  # ── THE APP HAS TO START, NOT JUST TYPECHECK AND PACKAGE ─────────────────
  #
  # #329 merged with 24 green checks and a temporal dead zone in
  # `apps/desktop/src/main/index.ts`: an `onChange` handler wired above
  # `const controller` called a function that reads `controller`, so every
  # launch threw `ReferenceError: Cannot access 'controller' before
  # initialization` — through a promise, so it surfaced as an unhandled
  # rejection rather than a stack trace at the call site. Nothing in THIS
  # file would have caught it; `apps/desktop`'s own `test.mjs` and `tsc
  # --noEmit` both stayed green, because neither one starts the process.
  # `test/launch.smoke.mjs` does — see docs/decisions/desktop.md, "A release
  # is a build that started" — and it already existed, wired into
  # `deploy-desktop.yml`. The defect still reached `main`, because that
  # workflow is `workflow_dispatch` only: the gate spoke hours later, on a
  # release dispatch, against a commit two pull requests removed from the one
  # that broke it. This job is the fix for THAT gap — the same check, run
  # where a defect can still be stopped rather than merely dated.
  #
  # ## Why a macOS runner, on pull requests, and this is affordable
  #
  # `context` is public (CLAUDE.md, "This repository is public and MIT
  # licensed"), and GitHub does not meter Actions minutes on a public
  # repository's hosted runners by OS or otherwise — a macOS runner here
  # costs no more in billing than `ubuntu-latest` costs `desktop-bridge`
  # above. What a macOS runner actually spends is queue time against a
  # smaller concurrency pool than Linux gets, and the way to keep that cheap
  # is to run it only where it can find something: gated by path, exactly
  # like `editor-webkit` below gates on `apps/mobile/**`. A run that does
  # apply is short — `pnpm install --filter "@context/desktop..."`, a build,
  # then the same `--smoke` launch `deploy-desktop.yml` runs, with no
  # certificate, no notarisation and no `.dmg` — nothing like that job's
  # 45-minute budget.
  #
  # So: on a pull request, this runs only when the diff touches
  # `apps/desktop` itself, one of its four runtime workspace packages, or the
  # MCP/collaboration packages its tool-contract test imports. These are the
  # dependency edges declared by `apps/desktop/package.json`, rather than
  # `packages/**` wholesale: `packages/shared` is not one of them, and gating
  # on all packages would run this on every unrelated package change. This uses
  # the same in-job change detection as `editor-webkit`, for the same reason (a
  # `paths:` filter on the trigger would leave an unrelated pull request with
  # no report at all, pending forever on a required check). On a push to
  # `main` it always runs, ungated — a merge is the moment this incident
  # actually happened, pushes to `main` are one per merge rather than one per
  # commit, and a change reaching `main` through something this path list did
  # not anticipate (a workspace-root dependency bump, a fifth package this
  # app starts depending on) still gets caught within minutes rather than at
  # the next release dispatch.
  #
  # ## What still is not covered
  #
  # `deploy-desktop.yml`'s own launch step is untouched — signed, notarised,
  # packaged, Gatekeeper-checked, and still the only thing that gates a
  # published release. This job runs the *unpackaged* dev bundle
  # (`dist/main/index.cjs`, `pnpm --filter @context/desktop smoke` with no
  # `--app`), so it cannot see a packaging-only defect (an asar path, an
  # Info.plist icon, code signing) — only a defect in the module graph or
  # `main()` itself, which is exactly what #329's was and exactly what nothing
  # before this job ran on a pull request at all. The two gates are
  # deliberately not merged into one: this one is meant to be cheap and fast
  # enough to run on every relevant pull request, and the release gate is
  # meant to prove the exact bits about to ship. Neither replaces the other.
  desktop-launch-smoke:
    name: The desktop app launches
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Does this touch the desktop app or what it depends on?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            desktop:
              - "apps/desktop/**"
              - "packages/desktop-bridge/**"
              - "packages/hook/**"
              - "packages/communications/**"
              - "packages/meetings/**"
              - "apps/mcp/**"
              - "packages/collaboration/**"
              - ".github/workflows/ci.yml"

      # `github.event_name == 'push'` (to `main`, per this workflow's trigger)
      # always runs, ungated — see the comment above this job for why a merge
      # gets no path filter and a pull request does.
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'push' || steps.changes.outputs.desktop == 'true'

      - uses: actions/setup-node@v5
        if: github.event_name == 'push' || steps.changes.outputs.desktop == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Scoped to the app and its declared runtime and test dependencies, same
      # as `deploy-desktop.yml`'s install. The rest of the workspace is not
      # this job's business.
      - name: Install
        if: github.event_name == 'push' || steps.changes.outputs.desktop == 'true'
        run: pnpm install --filter "@context/desktop..." --frozen-lockfile

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: pnpm run build

      # The same check `deploy-desktop.yml` runs against the packaged app,
      # here against the unpackaged dev bundle it builds above — see the
      # header comment for what that does and does not cover.
      #
      # The failure has to name the app's own error, not just an exit code:
      # that is the entire lesson of tonight's incident, where the gate that
      # did exist spoke only "the release build failed" hours after the fact
      # and pointed at a commit two pull requests removed from the one that
      # broke it. `test/launch.smoke.mjs` already prints a PASS/FAIL line per
      # check and the app's full captured output on any failure (both reach
      # this step's own log); the `::error::` annotation below additionally
      # pulls out one line for the job summary and the check-run title, so the
      # reason is visible without opening the log at all.
      #
      # Ordered on purpose, most specific first — proven against a real run of
      # this exact job (#329's dead zone, still open on `main` as this was
      # written): `main/index.ts`'s own `uncaughtException`/`unhandledRejection`
      # handlers print `[smoke] uncaught exception: <message>` or
      # `[smoke] unhandled rejection: <message>` before exiting, and that
      # message — e.g. `ReferenceError: Cannot access 'controller' before
      # initialization` — is the one sentence an on-call person actually needs.
      # The first attempt at this grepped `FAIL |Error:|Exception` with no
      # ordering and surfaced `FAIL  IT EXITS ZERO — exit code 1` instead on
      # that exact run, because the checker's own FAIL line for that symptom
      # sits earlier in the output than the JS error it was caused by — true,
      # but not the answer. Falling back to a `FAIL` line, then to the crash
      # strings `launch.smoke.mjs` itself greps for, only reads as "nothing
      # more specific was in the log" when none of the app's own error text
      # was captured at all.
      - name: Launch the app it just built (smoke test)
        id: smoke
        if: github.event_name == 'push' || steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: |
          set +e
          pnpm run smoke 2>&1 | tee "$RUNNER_TEMP/desktop-smoke.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            reason="$(grep -m1 -E 'uncaught exception:|unhandled rejection:' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            if [ -z "$reason" ]; then
              reason="$(grep -m1 -E 'Dynamic require of|Uncaught Exception|A JavaScript error occurred|App threw an error during load' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            fi
            if [ -z "$reason" ]; then
              reason="$(grep -m1 -E '^FAIL ' "$RUNNER_TEMP/desktop-smoke.log" || true)"
            fi
            if [ -z "$reason" ]; then
              reason="exited $status with no recognisable error line — see the full log above"
            fi
            echo "::error::apps/desktop failed to launch: ${reason}"
          fi
          exit "$status"

  # ── NO WEBKIT IN CI OR IN AN AGENT SANDBOX, UNTIL NOW ─────────────────────
  #
  # Every iOS-only editor bug in `docs/decisions/app-and-console.md`'s "A long
  # press has two signals" — the WebKit long-press recogniser's own
  # `touchcancel`, and the caret/touch trap it argues through — was reproduced
  # by SIMULATING WebKit's event sequence in Chromium (`editorLinks.test.ts`,
  # jsdom). That is enough to fix a bug once somebody has already found it on a
  # phone; it is not enough to prove the fix holds, because nothing in this
  # repository's CI, and nothing in the sandbox an agent here runs in, had ever
  # executed the editor inside an actual WebKit engine.
  #
  # This job closes that gap, and only that gap — see
  # `docs/decisions/testing.md` for what a green run here proves and does not
  # (Linux WebKit is close to iOS Safari's DOM event handling, not identical).
  #
  # `ubuntu-latest` rather than `macos-latest`: this repository runs no job on
  # macOS today, and Linux WebKit is the documented cheap path for exactly this
  # trade — a real WebKit engine's touch event pipeline, at a fraction of a
  # macOS runner's cost and queue time. If a bug ever surfaces here that Linux
  # WebKit cannot see and only iOS Safari can, that is the point to spend a
  # macOS runner, not before.
  #
  # `apps/mobile/e2e/webkit/playwright.config.ts` carries the rest of the
  # reasoning — what the suite runs against (the built web export, not `expo
  # start`), why the fixture route exists and how it is kept out of every real
  # build, and why case (a) steps outside `page.touchscreen` to dispatch one
  # `TouchEvent` by hand.
  editor-webkit:
    name: Editor in WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Change detection lives INSIDE the job, as a step, rather than as a
      # `paths:` filter on the trigger above — see mcp.yml's header and
      # `scripts/check-workflow-triggers.mjs`, which enforces the rule this
      # repeats: a required check filtered out of the trigger never reports at
      # all, and GitHub leaves the pull request pending on it forever. This way
      # the job always runs and always reports; an unrelated pull request just
      # finds every step after this one skipped, which is a pass.
      - name: Does this touch the editor or what it runs on?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - "apps/mobile/**"
              - "packages/**"
              - ".github/workflows/ci.yml"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.mobile == 'true'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      # Pinned by `apps/mobile/package.json`'s `@playwright/test` version, not
      # by a version here — `playwright install` always installs the browser
      # matching the npm package `pnpm install` just resolved, so the two
      # cannot drift, and bumping the browser is the same pull request as
      # bumping the dependency.
      #
      # Chromium comes too, and only for `offlineShell.spec.ts` below: WebKit
      # runs the suite, and that one case skips itself there because
      # Playwright's WebKit driver errors on a reload taken while offline. The
      # first attempt at this installed WebKit alone and the Chromium step died
      # with "Executable doesn't exist" — a step that runs a browser has to ask
      # for it, and nothing else in this job did.
      - name: Install Playwright's WebKit (and Chromium, for the offline case)
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: pnpm exec playwright install --with-deps webkit chromium

      # `EXPO_PUBLIC_E2E_FIXTURE=1` is the only thing that makes `/e2e-fixture`
      # render anything — see that route's own header. Every other export in
      # this repository (`deploy-web.yml`, `deploy-mobile-*.yml`, a laptop's
      # `expo start`) leaves it unset, so this build is never what ships.
      # `EXPO_PUBLIC_CONVEX_URL` is a syntactically valid, deliberately
      # unreachable host — the fixture console never opens a Convex
      # subscription (`useDemoConsoleData` is literals), so nothing here ever
      # dials out to it.
      - name: Build the web export with the E2E fixture route enabled
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_E2E_FIXTURE: "1"
          EXPO_PUBLIC_CONVEX_URL: "https://e2e-fixture.invalid"
        # This also builds the standalone drawing editor into `public/` before
        # Expo copies public assets into the export. Calling `expo export`
        # directly leaves `/drawing-assets/editor/index.html` absent, and the
        # static server serves the SPA fallback page at that URL instead.
        run: pnpm build:e2e-web

      # `pluginBundles.spec.ts` runs a real community-plugin release through the
      # real shim, which is the only check that has ever caught a plugin failing
      # to load at all — `SuggestModal`, then `Events`, then `Modal`, each a
      # class nobody had listed and each taking a whole bundle down while every
      # jsdom suite stayed green.
      #
      # The releases are not committed (megabytes of third-party minified code
      # in a public repository) and the spec skips when they are absent, so a
      # GitHub outage costs a skip rather than a red run. `continue-on-error`
      # says that out loud rather than leaving it to a silent `|| true`.
      - name: Fetch the community plugin releases the browser suite runs
        if: steps.changes.outputs.mobile == 'true'
        continue-on-error: true
        working-directory: apps/mobile
        run: node e2e/webkit/fetch-bundles.mjs

      - name: Run the suite in WebKit
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          CI: "true"
        run: pnpm test:e2e:webkit

      # ── THE OFFLINE CHECK, IN THE ENGINE THAT CAN BE TAKEN OFFLINE ──────
      #
      # `offlineShell.spec.ts` is the only thing in this repository that loads
      # the app in a real browser with the network genuinely gone — the class
      # of defect #690 escaped into, where a hand-written `CacheStorage` fake
      # could not model `Response.url` and a private note path ended up in a
      # cache that sign-out does not clear.
      #
      # It skips itself on WebKit, and the reason is measured rather than
      # assumed: WebKit registers and controls the worker fine (85 cases passed
      # beside it), but a reload taken while `setOffline(true)` is in force
      # fails inside Playwright's WebKit driver — "WebKit encountered an
      # internal error", before the navigation starts. The spec's own header
      # carries the detail and says to re-check it when that support changes.
      #
      # So it runs here, in Chromium, as its own step. A step rather than
      # folding the chromium project into the line above, because that project
      # exists to validate *the tests* against the whole suite and would double
      # every case's runtime for one file's worth of coverage.
      - name: The app opens with the network off (Chromium)
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          CI: "true"
        run: pnpm test:e2e:offline

      # Playwright's own HTML report — screenshots, traces, and the exact
      # assertion that failed — rather than the raw `test-results/` directory,
      # which is one PNG per failure with no way to see which case it was
      # without cross-referencing the log. `playwright.config.ts` sets
      # `screenshot: "only-on-failure"` and `trace: "retain-on-failure"`, so a
      # red run always has both without a slow run ever paying for them.
      - name: The failing case's screenshot and trace
        if: failure() && steps.changes.outputs.mobile == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editor-webkit-report
          path: apps/mobile/e2e/webkit/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── THE MONITOR HAS TO BE ABLE TO GO RED ────────────────────────────────
  #
  # `gateway-health.yml` probes production on a schedule, so nothing about it
  # runs on a pull request — which would leave the assertions it is made of
  # unchecked until the next tick, and a probe whose assertions have quietly
  # stopped matching anything reports a healthy service forever. That is this
  # repository's most-repeated failure shape, and it is worse in a monitor than
  # anywhere else: the thing that is supposed to tell you the endpoint is down
  # is the last thing anybody looks at while it is green.
  #
  # So the self-test runs here, on every pull request, and asserts the opposite
  # of what the monitor asserts: that fifteen sabotaged responses — an
  # unreachable host, a 200 serving an error page, PKCE dropped from the
  # metadata, an unauthenticated 200 from the MCP route — each still produce a
  # problem. No network, no credential, nothing to install.
  # ── THE BUNDLE THAT SHIPS TO A PHONE IS NOT THE ONE CI WAS BUILDING ─────
  #
  # Everything above resolves modules for node (jest) or for a browser (the
  # web export, the WebKit suite). A phone is a third resolver: Metro picks the
  # `react-native` export condition, and a dependency can have an entry point
  # there that exists on npm and cannot be resolved in this tree.
  #
  # That is not hypothetical. Live co-editing put Yjs in the console, Yjs
  # reaches Web Crypto through `lib0/webcrypto`, and lib0's `react-native`
  # condition requires `isomorphic-webcrypto/src/react-native` — a package
  # nothing here depends on. Every pull request was green. Every OTA deploy
  # after the merge failed at `expo export`, for four merges, because the only
  # thing that builds a native bundle ran *after* the merge button.
  #
  # So the deploy's own export runs here, before merging, for both platforms.
  # It is the same command `deploy-mobile-update.yml` runs, minus the publish:
  # no EAS credential, no Expo account, nothing sent anywhere. Roughly two
  # minutes, and it is the only check in this repository that can see a native
  # resolution failure at all.
  #
  # `--dump-assetmap` and `--source-maps` are deliberately left off: this job
  # asks whether the bundle *builds*, and the deploy asks for the rest.
  native-bundle:
    name: The native bundle still builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Inside the job as a step, never a `paths:` filter on the trigger —
      # see `editor-webkit` above and `scripts/check-workflow-triggers.mjs`.
      - name: Does this touch the app or what it bundles?
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - "apps/mobile/**"
              - "packages/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/ci.yml"

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.mobile == 'true'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      # A syntactically valid, deliberately unreachable host, as `editor-webkit`
      # uses: nothing in an export dials out, and a missing one would fail the
      # build for a reason that is not the one this job is asking about.
      - name: Export the iOS and Android bundles
        if: steps.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_CONVEX_URL: "https://native-bundle-check.invalid"
        run: pnpm exec expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/native-bundle"

  # The Convex deploy runs its own `tsc`, which reads the gateway's JSDoc types
  # through fileOps.ts; the package `tsc` above does not. A split that stranded
  # one `@param` block passed every PR check and failed every staging deploy.
  convex-deploy-typecheck:
    name: The Convex deploy typecheck passes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck what the Convex deploy would push
        run: pnpm exec convex typecheck

  gateway-health-assertions:
    name: The gateway monitor can still fail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Plain Node over `fetch`, no dependency to install — see mcp.yml for
          # why the cache must be off in a job without pnpm.
          package-manager-cache: false

      - name: The probe catches what it claims to
        run: node scripts/health-check-gateway.mjs --self-test
