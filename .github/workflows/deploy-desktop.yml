name: Deploy Desktop (build the Mac app)

# A `.dmg` of the meeting recorder, built on a Mac runner — signed and notarised
# when the credentials exist, and honestly unsigned when they do not.
#
# ## Why nothing about a branch triggers it
#
# `workflow_dispatch` only, and the same reason `deploy-mobile-native.yml` gives:
# this produces a **binary somebody installs**. A merge to `main` deploys the
# Convex functions, the gateway and an OTA bundle because those are reversible
# by the next merge; a build that a person downloads and runs is not, and
# shipping one is a decision somebody takes. CLAUDE.md says it in as many words:
# "a native build, a store submission, rotating a secret" are what a merge
# cannot do on its own.
#
# The consequence, stated rather than discovered: **merging a desktop change
# ships nothing.** Dispatch this when there is a build worth having.
#
# ## Signed or not, and what the difference costs
#
# Everything in this file works with no signing credentials at all, and that is
# deliberate: the certificate and the App Store Connect key do not exist yet, and
# a workflow that cannot run until they do is a workflow nobody tests. So the
# unsigned path produces a real `.dmg` you can install on the machine that built
# it — enough to prove the app opens, the tray appears, and the microphone path
# works.
#
# What an unsigned build does **not** get, and this is the whole reason the
# signed path matters:
#
#  - Gatekeeper refuses it on any other Mac.
#  - macOS does not grant a hardened-runtime app TCC permissions it has not
#    verified, so **system audio does not work** — the app degrades to mic-only
#    and says so, which is the honest behaviour and not the intended one.
#
# The moment `CSC_LINK`, `CSC_KEY_PASSWORD`, `ASC_API_KEY_P8`, `ASC_KEY_ID` and
# `ASC_ISSUER_ID` are in the `production` environment, the same dispatch signs,
# notarises and staples with no change here: electron-builder reads the first
# two itself, and `build/notarize.cjs` reads the other three and skips cleanly
# without them.
#
# ## What this cannot check
#
# That the signature is trusted on somebody else's Mac, that notarisation
# actually granted TCC, or that ScreenCaptureKit hands over system audio. All
# three need a person, a Mac and a meeting. The artifact is what they need to do
# that with.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this build exists — it goes in the run's title"
        required: false
        default: "a build to try on a Mac"
      publish:
        description: "Publish a GitHub Release (needs a signed, notarised build; a version already released is refused)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-desktop
  cancel-in-progress: false

jobs:
  build:
    name: Build the Mac app
    # macOS, and not optional: codesign, notarytool and dmg creation are all
    # Apple's own tools. A Linux runner can produce a directory that looks like
    # an app and nothing that installs.
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production
    # `contents: write`, overriding the workflow's own `contents: read` above,
    # because a `publish: true` dispatch hands electron-builder `GH_TOKEN` and
    # asks it to create a GitHub Release. GitHub Actions has no conditional
    # permission — a job declares one scope for every run it will ever have,
    # not one per input — so the choice is between this override and a second
    # job that duplicates the entire certificate-and-build sequence above it
    # just to hold a narrower scope. That duplication is the worse trade: twice
    # the signing surface, two keychains to leak instead of one, and a copy of
    # ~180 lines that drifts the day only one of them is edited. What actually
    # keeps this scope narrow is downstream of here rather than in this key:
    # the token this run receives is minted for this run alone and expires with
    # it, dispatching this workflow at all already requires write access to the
    # repository, and the API call the elevated scope would allow is reached
    # from exactly one place — the `--publish` flag on the Build step below —
    # gated on `publish == 'true'` AND a signed AND notarised build. Every
    # dispatch that leaves `publish` at its default touches nothing this scope
    # adds. See docs/decisions/desktop.md, "The shell updates itself", for the
    # test that fails if that gate is ever removed instead of the scope.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Scoped to the app and what it depends on. The desktop app has one
      # runtime dependency (`@context/meetings`, bundled by esbuild) and its
      # build tools; the rest of the workspace is not this build's business.
      - name: Install
        run: pnpm install --filter "./apps/desktop..." --frozen-lockfile

      # Before anything is built. A `.dmg` of a broken app is worse than no
      # `.dmg`, because somebody installs it.
      - name: Test
        working-directory: apps/desktop
        run: node --experimental-strip-types test/test.mjs

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

      # Everything about the certificate that can be established before a build,
      # established before the build — and then the keychain electron-builder
      # will sign from, made here rather than by electron-builder.
      #
      # ## Why this workflow owns the keychain
      #
      # Handed `CSC_LINK`, electron-builder creates a throwaway keychain with a
      # random password, imports the .p12 into it, and then runs
      #
      #   security set-key-partition-list -S apple-tool:,apple: -s -k <password>
      #
      # with the **certificate's** import password rather than that keychain's.
      # Those are two different secrets and only the keychain's own unlocks it,
      # so the command fails with "SecKeychainUnlock: The user name or
      # passphrase you entered is not correct" and the build is over in forty
      # seconds, before it has packaged anything. It is
      # electron-userland/electron-builder#10066, its fix is in no released
      # 26.x, and the two dispatches that failed this way are what this step
      # exists for. The `security import` on the line before succeeded both
      # times, which is what says the passphrase is right and the *keychain's*
      # password was what was wrong.
      #
      # Avoiding that path costs one line: with no `CSC_LINK` in its
      # environment, electron-builder signs from `CSC_KEYCHAIN` — a keychain
      # somebody else made — instead of making one. So both signing secrets
      # stop at this step, the Build step below is handed a keychain and no
      # secrets at all, and the keychain is deleted in an `always()` step at
      # the end whatever the build did.
      #
      # ## What it prints, and what it will not
      #
      # This repository is public and so are these logs. The certificate's
      # subject names the company and carries the Apple team id, so it is never
      # printed: the log gets the *kind* of certificate, whether the private key
      # came with it, when it expires, and how many signing identities the
      # keychain ended up holding. Each of those tells one failure from another,
      # and none of them identifies anybody.
      - name: Check the certificate, and make the keychain to sign from
        id: certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail

          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::No signing certificate — this build is UNSIGNED."
            echo "It installs on the machine that built it and nowhere else, and"
            echo "macOS will not give it system audio. Mic-only is expected."
            # Without this, electron-builder looks for an identity in the
            # runner's own keychain and fails on a machine that has none.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            # Read by "Decide whether to publish" below — an unsigned build has
            # nothing Squirrel.Mac can verify, so `updater.ts`'s own arming rule
            # (`shouldArmUpdater`) would refuse it anyway; this is that same
            # refusal, one step earlier, before any network call is attempted.
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::CSC_LINK is set but CSC_KEY_PASSWORD is not. A .p12 exported from Keychain Access always has an export password, and it is that one."
            exit 1
          fi

          dir="$RUNNER_TEMP/desktop-signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          p12="$dir/certificate.p12"

          # `openssl base64 -d -A` rather than `base64 --decode`: the flag spelling
          # differs between the BSD and GNU tools, and -A takes the whole thing as
          # one line, which is what a secret pasted from `base64 -i cert.p12` is.
          if ! printf '%s' "$CSC_LINK" | tr -d '\r\n' | /usr/bin/openssl base64 -d -A > "$p12" 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64. It should be the whole .p12 file, base64-encoded, and nothing else."
            exit 1
          fi
          if [ ! -s "$p12" ]; then
            echo "::error::CSC_LINK decoded to nothing. It should be the whole .p12 file, base64-encoded."
            exit 1
          fi

          # The certificate half. A wrong passphrase and a file that is not a
          # PKCS#12 bundle at all fail here in the same breath, so they are told
          # apart by what openssl said rather than reported as one guess. Its
          # stderr is read, never echoed.
          if ! /usr/bin/openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:CSC_KEY_PASSWORD -out "$dir/certificate.pem" 2> "$dir/openssl.err"; then
            if grep -qi "mac verify" "$dir/openssl.err"; then
              echo "::error::CSC_KEY_PASSWORD does not open CSC_LINK. The password wanted is the one typed when the certificate was exported from Keychain Access — check for a trailing space or newline in the secret."
            else
              echo "::error::CSC_LINK is not a PKCS#12 (.p12) bundle. Export the identity from Keychain Access as .p12 — a .cer or .pem is the certificate without its private key and cannot sign."
            fi
            exit 1
          fi

          # The private-key half, which the check above cannot see: a .p12 that
          # holds only a certificate imports without complaint and then signs
          # nothing. Piped, never written — an unencrypted private key does not
          # go on a disk here.
          keys="$(/usr/bin/openssl pkcs12 -in "$p12" -nocerts -nodes -passin env:CSC_KEY_PASSWORD 2>/dev/null | grep -c "PRIVATE KEY" || true)"
          if [ "${keys:-0}" -eq 0 ]; then
            echo "::error::CSC_LINK holds a certificate but no private key. Export the identity itself from Keychain Access — the row with the key under it — as .p12."
            exit 1
          fi

          if ! /usr/bin/openssl x509 -in "$dir/certificate.pem" -noout -checkend 0 > /dev/null; then
            echo "::error::The certificate in CSC_LINK has expired. A new Developer ID Application certificate is needed; nothing here can be signed with this one."
            exit 1
          fi
          # The subject is read and NOT printed — it carries the team id. Into a
          # variable rather than through `grep -q`, because `set -o pipefail`
          # turns the SIGPIPE that a matching `grep -q` sends into a failure of
          # the whole pipeline — a check that fails on the certificate it just
          # accepted.
          subject="$(/usr/bin/openssl x509 -in "$dir/certificate.pem" -noout -subject)"
          case "$subject" in
            *"Developer ID Application"*) ;;
            *)
              echo "::error::The certificate in CSC_LINK is not a Developer ID Application certificate. A Mac App Distribution or Development certificate cannot produce a dmg that opens on somebody else's Mac."
              exit 1
              ;;
          esac
          expires="$(/usr/bin/openssl x509 -in "$dir/certificate.pem" -noout -enddate | sed 's/^notAfter=//')"
          echo "A Developer ID Application certificate, with its private key, valid until $expires."

          # The keychain, with a password generated here and used for both the
          # things that need it: creating it, and authorising codesign to use
          # the key without a prompt no runner can answer.
          keychain="$dir/signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"
          /usr/bin/security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$dir/keychains.before"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          # No lock on sleep and a timeout longer than this job's, or a long
          # notarisation returns to a locked keychain and a signature that fails.
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$p12" -k "$keychain" -f pkcs12 -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Kept on the search list alongside the runner's own, so the chain up
          # to Apple's intermediate can still be built.
          # shellcheck disable=SC2046
          /usr/bin/security list-keychains -d user -s "$keychain" $(cat "$dir/keychains.before")
          rm -f "$p12" "$dir/certificate.pem" "$dir/openssl.err"

          # Counted, not printed: each line names the company and the team id.
          identities="$(/usr/bin/security find-identity -v -p codesigning "$keychain" | grep -c "Developer ID Application" || true)"
          if [ "${identities:-0}" -eq 0 ]; then
            echo "::error::The certificate imported but macOS will not sign with it. The usual cause is a .p12 whose private key did not survive the export."
            exit 1
          fi
          echo "The keychain holds $identities Developer ID Application signing identity(ies)."

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

          if [ -n "${ASC_API_KEY_P8:-}" ]; then
            echo "This build will be signed and notarised."
          else
            echo "::warning::This build will be signed but NOT notarised — the App Store Connect key is missing."
            echo "Gatekeeper refuses an un-notarised build on another Mac, and macOS will not give it system audio."
          fi

      # The other credential, judged by the code that will use it.
      #
      # The first build to get past code signing died twenty-six seconds later,
      # after Electron had been downloaded, the app packaged and the signature
      # applied, on `Failed to notarize via notarytool. Error:
      # invalidPEMDocument` — which says the file the hook wrote is not a PEM
      # and nothing about why. A `.p8` is a multi-line PEM and a secret store is
      # a text box, so `build/notarize.cjs` repairs the four unambiguous ways it
      # arrives damaged and refuses anything that is not a private key; running
      # it with `--check` here applies exactly that rule, before the build,
      # instead of a second copy of it in shell. The key stays inside that
      # process: it is not written, echoed or exported.
      - name: Check the notarisation key
        id: notarize_check
        working-directory: apps/desktop
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          node build/notarize.cjs --check
          # "Decide whether to publish" reads this rather than re-deriving it:
          # `credentials()` in that file is "all three, or nothing", and this is
          # the one place that already ran it.
          if [ -n "${ASC_API_KEY_P8:-}" ] && [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER_ID:-}" ]; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      # Whether this run may create a release, decided once rather than
      # inlined into the Build step below. `publish` asked for a release that
      # `signed`/`notarized` cannot deliver is a warning and an artifact-only
      # build, never a failure — the same honesty this file already gives an
      # unsigned dispatch.
      - name: Decide whether to publish
        id: decide
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          SIGNED: ${{ steps.certificate.outputs.signed }}
          NOTARIZED: ${{ steps.notarize_check.outputs.notarized }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_REQUESTED" = "true" ] && [ "$SIGNED" = "true" ] && [ "$NOTARIZED" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "This build will publish a GitHub Release."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISH_REQUESTED" = "true" ]; then
              echo "::warning::publish was requested but this build is $( [ "$SIGNED" = "true" ] && echo unnotarised || echo unsigned ) — uploading an artifact only, no release."
            fi
          fi

      # A version this workflow already released, refused before forty-five
      # minutes of signing and notarising rather than after — and before
      # electron-builder gets anywhere near overwriting a release somebody may
      # already have pointed people at. `apps/desktop/package.json`'s version is
      # never bumped by this workflow; bump it, commit it, then dispatch again.
      - name: Read the app version
        id: version
        working-directory: apps/desktop
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a version already released
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's own default tag scheme (`vPrefixedTagName`, on by
          # default) — not renamed here, because the tag this step checks has to
          # be the exact one electron-builder will look for and reuse below.
          TAG: v${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already has a release. This workflow never overwrites one — bump the version in apps/desktop/package.json and dispatch again."
            exit 1
          fi
          echo "$TAG has no release yet; this dispatch may create it."

      # The signing half arrives as `CSC_KEYCHAIN` and
      # `CSC_IDENTITY_AUTO_DISCOVERY` from the step above, through `GITHUB_ENV`
      # — and `CSC_LINK` deliberately does not arrive at all, because its
      # presence is what makes electron-builder build its own keychain and fail.
      # `build/notarize.cjs` reads the three ASC values, and treats absent as
      # "do the unsigned thing" rather than as an error.
      # electron-builder itself prints the signing identity at "info" level on
      # every signed build — `MacPackager.doSign()` in app-builder-lib logs
      # `identityName=Developer ID Application: <company> (<team id>) identityHash=<sha1>`
      # unconditionally, with no flag to quiet it. That is the same subject the
      # preflight above reads and refuses to print, arriving anyway through a
      # dependency's own log line, so it is redacted here instead — on the way
      # to the log, not before electron-builder ever sees it, and with
      # `pipefail` so a redacted failure still fails the step. The expression
      # itself lives in `build/redact-signing-log.sh`, not inline: an earlier
      # inline `sed` used `[^\n]*`, which is a GNU extension that this
      # `macos-latest` runner's BSD `sed` does not share (see that script's own
      # header) — it matched nothing, silently, on the one platform this step
      # ever runs on for a signed build, and both dispatches went out with the
      # company name and Apple team id in a public log. One shared script
      # means the workflow and `test/packaging.test.mjs` run the identical
      # expression instead of two copies that can drift apart again the same
      # way.
      #
      # Separately: `skipped macOS notarization reason=… unable to be
      # generated`, a few lines into the Build step's own output, is
      # electron-builder's *built-in* notarize step declining — expected and
      # harmless. This repository notarises through its own `afterSign` hook
      # (`build/notarize.cjs`, wired below it) instead of electron-builder's
      # built-in support, precisely so the `.p8` can be repaired and checked
      # the way that file's header explains; the hook's own
      # "submitting … / done — notarised and stapled" lines, right after, are
      # the notarisation that actually happens.
      - name: Build
        working-directory: apps/desktop
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Baked into the main process bundle by `scripts/build.mjs` — see its
          # header — never read live by the packaged app. `steps.certificate`
          # already decided this; this is that decision reaching the code that
          # arms `autoUpdater`.
          CONTEXT_DESKTOP_SIGNED: ${{ steps.certificate.outputs.signed }}
          # Present on every run; only load-bearing when the line below passes
          # `--publish always`. Unused, it is inert — electron-builder makes no
          # network call for a `--publish never` build, signed or not.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
        run: |
          set -o pipefail
          pnpm run build
          if [ "$PUBLISH" = "true" ]; then
            publish_policy=always
          else
            publish_policy=never
          fi
          pnpm exec electron-builder --mac --config electron-builder.yml --publish "$publish_policy" 2>&1 \
            | bash build/redact-signing-log.sh

      - name: What was produced
        working-directory: apps/desktop
        env:
          PUBLISHED: ${{ steps.decide.outputs.publish }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          ls -la release/*.dmg
          ls -la release/*.zip release/latest-mac.yml 2>/dev/null || true
          if [ "$PUBLISHED" = "true" ]; then
            echo "Published v$VERSION to GitHub Releases — electron-builder's own log above named the assets it uploaded."
          fi

      # `spctl --assess` on the `.dmg` itself always said "no usable
      # signature" — correctly, because electron-builder does not sign the
      # disk image by default and Gatekeeper never assesses one anyway: it
      # assesses the app a person double-clicks their way into, after
      # mounting the dmg, exactly like this step now does.
      # `electron-builder.yml`'s `dmg.sign: true` signs the container too, so
      # a real failure to sign or mount is no longer masked by a dmg check
      # that was never going to pass regardless.
      #
      # Signed and notarised is the only shape this can honestly demand
      # Gatekeeper accept, so that combination is what gates the step; an
      # unsigned or un-notarised dispatch is expected to fail every one of
      # these — that is the whole reason this workflow prints
      # "::warning::This build is UNSIGNED" earlier rather than refusing to
      # build at all — and is reported, not failed, the same way the dmg
      # check it replaces always treated an unsigned build's rejection as the
      # truth rather than a bug.
      #
      # None of the three tools' own output reaches the log: `spctl -vv` and
      # `codesign -v` both print the signing identity on success, which is
      # the same subject already redacted out of electron-builder's own log
      # above — showing it here a second time would undo that. Only the
      # PASS/FAIL line this step writes itself is printed.
      - name: Verify the signed app inside each dmg
        working-directory: apps/desktop
        env:
          SIGNED: ${{ steps.certificate.outputs.signed }}
          NOTARIZED: ${{ steps.notarize_check.outputs.notarized }}
        run: |
          set -euo pipefail
          strict=false
          if [ "$SIGNED" = "true" ] && [ "$NOTARIZED" = "true" ]; then
            strict=true
          fi
          status=0
          for dmg in release/*.dmg; do
            name="$(basename "$dmg")"
            mnt="$(mktemp -d)"
            if ! hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null 2>&1; then
              echo "FAIL: could not mount $name"
              status=1
              rmdir "$mnt" 2>/dev/null || true
              continue
            fi
            app="$(find "$mnt" -maxdepth 1 -name "*.app" -print -quit)"
            if [ -z "$app" ]; then
              echo "FAIL: no .app found inside $name"
              status=1
            else
              if spctl --assess --type execute -vv "$app" >/dev/null 2>&1; then
                echo "PASS: spctl accepts the app in $name"
              else
                echo "FAIL: spctl rejects the app in $name"
                status=1
              fi
              if codesign --verify --deep --strict "$app" >/dev/null 2>&1; then
                echo "PASS: codesign verifies the app in $name"
              else
                echo "FAIL: codesign verification failed for the app in $name"
                status=1
              fi
              if xcrun stapler validate "$app" >/dev/null 2>&1; then
                echo "PASS: the notarisation ticket is stapled in $name"
              else
                echo "FAIL: stapler could not validate the app in $name"
                status=1
              fi
            fi
            hdiutil detach "$mnt" -quiet >/dev/null 2>&1 || hdiutil detach "$mnt" -force >/dev/null 2>&1 || true
          done
          if [ "$status" -ne 0 ]; then
            if [ "$strict" = "true" ]; then
              echo "::error::A signed, notarised build failed a Gatekeeper check inside its own dmg — see PASS/FAIL lines above."
              exit 1
            fi
            echo "::warning::Not every check passed, but this build is not both signed and notarised — Gatekeeper is expected to refuse it elsewhere. See PASS/FAIL lines above."
          fi

      # 922 checks passed on a build that had never opened a window — see
      # docs/decisions/desktop.md, "a release is a build that started". `--smoke`
      # is the app's own contribution (`apps/desktop/src/main/index.ts`, a
      # separate pull request): initialise, open the console window, log one
      # line, and exit 0 within 10 seconds; exit non-zero on any uncaught error
      # or if no window was created. This step is what makes that mode
      # load-bearing rather than merely present: it is the first time anything
      # in this repository has started the app it just built, and it runs
      # before the artifact this job hands anybody exists as far as the rest of
      # the job is concerned.
      #
      # ## Why the unsigned path gets this too
      #
      # `spctl`'s refusal is a check against the quarantine attribute a
      # download sets; a binary this runner just built and executes by its own
      # path, in the same job, never has one. So an unsigned build launches
      # here exactly as a signed one does, which is what makes this step a real
      # gate on the artifact-only path — the one most dispatches actually
      # produce, `publish` defaulting to false. Nothing below is conditioned on
      # `steps.certificate.outputs.signed` or `steps.notarize_check.outputs.notarized`.
      #
      # ## Why a runner is not a screen, and why that is fine here
      #
      # A GitHub-hosted `macos-latest` runner carries a real window server, so
      # `BrowserWindow` construction does not need `--no-sandbox` or a virtual
      # display the way it would on headless Linux — there is no framebuffer to
      # fake. If a future `--smoke` needs a flag of its own, it is passed on the
      # command line below and named in this comment; none is needed today.
      #
      # ## Why `perl -e 'alarm N; exec @ARGV'` and not `timeout`
      #
      # macOS ships no `timeout(1)`. `alarm` schedules `SIGALRM`, `exec`
      # replaces perl's own process image with the app in place — same PID — so
      # there is no wrapper left over to reap, and the signal reaches the app
      # itself if it is still running when the deadline passes (exit 128+14, so
      # the exit-code check below already covers it — the separate message is
      # for a human reading the log, not a second control path).
      #
      # ## What this cannot check, same honesty as the step above it
      #
      # `--publish always` runs *inside* `electron-builder --mac` in the Build
      # step above — electron-builder's own GitHub provider uploads as part of
      # building, not as a step this workflow could still refuse to reach. A
      # `publish: true` dispatch of a build that fails this gate has therefore
      # already been uploaded to a GitHub Release by the time this step runs,
      # the same limitation `docs/decisions/desktop.md` now records: this step
      # still fails the job — red CI, an `::error::` line, nobody merges or
      # trusts that run — which is the same shape as the Gatekeeper check right
      # above it, checking a dmg whose contents were, by construction, already
      # written to disk. What this step unconditionally prevents is the
      # artifact upload two steps down, on every dispatch, signed or not,
      # publishing or not.
      - name: Launch the app it just built
        working-directory: apps/desktop
        run: |
          set -uo pipefail

          # A crash caught and printed rather than left to a bare exit code:
          # Electron's default uncaught-exception dialog and the CommonJS
          # `require` failure that started this whole gate both say one of
          # these three things, and none of them is expected to appear whether
          # `--smoke` failed loudly (non-zero exit) or limped along and exited
          # 0 anyway.
          CRASH_STRINGS='Uncaught Exception|A JavaScript error occurred|Dynamic require'

          launch() {
            local app_path="$1" log_file="$2"
            if [ ! -x "$app_path" ]; then
              echo "FAIL: $app_path is missing or not executable — electron-builder did not produce it where this step expected it."
              return 1
            fi
            local started
            started="$(date +%s)"
            perl -e 'alarm 30; exec @ARGV' "$app_path" --smoke > "$log_file" 2>&1
            local status=$?
            local elapsed=$(( $(date +%s) - started ))

            if [ "$status" -eq 142 ]; then
              echo "FAIL: $app_path was still running past the 30s deadline and was killed — --smoke is meant to exit within 10s."
              return 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "FAIL: $app_path exited $status after ${elapsed}s."
              return 1
            fi
            if grep -qE "$CRASH_STRINGS" "$log_file"; then
              echo "FAIL: $app_path exited 0 but its log names a crash — a caught exception is still a crash."
              return 1
            fi
            echo "PASS: $app_path started, ran --smoke, and exited 0 after ${elapsed}s."
            return 0
          }

          # Only the last 40 lines, and through the same redaction script the
          # Build step's own output goes through: a crash log is exactly the
          # kind of output somebody pastes into an issue, and electron-builder's
          # signing-identity line (redacted above, for a signed build) can
          # appear again here if Electron's own crash reporter echoes recent
          # log output on the way out.
          show_log() {
            local log_file="$1" label="$2"
            echo "--- last 40 lines of the $label log (redacted) ---"
            if [ -f "$log_file" ]; then
              tail -n 40 "$log_file" | bash build/redact-signing-log.sh
            else
              echo "(no log — the app never started)"
            fi
          }

          status=0

          arm64_log="$RUNNER_TEMP/smoke-arm64.log"
          if ! launch "release/mac-arm64/Context.app/Contents/MacOS/Context" "$arm64_log"; then
            status=1
          fi
          show_log "$arm64_log" "arm64"

          # This runner is arm64 (`macos-latest` has been an Apple Silicon
          # image since macos-14), so the x64 build under `release/mac/` needs
          # Rosetta to run at all — and GitHub's arm64 runner images do not
          # carry it by default. Probed rather than assumed: `arch -x86_64`
          # against a no-op fails cleanly with "Bad CPU type in executable"
          # when Rosetta is absent, and that failure is reported as a skip, not
          # folded into `status`, because it is a fact about the runner rather
          # than about the app. If a later runner image ships Rosetta, or
          # `macos-latest` ever means an Intel image again, this starts
          # covering the x64 artifact with no edit needed here.
          runner_arch="$(uname -m)"
          if [ "$runner_arch" != "arm64" ]; then
            echo "Runner reports $runner_arch, not arm64 — running the x64 build natively."
            run_x64=true
          elif arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "Rosetta is available on this arm64 runner — running the x64 build under it too."
            run_x64=true
          else
            echo "::warning::Rosetta is not installed on this arm64 runner, so the x64 build cannot be launched here. The arm64 launch above is what gates this job; the x64 artifact ships unverified by this step until Rosetta is available on this image or a Mac confirms it by hand."
            run_x64=false
          fi

          if [ "$run_x64" = "true" ]; then
            x64_log="$RUNNER_TEMP/smoke-x64.log"
            if ! launch "release/mac/Context.app/Contents/MacOS/Context" "$x64_log"; then
              status=1
            fi
            show_log "$x64_log" "x64"
          fi

          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          # Everything a Mac needs to install this build or test the updater
          # against it by hand: the dmg for a first install, the zip and
          # `latest-mac.yml` that `electron-updater` reads on every launch
          # after that one. Produced by every build now, signed or not —
          # `writeUpdateInfo` is on by default and costs nothing to generate;
          # only a signed, notarised build can ever have it acted on.
          name: context-desktop-release
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          # A build to try, not a release to keep. Long retention on an unsigned
          # binary is how somebody installs last month's app. A *published*
          # build's durable copy is the GitHub Release itself, not this
          # artifact.
          retention-days: 14

      # The private key does not outlive the job that needed it. `always()`
      # because the run that failed is exactly the one that would otherwise
      # leave a Developer ID key in a keychain on a machine somebody else gets
      # next — and because the runner being thrown away afterwards is a
      # property of GitHub's infrastructure, not a decision this repository
      # gets to rely on.
      - name: Delete the signing keychain
        if: always()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/desktop-signing"
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            if [ -s "$dir/keychains.before" ]; then
              # shellcheck disable=SC2046
              /usr/bin/security list-keychains -d user -s $(cat "$dir/keychains.before")
            fi
            /usr/bin/security delete-keychain "$SIGNING_KEYCHAIN" || true
            echo "The signing keychain is gone."
          fi
          rm -rf "$dir"
