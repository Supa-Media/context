# Move every person's Tex into their workspace's object now, rather than on
# their next text (Dev, 2026-11-02; `docs/decisions/texting-assistant/
# tex-durable-objects.md`, "One object for a person's workspace and their Tex").
#
# Manual only. Run it with `dry_run` first: that counts the personal workspaces
# and calls nothing. It pages through `functions/texPersonMerge:run`, which
# makes each person's first Tex call (the gateway copies, checks and switches)
# and answers with counts and a cursor, never a path, a key or a word: this
# repository is public, and so is this job's log. Running it again moves
# nothing twice.
name: Tex into workspace objects

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to move."
        type: choice
        options:
          - staging
          - production
        default: staging
      dry_run:
        description: "Count only; move nothing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Move each person's Tex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cursor=""
          page=0
          total='{}'
          while :; do
            page=$((page + 1))
            if [ -z "$cursor" ]; then
              args=$(jq -cn --argjson dry "$DRY_RUN" '{dryRun: $dry}')
            else
              args=$(jq -cn --argjson dry "$DRY_RUN" --arg cursor "$cursor" '{dryRun: $dry, cursor: $cursor}')
            fi
            # stderr is dropped: `convex run` prints the function's own log lines there, and a failure logs a
            # workspace id, which this public log must not show (`scripts/check-convex-run-stderr.mjs`).
            answer=$(npx convex run functions/texPersonMerge:run "$args" 2>/dev/null)
            echo "page $page: $(echo "$answer" | jq -c 'del(.cursor)')"
            total=$(jq -cn --argjson a "$total" --argjson b "$(echo "$answer" | jq -c '(.failedCodes // {} | with_entries(.key |= "failed_" + .)) + del(.cursor, .done, .failedCodes)')" '$a + ($b | to_entries | map({key, value: (.value + ($a[.key] // 0))}) | from_entries)')
            if [ "$(echo "$answer" | jq -r '.done')" = "true" ]; then break; fi
            cursor=$(echo "$answer" | jq -r '.cursor')
            if [ "$page" -ge 4000 ]; then echo "stopped after $page pages"; exit 1; fi
          done
          echo "total: $total"
