# 1Password → GitHub Environment secrets.
#
# The middle hop of the canonical Supa flow, which this repo has been missing:
#
#   1Password  ──sync (this workflow)──▶  GitHub Environment variables + secrets
#                                                │
#                                                ├─▶ Convex   (deploy-convex.yml)
#                                                ├─▶ Workers  (deploy-mcp.yml, …)
#                                                └─▶ EAS      (build-mobile-ota.yml, deploy-production-ota.yml)
#
# The framework's `docs/SECRETS.md` is the normative description, and the
# secrets half runs its script (see "Variables" below for why not its reusable
# workflow). Until now Context had only the two
# ends: `pnpm setup:secrets` locally, and the deploy workflows pushing GitHub
# secrets onward. Nothing filled the middle, so every GitHub secret here was
# typed in by hand — 1Password was the documented source of truth with nothing
# reading from it, and no way to notice drift.
#
# ## Why nothing about a branch triggers this
#
# Two reasons, and the second is the one that decided it.
#
# **1Password rate-limits reads.** A sync on every push gets throttled and then
# starts failing deploys for a reason nobody will guess.
#
# **And this writes and deletes credentials**, which is not a thing a merge
# should do as a side-effect. `check-workflow-triggers.mjs` states the
# precedent for exactly this shape: `health-check.yml` "can redeploy production
# and it inherits secrets, and what keeps it safe is that nothing about a
# branch triggers it — no `push`, no `pull_request`, only `workflow_dispatch`."
# The same is true here, more so — a sync can PRUNE a secret.
#
# A first draft did carry a `push:` trigger scoped to the allowlist file, so
# that adding a name re-synced automatically. Rule D caught it: a workflow with
# a `push` trigger and no `pull_request` one runs its jobs only against code
# that has already landed. For an ordinary job the fix is to add
# `pull_request`; for this one that would run a privileged, secret-writing
# operation from a pull request, so the fix is to have no branch trigger at all.
#
# Nothing is lost by that. The case the push trigger covered — somebody adds a
# secret name and forgets to sync — is caught by
# `scripts/check-secrets-allowlist.mjs` in CI, which fails when the allowlist
# and the workflows disagree. A check that says "you forgot" is a better answer
# than a privileged job that runs itself.
#
# ## Deleting is opt-in
#
# The sync used to DELETE any `optional` key absent from the vault. That stops
# a deploy reading a stale value after somebody removes an item from
# 1Password, but a secret set by hand in GitHub and never added to the vault
# looks exactly the same, so a dry run here would have deleted live production
# credentials (`JWT_PRIVATE_KEY` among them) and nobody could run it.
#
# Since `@supa-media/scripts` 1.3.0 an absent key is KEPT unless `prune` is
# ticked, and every run writes a drift report to the job summary: names GitHub
# holds that the vault lacks, names the vault holds that GitHub lacks, and
# names outside the allowlist. A real run without `prune` only ever writes.
#
# `dry-run` still defaults to true: read the drift report first. Tick `prune`
# only once "In GitHub, missing from the vault" is empty, so the deletion list
# is exactly the items somebody removed on purpose.
#
# ## What this needs, once
#
#   OP_SERVICE_ACCOUNT_TOKEN  a 1Password service-account token, READ-ONLY and
#                             scoped to the `Context` vault alone. The single
#                             bootstrap secret: it is what authorizes this hop,
#                             so it cannot itself come through it.
#   GH_ADMIN_TOKEN            a GitHub PAT with repo admin (`secrets:write`).
#                             The default GITHUB_TOKEN cannot manage secrets,
#                             which is why this is separate rather than an
#                             oversight.
#
#                             It also writes environment VARIABLES
#                             (`gh variable set`), so a fine-grained PAT needs
#                             the Variables permission as well as Secrets.
#
# Both live as repository secrets (not environment ones), so a "both" run can
# read them from either matrix leg.
#
# ## Variables, and why the jobs live here rather than in the framework
#
# GitHub caps an environment at 100 secrets, and production reached it on
# 2026-11-18. The allowlist's `variables` lists are values that grant nothing
# (an app origin, an EAS project id, an on/off switch); they are written as
# GitHub Environment VARIABLES by `scripts/secrets-sync-plan.mjs`, read from
# the same `op://Context/<NAME>/<environment>` items, with the same
# read-everything-then-write and keep-unless-prune rules. A variable is not
# masked in a log, and these logs are public: the allowlist's header says what
# may be one.
#
# Variables are written FIRST, then secrets. Workflows read
# `vars.NAME || secrets.NAME` while production still has the old secrets, so a
# deploy works whichever of the two exists; a failed variables step stops the
# job before any secret changes.
#
# The framework's reusable workflow syncs secrets only and takes the allowlist
# file as it is, so this repository runs the same script itself, on an
# allowlist built per environment (`onlyIn` keeps a staging-only name such as
# AGENTMAIL_API_KEY out of production). Variables are generic enough for
# supa-framework; until it has them, this is the one place they are written.
name: Sync Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to sync"
        type: choice
        options: [production, staging, both]
        default: production
      dry-run:
        description: "Preview only — no secret or variable is written or deleted"
        type: boolean
        default: true
      prune:
        description: "Also delete GitHub secrets and variables the vault lacks (read the dry run's drift report first)"
        type: boolean
        default: false

# Never let two syncs of the same environment race. Every run is a manual
# dispatch now, so this guards the case of two people rotating at once — which
# would interleave writes to the same secrets, and under `prune` could leave
# one of them deleted.
concurrency:
  group: sync-secrets-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A job binds one environment, and "both" is not one, so it becomes a matrix.
  setup:
    name: Compute environment matrix
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.compute.outputs.environments }}
    steps:
      - name: Compute environment list
        id: compute
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in
            both) echo 'environments=["staging","production"]' >> "$GITHUB_OUTPUT" ;;
            staging|production) echo "environments=[\"$TARGET\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown environment $TARGET"; exit 1 ;;
          esac

  sync:
    name: Sync ${{ matrix.environment }} variables and secrets (Context)
    needs: setup
    strategy:
      # A failed staging sync must not cancel a production one.
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.setup.outputs.environments) }}
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refuse to run without the bootstrap secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then echo "::error::OP_SERVICE_ACCOUNT_TOKEN is not set"; exit 1; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_ADMIN_TOKEN is not set"; exit 1; fi

      # First, so a deploy reading `vars.NAME || secrets.NAME` never finds a
      # name gone from both. A failure here stops the job before any secret.
      - name: Sync variables to GitHub
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TARGET: ${{ matrix.environment }}
          DRY_RUN: ${{ inputs.dry-run }}
          PRUNE: ${{ inputs.prune }}
        run: |
          FLAGS=()
          if [ "$DRY_RUN" = "true" ]; then FLAGS+=(--dry-run); fi
          if [ "$PRUNE" = "true" ]; then FLAGS+=(--prune); fi
          node scripts/secrets-sync-plan.mjs variables "$TARGET" --vault Context "${FLAGS[@]}"

      - name: Build this environment's secret allowlist
        env:
          TARGET: ${{ matrix.environment }}
        run: node scripts/secrets-sync-plan.mjs secret-allowlist "$TARGET" "$RUNNER_TEMP/secrets-allowlist.json"

      - name: Sync secrets to GitHub
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TARGET: ${{ matrix.environment }}
          DRY_RUN: ${{ inputs.dry-run }}
          PRUNE: ${{ inputs.prune }}
        run: |
          ARGS=(--vault Context --allowlist "$RUNNER_TEMP/secrets-allowlist.json" --environment "$TARGET")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$PRUNE" = "true" ]; then ARGS+=(--prune); fi
          # Pinned to the first release where deleting is opt-in. An older
          # script deletes by default, so resolving one must fail, not run.
          npx --yes --package=@supa-media/scripts@^1.3.0 supa-sync-1password-to-github "${ARGS[@]}"

      - name: List what the environment holds
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TARGET: ${{ matrix.environment }}
        run: |
          echo "=== Variables ($TARGET) — names only ==="
          gh variable list --env "$TARGET" --repo "$GITHUB_REPOSITORY" --json name -q '.[].name'
          echo "=== Secrets ($TARGET) ==="
          gh secret list --env "$TARGET" --repo "$GITHUB_REPOSITORY"
