# 1Password → GitHub Environment secrets.
#
# The middle hop of the canonical Supa flow, which this repo has been missing:
#
#   1Password  ──sync (this workflow)──▶  GitHub Environment secrets
#                                                │
#                                                ├─▶ Convex   (deploy-convex.yml)
#                                                ├─▶ Workers  (deploy-mcp.yml, …)
#                                                └─▶ EAS      (deploy-mobile-update.yml)
#
# The framework's `docs/SECRETS.md` is the normative description and this is a
# thin wrapper on its reusable workflow. Until now Context had only the two
# ends: `pnpm setup:secrets` locally, and the deploy workflows pushing GitHub
# secrets onward. Nothing filled the middle, so every GitHub secret here was
# typed in by hand — 1Password was the documented source of truth with nothing
# reading from it, and no way to notice drift.
#
# ## Why nothing about a branch triggers this
#
# Two reasons, and the second is the one that decided it.
#
# **1Password rate-limits reads.** A sync on every push gets throttled and then
# starts failing deploys for a reason nobody will guess.
#
# **And this writes and deletes credentials**, which is not a thing a merge
# should do as a side-effect. `check-workflow-triggers.mjs` states the
# precedent for exactly this shape: `health-check.yml` "can redeploy production
# and it inherits secrets, and what keeps it safe is that nothing about a
# branch triggers it — no `push`, no `pull_request`, only `workflow_dispatch`."
# The same is true here, more so — a sync can PRUNE a secret.
#
# A first draft did carry a `push:` trigger scoped to the allowlist file, so
# that adding a name re-synced automatically. Rule D caught it: a workflow with
# a `push` trigger and no `pull_request` one runs its jobs only against code
# that has already landed. For an ordinary job the fix is to add
# `pull_request`; for this one that would run a privileged, secret-writing
# operation from a pull request, so the fix is to have no branch trigger at all.
#
# Nothing is lost by that. The case the push trigger covered — somebody adds a
# secret name and forgets to sync — is caught by
# `scripts/check-secrets-allowlist.mjs` in CI, which fails when the allowlist
# and the workflows disagree. A check that says "you forgot" is a better answer
# than a privileged job that runs itself.
#
# ## Deleting is opt-in
#
# The sync used to DELETE any `optional` key absent from the vault. That stops
# a deploy reading a stale value after somebody removes an item from
# 1Password, but a secret set by hand in GitHub and never added to the vault
# looks exactly the same, so a dry run here would have deleted live production
# credentials (`JWT_PRIVATE_KEY` among them) and nobody could run it.
#
# Since `@supa-media/scripts` 1.3.0 an absent key is KEPT unless `prune` is
# ticked, and every run writes a drift report to the job summary: names GitHub
# holds that the vault lacks, names the vault holds that GitHub lacks, and
# names outside the allowlist. A real run without `prune` only ever writes.
#
# `dry-run` still defaults to true: read the drift report first. Tick `prune`
# only once "In GitHub, missing from the vault" is empty, so the deletion list
# is exactly the items somebody removed on purpose.
#
# ## What this needs, once
#
#   OP_SERVICE_ACCOUNT_TOKEN  a 1Password service-account token, READ-ONLY and
#                             scoped to the `Context` vault alone. The single
#                             bootstrap secret: it is what authorizes this hop,
#                             so it cannot itself come through it.
#   GH_ADMIN_TOKEN            a GitHub PAT with repo admin (`secrets:write`).
#                             The default GITHUB_TOKEN cannot manage secrets,
#                             which is why this is separate rather than an
#                             oversight.
#
# Both live as repository secrets (not environment ones), so a "both" run can
# read them from either matrix leg.
name: Sync Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to sync"
        type: choice
        options: [production, staging, both]
        default: production
      dry-run:
        description: "Preview only — no secret is written or deleted"
        type: boolean
        default: true
      prune:
        description: "Also delete GitHub secrets the vault lacks (read the dry run's drift report first)"
        type: boolean
        default: false

# Never let two syncs of the same environment race. Every run is a manual
# dispatch now, so this guards the case of two people rotating at once — which
# would interleave writes to the same secrets, and under `prune` could leave
# one of them deleted.
concurrency:
  group: sync-secrets-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    uses: Supa-Media/supa-framework/.github/workflows/sync-secrets.yml@main
    with:
      vault: Context
      allowlist-path: scripts/secrets-allowlist.json
      environment: ${{ inputs.environment }}
      dry-run: ${{ inputs.dry-run }}
      prune: ${{ inputs.prune }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
