name: Promote to Production

# A green CI run from a push to main starts Deploy to Production for the
# newest commit on main whose CI succeeded. Staging is not a gate, and this
# workflow does not listen for it. scripts/promote-production.mjs picks the
# commit and dispatches `prod-deploy/<sha>`, a branch at that commit.
# Dispatching `main` would ship whatever the tip was at creation time,
# including a commit CI has not passed.
#
# A merge made with GITHUB_TOKEN does not start CI, so it does not start
# this workflow either. A merge from a person or an agent using their own
# credentials does. AUTO_DEPLOY_PRODUCTION=off leaves the manual press.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# One starter runs, and a newer wake-up replaces one that has not started.
# The run that starts reads main then, so it deploys the newest green commit
# even when an older CI run finished later. It cancels a queued deploy of
# any other commit. It does not cancel a production deploy that has already
# started; that run's first step stops on its own if a newer commit is green.
concurrency:
  group: start-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: Start Deploy to Production
    if: ${{ vars.AUTO_DEPLOY_PRODUCTION != 'off' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    # The script waits up to 15 minutes for a GitHub API rate limit to reset.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Deploy the newest green commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_EVENT: ${{ github.event.workflow_run.event }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/promote-production.mjs
