# Tex's gate (docs/decisions/testing/test-set-service.md; Dev2, 2026-11-15: "the test set should become the actual
# thing that the CI/CD gates on ... training shouldn't affect CI/CD speed. Even the dev shouldn't").
#
# Runs on main only. "Tex replay required" dispatches it with ref main and the pull request's number; its GitHub
# OIDC token then names this file on main, which is the only caller the eval service (infra/tex-eval) hands the
# Test Set to. The same file dispatched on a branch is refused there, and refused here before it asks.
#
# The harness is main's checkout (this one); the pull request's tree and main's tree only supply the node code that
# is judged (apps/mcp/bench/setsRun.mjs --tree). The conversations and answers are written to a folder only this
# job's user reads, never printed, uploaded or cached, and deleted at the end; the runner's own output goes to
# /dev/null. The service scores the answers and says pass or fail and counts by node, which is all this prints.
# A first answer that scores any node below main is answered twice more on both trees, and the service scores all
# three (docs/decisions/testing/test-set-service.md): the reviewer node is a model, and main itself swings by one test.
# Capped by the service: 1 run a commit, 10 changes a pull request, 1000 a day. The change is the patch-id of the
# pull request's diff from main, so a commit that only merges main re-runs without spending a pull request run.

name: Tex test set

run-name: Tex test set for #${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The pull request to gate (its number)"
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  actions: write
  pull-requests: read
  id-token: write

jobs:
  test-set:
    name: Run the Test Set on the change and on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      AI_GATEWAY_KEY_ALIASES: dev-claude-credits,dev2-claude-credits # aliases on the gateway's Provider Keys page, not secrets
      ANTHROPIC_CREDIT_KEY: ${{ secrets.ANTHROPIC_CREDIT_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same-repository pull requests only: a fork's code never runs beside production's keys.
      - name: The pull request and its commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a pull request number"; exit 1; }
          info="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,isCrossRepository,state)"
          head="$(jq -r .headRefOid <<< "$info")"
          [ "$(jq -r .isCrossRepository <<< "$info")" = "false" ] || { echo "::error::a fork's pull request is never run here"; exit 1; }
          [ "$(jq -r .state <<< "$info")" = "OPEN" ] || { echo "::error::pull request #$PR is not open"; exit 1; }
          git fetch --no-tags origin "pull/$PR/head"
          base="$(git merge-base origin/main "$head")"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state=pending -f context="Tex test set" \
            -f description="Running the Test Set on the change and on main" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: The change and main, side by side
        env:
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/change" "$HEAD"
          git worktree add "$RUNNER_TEMP/main" "$BASE"
          (cd "$RUNNER_TEMP/change" && pnpm install --frozen-lockfile > /dev/null)
          (cd "$RUNNER_TEMP/main" && pnpm install --frozen-lockfile > /dev/null)

      - name: Take the Test Set from the eval service (never printed)
        id: start
        env:
          HEAD: ${{ steps.pr.outputs.head }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          # GitHub runs this with bash -e: without +e a capped start (exit 3) ends the step before "capped" is set,
          # and the commit is marked "failed before a verdict" instead of the cap's own reason.
          set +e -uo pipefail
          umask 077
          change="$(git diff "$BASE" "$HEAD" | git patch-id --stable | cut -d' ' -f1)"
          node scripts/tex-test-set.mjs start --pr "$PR" --sha "$HEAD" --base "$BASE" ${change:+--change "$change"} --dir "$RUNNER_TEMP/sealed" | tee -a "$GITHUB_STEP_SUMMARY"
          code="${PIPESTATUS[0]}"
          if [ "$code" = "3" ]; then echo "capped=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$code"

      # Main's harness, each tree's nodes. Their output is dropped: it could hold a word of a conversation.
      # A first answer that scores any node below main is answered twice more on both trees (the service scores all three).
      - name: Answer the Test Set on the change and on main
        if: steps.start.outputs.capped != 'true'
        run: |
          set -euo pipefail
          umask 077
          answer() {
            tree=$1; out=$2; n=$3
            node apps/mcp/bench/run.mjs sets run --conversations "$RUNNER_TEMP/sealed/conversations.json" \
              --tree "$RUNNER_TEMP/$tree" --out "$RUNNER_TEMP/sealed/$out" > /dev/null 2>&1 \
              || echo "::warning::the $tree tree's run ended with an error on attempt $n; its unanswered tests count as wrong"
          }
          answer change branch.json 1
          answer main main.json 1
          repeat="$(node scripts/tex-test-set.mjs repeat-needed --dir "$RUNNER_TEMP/sealed")"
          if [ "$repeat" = yes ]; then
            echo "A step scored fewer right than main on the first answer: answering both trees twice more."
            for n in 2 3; do
              answer change "branch.$n.json" "$n"
              answer main "main.$n.json" "$n"
            done
          else
            echo "The first answer is no worse than main: answered once."
          fi

      - name: Score it in the eval service
        id: score
        if: steps.start.outputs.capped != 'true'
        run: node scripts/tex-test-set.mjs finish --dir "$RUNNER_TEMP/sealed" | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"

      # Counts only, the same ones printed above, added to the workspace's metrics sheet with a sheet key
      # (scripts/metric-rows.mjs; docs/decisions/data-and-metrics.md, "CI sends its own numbers"). Never part of the gate.
      - name: Send the counts to the metrics sheet
        if: always() && steps.score.outcome != 'skipped'
        continue-on-error: true
        env:
          METRICS_PUSH_KEY: ${{ secrets.METRICS_PUSH_KEY }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          [ -f "$RUNNER_TEMP/sealed/verdict.json" ] || { echo "No verdict, so nothing to send."; exit 0; }
          node scripts/metric-rows.mjs test-set --verdict "$RUNNER_TEMP/sealed/verdict.json" --pr "$PR" --sha "$HEAD"

      - name: Mark the commit and re-run the pull request's check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr.outputs.head }}
          CAPPED: ${{ steps.start.outputs.capped }}
          SCORE: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          [ -n "$HEAD" ] || exit 0
          if [ "$CAPPED" = "true" ]; then
            # A second run on a commit that already passed is the cap ("1 a
            # commit"). That refusal must not replace the pass. A first run
            # that is itself capped still marks failure below: there is no pass.
            passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/statuses" --jq '[.[] | select(.context == "Tex test set" and .state == "success")][0].state // ""')"
            if [ "$passed" = "success" ]; then
              echo "This commit already has a successful Tex test set status; a second run was capped and does not replace it."
              exit 0
            fi
            state=failure; description="$(head -c 139 "$RUNNER_TEMP/sealed/refused")"
          elif [ -f "$RUNNER_TEMP/sealed/verdict.json" ]; then
            [ "$SCORE" = "success" ] && state=success || state=failure
            description="$(node --input-type=module -e 'import { statusLine } from "./scripts/tex-test-set.mjs"; import { readFileSync } from "node:fs"; console.log(statusLine(JSON.parse(readFileSync(process.argv[1], "utf8"))))' "$RUNNER_TEMP/sealed/verdict.json")"
          else
            state=failure; description="The Test Set run failed before a verdict: read the run"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" -f context="Tex test set" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tex-replay-check.yml --commit "$HEAD" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [ -z "$run" ] || gh run rerun "$run" --repo "$GITHUB_REPOSITORY" || true

      - name: Forget the Test Set
        if: always()
        run: rm -rf "$RUNNER_TEMP/sealed"
