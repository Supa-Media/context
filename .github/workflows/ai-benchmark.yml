# Runs one of the AI jobs' benchmarks against the real models and shows the
# scores on the run's summary page, so anybody who can open the Actions tab can
# run a round and read it without a machine, a key or a chat.
#
# What it runs is `pnpm ai run`, `judge`, `score` and `summary` from
# apps/mcp/bench/, against the folder committed at apps/mcp/bench/ai/: invented
# people and workspaces, the tests, and the setups the round compares. No
# customer note is anywhere near it. The result and the key go up as two
# artifacts (plus the judging's sidecar when it stopped partway, which is
# what `judge_run_id` resumes from); the result and the key still belong in `@context-lc ai/results/`,
# and whoever reads the round copies them there (the key is a separate
# artifact so a judge can be handed the result alone).
#
# What it spends: the gateway's model calls, on the Claude plan credit first
# (ANTHROPIC_CREDIT_KEY), then Unified Billing; a four-arm texting-assistant
# round is a few dollars, almost all of it the Sonnet arm. The judging refuses
# over `max_usd` before its first call (default $1; Haiku judges a round for
# cents). The `fake` input runs the whole pipeline on a scripted model and
# spends nothing, which is how to check the workflow itself.
#
# Manual only. It reads production's secrets, and nothing about a branch may
# run it: no `push`, no `pull_request`, no schedule (a schedule would spend
# money on nobody's say-so). check-workflow-triggers.mjs holds that line.
name: AI Benchmark

on:
  workflow_dispatch:
    inputs:
      job:
        description: "The job to benchmark (tests/<job>.md, setups/<job>/)"
        required: false
        default: "texting-assistant"
      setups:
        description: "Setups to run, comma-separated; empty runs every setup in setups/<job>/"
        required: false
        default: ""
      questions:
        description: "Questions to ask, comma-separated; empty asks them all"
        required: false
        default: ""
      runs:
        description: "Runs per question; empty uses the test's"
        required: false
        default: ""
      parallel:
        description: "How many processes answer at once; they wait on models, not the runner, so twelve is fine"
        required: false
        default: "12"
      judge:
        description: "The judge model; empty uses the test's (Haiku)"
        required: false
        default: ""
      max_usd:
        description: "The most the judging may spend; it refuses over this before its first call"
        required: false
        default: "1"
      fake:
        description: "Scripted model, no keys, spends nothing: checks the workflow"
        type: boolean
        default: false
      judge_run_id:
        description: "Judge and score an earlier run's result instead of answering again: that run's id (the number in its URL). The answers are not paid for twice."
        required: false
        default: ""
      calibrate:
        description: "With judge_run_id: instead of judging, put that run's judged answers to a decision model and report how often it agrees with the judge (nothing is written to the result)"
        type: boolean
        default: false
      decision:
        description: "The decision model to calibrate; empty means Clef"
        required: false
        default: ""

permissions:
  contents: read
  # Reading another run's artifacts (judge_run_id) needs it; nothing here writes.
  actions: read

concurrency:
  group: ai-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run, judge, score
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      AI_GATEWAY_ACCOUNT_ID: ${{ secrets.AI_GATEWAY_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      ANTHROPIC_CREDIT_KEY: ${{ secrets.ANTHROPIC_CREDIT_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      BENCH_JOB: ${{ inputs.job || 'texting-assistant' }}
      BENCH_FAKE: ${{ inputs.fake && '--fake' || '' }}
      # Every free-text input arrives here and nowhere else. GitHub pastes an
      # expression into a `run:` line as text before bash parses it, so a value
      # holding a quote would be a command in a job that carries production's
      # model and gateway credentials. An `env:` value is handed to the process,
      # not to the parser; `scripts/check-workflow-interpolation.mjs` keeps it
      # that way. The shapes are checked below as well, because a benchmark
      # argument that is not a number or a name is a mistake worth a clear
      # refusal rather than a stack trace twenty minutes in.
      BENCH_PARALLEL: ${{ inputs.parallel || '12' }}
      BENCH_SETUPS: ${{ inputs.setups }}
      BENCH_QUESTIONS: ${{ inputs.questions }}
      BENCH_RUNS: ${{ inputs.runs }}
      BENCH_JUDGE: ${{ inputs.judge }}
      BENCH_MAX_USD: ${{ inputs.max_usd || '1' }}
      BENCH_JUDGE_RUN_ID: ${{ inputs.judge_run_id }}
      BENCH_CALIBRATE: ${{ inputs.calibrate && 'yes' || '' }}
      BENCH_DECISION: ${{ inputs.decision }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refuse an argument that is not the shape it should be
        run: |
          set -euo pipefail
          refuse() { echo "::error::$1"; exit 1; }
          [[ "$BENCH_JOB" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || refuse "job must be a lowercase name (tests/<job>.md)."
          [[ "$BENCH_PARALLEL" =~ ^[0-9]{1,3}$ ]] || refuse "parallel must be a whole number."
          [[ "$BENCH_RUNS" =~ ^[0-9]{0,3}$ ]] || refuse "runs must be a whole number, or empty for the test's own."
          [[ "$BENCH_MAX_USD" =~ ^[0-9]{1,4}(\.[0-9]{1,2})?$ ]] || refuse "max_usd must be a number of dollars."
          [[ "$BENCH_JUDGE" =~ ^[a-z0-9@/._-]{0,64}$ ]] || refuse "judge must be a model id."
          [[ "$BENCH_SETUPS" =~ ^[A-Za-z0-9,._-]{0,256}$ ]] || refuse "setups must be comma-separated setup names."
          [[ "$BENCH_QUESTIONS" =~ ^[0-9,]{0,256}$ ]] || refuse "questions must be comma-separated numbers."
          [[ "$BENCH_JUDGE_RUN_ID" =~ ^[0-9]{0,20}$ ]] || refuse "judge_run_id must be a run id, or empty."
          [[ "$BENCH_DECISION" =~ ^[a-z0-9@/._-]{0,64}$ ]] || refuse "decision must be a model id."
          [ -z "$BENCH_CALIBRATE" ] || [ -n "$BENCH_JUDGE_RUN_ID" ] || refuse "calibrate needs judge_run_id: the run whose judged answers to compare against."

      - name: Refuse to run without the keys a real round needs
        if: ${{ !inputs.fake }}
        run: |
          for var in AI_GATEWAY_ACCOUNT_ID AI_GATEWAY_ID AI_GATEWAY_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_AI_TOKEN BRAVE_SEARCH_API_KEY; do
            if [ -z "${!var}" ]; then echo "::error::$var is empty in the production environment (scripts/secrets-allowlist.json says which sync fills it)."; exit 1; fi
          done

      # A round whose judging died (a judge reply that was not JSON, a gateway
      # outage, the runner lost) has answers that cost real money and are
      # already an artifact. judge_run_id takes those artifacts, and the judging
      # sidecar when that run saved one, and picks up where it stopped.
      - name: Fetch an earlier run's answers instead of answering again
        if: ${{ inputs.judge_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          merge-multiple: true
          path: apps/mcp/bench/ai/results
          run-id: ${{ inputs.judge_run_id }}
          github-token: ${{ github.token }}

      - name: Name the result
        id: name
        run: |
          set -euo pipefail
          if [ -n "$BENCH_JUDGE_RUN_ID" ]; then
            result="$(find apps/mcp/bench/ai/results -maxdepth 1 -name '*.md' ! -name '* key.md' | head -n 1)"
            [ -n "$result" ] || { echo "::error::run $BENCH_JUDGE_RUN_ID has no benchmark-result artifact to judge."; exit 1; }
            [ -f "${result%.md} key.md" ] || { echo "::error::run $BENCH_JUDGE_RUN_ID has no benchmark-key artifact beside its result."; exit 1; }
          else
            stamp="$(date -u +%Y-%m-%d)"
            result="apps/mcp/bench/ai/results/${stamp} ${BENCH_JOB} gh-${{ github.run_number }}.md"
          fi
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "key=${result%.md} key.md" >> "$GITHUB_OUTPUT"
          echo "judging=${result}.judging.json" >> "$GITHUB_OUTPUT"

      - name: Run every setup against every question
        if: ${{ inputs.judge_run_id == '' }}
        env:
          RESULT: ${{ steps.name.outputs.result }}
        run: |
          args=("$BENCH_JOB" --parallel "$BENCH_PARALLEL" --out "$RESULT")
          [ -n "$BENCH_SETUPS" ] && args+=(--setups "$BENCH_SETUPS")
          [ -n "$BENCH_QUESTIONS" ] && args+=(--questions "$BENCH_QUESTIONS")
          [ -n "$BENCH_RUNS" ] && args+=(--runs "$BENCH_RUNS")
          [ -n "$BENCH_FAKE" ] && args+=("$BENCH_FAKE")
          pnpm ai run "${args[@]}"

      # A calibration asks whether a decision model (Clef, Jev-compatible) reads
      # the judged answers the way the judge did: one yes-or-no per check, and
      # the agreement by kind and by line on the summary page. The judging of
      # record is untouched, and nothing is scored.
      - name: Compare a decision model with the judge
        if: ${{ inputs.calibrate }}
        env:
          RESULT: ${{ steps.name.outputs.result }}
        run: |
          args=("$RESULT")
          [ -n "$BENCH_DECISION" ] && args+=(--decision "$BENCH_DECISION")
          [ -n "$BENCH_FAKE" ] && args+=("$BENCH_FAKE")
          pnpm --silent ai calibrate "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Judge every answer, blind
        if: ${{ !inputs.calibrate }}
        env:
          RESULT: ${{ steps.name.outputs.result }}
        run: |
          args=("$RESULT" --max-usd "$BENCH_MAX_USD")
          [ -n "$BENCH_JUDGE" ] && args+=(--judge "$BENCH_JUDGE")
          [ -n "$BENCH_FAKE" ] && args+=("$BENCH_FAKE")
          pnpm ai judge "${args[@]}"

      - name: Score
        if: ${{ !inputs.calibrate }}
        env:
          RESULT: ${{ steps.name.outputs.result }}
        run: pnpm ai score "$RESULT"

      - name: Show the scores on this run's summary page
        if: ${{ always() && steps.name.outputs.result != '' }}
        env:
          RESULT: ${{ steps.name.outputs.result }}
        run: |
          if [ -f "$RESULT" ]; then
            pnpm --silent ai summary "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_The run wrote no result note; read the job log._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the result note
        if: ${{ always() && steps.name.outputs.result != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: ${{ steps.name.outputs.result }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the key note, separately
        if: ${{ always() && steps.name.outputs.key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-key
          path: ${{ steps.name.outputs.key }}
          if-no-files-found: ignore
          retention-days: 90

      # Only exists when the judging stopped partway: the verdicts it had, so a
      # judge_run_id run of this run resumes instead of paying for them again.
      - name: Upload the judging sidecar, when the judging stopped partway
        if: ${{ always() && steps.name.outputs.judging != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-judging
          path: ${{ steps.name.outputs.judging }}
          if-no-files-found: ignore
          retention-days: 90
