# The gateway's own CI.
#
# apps/mcp is deliberately outside the Supa framework's reusable pipeline: that
# workflow filters on apps/mobile, apps/convex, and packages/shared, so gateway
# changes matched nothing and its suite never ran. The most security-sensitive
# code in the repo — SigV4 signing, path handling, the privacy engine — was the
# least covered in CI, which is how two HIGH-severity bugs reached a pull
# request with a green check.
#
# It runs on bare node with no install step, because apps/mcp has no
# dependencies and we intend to keep it that way (see CONTRIBUTING.md).
name: MCP Gateway

# No `paths:` filter on pull_request, deliberately.
#
# These jobs are meant to be required status checks. A required check that is
# filtered out never reports at all — GitHub leaves it pending as "Expected"
# and the pull request can never merge. That is not hypothetical: it blocked
# every PR that did not touch apps/mcp. The jobs take seconds, so running them
# on every PR is far cheaper than the footgun.
#
# And no `branches:` filter on pull_request either — the same failure one level
# up. `pull_request: branches: [main]` reads as "check pull requests" and means
# "check pull requests INTO main", so a pull request based on any other branch
# ran no checks at all. Measured: #169, based on `offline/notes-cache`, had zero
# check runs across its whole life and was merged on local test runs alone.
# Stacked pull requests are the normal shape here — basing a fix on the pull
# request it fixes is what keeps its diff reviewable — so "merge only on green
# CI" silently did not apply to exactly those, because there was no green to be
# had.
#
# The key is absent rather than `branches: ['**']`. The two are equivalent to
# GitHub, and only one of them has a footgun: a later tidy-up of `'**'` to `'*'`
# stops matching any branch with a slash in it, which is every branch this repo
# uses (`claude/…`, `offline/…`), and would restore this bug without touching
# the word `main`. `scripts/check-workflow-triggers.mjs` enforces the rule on
# every workflow.
#
# The `push:` filter below stays on `main` and must: a push run is the deploy
# lane's neighbour, not a pull request's check.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/mcp.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Required. setup-node defaults this to true, detects pnpm from the
          # root package.json's `packageManager` field, and shells out to
          # `pnpm` to resolve its cache directory. This workflow deliberately
          # never installs pnpm, so the step dies with "Unable to locate
          # executable file: pnpm" before the suite ever runs.
          package-manager-cache: false

      # No `pnpm install`. If this ever needs one, a dependency crept into the
      # gateway and that is the thing to fix.
      - name: Worker fetch options workerd implements
        run: node scripts/check-worker-fetch-options.mjs

      - name: Run test suite
        working-directory: apps/mcp
        run: node test/test.mjs

  meetings:
    name: Test Meetings Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # NO CI JOB RAN THIS PACKAGE'S SUITE AT ALL. Measured on #247, from that
      # run's own `Detect Changes` log: `ci.yml` filters on
      # `packages/shared/**`, `apps/mobile/**`, `apps/convex/**` and the e2e
      # paths, all four false against a diff of five files under
      # `packages/meetings/**` and `docs/`; and no other workflow invoked
      # `packages/meetings/test`. So its checks were local-only, on code the
      # gateway imports by relative path and files meetings into a customer's
      # bucket with.
      #
      # The gateway's own suite is not a substitute, and the same pull request
      # measured why: delete `normalizeMeetingFolder`'s idempotence rule and
      # one gateway check goes red, but replace it with the per-segment variant
      # that refuses 36 folders a real vault would have and the gateway stays
      # GREEN while this package goes 2 red. A consumer's suite sees the
      # behaviour it happens to exercise; the owning package's suite is the
      # contract.
      #
      # It lives in this file rather than in `ci.yml` for the reason in the
      # header above: this workflow carries no `paths:` filter on
      # `pull_request`, so it runs on every pull request — including ones that
      # change this package and touch nothing else, which is precisely the
      # shape that ran nothing before. Bare node with no install, because this
      # package has no dependencies either.
      - name: Run test suite
        working-directory: packages/meetings
        run: node test/test.mjs

  workflows-parse:
    name: Workflows parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # A workflow file that does not parse is not a failing check — GitHub
      # ignores the file entirely, so it produces no run, no error, and no
      # status at all. The pull request then goes green having never executed
      # the jobs somebody just wrote, which is this repository's most-repeated
      # failure shape (see 3-resources/engineering/false-green-patterns.md).
      #
      # It has already happened once: `hook.yml` shipped with an unquoted
      # `node:` inside a step name, which YAML reads as a mapping value. The
      # package's whole suite was silently absent from CI.
      #
      # This job deliberately lives in a DIFFERENT workflow from the ones it
      # checks, because a checker inside the broken file cannot run either.
      - name: Every workflow file parses as YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          failed = False
          for path in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              try:
                  document = yaml.safe_load(open(path))
              except Exception as error:
                  print(f"FAIL {path}: {error}")
                  failed = True
                  continue
              if not isinstance(document, dict) or "jobs" not in document:
                  print(f"FAIL {path}: parsed, but declares no jobs")
                  failed = True
                  continue
              print(f"ok   {path}")

          if failed:
              print("")
              print("A workflow that does not parse is ignored by GitHub — no run, no")
              print("failing check, and a pull request that goes green without it.")
              sys.exit(1)
          PY

      # Runs after the parse above, deliberately: a file GitHub cannot parse is
      # ignored entirely, so what its `on:` block says is moot and reporting it
      # first would name the wrong fault.
      #
      # A pull request based on a branch other than `main` used to run NO
      # checks at all — see the header, and #169, which merged with zero check
      # runs. The same block decides that no deploy workflow may be reached by
      # a pull request at all, which is the assertion that actually protects
      # something: widening CI's triggers has an obvious-looking next step
      # ("make the rest consistent") that would run unreviewed code with the
      # account's Cloudflare credentials. The actor there is a branch pushed
      # HERE, not a fork — a fork's run inherits no secrets, so it is the one
      # shape that could not do it.
      #
      # It runs here AND in email-worker.yml on purpose. A checker hosted in
      # one workflow cannot see that workflow's own trigger being narrowed —
      # narrowing it stops the job running on the pull request that did it.
      # Two hosts is the cheapest way to keep one narrowing visible; dropping
      # either copy restores that blind spot.
      #
      # `--self-test` first, for the same reason the gateway-contracts job runs
      # one: a checker that reports nothing because it stopped working is the
      # exact failure it was written to catch.
      - name: Workflow triggers reach pull requests, and deploys reach none
        run: |
          node scripts/check-workflow-triggers.mjs --self-test
          node scripts/check-workflow-triggers.mjs

  no-nul-bytes:
    name: Source stays diffable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # A raw NUL in a source file makes git call it binary, and a binary file
      # has no diff: `git show` and GitHub both render `Bin 0 -> N bytes,
      # 0 insertions(+)`. Five test files had one, as a hostile-input fixture —
      # among them the security tests for the newest surfaces. In a repository
      # whose stated model is that self-review is the only review, the files
      # carrying the evidence for those pull requests could not be read by the
      # only review they were going to get.
      #
      # This checks for the NUL, not for git's verdict, because the two are not
      # the same set and the difference is a trap. Git sniffs only the FIRST
      # 8000 BYTES: of the seven files that carried one, five had it early
      # enough to be called binary and two did not — including one in
      # production source. Those two were latent, one edit away from flipping,
      # and a guard written against `git diff --numstat` would have missed
      # them. Driven to confirm the mechanism: the same content with the NUL at
      # byte 100 diffs as `-  -`, at byte 9000 as `3  0`.
      #
      # `\u0000` in the source is the same string at runtime, so nothing about
      # any fixture's meaning changes.
      #
      # **The rule is NUL and nothing else, deliberately.** A raw DEL or ESC in
      # a fixture is invisible to a reviewer too, which is the weaker half of
      # the same argument — but it does not flip git's verdict, so it costs no
      # diff, and a rule over C0 generally has to carve out tab, LF and CR and
      # becomes a style rule with exceptions. The one raw DEL left in the tree
      # is escaped in this commit for consistency on its own line; the job does
      # not police it.
      #
      # **The skip list names what is binary, never what is text.** An
      # allow-list of source extensions was written first and already missed
      # six kinds present in the tree (.jsonc, .patch, .npmrc, .gitkeep,
      # .gitignore, .example), and would have kept missing every kind added
      # after it — silently, which is the failure this job exists to stop.
      # Inverted, a new source type is covered the day it appears and a new
      # binary asset type fails once, loudly, and gets added on purpose. That
      # is the same trade `CREDENTIAL_BARRIERS` makes: the enumeration is the
      # mitigation because extending it forces a conversation.
      #
      # It lives here rather than in a package suite because this workflow's
      # `pull_request` trigger has no `paths:` filter — see the header. (Its
      # `push` trigger does filter, so a direct push to main touching only
      # apps/convex would not run this; merges go through the pull-request run,
      # so coverage is real, and saying otherwise would be one of the
      # overstatements this repository keeps a list of.) The rule spans four
      # packages, and
      # a guard in any one of their filtered jobs would be silent on pull
      # requests touching the others, which is this repository's most-repeated
      # failure shape.
      - name: No tracked source file carries a NUL
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, tempfile

          BINARY_SUFFIXES = (
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".icns",
              ".woff", ".woff2", ".ttf", ".otf", ".eot",
              ".pdf", ".wasm", ".zip", ".gz", ".tgz", ".mp4", ".mov", ".keystore",
          )

          def first_nul(blob):
              return blob.find(b"\x00")

          # The checker, checked. A sample it must flag and one it must not —
          # otherwise a `return -1` here is a green run forever.
          assert first_nul(b'const a = "x";\n') == -1
          assert first_nul(b'const a = "\x00";\n') == 11
          # A sample past git's window, because the comment above is an active
          # invitation to "align the checker with git" by writing
          # `blob[:8000].find(...)`. Both samples above are fifteen bytes, so
          # they pass under that edit — and on the tree this job was written
          # for it would find five of seven and still exit 1, looking like it
          # worked while missing exactly the two files that motivated it.
          assert first_nul(b"x" * 9000 + b"\x00") == 9000

          def nul_report(path, blob):
              # The WHOLE per-file decision, in one function, because the
              # comparison at a call site is as mutable as the search itself:
              # with `first_nul` pinned and the site left as `if at != -1`,
              # rewriting that site to `if at > 0` passes every sample that
              # does not begin with a NUL, and drops the byte-0 case silently.
              at = first_nul(blob)
              if at == -1:
                  return None
              line = blob[:at].count(b"\n") + 1
              return f"{path}:{line} (byte {at})"

          assert nul_report("a.ts", b'const a = "x";\n') is None
          assert nul_report("a.ts", b"\x00rest") == "a.ts:1 (byte 0)"
          assert nul_report("a.ts", b"x\n\x00") == "a.ts:2 (byte 2)"
          assert nul_report("a.ts", b"x" * 9000 + b"\x00") == "a.ts:1 (byte 9000)"
          # With a newline AFTER the NUL, because every sample above agrees
          # with a whole-blob count and only this one distinguishes the prefix.
          assert nul_report("a.ts", b"one\n\x00\nthree\n") == "a.ts:2 (byte 4)"

          # A suffix, not a substring: `str.endswith` is happy with
          # `"ingest.ts"`, which exempts one guilty file by name while the
          # earn-your-skip rule below sees nothing wrong — that file really
          # does hold a NUL. The wide edit is caught; this is the narrow one.
          assert all(
              suffix.startswith(".") and suffix.count(".") == 1
              for suffix in BINARY_SUFFIXES
          ), "BINARY_SUFFIXES holds file extensions, not names"

          def read_blob(path):
              # The whole file. `.read(8000)` here is the same "align it with
              # git" edit the comment above invites, one line further down than
              # the one the 9000-byte sample blocks — and it reproduces the
              # original bug exactly: on the tree this job was written for it
              # finds five files instead of seven, missing both of the two past
              # the window, one of them production source. (Measured. An
              # earlier version of this comment said ten of twelve, which was a
              # reviewer's count over a scope that included the five PNGs this
              # job skips — and it contradicted the correct figure written
              # twice elsewhere in this same file.)
              return open(path, "rb").read()

          def classify(entries):
              # The whole per-file loop, so a synthetic corpus can pin the
              # counting, the reporting AND the earn-your-skip rule — which was
              # the one guard here with prose defending it and no sample.
              scanned = 0
              failed = []
              unearned = []
              for path, blob in entries:
                  report = nul_report(path, blob)
                  if path.lower().endswith(BINARY_SUFFIXES):
                      # The skip list has to EARN each entry. Pinning "is there
                      # a NUL" while leaving "in which files" unpinned is a
                      # guard whose decision is held and whose subject is not,
                      # and the cheap edit is to quiet this job by adding `.ts`
                      # to the tuple above — which passes, silently, and turns
                      # the whole job off. A real binary asset contains a NUL;
                      # a source file does not, so a skipped file with none is
                      # a skip nobody justified.
                      if report is None:
                          unearned.append(path)
                      continue
                  scanned += 1
                  if report is not None:
                      failed.append(report)
              return scanned, failed, unearned

          assert classify([
              ("a.ts", b"clean\n"),
              ("b.ts", b"bad\x00\n"),
              ("c.png", b"\x89PNG\x00"),
              ("d.png", b"not a real asset"),
          ]) == (2, ["b.ts:1 (byte 3)"], ["d.png"])

          with tempfile.NamedTemporaryFile(suffix=".ts", delete=False) as probe:
              probe.write(b"x" * 9000 + b"\x00")
          assert classify([(probe.name, read_blob(probe.name))])[0] == 1
          assert classify([(probe.name, read_blob(probe.name))])[1] != [], (
              "read_blob is not reading past byte 8000"
          )
          os.unlink(probe.name)

          def exit_code(failed, unearned):
              # Whether this run fails, separated from the printing so both
              # branches have a sample. Every helper above is self-tested and
              # this was not: deleting `sys.exit(1)` from either report block
              # is invisible to all of them, and the job then prints every
              # FAIL line it found and exits 0 — the "green because it never
              # executed" shape the floor's own comment cites.
              return 1 if (failed or unearned) else 0

          assert exit_code([], []) == 0
          assert exit_code(["a.ts:1 (byte 0)"], []) == 1
          assert exit_code([], ["d.png"]) == 1
          assert exit_code(["a.ts:1 (byte 0)"], ["d.png"]) == 1

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout.split(b"\0")

          paths = [
              raw.decode("utf-8", "surrogateescape") for raw in tracked if raw
          ]
          # A generator, so one 86KB asset is not held beside 514 other files.
          scanned, failed, unearned = classify(
              (path, read_blob(path)) for path in paths
          )

          # A floor, because every other way this job can be wrong ends in
          # "scanned nothing, printed ok, exited 0" — an empty index, a
          # `working-directory:` added to the step (plausible in a file called
          # mcp.yml, and it would scan 28 files and pass with a NUL still in
          # infra/), or `git ls-files` failing without `check=True`. Green
          # because it never executed is this repository's most-repeated
          # failure shape, and `workflows-parse` in this same file exists for
          # exactly that reason.
          assert scanned > 400, f"only {scanned} files scanned — wrong root, or an empty index"

          # And the roots, because a count alone does not notice a directory
          # going missing: narrowing to `git ls-files -- apps packages` still
          # scans 441 and clears the floor above while dropping infra/ — which
          # holds one of the seven files this job was written for. Named roots
          # do not drift as the file count does.
          roots = {path.split("/")[0] for path in paths}
          assert {"apps", "infra", "packages", "scripts", ".github"} <= roots, (
              f"whole directories missing from the walk: {sorted(roots)}"
          )
          # What this does NOT pin, stated rather than implied: a pathspec that
          # names all five still passes, and would silently drop patches/,
          # docs/ and the root files. Naming them all would make this list
          # churn on every new directory, which is its own kind of untrue. The
          # five are the ones that hold source, and scripts/ is in the list
          # because dropping it takes three other CI guards with it.

          # Conservation: every tracked path was either scanned or skipped, and
          # the numbers printed below are the ones classify actually produced
          # rather than a count with no counting rule behind it.
          skipped = sum(1 for path in paths if path.lower().endswith(BINARY_SUFFIXES))
          assert scanned + skipped == len(paths), (
              f"{scanned} + {skipped} != {len(paths)} tracked paths"
          )

          print(f"scanned {scanned} tracked files, skipped {skipped}")
          for entry in failed:
              print(f"FAIL {entry}")
          for entry in unearned:
              print(f"FAIL {entry}: on the binary skip list and holds no NUL — it is text, so scan it")
          if unearned and not failed:
              print("")
              print("BINARY_SUFFIXES is for binary assets. Something textual is being")
              print("skipped by it, which switches this job off for that whole file")
              print("type. Remove the suffix rather than the coverage.")
          if failed:
              print("")
              print("A NUL makes git treat the file as binary, so it has no diff and")
              print("cannot be reviewed. Write it as an escape instead — \\u0000 in a")
              print("string literal is the same string at runtime. If this is a new")
              print("kind of binary ASSET, add its suffix to BINARY_SUFFIXES above,")
              print("deliberately, rather than widening the rule.")
          if not failed and not unearned:
              print("ok   every tracked source file can be diffed")
          # One exit, from the tested function. Two `sys.exit(1)` calls inside
          # print blocks were two places for the exit to go missing without a
          # sample noticing.
          sys.exit(exit_code(failed, unearned))
          PY

  no-dependencies:
    name: Gateway stays dependency-free
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Assert apps/mcp declares no dependencies
        run: |
          set -euo pipefail
          for field in dependencies optionalDependencies peerDependencies bundleDependencies; do
            declared=$(node -p "JSON.stringify(require('./apps/mcp/package.json').$field || {})")
            if [ "$declared" != "{}" ]; then
              echo "apps/mcp declared $field: $declared"
              echo ""
              echo "The gateway is the piece users self-host, and a dependency is"
              echo "something that can break under them or quietly change what"
              echo "happens to their notes. Propose it in an issue first."
              exit 1
            fi
          done
          echo "OK — no dependencies in any field."

      # The real invariant is "apps/mcp/src imports nothing but its own files".
      #
      # This was a grep until it matched prose: a comment reading
      # `… from "not yours"` is not an import. The check is now a script that
      # strips comments and only looks at statement positions, and it
      # self-tests — a guard nobody has checked is not a guard.
      - name: Assert apps/mcp/src imports only relative paths
        run: |
          node scripts/check-gateway-imports.mjs --self-test
          node scripts/check-gateway-imports.mjs apps/mcp/src
