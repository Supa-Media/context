# Read back what the texting assistant (context-agent) logged in production
# over the last few minutes, so a turn that went quiet can be taken apart
# without a dashboard (Tex on WhatsApp, 2026-10-27). Manual only.
#
# It asks Workers Observability for the Worker's events and prints, per log
# line, only a fixed list of keys: the event name, its outcome, reason, status
# and service. Every one of those is a code the Worker chose, never a person's
# words, number or chat id, so nothing anyone texted reaches this public run
# page. A line without an `event` key is counted, not printed.
name: Texting assistant logs

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How far back to read, in minutes (1 to 120)."
        required: true
        default: "30"
      event:
        description: "Only lines whose event starts with this (blank for all), e.g. group_ or whapi"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  logs:
    name: Read the texting assistant's recent log codes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINUTES: ${{ inputs.minutes }}
          EVENT_PREFIX: ${{ inputs.event }}
        run: |
          set -euo pipefail
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number" >&2; exit 1 ;; esac
          case "$EVENT_PREFIX" in *[!a-z0-9_]*) echo "event must be lowercase letters, digits and underscores" >&2; exit 1 ;; esac
          node - <<'EOF'
          const minutes = Math.min(120, Math.max(1, Number(process.env.MINUTES)));
          const prefix = process.env.EVENT_PREFIX ?? "";
          const to = Date.now();
          const from = to - minutes * 60_000;
          const keep = ["event", "outcome", "reason", "status", "service", "kind", "attempts"];
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query`;
          const lines = [];
          let skipped = 0;
          let offset;
          for (let page = 0; page < 10; page++) {
            const body = {
              queryId: "agent-logs",
              timeframe: { from, to },
              view: "events",
              limit: 500,
              ...(offset ? { offset } : {}),
              parameters: { filters: [{ key: "$metadata.service", operation: "eq", type: "string", value: "context-agent" }] },
            };
            const response = await fetch(url, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, "content-type": "application/json" },
              body: JSON.stringify(body),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) {
              console.error(`Observability refused the query (${response.status}): ${JSON.stringify(data.errors ?? [])}`);
              process.exit(1);
            }
            const events = data.result?.events?.events ?? [];
            for (const e of events) {
              let source = e.source;
              if (typeof source === "string") { try { source = JSON.parse(source); } catch { source = null; } }
              if ((source === null || typeof source !== "object") && typeof e.$metadata?.message === "string") {
                try { source = JSON.parse(e.$metadata.message); } catch { source = null; }
              }
              const level = e.$metadata?.level ?? "";
              if (source === null || typeof source !== "object" || typeof source.event !== "string") {
                if (level === "error" && e.$metadata?.error) lines.push([e.timestamp, `exception ${String(e.$metadata.error).slice(0, 80).replace(/[^\w .:-]/g, "")}`]);
                else skipped++;
                continue;
              }
              if (!source.event.startsWith(prefix)) continue;
              const picked = keep.filter((k) => source[k] !== undefined).map((k) => `${k}=${String(source[k]).replace(/[^\w.:-]/g, "").slice(0, 60)}`);
              lines.push([e.timestamp, picked.join(" ")]);
            }
            if (events.length < 500) break;
            offset = events.at(-1)?.$metadata?.id;
            if (!offset) break;
          }
          lines.sort((a, b) => a[0] - b[0]);
          for (const [at, text] of lines) console.log(`${new Date(at).toISOString()} ${text}`);
          console.log(`${lines.length} lines printed, ${skipped} without an event code not printed.`);
          EOF
