# How long each named step of an MCP call takes in production or staging, read from the gateway's
# `mcp_entry` dataset (`apps/mcp/src/mcp/mcpEntryPoint.js`): per data center that served the call and per step, how many, the median and the 95th
# percentile of its total milliseconds per request, and how many times it ran per request. Names, routes and times only: the dataset holds no path and no words, and this
# prints no workspace. Read-only, manual only.
name: MCP entry timings

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to read."
        type: choice
        options: [production, staging]
        default: production
      call:
        description: "Which call, e.g. tools/call:fetch, tools/call:manage (every action) or tools/call:manage:archive (one action)."
        required: true
        default: "tools/call:write"
      hours:
        description: "How far back to read, in hours (1 to 168)."
        required: true
        default: "1"
      minutes:
        description: "Instead of hours: how far back to read, in minutes (5 to 1440), e.g. since a deploy. Blank uses hours."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  timings:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Read the timings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CALL: ${{ inputs.call }}
          HOURS: ${{ inputs.hours }}
          MINUTES: ${{ inputs.minutes }}
          DATASET: ${{ inputs.environment == 'staging' && 'mcp_entry_staging' || 'mcp_entry' }}
        run: |
          set -euo pipefail
          case "$CALL" in ''|*[!a-z_/:]*) echo "call must be lowercase letters, _, / and :" >&2; exit 1 ;; esac
          case "$HOURS" in ''|*[!0-9]*) echo "hours must be a number" >&2; exit 1 ;; esac
          if [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 168 ]; then echo "hours must be 1 to 168" >&2; exit 1; fi
          window="$HOURS' HOUR"
          span="$HOURS h"
          if [ -n "${MINUTES:-}" ]; then
            case "$MINUTES" in *[!0-9]*) echo "minutes must be a number" >&2; exit 1 ;; esac
            if [ "$MINUTES" -lt 5 ] || [ "$MINUTES" -gt 1440 ]; then echo "minutes must be 5 to 1440" >&2; exit 1; fi
            window="$MINUTES' MINUTE"
            span="$MINUTES min"
          fi
          query="SELECT blob6 AS colo, blob3 AS step, blob4 AS state, SUM(_sample_interval) AS n,
            quantileWeighted(0.5)(double1, _sample_interval) AS p50_ms,
            quantileWeighted(0.95)(double1, _sample_interval) AS p95_ms,
            SUM(double3 * _sample_interval) / SUM(_sample_interval) AS calls
            FROM $DATASET
            WHERE blob1 = 'mcp' AND (blob2 = '$CALL' OR blob2 LIKE '$CALL:%') AND timestamp > NOW() - INTERVAL '$window
            GROUP BY colo, step, state ORDER BY colo, p50_ms DESC LIMIT 60 FORMAT JSON"
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data "$query" > answer.json
          SPAN="$span" node -e '
            const { data } = JSON.parse(require("fs").readFileSync("answer.json", "utf8"));
            const lines = ["| data center | step | state | n | p50 ms | p95 ms | calls each |", "| --- | --- | --- | ---: | ---: | ---: | ---: |"];
            for (const row of data) lines.push(`| ${row.colo || "?"} | ${row.step} | ${row.state} | ${Math.round(row.n)} | ${Math.round(row.p50_ms)} | ${Math.round(row.p95_ms)} | ${Number(row.calls).toFixed(1)} |`);
            const out = [`### ${process.env.CALL}, last ${process.env.SPAN}`, "", ...lines].join("\n");
            console.log(out);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
