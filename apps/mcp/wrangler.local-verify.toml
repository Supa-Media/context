name = "context-mcp-local"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "PRESENCE_ROOM"
class_name = "PresenceRoom"

[[migrations]]
tag = "v1-presence"
new_sqlite_classes = ["PresenceRoom"]

[vars]
PUBLIC_ORIGIN = "http://127.0.0.1:8799"
ALLOWED_ORIGINS = "http://127.0.0.1:8798"
CONTROL_PLANE_URL = "http://127.0.0.1:8797"
GATEWAY_SECRET = "local-verification-secret-not-real"
NATIVE_BINDINGS = "LOCAL_BUCKET"

[[r2_buckets]]
binding = "LOCAL_BUCKET"
bucket_name = "local-verification"
