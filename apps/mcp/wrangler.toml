# Analytics Engine datasets, each the staging name with `_preview` in place of `_staging`.
[[env.preview.analytics_engine_datasets]]
binding = "TEX_TIMING"
dataset = "tex_timing_preview"

[[env.preview.analytics_engine_datasets]]
binding = "TEX_CALLS"
dataset = "tex_model_calls_preview"

[[env.preview.analytics_engine_datasets]]
binding = "TEX_ENTRY"
dataset = "tex_entry_preview"

[[env.preview.analytics_engine_datasets]]
binding = "MCP_ENTRY"
dataset = "mcp_entry_preview"

[[env.preview.analytics_engine_datasets]]
binding = "CALL_COUNTS"
dataset = "context_calls_preview"

[[env.preview.analytics_engine_datasets]]
binding = "TEX_TEXTS"
dataset = "tex_text_timing_preview"

[[env.preview.analytics_engine_datasets]]
binding = "TEX_COUNTS"
dataset = "tex_text_counts_preview"

# Site screenshots and the eval service stay on staging's Workers: they hold no customer data and have no
# address of their own. The texting Worker is this pull request's own preview.
[[env.preview.services]]
binding = "SITE_SHOTS"
service = "context-site-shots-staging"

[[env.preview.services]]
binding = "TEXTING"
service = "context-agent-__PREVIEW__"
entrypoint = "TexRoutines"

[[env.preview.services]]
binding = "TEX_EVAL"
service = "context-tex-eval-staging"
entrypoint = "PeopleDoor"

[[env.preview.services]]
binding = "TEX_EVAL_HTTP"
service = "context-tex-eval-staging"

[env.preview.ai]
binding = "AI"

[env.preview.images]
binding = "IMAGES"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"
