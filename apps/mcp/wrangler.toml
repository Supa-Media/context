# Context MCP gateway — the product / self-host Worker config.
#
# This deploys the multi-tenant gateway in `src/`: a stateless Worker that holds
# no database and no bucket of its own. Every request carries an OAuth 2.1
# access token, the control plane resolves it to a workspace, and that
# workspace's storage credential is fetched per request and thrown away with the
# request. Nothing bound here grants access to anything, and that is the point —
# see the header of `src/session.js` for why there is no cross-request cache.
#
# The original single-tenant `brain` Worker (an R2 `BRAIN` binding, a personal
# calendar cron) now lives on a separate Cloudflare account with its own config.
# It is no longer this file's subject, and `BRAIN` is not read anywhere in `src/`.
#
# One honest note about CI, so nobody is caught out: today
# `.github/workflows/deploy-mcp.yml` deploys `MCP_WRANGLER_CONFIG`
# (`wrangler.product.toml`) and *skips* the deploy when that file is absent,
# rather than falling back to this one. Until that variable is pointed here,
# production is deployed by hand — and this is the config a self-hoster runs
# `wrangler deploy` against.

name = "context-mcp"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Run beside the workspace objects (placed `enam`) and the control plane, not at the caller's edge (decided by the
# owner, 2026-11-04; docs/decisions/gateway-protocol/gateway-placement.md). A note read makes about four trips to
# its workspace object, each 25 to 60 ms from the edge and a few ms from here. Staging inherits it.
[placement]
region = "aws:us-east-1"

# The gateway's own log lines (`console.log`: structured, ids and names only, never a note's words or a secret)
# kept in Workers Logs, so a failed turn can be read back (Dev2, 2026-11-08, after a job's part failed in the
# advisor step with nothing to show why). Cloudflare's per-request invocation lines stay off: they carry the
# request URL, and an OAuth step's code rides in one. A crash's outcome (exceededMemory, exception) is still in
# Workers analytics. Self-hosting: delete this block to keep no logs at all. Staging inherits it.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]

# The sharing judge (docs/decisions/privacy-and-sharing/agent-egress.md): an AI
# client's call that would let more people see something runs only when the
# person's own words ask for it, as a small model reads them. Needs the AI
# gateway below; leave it out to let such calls run at once.
SHARING_JUDGE = "on"

# The hand-back judge (docs/decisions/texting-assistant/handing-back.md): a small
# model reads a texted answer that asks the person something, and one that hands
# them work Tex could do goes back for one more round. Needs the AI gateway.
HANDBACK_JUDGE = "on"

# Tex's self-review (docs/decisions/texting-assistant/self-review.md): a small
# model scores a finished texted conversation, and the control plane decides
# whether its words may go with the scores. Needs the AI gateway.
TEX_REVIEW = "on"

# The gateway's own public origin, e.g. "https://mcp.example.com" (no trailing
# slash).
#
# Every URL in both discovery documents is built from this — including the
# `authorization_endpoint` a client will send a person's browser to — so it has
# to be the origin *you* serve on. Left unset, the worker falls back to the
# request's `Host` header, which is right for `wrangler dev` and a workers.dev
# URL and wrong behind anything that rewrites `Host`. Set it before serving
# production traffic, and set it to your own origin, never someone else's.
PUBLIC_ORIGIN = "https://mcp.context.lc"

# Where a text chat's background jobs run (src/texJob.js): "worker" keeps them in the texting Worker, as they are today;
# "gateway" runs them in TEX_JOB here. Production moved on Dev2's go (2026-11-14); a job that started in the Worker
# finishes there.
TEX_JOBS = "gateway"

# OpenAI verifies ownership of the MCP hostname by reading this public token
# from `/.well-known/openai-apps-challenge`. It is issued for the current
# Context Plugin draft and is public by design once the endpoint is deployed.
OPENAI_APPS_CHALLENGE = "mvCPz_ecepW9QtwBVmDzCk3cxzqSXHmRE0TE52cJbcc"

# Browser origins permitted to reach `/mcp` and `/inbox`, comma- or
# space-separated. MCP requires a server to validate `Origin` on the Streamable
# HTTP transport, because a page in a victim's browser that rebinds a hostname
# to this gateway would otherwise reach a session that can read and write the
# whole context.
#
# Unset means "non-browser clients only". That is deliberately fail-closed and
# breaks nothing you are already running: Claude Desktop, Codex CLI and the MCP
# SDKs send no `Origin` at all, and a request without one is always served. It
# only refuses *browser* clients you have not listed. The origin in
# `PUBLIC_ORIGIN` above is always permitted and does not need listing — but
# only that one. With `PUBLIC_ORIGIN` unset there is no declared self, so
# nothing is self-permitted: the fallback named above is the request's own
# `Host`, and trusting it here would let a page claiming any hostname allow
# itself. So on `wrangler dev`, list the origin you browse from.
#
# Matching is exact — scheme, host and port, no wildcards. On the product
# deployment the console is the apex, and the same console is served at Tex's
# own domain (`infra/router/src/texHost.ts`), so both are listed:
ALLOWED_ORIGINS = "https://context.lc https://tex.lc"
# The app, named in the OAuth metadata as `context_app_origin` so the CLI can
# send the browser to the app's "connected" page after signing in. Optional:
# unset, the CLI shows its own plain page.
APP_ORIGIN = "https://context.lc"
# Self-hosting: put your own console origin here, not that one.

# Store operations one search may spend (index sync + conditional write +
# snippet reads). Set ONLY on a worker verifiably on the paid plan: the code's
# default of 40 fits the free tier's 50-subrequest ceiling, and a raised value
# on a free-tier worker makes every search die with "Too many subrequests" —
# measured live when "600" was set on an assumed-paid worker that was not.
# The owner upgraded this deployment to Workers Paid on 2026-08-30, which is
# what re-enabled it. Clamped in code to [15, 900]; unset or unparseable falls
# back to 40. Self-hosting on the free tier: leave this unset.
#
# Raising it no longer lengthens a search. It used to: this is a *subrequest*
# budget, and 600 of them authorized ~580 sequential note reads in front of an
# answer — measured live at 40-60 seconds. An interactive search now spends
# `INTERACTIVE_BACKFILL_OPS` note reads and continues the same index sync after
# its response has been sent, so what this number buys is how much of the index
# one invocation finishes, not how long the caller waits. The whole invocation,
# deferred half included, still stays inside it.
SEARCH_SUBREQUEST_BUDGET = "600"

# ── Presence: who else has this note open ───────────────────────────────────
#
# One Durable Object per note, addressed by `idFromName(workspaceId + path)`.
# Unlike the per-workspace search databases — which are created at runtime and
# therefore cannot be bindings at all (`src/search/d1/client.js`) — a Durable
# Object namespace is ONE binding covering unlimited instances, so the ceiling
# that forced search onto the HTTP API does not apply here.
#
# The object has no storage and holds no credential: the roster is rebuilt from
# the live sockets on every wake, so there is nothing to migrate, nothing to
# delete when the last person leaves, and nothing of one tenant that can outlive
# a request into another. A note nobody has opened was never instantiated.
#
# Self-hosting: Durable Objects need a paid Workers plan. Leave this commented
# out on the free tier — `GET /presence` then answers 501 and every note still
# opens, saves and conflicts exactly as before.
[[durable_objects.bindings]]
name = "PRESENCE_ROOM"
class_name = "PresenceRoom"

# SQLite-backed, which is the current default class for a new namespace. This
# object writes no rows; the storage API is touched only for the sweep alarm.
[[migrations]]
tag = "v1-presence"
new_sqlite_classes = ["PresenceRoom"]

# Tex's notes: one SQLite-backed object per person and per group chat
# (src/texStore.js). A note marked on its tree row as living here keeps its
# text here instead of in the workspace's bucket. Self-hosting on the free
# tier: leave the binding out, and nothing is ever marked as living here.
[[durable_objects.bindings]]
name = "TEX_STORE"
class_name = "TexStore"

[[migrations]]
tag = "v2-tex-store"
new_sqlite_classes = ["TexStore"]

# Each workspace's notes, tree rows and access rules: one SQLite-backed object
# per workspace (src/workspaceStore.js). Bodies are read from here once the
# workspace's home is switched to "object"; until then nothing reads it.
[[durable_objects.bindings]]
name = "WORKSPACE_STORE"
class_name = "WorkspaceStore"

[[migrations]]
tag = "v3-workspace-store"
new_sqlite_classes = ["WorkspaceStore"]

# One live-socket ticket's spent mark (src/live/ticket.js): an object per
# ticket, one key, deleted by an alarm two minutes after it was minted. The
# app's sockets open on a one-use ticket instead of carrying a token.
# Self-hosting on the free tier: leave it out, and `POST /presence/ticket`
# answers 501 (the sockets need Durable Objects anyway).
[[durable_objects.bindings]]
name = "LIVE_TICKET"
class_name = "LiveTicket"

[[migrations]]
tag = "v4-live-ticket"
new_sqlite_classes = ["LiveTicket"]

# One text chat's intake queue (src/texChat.js): an object per chat, holding the texts waiting for Tex's answer under
# the texting Worker's keys, and each event id seen in the last day. Queued texts are the only copy of a waiting
# text, so the object keeps them until a turn answers them. Nothing live reaches it yet. Self-hosting on the free
# tier: leave it out, and `POST /texts/arrive` answers 501 (the texting Worker then keeps its own queue).
[[durable_objects.bindings]]
name = "TEX_CHAT"
class_name = "TexChat"

[[migrations]]
tag = "v5-tex-chat"
new_sqlite_classes = ["TexChat"]

# The root the search quality log's keyed hashes are derived from (src/search/qualityKeyObject.js): one object, one
# random key it makes the first time it is asked. Only this Worker reaches it, so the control plane, which holds
# GATEWAY_SECRET, can never compute the hashes it stores. Self-hosting on the free tier: leave it out, and the
# admin console's search log carries timing only.
[[durable_objects.bindings]]
name = "SEARCH_QUALITY_KEY"
class_name = "SearchQualityKey"

[[migrations]]
tag = "v6-search-quality-key"
new_sqlite_classes = ["SearchQualityKey"]

# One background job's object (src/texJob.js): the texting Worker's job object, run here, one per job (`job:<id>`).
# Idle where TEX_JOBS is "worker"; its passes are run by the texting Worker's job workflow, which reaches it
# through the Worker's job stub, started over the Worker's RPC (`TexRoutines.jobRun`). Self-hosting on the free tier: leave both out,
# and `POST /texts/job-call/` answers 501 (the texting Worker then keeps its own jobs).
[[durable_objects.bindings]]
name = "TEX_JOB"
class_name = "TexJob"

[[migrations]]
tag = "v7-tex-job"
new_sqlite_classes = ["TexJob"]

# One Lab test chat (src/labSandbox/object.js): its rows, what its turns would have changed or sent, and the
# copy-on-write overlay over the real objects, one per person's test chat (`labsandbox:<userId>:<sandboxId>`),
# deleted on Reset or 24 hours after its last use. Self-hosting: leave it out, and `POST /tex-lab/sandbox` answers 501.
[[durable_objects.bindings]]
name = "LAB_SANDBOX"
class_name = "LabSandbox"

[[migrations]]
tag = "v8-lab-sandbox"
new_sqlite_classes = ["LabSandbox"]

# Which AI Gateway payer's credit is spent (src/agent/creditRest.js): one object, a payer name and a timestamp,
# never a key and never a prompt. Every isolate reads it, so a spent plan credit is skipped everywhere instead of
# failing once per isolate and then being paid again on Unified Billing. Self-hosting on the free tier: leave it
# out, and each isolate keeps its own fifteen-minute rest.
[[durable_objects.bindings]]
name = "CREDIT_REST"
class_name = "CreditRest"

[[migrations]]
tag = "v9-credit-rest"
new_sqlite_classes = ["CreditRest"]

# The Lab's evals (src/labEvals/store.js): public benchmarks run through real Tex. One object, `labevals`: each
# benchmark's dataset file (its commit and where each question is in it), the runs and their results. Public data
# and Tex's answers to it only. Self-hosting: leave it out, and `POST /tex-lab/evals` answers 501.
[[durable_objects.bindings]]
name = "LAB_EVALS"
class_name = "LabEvals"

[[migrations]]
tag = "v10-lab-evals"
new_sqlite_classes = ["LabEvals"]

# Where each Tex turn's time went (src/agent/turnStages.js): numbers, a kind
# and an outcome per turn, never words, a person or a workspace. Read with the
# account's Analytics Engine SQL API (`SELECT ... FROM tex_timing`). The code
# shipped in #2496 but the binding never did, so nothing was written. Leave it
# out when self-hosting: without it nothing is written.
[[analytics_engine_datasets]]
binding = "TEX_TIMING"
dataset = "tex_timing"

# One point per model call of a turn (`turnStages.js` `callPoints`): its
# milliseconds and token counts, cache reads and writes included. Optional too.
[[analytics_engine_datasets]]
binding = "TEX_CALLS"
dataset = "tex_model_calls"

# One point per named step of a Tex turn (`src/agent/texTiming.js`): the
# step, its state, its milliseconds and when it started, indexed by workspace
# so one person's turns and everyone's both add up. Names and times only,
# never a word anyone wrote. Optional: without it nothing is written.
[[analytics_engine_datasets]]
binding = "TEX_ENTRY"
dataset = "tex_entry"

# One point per named step of an MCP request (`src/mcp/mcpEntryPoint.js`):
# the call (`tools/call:orient`, `initialize`, ...), the step or the
# control-plane route or store operation it timed, its state, its
# milliseconds and when it started, indexed by workspace. Names, routes and
# times only, never a path or a word. Optional: without it nothing is written.
[[analytics_engine_datasets]]
binding = "MCP_ENTRY"
dataset = "mcp_entry"

# One point per request the gateway answers and per call a workspace object
# answers (`src/observability/callCounts.js`): a fixed route name or op, the
# client's kind or the object's caller, indexed by route or by the object's
# id. Never a path, a slug or a word. Optional: without it nothing is written.
[[analytics_engine_datasets]]
binding = "CALL_COUNTS"
dataset = "context_calls"

# The texting Worker's two datasets (`apps/agent/wrangler.jsonc`), bound here
# too because a chat's object runs here once its text arrives here
# (`src/texChat.js`): each text's wait, and each text in and out. Ids and
# counts only. Optional: without them nothing is written.
[[analytics_engine_datasets]]
binding = "TEX_TEXTS"
dataset = "tex_text_timing"

[[analytics_engine_datasets]]
binding = "TEX_COUNTS"
dataset = "tex_text_counts"

# `write_note` `site: { action: "screenshot" }`: the Worker in infra/site-shots,
# which photographs a published website page with Browser Rendering. Reached
# only through this binding, so it has no address and holds no secret. It must
# exist before this Worker deploys (Cloudflare refuses a binding to a missing
# script), so the deploy jobs deploy it first. Self-hosting without Browser
# Rendering: delete this block; screenshots then answer "not available".
[[services]]
binding = "SITE_SHOTS"
service = "context-site-shots"

# The texting Worker's named entrypoint `TexRoutines` (apps/agent). A Tex
# store's alarm calls `routineDue` on it to run a routine on time
# (`src/texStore/dispatch.js`). A named entrypoint is reachable only through
# this binding, never over HTTP, so there is no secret to set.
# Self-hosting without the texting Worker: delete this block; routines then
# run on the minute's cron, as they always have.
[[services]]
binding = "TEXTING"
service = "context-agent"
entrypoint = "TexRoutines"

# Tex's eval service (infra/tex-eval): the sealed Test Set. `TEX_EVAL` is its
# named entrypoint `PeopleDoor`, for the Lab's people (`src/http/texTestSet.js`
# checks who); `TEX_EVAL_HTTP` its default one, which `/tex-eval/*` is passed to
# untouched and which takes only main's Test Set workflow, by GitHub OIDC. No
# address of its own and no secret. It deploys first, in the gateway's job.
# Self-hosting without it: delete both blocks; the Lab's Testing tab then
# answers that the Test Set could not be reached.
[[services]]
binding = "TEX_EVAL"
service = "context-tex-eval"
entrypoint = "PeopleDoor"

[[services]]
binding = "TEX_EVAL_HTTP"
service = "context-tex-eval"

# Self-host only. Comma-separated allowlist of Worker binding names that a
# control-plane storage binding is permitted to name.
#
# Unset (the product setting) means no native binding can ever be used: tenants
# bring their own buckets, reached over the S3 API with a credential they can
# revoke without asking us. Without this allowlist, a control plane that was
# compromised, confused, or merely pointed at the wrong row could name any R2
# bucket this Worker can see, for any tenant. See `nativeStore` in
# `src/session.js`.
# NATIVE_BINDINGS = "CONTEXT_BUCKET"

# ── Secrets (`wrangler secret put <NAME>`; never commit values) ──────────────
#
#   CONTROL_PLANE_URL       required. The Convex HTTP-actions origin
#                           (https://<deployment>.convex.site), no trailing
#                           slash. Not a secret in the cryptographic sense, but
#                           deployment-specific and not worth publishing.
#   GATEWAY_SECRET          required. Proves "this caller is the gateway" to the
#                           control plane. On its own it opens nothing: fetching
#                           a storage credential also requires the end user's
#                           own access token, forwarded verbatim, and the
#                           workspace is derived from *that* grant. See the
#                           contract at the top of `src/controlPlane.js`.
#
# Without both of those the worker refuses every request. There is no degraded
# mode and no second way in: `PRIVATE_TOKEN`, `TEAM_TOKEN`, `PUBLIC_TOKEN` and
# `INBOX_TOKEN` no longer exist, and no environment variable grants access to
# anything.
#
# Optional on any deployment:
#   BRAVE_SEARCH_API_KEY    lets the texting assistant search the web
#                           (src/agent/search.js); without it there is no
#                           search tool. AGENT_SEARCH picks another provider.
#   AI_GATEWAY_ACCOUNT_ID   optional. Cloudflare account id for AI Gateway
#                           (src/agent/aiGateway.js); kept secret, not [vars].
#   AI_GATEWAY_ID           optional. The AI Gateway's name; falls back to Workers AI (GLM) if unset.
#   AI_GATEWAY_TOKEN        optional. Token for AI Gateway; falls back to Workers AI (GLM) if unset.
#   ANTHROPIC_CREDIT_KEY    optional. The Claude plan's API credit key, spent first;
#                           without it every gateway call is Unified Billing.

# ── Self-host only, commented out on purpose ────────────────────────────────
#
# A native R2 binding for a self-hoster's *served* context — the other half of
# `NATIVE_BINDINGS` above. The binding name here must appear in that allowlist
# and must match the `bindingName` the control plane returns, or the gateway
# refuses to build a store.
#
# [[r2_buckets]]
# binding = "CONTEXT_BUCKET"
# bucket_name = "my-context"

# The texting assistant's built-in model (`src/agent/builtin.js`), spent only
# after the control plane allows the turn and metered there. Self-hosting
# without Workers AI: delete this block; a turn with no connected model account
# is then refused as "no account connected", exactly as before.
[ai]
binding = "AI"

# Tex's example index (`src/agent/graph/nodes/examples.js`): the front door's
# Training moments, filled by the control plane after each deploy
# (`apps/convex/functions/texExamplesIndex.ts`). Tex's own, never a workspace's
# (`context-meaning-<id>`). Read only when a config wires `fd -> examples`;
# without it, or self-hosting without the index (delete this block), the front
# door keeps its fixed examples.
[[vectorize]]
binding = "TEX_EXAMPLES"
index_name = "tex-examples"

# Pictures are kept compressed (`packages/shared/src/pictureCompression.cjs`,
# `docs/decisions/storage-and-credentials/files-bucket.md`): Cloudflare's Images
# binding re-encodes each one to WebP before it is stored. Self-hosting without
# it: delete this block, and pictures are stored as they came.
[images]
binding = "IMAGES"

# Which Worker version answered a Tex turn (`src/agent/texVersion.js`): its id
# is kept on the turn's reply in the chat's ledger, beside the deployed commit
# (`TEX_CODE_VERSION`, passed by the deploy workflows), so the Lab can say what
# an old text ran on. Self-hosting: harmless to keep; delete it and turns keep
# only the commit and setup versions.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Staging shares code with production, but owns its presence objects.
[env.staging]
name = "context-mcp-staging"
workers_dev = true

[env.staging.vars]
# The texts simulator's chats, once their chat object runs here (`src/texChat.js`); as the texting Worker's staging
# `SIMULATOR`, never set in production.
SIMULATOR = "on"
# Site-block fallback onto Browser Use. Staging only: production reads
# browsers.browserUseFallback "off" in texConfig.json and must not set this.
BROWSER_USE_FALLBACK = "on"
SHARING_JUDGE = "on"
HANDBACK_JUDGE = "on"
TEX_REVIEW = "on"
PUBLIC_ORIGIN = "https://mcp-staging.context.lc"
ALLOWED_ORIGINS = "https://staging.context.lc https://tex-staging.context.lc"
APP_ORIGIN = "https://staging.context.lc"
SEARCH_SUBREQUEST_BUDGET = "600"
TEX_JOBS = "gateway"

[[env.staging.durable_objects.bindings]]
