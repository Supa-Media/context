# Preview: a throwaway copy of this gateway for one pull request, so that branch's Context and Tex can be
# exercised end to end on workers.dev without touching production or staging data. Its names and hosts are
# placeholders (__PREVIEW__ and __WORKERS_DEV__) that scripts/preview-config.mjs renders into a copy beside this
# file. Never deploy this section directly: the rendered copy is the only thing that goes out.
[env.preview]
name = "context-mcp-__PREVIEW__"
workers_dev = true

[env.preview.vars]
# Staging's settings with a preview's own hosts. The texts simulator is on: the texting Worker's preview hands
# simulated chats to this gateway's chat object (`src/texChat.js`), as staging does. Browser Use is left off: a
# preview does not spend a paid outside browser.
SIMULATOR = "on"
SHARING_JUDGE = "on"
HANDBACK_JUDGE = "on"
TEX_REVIEW = "on"
PUBLIC_ORIGIN = "https://context-mcp-__PREVIEW__.__WORKERS_DEV__"
ALLOWED_ORIGINS = "https://context-router-__PREVIEW__.__WORKERS_DEV__"
APP_ORIGIN = "https://context-router-__PREVIEW__.__WORKERS_DEV__"
SEARCH_SUBREQUEST_BUDGET = "600"
TEX_JOBS = "gateway"

[[env.preview.durable_objects.bindings]]
name = "PRESENCE_ROOM"
class_name = "PresenceRoom"

[[env.preview.durable_objects.bindings]]
name = "TEX_STORE"
class_name = "TexStore"

[[env.preview.durable_objects.bindings]]
name = "WORKSPACE_STORE"
class_name = "WorkspaceStore"

[[env.preview.durable_objects.bindings]]
