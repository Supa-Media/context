# What ships, and what macOS is told about it.
#
# ## Why electron-builder and not Forge
#
# The one thing this configuration exists to produce is a **signed, notarised,
# hardened-runtime** app, because that is what stands between this app and
# macOS handing it system audio. electron-builder does signing, entitlements,
# notarisation and a dmg from one file with no plugin per step, and it reads
# `CSC_LINK` / `CSC_KEY_PASSWORD` from the environment — which is what lets the
# release workflow build unsigned today and signed the day a certificate exists,
# with no change to this file. Forge would be a maker plus a plugin per concern
# for the same result.
#
# The framework's own desktop package (`@supa-media/desktop`, supa-framework#56)
# is not published yet and this app does not depend on it. When it is, the right
# move is to adopt whatever it expects rather than to keep two answers — this
# file is small on purpose so that is a deletion.
#
# ## The Info.plist strings are the product, not boilerplate
#
# `NSMicrophoneUsageDescription` and `NSAudioCaptureUsageDescription` are the
# sentences macOS shows in the permission dialog, and they are the only thing a
# person reads before deciding whether this app may hear their meeting. They say
# what is captured and what happens to it. `NSCalendarsUsageDescription` is the
# same for the detector, which reads events to name a meeting and correlate one.
#
# ## The zip target is not cosmetic
#
# macOS `electron-updater` applies an update through Squirrel.Mac, and Squirrel.Mac
# reads a `.zip`, never a `.dmg` — a release with only a dmg and no
# `latest-mac.yml` is one the updater finds nothing in and reports no error
# about. So the mac target is `[dmg, zip]`: the dmg is still built, because a dmg
# is what a person installs the first time, and the zip plus `latest-mac.yml` are
# what every launch after that one checks against. `writeUpdateInfo` is left at
# its default (on) so that file is produced by every build, signed or not —
# generating it costs nothing, and only a signed build can ever have it acted on
# (`docs/decisions/desktop.md`, "The shell updates itself").
#
# ## `publish`, and why it names a release rather than a draft
#
# `releaseType: release` publishes the moment `deploy-desktop.yml` asks
# electron-builder to (`--publish always`), rather than leaving a draft for a
# person to click. The alternative was considered and rejected: `autoUpdater`'s
# GitHub provider looks at the *latest published* release, and a draft simply
# is not one — it exists in the repository's UI and nowhere the update check
# can see, which would make this whole step build correctly and update nobody.
# `owner`/`repo` are pinned to this repository rather than read from `package.json`
# (which has none, being private) so a fork publishes to itself with no edit
# needed anywhere but here.
#
# ## What is deliberately not here
#
# No code-signing identity in this file — that stays the workflow's job (see its
# own header) — and no channel other than "latest": every signed build the
# workflow publishes is the one every installed shell checks against, because
# there is exactly one distribution today.

appId: lc.context.desktop
productName: Context
copyright: MIT licensed — see LICENSE

directories:
  output: release
  buildResources: build

# `dist/` is what esbuild produced; `node_modules` is not copied because every
# runtime dependency — `@context/meetings` and `electron-updater` — is bundled
# into the main process by esbuild, which is also why `asar` has nothing to
# unpack.
files:
  - dist/**/*
  - package.json

asar: true

mac:
  category: public.app-category.productivity
  # Stated, though `build/icon.icns` is also where electron-builder looks by
  # default, because that implicit lookup is exactly what shipped Electron's
  # own atom icon to the owner. With no icon configured and no file at the
  # default path, electron-builder does not warn: it bundles its bundled
  # `electron.icns` and writes that into `CFBundleIconFile`. The build passes,
  # the dmg installs, Gatekeeper is happy, and the first anybody knows is the
  # Dock — which is where it was found. Named here, a missing or misspelled
  # file is a build failure instead of a wrong icon.
  #
  # Generated from `apps/mobile/assets/source/desktop-icon.svg` by the
  # `generate.sh` beside it, which is the one command that regenerates every
  # app asset. Edit the vector, never the .icns.
  icon: build/icon.icns
  # `distribution`, not `development`: it decides which certificate
  # electron-builder looks for and which provisioning rules apply. It says
  # nothing about the Dock or the menu bar in either direction.
  type: distribution
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    # `LSUIElement: true` used to be here, paired with `app.dock.hide()` in
    # `src/main/index.ts`, and it is deliberately gone.
    #
    # It was right when it was written: a menu-bar app with no window of its own
    # has nothing to put in the Dock. Step 4 ended that — "the console is what a
    # launch opens" — and the first signed build reached the owner as an app
    # with a window, no Dock tile, no app-switcher entry and no menu bar, which
    # reads as an app that did not install. Their words: "I dont even see a
    # launched app, I should be able to open the app locally like all these
    # other apps."
    #
    # An accessory app also shows no application menu, and the console hosts a
    # text editor — no menu means no Cmd-C, Cmd-V or Cmd-Z, because on macOS
    # those are menu key equivalents and nothing else.
    #
    # The tray is untouched: `main/index.ts` still builds it, still records a
    # whole meeting with no window open, and closing the window still does not
    # quit. A Dock tile as well as a menu-bar item, never instead of it. See
    # `docs/decisions/desktop.md`, "The app is in the Dock".
    NSMicrophoneUsageDescription: >-
      Context records the meetings you ask it to. Your microphone is opened only
      after you press Take notes or Record, and the audio is transcribed and
      thrown away — the note is what is kept, in the storage you own.
    NSAudioCaptureUsageDescription: >-
      Context captures this Mac's own audio so the other people in a call are in
      the transcript without a bot joining it. It is opened only for a meeting
      you started recording, and the audio is never saved.
    NSCalendarsUsageDescription: >-
      Context reads your calendar to notice when a meeting starts and to name it.
      Event details are used on this Mac and are never sent anywhere.

# The hook is `afterSign` rather than `afterAllArtifactBuild` because
# notarisation happens on the signed `.app`, before it is put in a dmg. It
# no-ops cleanly when there is nothing to notarise with; see build/notarize.cjs.
afterSign: build/notarize.cjs

dmg:
  # The default window with the app and an Applications alias — a background
  # image is a design decision nobody has taken.
  #
  # `sign: true` because electron-builder's own default is to leave the disk
  # image itself unsigned even on a fully signed, notarised build (only the
  # `.app` inside it is signed by default) — confirmed against `dmg-builder`
  # 26.0.0's own source, which only signs the dmg when this is explicitly
  # `true`. `deploy-desktop.yml`'s post-build check asserts Gatekeeper accepts
  # the `.app` mounted out of each dmg — this line is what makes the dmg
  # itself a real, signed container around that app instead of the
  # unconditional "no usable signature" the workflow used to print for a dmg
  # nothing had ever signed. It reuses whatever identity `mac.type:
  # distribution` above already resolved — no new secret, no separate
  # certificate.
  sign: true

# GitHub Releases, published only when `deploy-desktop.yml` passes
# `--publish always` — see the header for why `release` and not `draft`, and why
# owner/repo are pinned here.
publish:
  provider: github
  owner: Supa-Media
  repo: context
  releaseType: release
