<!doctype html>
<!--
  Source for src/og-card.png — the 1200x630 OpenGraph card every context.lc
  link falls back to.

  IT SAYS NOTHING ABOUT ANY WORKSPACE, AND MUST NOT. A crawler is
  unauthenticated (see the long comment at the top of src/preview.ts), so the
  card is product branding and only product branding. Do not add a name, an
  avatar, a count, or anything else derived from the URL being previewed.

  It is also what a revoked link unfurls with, which is the sharper reason: a
  link taken back has to look exactly like one that never existed, so this is
  the picture for "no", and "no" has no subject.

  Regenerate after editing:

    node scripts/render-og-card.mjs

  The script drives the bundled Chromium at 2x and downsamples with sharp, and
  it replaced a chrome + ImageMagick pipeline that this repository's own
  environment could not run — a regeneration command nobody can execute is how
  a source file and the PNG beside it drift into disagreeing. Keep it at
  1200x630: src/preview.ts advertises those numbers in og:image:width/height
  and preview.test.ts reads them back out of the PNG header.

  Rendered at 2x and downsampled so the type is crisp; quantised to a 256
  colour palette because the whole file ships inside the Worker bundle and the
  truecolour version is several times the size for no visible gain.

  Palette and type are Graphite, from apps/mobile/features/design/tokens.ts and
  apps/mobile/features/design/fonts.ts — the same two files the generated card
  follows (apps/convex/functions/lib/cardArt.ts). The three cards a person
  might see in one thread are one object in three states, so they share a frame:
  ground, an inset panel on a hairline, one petrol rule, one lockup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  No webfont link, deliberately. `scripts/render-og-card.mjs` injects the face
  from the one copy of Instrument Sans this repository holds — the base64 in
  apps/convex/functions/lib/cardFont/instrumentSans.ts, which is what the
  generated card is drawn with too.

  It used to load Google Fonts, and that made the picture depend on the network
  at regeneration time: in an environment that proxies TLS the stylesheet fails
  with ERR_CERT_AUTHORITY_INVALID, the page falls back to the system sans, and
  the screenshot succeeds. A card in the wrong typeface that renders without
  complaint is exactly the drift this whole pipeline exists to prevent, so the
  bytes come from the repository and the render touches no network at all.

  Opening this file directly in a browser therefore shows the system sans. The
  layout is still right; the letterforms are not.
-->
<style>
  :root{
    /* Graphite. See darkColors in apps/mobile/features/design/tokens.ts. */
    --ground:#100F0E;
    --surface:#191715;
    --line:rgba(237,232,224,.07);
    --line-strong:rgba(237,232,224,.14);
    --text:#EDE8E0;
    --text-2:#C3BCB2;
    --muted:#A79F95;
    --dim:#7A736A;
    --accent:#6BC8C1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:var(--ground);color:var(--text);
    font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:1200px;height:630px;padding:40px;display:flex;
  }
  .panel{
    flex:1;display:flex;flex-direction:column;
    padding:58px 64px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:28px;
  }

  .mark{display:flex;align-items:center;gap:14px}
  .mark .dot{width:13px;height:13px;border-radius:50%;background:var(--accent)}
  .mark em{
    font-style:normal;font-size:28px;color:var(--dim);letter-spacing:.01em;
  }

  .rule{width:84px;height:3px;background:var(--accent);margin-top:40px}

  h1{
    font-weight:600;font-size:72px;line-height:1.05;letter-spacing:-.03em;
    margin:32px 0 0;max-width:17ch;
  }
  h1 .dim{color:var(--dim)}

  .spacer{flex:1}

  p.sub{
    /*
      600, like everything else here. The generated card registers one weight
      with satori, so its subtitle is drawn at 600 too — a 400 here would make
      the two cards differ in the one place a person sees them side by side.
    */
    margin:0;font-size:29px;line-height:1.35;color:var(--text-2);
    max-width:34ch;font-weight:600;letter-spacing:-.01em;
  }
  /*
    No `.foot`. The lockup above already says `context.lc`, and this card has
    no handle to put there instead — so a second copy at the bottom is the word
    twice. The generated card has the same rule, in cardArt.ts.
  */
</style>
</head>
<body>
  <div class="card">
    <div class="panel">
      <div class="mark"><i class="dot"></i><em>context.lc</em></div>
      <div class="rule"></div>
      <h1>Free your context.<br><span class="dim">Share your context.</span></h1>
      <div class="spacer"></div>
      <p class="sub">One MCP endpoint for every AI client, backed by plain markdown in a bucket you own.</p>
    </div>
  </div>
</body>
</html>
