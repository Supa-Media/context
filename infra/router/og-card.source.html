<!doctype html>
<!--
  Source for src/og-card.png — the 1200x630 OpenGraph card every context.lc
  link falls back to.

  IT SAYS NOTHING ABOUT ANY WORKSPACE, AND MUST NOT. A crawler is
  unauthenticated (see the long comment at the top of src/preview.ts), so the
  card is product branding and only product branding. Do not add a name, an
  avatar, a count, or anything else derived from the URL being previewed.

  It is also what a revoked link unfurls with, which is the sharper reason: a
  link taken back has to look exactly like one that never existed, so this is
  the picture for "no", and "no" has no subject.

  Regenerate after editing:

    node scripts/render-og-card.mjs

  The script drives the bundled Chromium at 2x and downsamples with sharp, and
  it replaced a chrome + ImageMagick pipeline that this repository's own
  environment could not run — a regeneration command nobody can execute is how
  a source file and the PNG beside it drift into disagreeing. Keep it at
  1200x630: src/preview.ts advertises those numbers in og:image:width/height
  and preview.test.ts reads them back out of the PNG header.

  Rendered at 2x and downsampled so the type is crisp; quantised to a 256
  colour palette because the whole file ships inside the Worker bundle and the
  truecolour version is several times the size for no visible gain.

  Paper (Dev2, 2026-10-06): warm paper ground, ink type, the motto "Less
  chaos." with its line on top, the app icon itself
  (apps/mobile/assets/source/favicon.svg, Tex's resting # on paper) top right, and "Context" set huge
  along the bottom with a blue period shaped like the tile. It is drawn to be
  read at feed size, like a video thumbnail, so the only small type is the one
  line under the motto.

  The word stops 64px above the bottom edge on purpose: X draws its domain
  label over the bottom-left corner of a card.

  Everything is 600, the one weight of Instrument Sans this repository holds.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  No webfont link, deliberately. `scripts/render-og-card.mjs` injects the face
  from the one copy of Instrument Sans this repository holds — the base64 in
  apps/convex/functions/lib/cardFont/instrumentSans.ts, which is what the
  generated card is drawn with too.

  It used to load Google Fonts, and that made the picture depend on the network
  at regeneration time: in an environment that proxies TLS the stylesheet fails
  with ERR_CERT_AUTHORITY_INVALID, the page falls back to the system sans, and
  the screenshot succeeds. A card in the wrong typeface that renders without
  complaint is exactly the drift this whole pipeline exists to prevent, so the
  bytes come from the repository and the render touches no network at all.

  Opening this file directly in a browser therefore shows the system sans. The
  layout is still right; the letterforms are not.
-->
<style>
  :root{
    --ground:#EDE4D3;
    --ink:#16181C;
    --ink-2:#55534E;
    --dot:#2F7BF5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:var(--ground);color:var(--ink);
    font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
    font-weight:600;-webkit-font-smoothing:antialiased;
  }
  .top{
    position:absolute;left:68px;right:68px;top:54px;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .motto{font-size:64px;letter-spacing:-.035em;line-height:1}
  .line{font-size:36px;letter-spacing:-.015em;color:var(--ink-2);margin-top:16px}
  /* Paper on paper: the icon's edge is a hairline and a soft shadow. */
  .tile{
    width:100px;height:100px;border-radius:22px;display:block;
    box-shadow:0 0 0 1.5px rgba(22,24,28,.10),0 6px 18px rgba(22,24,28,.10);
  }
  .word{
    position:absolute;left:58px;bottom:64px;
    font-size:288px;letter-spacing:-.045em;line-height:.8;white-space:nowrap;
  }
  /* The C's own side bearing leaves a gap the rest of the word does not have. */
  .word .c{margin-right:-.03em}
  .word .dot{
    display:inline-block;width:.19em;height:.19em;margin-left:.035em;
    border-radius:22%;background:var(--dot);
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="motto">Less chaos.</div>
      <div class="line">Finally, everyone’s on the same page.</div>
    </div>
    <img class="tile" src="../../apps/mobile/assets/source/favicon.svg" alt="">
  </div>
  <div class="word"><span class="c">C</span>ontext<i class="dot"></i></div>
</body>
</html>
